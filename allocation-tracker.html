/* ===============================================================
   CHECK-IN (F1) — clone latest, overtype, ≤10 min
   =============================================================== */
/* Build the check-in draft in place — NO render() (so it's safe to call
   from inside render() via renderCheckin without re-entrancy). */
function ensureCheckinDraft() {
  if (ui.checkin) return;
  const base = latestSnapshot();
  const values = {};
  const activeIds = new Set(activeHoldings().map(h => h.id));
  if (base) {
    for (const v of base.values) {
      if (activeIds.has(v.holdingId)) values[v.holdingId] = { marketValue: v.marketValue, costBasis: v.costBasis };
    }
  }
  for (const h of activeHoldings()) if (!values[h.id]) values[h.id] = { marketValue: '', costBasis: '' };
  const open = {};
  const firstAcct = accountsSorted()[0];
  if (firstAcct) open[firstAcct.id] = true;
  ui.checkin = { date: todayISO(), baseDate: base ? base.date : null, note: '', values };
  ui.checkinOpen = open;
  ui.checkinNetWorth = '';
}
function startCheckin() { ui.checkin = null; ensureCheckinDraft(); ui.view = 'checkin'; render(); }

function checkinTotal() {
  let t = 0;
  for (const h of activeHoldings()) {
    const v = ui.checkin.values[h.id];
    const mv = v ? parseNum(v.marketValue) : null;
    if (mv) t += mv;
  }
  return t;
}
function checkinSanityHTML(total) {
  const nw = parseNum(ui.checkinNetWorth);
  if (nw == null || nw <= 0) return '<span class="text-muted" style="font-size:12px;">Enter your net-worth number to sanity-check.</span>';
  const d = total - nw, pct = (d / nw) * 100, within = Math.abs(pct) <= 2;
  return `<span class="tag ${within ? 'tag-ok' : 'tag-warn'}">Off by ${fmtMoney2(Math.abs(d))} · ${Math.abs(pct).toFixed(2)}% — ${within ? 'within tolerance' : 'check entries'}</span>`;
}
/* Live-update the sanity footer without a full re-render (keeps input focus). */
function updateCheckinTotals() {
  if (!ui.checkin) return;
  const total = checkinTotal();
  const tEl = document.getElementById('ci-total'); if (tEl) tEl.textContent = fmtMoney2(total);
  const sEl = document.getElementById('ci-sanity'); if (sEl) sEl.innerHTML = checkinSanityHTML(total);
}

/* One account's collapsible block in the check-in. */
function checkinAccountBlock(acct, ci, baseVals) {
  const open = !!ui.checkinOpen[acct.id];
  const holds = activeHoldings(acct.id);
  let acctTotal = 0, baseTotal = 0;
  for (const h of holds) {
    const mv = parseNum((ci.values[h.id] || {}).marketValue) || 0; acctTotal += mv;
    const bv = baseVals[h.id] ? Number(baseVals[h.id].marketValue) : 0; baseTotal += bv;
  }
  const delta = acctTotal - baseTotal;
  const head = `<div style="display:flex;align-items:center;gap:12px;padding:12px 20px;${open ? 'background:color-mix(in srgb, var(--color-text) 4%, transparent);' : ''}cursor:pointer;" data-act="ci-toggle" data-account="${esc(acct.id)}">
      <span class="text-muted" style="font-size:14px;width:12px;">${open ? '–' : '+'}</span>
      <span style="font-family:var(--font-heading);font-size:18px;">${esc(acct.name)}</span>
      ${acct.institution ? `<span class="text-muted" style="font-size:13px;">${esc(acct.institution)}</span>` : ''}
      ${acct.taxTreatment ? `<span class="tag tag-outline">${esc(acct.taxTreatment)}</span>` : ''}
      <button class="btn btn-ghost btn-sm" title="Edit account" data-act="edit-account" data-account="${esc(acct.id)}">edit</button>
      <span class="text-muted tnum" style="font-size:12px;margin-left:auto;">${fmtMoney2(acctTotal)} ${baseTotal ? `<span style="color:var(--color-accent-700);">${fmtMoneySigned2(delta)}</span>` : ''}</span>
    </div>`;
  if (!open) return `<div style="border-bottom:1px solid var(--color-divider);">${head}</div>`;

  const rows = holds.map(h => {
    const v = ci.values[h.id] || {};
    const prev = baseVals[h.id] ? fmtMoney2(baseVals[h.id].marketValue) : '—';
    const mv = parseNum(v.marketValue), cb = parseNum(v.costBasis);
    const gain = (mv != null && cb != null) ? mv - cb : null;
    return `<tr>
        <td style="padding-left:20px;font-family:var(--font-heading);font-size:15px;">${esc(h.ticker)}</td>
        <td>
          <span class="tag ${compositionOf(h) ? 'tag-accent-2' : 'tag-accent'}" style="cursor:pointer;gap:6px;" data-act="edit-class" data-hid="${esc(h.id)}">${compositionOf(h) ? 'Split · ' : ''}${esc(detailLabel(h.assetClass))}<span class="text-muted" style="font-size:10px;">edit</span></span>
          ${h.name ? `<span class="text-muted" style="font-size:11px;margin-left:8px;">${esc(h.name)}</span>` : ''}
        </td>
        <td class="text-muted tnum" style="text-align:right;">${prev}</td>
        <td><input class="input tnum" style="min-height:32px;text-align:right;" inputmode="decimal" value="${esc(fmtEditNum(v.marketValue))}" data-act="ci-val" data-hid="${esc(h.id)}" placeholder="0.00"></td>
        <td><input class="input tnum" style="min-height:32px;text-align:right;" inputmode="decimal" value="${esc(fmtEditNum(v.costBasis))}" data-act="ci-basis" data-hid="${esc(h.id)}" placeholder="—"></td>
        <td class="tnum" style="text-align:right;padding-right:8px;color:${gain != null && gain < 0 ? 'var(--color-crit)' : 'var(--color-accent-700)'};">${gain != null ? fmtMoneySigned2(gain) : '—'}</td>
        <td style="width:34px;text-align:right;padding-right:16px;"><button class="btn btn-ghost btn-sm" title="Archive holding" data-act="archive-holding" data-hid="${esc(h.id)}">✕</button></td>
      </tr>`;
  }).join('');

  return `<div style="border-bottom:1px solid var(--color-divider);">
      ${head}
      <table class="table">
        <thead><tr>
          <th style="width:96px;padding-left:20px;">Ticker</th>
          <th>Asset class <span class="text-muted" style="text-transform:none;letter-spacing:0;">auto</span></th>
          <th style="width:120px;text-align:right;">Last value</th>
          <th style="width:150px;text-align:right;">Current value</th>
          <th style="width:130px;text-align:right;">Cost basis <span class="text-muted" style="text-transform:none;letter-spacing:0;">opt.</span></th>
          <th style="width:120px;text-align:right;">Unrealized</th>
          <th></th>
        </tr></thead>
        <tbody>${rows || '<tr><td colspan="7" class="text-muted" style="padding:14px 20px;">No holdings yet.</td></tr>'}</tbody>
      </table>
      <div style="padding:10px 20px;"><button class="btn btn-ghost btn-sm" data-act="add-holding" data-account="${esc(acct.id)}">+ Add holding</button></div>
    </div>`;
}

function renderCheckin() {
  ensureCheckinDraft();
  const ci = ui.checkin;
  const baseVals = ci.baseDate ? valueIndex(snapshotByDate(ci.baseDate)) : {};

  const groups = accountGroups();
  const acctBlocks = groups.map(g => {
    let gTotal = 0;
    for (const acct of g.accounts) for (const h of activeHoldings(acct.id)) gTotal += parseNum((ci.values[h.id] || {}).marketValue) || 0;
    const header = `<div style="display:flex;align-items:baseline;gap:10px;padding:14px 20px 8px;border-bottom:1px solid var(--color-divider);background:color-mix(in srgb, var(--color-text) 2%, transparent);">
      <span class="kicker" style="font-size:11px;">${esc(g.label)}</span>
      <span class="text-muted" style="font-size:11px;">${g.accounts.length} account${g.accounts.length > 1 ? 's' : ''}</span>
      <span class="text-muted tnum" style="font-size:12px;margin-left:auto;">${fmtMoney2(gTotal)}</span>
    </div>`;
    return header + g.accounts.map(acct => checkinAccountBlock(acct, ci, baseVals)).join('');
  }).join('');

  const total = checkinTotal();
  const sanity = checkinSanityHTML(total);

  return `<div class="panel">
    <div style="display:flex;align-items:flex-end;gap:20px;padding:18px 20px;border-bottom:1px solid var(--color-divider);">
      <div>
        <h3 style="margin:0 0 4px;">New check-in</h3>
        <span class="text-muted" style="font-size:13px;">${ci.baseDate ? `Prefilled from ${esc(ci.baseDate)} · overtype what changed` : 'First snapshot — enter current values'}</span>
      </div>
      <div class="field" style="width:150px;margin-left:8px;"><label>Snapshot date</label><input class="input" type="date" value="${esc(ci.date)}" data-act="ci-date"></div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:10px;">
        <button class="btn btn-secondary" data-act="ci-discard">Discard</button>
        <button class="btn btn-secondary" data-act="add-account">+ Account</button>
        <button class="btn btn-primary" data-act="ci-save">Save snapshot</button>
      </div>
    </div>
    ${acctBlocks || '<div class="text-muted" style="padding:20px;">No accounts. Add one to start.</div>'}
    <div style="display:flex;align-items:center;gap:20px;padding:18px 20px;flex-wrap:wrap;">
      <div>
        <div class="kicker">Snapshot total</div>
        <div id="ci-total" style="font-family:var(--font-heading);font-size:30px;line-height:1.1;" class="tnum">${fmtMoney2(total)}</div>
      </div>
      <div class="field" style="width:190px;border-left:1px solid var(--color-divider);padding-left:20px;"><label>Net worth tracker says</label><input class="input tnum" inputmode="decimal" placeholder="optional" value="${esc(ui.checkinNetWorth)}" data-act="ci-nw"></div>
      <div id="ci-sanity" style="align-self:flex-end;padding-bottom:6px;">${sanity}</div>
      <div class="field" style="margin-left:auto;width:320px;"><label>Snapshot note (optional)</label><input class="input" value="${esc(ci.note)}" data-act="ci-note" placeholder="e.g. Bonds still light after top-up."></div>
    </div>
  </div>`;
}

function saveCheckin() {
  const ci = ui.checkin;
  const values = [];
  for (const h of activeHoldings()) {
    const v = ci.values[h.id] || {};
    const mv = parseNum(v.marketValue);
    if (mv == null) continue; // skip blank
    const entry = { holdingId: h.id, marketValue: mv };
    const cb = parseNum(v.costBasis);
    if (cb != null) entry.costBasis = cb;
    values.push(entry);
  }
  if (!values.length) { toast('Enter at least one value before saving.'); return; }
  const existing = snapshotByDate(ci.date);
  if (existing) { existing.values = values; existing.note = ci.note; }
  else portfolio.snapshots.push({ date: ci.date, values, note: ci.note });
  markDirty();
  ui.snapDate = ci.date; ui.checkin = null; ui.view = 'dashboard';
  render();
  toast('Snapshot saved · ' + ci.date);
}

/* ===============================================================
   HISTORY (F4)
   =============================================================== */
function renderHistory() {
  const series = historySeries('household');
  const tabs = [['value', 'Value by class'], ['pct', 'Allocation % over time'], ['growth', 'Growth by category']];
  const tabHTML = tabs.map(([t, l]) =>
    `<label class="seg-opt"><input type="radio" name="htab" ${ui.historyTab === t ? 'checked' : ''} data-act="htab" data-tab="${t}">${l}</label>`).join('');
  let chart, legend = '';
  if (ui.historyTab === 'value') {
    chart = stackedAreaSVG(series);
    legend = TAXONOMY.groups.map(g => `<div class="legend-item"><span class="swatch" style="background:${groupColor(g.id)}"></span>${esc(g.label)}</div>`).join('');
  } else if (ui.historyTab === 'pct') {
    chart = pctStackSVG(series);
    legend = TAXONOMY.groups.map(g => `<div class="legend-item"><span class="swatch" style="background:${groupColor(g.id)}"></span>${esc(g.label)}</div>`).join('');
  } else {
    const dates = series.map(s => s.date);
    const cats = ['Retirement', '529', 'Non-Retirement', 'Other'];
    const palette = ['--color-accent-900', '--color-accent-2-500', '--color-accent-500', '--color-neutral-500'];
    const lines = cats.map((cat, i) => ({
      label: cat, color: cssVarValue(palette[i], '#888'),
      points: series.map(s => allocate(categoryHoldings(cat), snapshotByDate(s.date)).total),
    })).filter(l => l.points.some(v => v > 0));
    chart = multiLineSVG(dates, lines);
    legend = lines.map(l => `<div class="legend-item"><span class="swatch" style="background:${l.color}"></span>${esc(l.label)}</div>`).join('');
  }
  return `<div class="toolbar no-print"><div class="crumb"><span>History</span></div>
    <div class="seg" style="margin-left:auto;">${tabHTML}</div></div>
    <div class="panel"><div class="panel-hd"><h4>${esc(tabs.find(t => t[0] === ui.historyTab)[1])}</h4><span class="text-muted" style="font-size:12px;margin-left:auto;">${series.length} snapshot${series.length !== 1 ? 's' : ''}</span></div>
      <figure class="blueprint" style="margin:20px;padding:16px;">${corners()}${chart}</figure>
      <div class="legend" style="padding:0 20px 20px;">${legend}</div>
    </div>`;
}

/* ===============================================================
   GOAL & JOURNAL (F5)
   =============================================================== */
function renderGoal() {
  const goal = activeGoal(todayISO());
  const detail = TAXONOMY.detail;
  const draft = ui.goalDraft || (ui.goalDraft = {
    date: todayISO(),
    targets: (() => { const dt = goalDetailTargets(goal); return Object.fromEntries(detail.map(d => [d.id, dt && dt[d.id] != null ? dt[d.id] : 0])); })(),
    rationale: '',
  });
  const sum = detail.reduce((s, d) => s + (Number(draft.targets[d.id]) || 0), 0);
  // 14 classes grouped by rollup family, each family showing its subtotal.
  const inputs = TAXONOMY.groups.map(grp => {
    const kids = detail.filter(d => d.group === grp.id);
    const famSum = kids.reduce((s, d) => s + (Number(draft.targets[d.id]) || 0), 0);
    const rows = kids.map(d => `
      <div class="drift-row" style="grid-template-columns:150px 1fr 58px;gap:10px;">
        <span style="font-size:13px;"><span class="swatch" style="background:${detailColor(d.id)};margin-right:6px;"></span>${esc(d.label)}</span>
        <input type="range" min="0" max="100" step="1" value="${draft.targets[d.id]}" data-act="goal-slider" data-gid="${d.id}" style="width:100%;">
        <input class="input tnum" style="text-align:right;min-height:28px;padding:3px 6px;" inputmode="numeric" value="${draft.targets[d.id]}" data-act="goal-num" data-gid="${d.id}">
      </div>`).join('');
    return `<div style="margin-bottom:4px;">
      <div style="display:flex;align-items:baseline;gap:8px;margin:8px 0 4px;border-bottom:1px solid var(--color-divider);padding-bottom:2px;">
        <span class="kicker" style="font-size:10px;">${esc(grp.label)}</span>
        <span class="text-muted tnum" id="goal-fam-${grp.id}" style="font-size:11px;margin-left:auto;">${Math.round(famSum)}%</span>
      </div>${rows}</div>`;
  }).join('');
  const sumOk = Math.abs(sum - 100) < 0.5;
  const canSave = sumOk && draft.rationale.trim().length > 0;

  const timeline = portfolio.goals.slice().sort((a, b) => b.effectiveDate.localeCompare(a.effectiveDate)).map((g, i) => `
    <div style="display:grid;grid-template-columns:100px 1fr;gap:14px;border-left:1px solid var(--color-divider);padding:0 0 14px 14px;position:relative;">
      <span class="text-muted tnum" style="font-size:12px;">${esc(g.effectiveDate)}${i === 0 ? ' <span class="tag tag-accent">current</span>' : ''}</span>
      <div>
        <div style="font-size:13px;font-family:var(--font-heading);">${(() => { const gg = goalGroupTargets(g) || {}; return TAXONOMY.groups.filter(x => gg[x.id]).map(x => `${x.label.split(' ')[0]} ${Math.round(gg[x.id])}%`).join(' · '); })()}</div>
        <p class="text-muted" style="margin:2px 0 0;font-size:13px;">${esc(g.rationale || '(no rationale recorded)')}</p>
      </div>
    </div>`).join('') || '<span class="text-muted">No goals recorded yet.</span>';

  return `<div class="toolbar no-print"><div class="crumb"><span>Goal &amp; journal</span></div></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;">
    <div class="panel">
      <div class="panel-hd"><h4>Household target — 14 classes</h4><span id="goal-sum" class="tnum text-muted" style="margin-left:auto;font-size:13px;color:${sumOk ? '' : 'var(--color-crit)'};">sum ${Math.round(sum)}%</span></div>
      <div style="padding:20px;display:flex;flex-direction:column;gap:10px;">
        ${inputs}
        <div class="field" style="margin-top:10px;"><label>Why is the goal changing? (required — this is the journal)</label>
          <textarea class="input" data-act="goal-rationale" placeholder="e.g. Trimmed equities 5% into bonds as we near the home-fund milestone.">${esc(draft.rationale)}</textarea></div>
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="field" style="width:150px;"><label>Effective date</label><input class="input" type="date" value="${esc(draft.date)}" data-act="goal-date"></div>
          <button class="btn btn-primary" style="margin-left:auto;align-self:flex-end;" data-act="goal-save" ${canSave ? '' : 'disabled'}>Save goal change</button>
        </div>
        ${!sumOk ? '<span class="text-muted" style="font-size:12px;color:var(--color-warn);">Targets must sum to 100% to save.</span>' : ''}
        ${sumOk && !draft.rationale.trim() ? '<span class="text-muted" style="font-size:12px;">A rationale note is required — an empty goal change is not allowed (§7.6).</span>' : ''}
      </div>
    </div>
    <div class="panel">
      <div class="panel-hd"><h4>Goal journal</h4></div>
      <div style="padding:20px;display:flex;flex-direction:column;gap:0;">${timeline}</div>
    </div>
  </div>
  ${renderGlidePaths()}`;
}

function renderGlidePaths() {
  if (!portfolio.children.length) {
    return `<div class="panel"><div class="panel-hd"><h4>529 glide paths</h4></div>
      <div style="padding:20px;"><span class="text-muted" style="font-size:13px;">Add a child in Accounts to define an age-based 529 glide path.</span></div></div>`;
  }
  const blocks = portfolio.children.map(child => {
    let gp = portfolio.glidePaths.find(g => g.childId === child.id);
    const bands = gp ? gp.bands.slice().sort((a, b) => a.ageFrom - b.ageFrom) : [];
    const age = childAge(child.birthYear, todayISO());
    const rows = bands.map((b, i) => {
      const active = age >= b.ageFrom && age <= b.ageTo;
      const t = TAXONOMY.groups.filter(g => b.targets[g.id]).map(g => `${g.label.split(' ')[0]} ${b.targets[g.id]}%`).join(' · ');
      return `<tr ${active ? 'style="background:var(--color-accent-100);"' : ''}>
        <td class="tnum">${b.ageFrom}–${b.ageTo}${active ? ' <span class="tag tag-accent">now</span>' : ''}</td>
        <td style="font-size:13px;">${t || '<span class="text-muted">—</span>'}</td>
        <td style="text-align:right;"><button class="btn btn-ghost btn-sm" data-act="edit-band" data-child="${esc(child.id)}" data-idx="${i}">edit</button><button class="btn btn-ghost btn-sm btn-danger" data-act="del-band" data-child="${esc(child.id)}" data-idx="${i}">✕</button></td>
      </tr>`;
    }).join('');
    return `<div style="border:1px solid var(--color-divider);padding:0;">
      <div class="panel-hd"><h4>${esc(child.label)} <span class="text-muted" style="font-family:var(--font-body);font-size:13px;">born ${esc(child.birthYear)} · age ${age}</span></h4>
        <button class="btn btn-ghost btn-sm" style="margin-left:auto;" data-act="add-band" data-child="${esc(child.id)}">+ Add band</button></div>
      <table class="table"><thead><tr><th style="padding-left:16px;">Age band</th><th>Targets</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="3" class="text-muted" style="padding:12px 16px;">No bands yet.</td></tr>'}</tbody></table>
      <div style="padding:10px 16px;"><input class="input" style="max-width:520px;" placeholder="Glide rationale (optional)" value="${esc(gp ? gp.rationale || '' : '')}" data-act="glide-rationale" data-child="${esc(child.id)}"></div>
    </div>`;
  }).join('');
  return `<div class="panel"><div class="panel-hd"><h4>529 glide paths</h4><span class="text-muted" style="font-size:12px;margin-left:auto;">per child · measured instead of the household goal (§12.3)</span></div>
    <div style="padding:20px;display:flex;flex-direction:column;gap:20px;">${blocks}</div></div>`;
}

/* ===============================================================
   REPORT (F7) — screen preview + print
   =============================================================== */
function renderReport() {
  const snap = currentSnapshot();
  const snaps = sortedSnapshots().slice().reverse();
  const opts = snaps.map((s, i) => `<option value="${s.date}" ${snap && s.date === snap.date ? 'selected' : ''}>${s.date}${i === 0 ? ' (latest)' : ''}</option>`).join('');
  return `<div class="toolbar no-print"><div class="crumb"><span>Allocation report</span></div>
    <div class="field" style="width:170px;margin-left:auto;"><select class="input" data-act="pick-snap">${opts}</select></div>
    <button class="btn btn-secondary" data-act="report-csv">Export CSV</button>
    <button class="btn btn-primary" data-act="print">Print / Save PDF</button>
  </div>
  <div class="report show-screen panel" style="padding:28px;">${reportHTML(snap)}</div>`;
}

function allocTableHTML(rows, goalTargets, band) {
  const drift = goalTargets ? computeDrift(rows, rows.reduce((s, r) => s + r.value, 0), goalTargets, band) : null;
  const driftById = drift ? Object.fromEntries(drift.map(d => [d.id, d])) : {};
  const body = rows.map(r => {
    const d = driftById[r.id];
    return `<tr>
      <td><span class="swatch" style="background:${r.color};margin-right:6px;"></span>${esc(r.label)}</td>
      <td class="tnum" style="text-align:right;">${fmtMoney(r.value)}</td>
      <td class="tnum" style="text-align:right;">${fmtPct(r.pct)}</td>
      <td class="tnum" style="text-align:right;">${goalTargets && goalTargets[r.id] != null ? goalTargets[r.id] + '%' : '—'}</td>
      <td class="tnum" style="text-align:right;color:${d && d.breach ? 'var(--color-crit)' : ''}">${d ? fmtPctSigned(d.driftPct) + (d.breach ? ' ⚠' : '') : '—'}</td>
    </tr>`;
  }).join('');
  return `<table class="table"><thead><tr><th>Asset class</th><th style="text-align:right;">Value</th><th style="text-align:right;">Actual</th><th style="text-align:right;">Goal</th><th style="text-align:right;">Drift</th></tr></thead><tbody>${body}</tbody></table>`;
}

function reportSection(title, subtitle, holdings, snap, goalTargets, band, showAccounts, detailTargets) {
  const a = allocate(holdings, snap);
  const rollup = toRows(a.group, a.total, 'group');
  const detail = toRows(a.detail, a.total, 'detail');
  let accountsHTML = '';
  if (showAccounts && showAccounts.length) {
    accountsHTML = '<div style="margin-top:12px;"><div class="kicker" style="margin-bottom:6px;">Accounts</div>' +
      showAccounts.map(acct => {
        const av = allocate(accountHoldings(acct.id), snap);
        return `<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);"><span>${esc(acct.name)} <span class="text-muted">${esc(acct.institution || '')}</span></span><span class="tnum">${fmtMoney(av.total)}</span></div>`;
      }).join('') + '</div>';
  }
  const goalRows = goalTargets
    ? TAXONOMY.groups.filter(g => goalTargets[g.id] != null).map(g => ({ id: g.id, label: g.label, color: groupColor(g.id), value: goalTargets[g.id], pct: goalTargets[g.id] }))
    : null;
  const legend = rollup.map(r => {
    const gt = goalTargets && goalTargets[r.id];
    return `<div class="legend-item"><span class="swatch" style="background:${r.color}"></span>${esc(r.label)} <span class="text-muted tnum">${r.pct.toFixed(0)}%${gt != null ? ' / ' + Math.round(gt) + '%' : ''}</span></div>`;
  }).join('');
  return `<section class="rep-section" style="margin-bottom:26px;">
    <h3 style="margin:0 0 2px;">${esc(title)}</h3>
    <div class="text-muted" style="font-size:13px;margin-bottom:12px;">${esc(subtitle)} · ${fmtMoney(a.total)}</div>
    <div style="display:flex;gap:24px;align-items:center;margin-bottom:16px;">
      <figure class="blueprint" style="padding:12px;flex:none;">${corners()}${concentricDonutSVG(rollup, goalRows)}</figure>
      <div style="flex:1;"><div class="kicker" style="margin-bottom:8px;">${goalRows ? 'Outer ring = actual · inner ring = goal' : 'Allocation'}</div><div class="legend" style="flex-direction:column;gap:7px;">${legend}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
      <div><div class="kicker" style="margin-bottom:6px;">Rollup</div>${allocTableHTML(rollup, goalTargets, band)}</div>
      <div><div class="kicker" style="margin-bottom:6px;">Detail</div>${allocTableHTML(detail, detailTargets || null, band)}</div>
    </div>
    ${accountsHTML}
  </section>`;
}

function reportHTML(snap) {
  if (!snap) return '<p class="text-muted">No snapshot to report on yet.</p>';
  const band = portfolio.meta.driftBandPct || 5;
  const goal = activeGoal(snap.date);
  const ggt = goal ? goalGroupTargets(goal) : null;
  const gdt = goal ? goalDetailTargets(goal) : null;
  let out = `<header style="border-bottom:2px solid var(--color-text);padding-bottom:10px;margin-bottom:20px;">
    <div class="kicker">Asset Allocation Report</div>
    <h1 style="margin:2px 0 0;font-size:34px;">As of ${esc(snap.date)}</h1>
  </header>`;

  // Order: Household → Investments (non-retirement) → Retirement → 529 → Others
  out += reportSection('Household', 'Excludes 529s · vs goal', householdHoldings(), snap, ggt, band, null, gdt);

  const nonret = accountsSorted(a => a.category === 'Non-Retirement');
  if (nonret.length) out += reportSection(catLabel('Non-Retirement'), 'vs household goal', nonret.flatMap(a => accountHoldings(a.id)), snap, ggt, band, nonret, gdt);

  const ret = accountsSorted(a => a.category === 'Retirement');
  if (ret.length) out += reportSection('Retirement', 'vs household goal', ret.flatMap(a => accountHoldings(a.id)), snap, ggt, band, ret, gdt);

  for (const acct of accountsSorted(a => a.category === '529')) {
    const child = childById(acct.childId);
    const g = glideTargets(acct.childId, snap.date);
    out += '<div class="page-break"></div>' + reportSection(`529 — ${child ? child.label : acct.name}`, `Age ${g ? g.age : '?'} · vs glide band`, accountHoldings(acct.id), snap, g && g.targets, band, [acct]);
  }

  // Other categories grouped by label
  const others = accountsSorted(a => a.category === 'Other');
  const byLabel = {};
  for (const a of others) { const k = a.categoryLabel || 'Other'; (byLabel[k] = byLabel[k] || []).push(a); }
  for (const [label, accts] of Object.entries(byLabel)) {
    out += reportSection(label, 'Other category · vs household goal', accts.flatMap(a => accountHoldings(a.id)), snap, ggt, band, accts, gdt);
  }

  out += `<footer style="border-top:1px solid var(--color-divider);margin-top:20px;padding-top:12px;font-size:12px;" class="text-muted">
    Snapshot ${esc(snap.date)} · Goal effective ${goal ? esc(goal.effectiveDate) : '—'} · Drift band ±${band}% absolute.
    ${goal && goal.rationale ? '<br>Latest rationale: ' + esc(goal.rationale) : ''}
  </footer>`;
  return out;
}

/* ===============================================================
   TOAST + afterRender (dialog/toast mounting)
   =============================================================== */
let _toastTimer = null;
function toast(msg) {
  ui._toast = msg;
  const app = document.getElementById('app');
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.style.display = 'block';
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2600);
}

function afterRender() {
  const app = document.getElementById('app');
  const existing = document.getElementById('dialog-mount');
  if (existing) existing.remove();
  if (ui.dialog) {
    const mount = document.createElement('div');
    mount.id = 'dialog-mount';
    mount.innerHTML = dialogHTML();
    app.appendChild(mount);
    const first = mount.querySelector('input,select,textarea,button');
    if (first && first.tagName !== 'BUTTON') first.focus();
  }
}

/* ===============================================================
   EVENT DISPATCH (delegated)
   =============================================================== */
function boot() {
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  // Money inputs: strip grouping while editing, reformat to 1,234.00 on blur.
  document.addEventListener('focusin', e => {
    const t = e.target.closest && e.target.closest('input[data-act="ci-val"],input[data-act="ci-basis"],input[data-act="ci-nw"]');
    if (t) { const n = parseNum(t.value); t.value = n == null ? '' : String(n); }
  });
  document.addEventListener('focusout', e => {
    const t = e.target.closest && e.target.closest('input[data-act="ci-val"],input[data-act="ci-basis"],input[data-act="ci-nw"]');
    if (!t) return;
    const n = parseNum(t.value);
    t.value = n == null ? '' : fmtNum2(n);
    const act = t.dataset.act, hid = t.dataset.hid;
    if (act === 'ci-nw') ui.checkinNetWorth = t.value;
    else if (ui.checkin) { ui.checkin.values[hid] = ui.checkin.values[hid] || {}; ui.checkin.values[hid][act === 'ci-val' ? 'marketValue' : 'costBasis'] = t.value; }
    updateCheckinTotals();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.dialog) closeDialog(); });
  document.addEventListener('pointermove', onDonutHover);
  render();
  // Auto-restore the last file where the browser permits (Chrome/Edge handle,
  // or a served sibling my-portfolio.json). Falls back to the one-click reopen.
  tryAutoload().then(r => {
    if (r.loaded) { resetViewState(); render(); toast('Loaded · ' + fileName); }
    else if (r.needsClick) { ui.pendingReopen = r.name; render(); }
  }).catch(() => {});
}

/* Donut hover: update the fixed readout to the right of the donut (CSS pops the
   slice). One steady spot so it's easy to read. */
const RO_HINT = '<div class="ro-hint text-muted">Hover a slice</div>';
function onDonutHover(e) {
  const s = e.target.closest ? e.target.closest('[data-slice]') : null;
  const active = s ? s.closest('.donut-wrap') : null;
  document.querySelectorAll('.donut-readout').forEach(ro => {
    if (ro.parentElement !== active) ro.innerHTML = RO_HINT;
  });
  if (!active) return;
  const ro = active.querySelector('.donut-readout'); if (!ro) return;
  ro.innerHTML = `<div class="ro-ring text-muted">${esc(s.dataset.ring)}</div>`
    + `<div class="ro-label">${esc(s.dataset.label)}</div>`
    + `<div class="ro-pct">${s.dataset.pct}%</div>`;
}

function onClick(e) {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act, ds = t.dataset;
  switch (a) {
    case 'nav': ui.view = ds.view; if (ds.view !== 'checkin') ui.checkin = ui.checkin; render(); break;
    case 'save': saveFile().then(r => { if (r && r.ok) toast('Saved · ' + fileName); render(); }); break;
    case 'open': doOpen(); break;
    case 'new-checkin': startCheckin(); break;
    case 'load-demo': loadDemoData(); resetViewState(); render(); toast('Demo data loaded'); break;
    case 'onboard-start': openDialog({ type: 'account' }); break;
    case 'reopen-file': reopenPending(); break;
    case 'drill':
      ui.drill = { level: ds.level, category: ds.category || null, categoryLabel: ds.categorylabel || null, accountId: ds.account || null };
      if (ds.level === 'account') { const ac = accountById(ds.account); ui.drill.category = ac ? ac.category : null; ui.drill.categoryLabel = ac ? (ac.categoryLabel || null) : null; }
      ui.view = 'dashboard'; render(); break;
    case 'ci-toggle': ui.checkinOpen[ds.account] = !ui.checkinOpen[ds.account]; render(); break;
    case 'ci-discard': ui.checkin = null; ui.view = 'dashboard'; render(); break;
    case 'ci-save': saveCheckin(); break;
    case 'add-account': openDialog({ type: 'account' }); break;
    case 'edit-account': openDialog({ type: 'account', acctId: ds.account }); break;
    case 'add-child': openDialog({ type: 'child' }); break;
    case 'add-holding': openDialog({ type: 'holding', acctId: ds.account }); break;
    case 'edit-class': openDialog({ type: 'class-pick', hid: ds.hid }); break;
    case 'archive-holding': archiveHolding(ds.hid); break;
    case 'archive-account': confirmArchiveAccount(ds.account); break;
    case 'move-acct': moveAccount(ds.account, Number(ds.dir)); break;
    case 'del-child': deleteChild(ds.child); break;
    case 'pick-class': setHoldingClass(ds.hid, ds.cls); break;
    case 'comp-preset': applyCompPreset(ds.preset); break;
    case 'save-composition': saveComposition(ds.hid); break;
    case 'save-account': saveAccountFromDialog(ds.acct || null); break;
    case 'save-child': saveChildFromDialog(); break;
    case 'save-holding': saveHoldingFromDialog(ds.account); break;
    case 'add-band': openDialog({ type: 'band', child: ds.child }); break;
    case 'edit-band': openDialog({ type: 'band', child: ds.child, idx: Number(ds.idx) }); break;
    case 'del-band': deleteBand(ds.child, Number(ds.idx)); break;
    case 'save-band': saveBandFromDialog(ds.child, ds.idx === '' ? null : Number(ds.idx)); break;
    case 'goal-save': saveGoalDraft(); break;
    case 'start-fresh': openDialog({ type: 'confirm', title: 'Start fresh?', body: 'This clears all accounts, holdings, snapshots and goals in memory. Save your file first if you want to keep it. (Your saved file on disk is not touched.)', ok: 'Start fresh', danger: true, action: 'start-fresh' }); break;
    case 'export-csv': { const s = currentSnapshot(); if (s) triggerDownload(snapshotCSV(s), `snapshot-${s.date}.csv`, 'text/csv'); else toast('No snapshot to export.'); break; }
    case 'report-csv': { const s = currentSnapshot(); if (s) triggerDownload(snapshotCSV(s), `report-${s.date}.csv`, 'text/csv'); break; }
    case 'print': window.print(); break;
    case 'confirm-yes': handleConfirm(); break;
    case 'close-dialog': closeDialog(); break;
    case 'backdrop': if (!e.target.closest('[data-stop]')) closeDialog(); break;
  }
}

function onChange(e) {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act, ds = t.dataset;
  if (a === 'level') { ui.level = ds.level; render(); }
  else if (a === 'pick-snap') { ui.snapDate = t.value; render(); }
  else if (a === 'htab') { ui.historyTab = ds.tab; render(); }
  else if (a === 'acct-cat') {
    const other = document.getElementById('f-other-wrap'), child = document.getElementById('f-child-wrap');
    if (other) other.style.display = t.value === 'Other' ? 'block' : 'none';
    if (child) child.style.display = t.value === '529' ? 'block' : 'none';
  }
}

function onInput(e) {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act, ds = t.dataset;
  // check-in fields — mutate draft WITHOUT re-render (preserve focus); recompute totals lazily
  if (a === 'ci-val')   { ui.checkin.values[ds.hid] = ui.checkin.values[ds.hid] || {}; ui.checkin.values[ds.hid].marketValue = t.value; updateCheckinTotals(); }
  else if (a === 'ci-basis') { ui.checkin.values[ds.hid] = ui.checkin.values[ds.hid] || {}; ui.checkin.values[ds.hid].costBasis = t.value; }
  else if (a === 'ci-note') { ui.checkin.note = t.value; }
  else if (a === 'ci-date') { ui.checkin.date = t.value; }
  else if (a === 'ci-nw') { ui.checkinNetWorth = t.value; updateCheckinTotals(); }
  else if (a === 'comp-input') { updateCompSum(); }
  else if (a === 'goal-slider' || a === 'goal-num') {
    const v = Math.max(0, Math.min(100, Math.round(Number(t.value) || 0)));
    ui.goalDraft.targets[ds.gid] = v; renderGoalLive();
  }
  else if (a === 'goal-rationale') { ui.goalDraft.rationale = t.value; toggleGoalSave(); }
  else if (a === 'goal-date') { ui.goalDraft.date = t.value; }
  else if (a === 'set-band') { const n = parseNum(t.value); if (n != null) { portfolio.meta.driftBandPct = Math.max(1, Math.min(50, n)); markDirty(); } }
  else if (a === 'glide-rationale') { const gp = ensureGlide(ds.child); gp.rationale = t.value; markDirty(); }
}

/* Light-touch updates that avoid a full re-render mid-typing */
function renderGoalLive() {
  markDirty();
  // update siblings + subtotals + overall sum without stealing focus
  const T = ui.goalDraft.targets;
  const sum = TAXONOMY.detail.reduce((s, d) => s + (Number(T[d.id]) || 0), 0);
  document.querySelectorAll('[data-act="goal-slider"]').forEach(el => { el.value = T[el.dataset.gid]; });
  document.querySelectorAll('[data-act="goal-num"]').forEach(el => { if (el !== document.activeElement) el.value = T[el.dataset.gid]; });
  for (const grp of TAXONOMY.groups) {
    const fam = document.getElementById('goal-fam-' + grp.id);
    if (fam) fam.textContent = Math.round(TAXONOMY.detail.filter(d => d.group === grp.id).reduce((s, d) => s + (Number(T[d.id]) || 0), 0)) + '%';
  }
  const sumEl = document.getElementById('goal-sum');
  if (sumEl) { sumEl.textContent = 'sum ' + Math.round(sum) + '%'; sumEl.style.color = Math.abs(sum - 100) < 0.5 ? '' : 'var(--color-crit)'; }
  toggleGoalSave();
}
function toggleGoalSave() {
  const sum = TAXONOMY.detail.reduce((s, d) => s + (Number(ui.goalDraft.targets[d.id]) || 0), 0);
  const btn = document.querySelector('[data-act="goal-save"]');
  if (btn) btn.disabled = !(Math.abs(sum - 100) < 0.5 && ui.goalDraft.rationale.trim().length > 0);
}

/* ===============================================================
   MUTATIONS wired from the dispatch
   =============================================================== */
async function doOpen() {
  if (dirty && !confirm('You have unsaved changes. Open another file and discard them?')) return;
  const r = await openFile();
  if (r.ok) { resetViewState(); render(); toast('Loaded · ' + fileName); }
  else if (r.error) toast('Could not open: ' + r.error);
}

function setHoldingClass(hid, cls) {
  const h = portfolio.holdings.find(x => x.id === hid);
  if (h) { h.assetClass = cls; delete h.composition; if (h.ticker) portfolio.tickerMap[h.ticker.trim().toUpperCase()] = cls; markDirty(); }
  closeDialog();
}

/* ---- Look-through composition editor ---- */
const COMP_PRESETS = {
  '90/10':     { us_total: 54, intl_dev: 36, us_bond: 10 },
  '80/20':     { us_total: 48, intl_dev: 32, us_bond: 16, intl_bond: 4 },
  '60/40':     { us_total: 36, intl_dev: 24, us_bond: 32, intl_bond: 8 },
  'three-fund':{ us_total: 54, intl_dev: 36, us_bond: 10 },
};
function applyCompPreset(name) {
  const preset = name === 'clear' ? {} : (COMP_PRESETS[name] || {});
  for (const dc of TAXONOMY.detail) {
    const el = document.getElementById('comp-' + dc.id);
    if (el) el.value = preset[dc.id] != null ? preset[dc.id] : '';
  }
  updateCompSum();
}
function readCompInputs() {
  const comp = {};
  let sum = 0;
  for (const dc of TAXONOMY.detail) {
    const el = document.getElementById('comp-' + dc.id);
    const v = el ? parseNum(el.value) : null;
    if (v && v > 0) { comp[dc.id] = v; sum += v; }
  }
  return { comp, sum };
}
function updateCompSum() {
  const { sum } = readCompInputs();
  const el = document.getElementById('comp-sum');
  if (el) { el.textContent = 'split sum ' + Math.round(sum) + '%'; el.style.color = (sum === 0 || Math.abs(sum - 100) < 0.5) ? '' : 'var(--color-warn)'; }
}
function saveComposition(hid) {
  const h = portfolio.holdings.find(x => x.id === hid);
  if (!h) { closeDialog(); return; }
  const { comp, sum } = readCompInputs();
  if (Object.keys(comp).length === 0) { toast('Enter at least one class %, or pick a single class above.'); return; }
  if (Math.abs(sum - 100) > 0.5) { toast('Split must sum to 100% (now ' + Math.round(sum) + ').'); return; }
  h.composition = comp;
  // primary class (chip label) = largest weight
  h.assetClass = Object.entries(comp).sort((a, b) => b[1] - a[1])[0][0];
  markDirty(); closeDialog();
}
function archiveHolding(hid) {
  const h = portfolio.holdings.find(x => x.id === hid);
  if (h) { h.status = 'archived'; if (ui.checkin) delete ui.checkin.values[hid]; markDirty(); render(); }
}
function confirmArchiveAccount(id) {
  const a = accountById(id);
  openDialog({ type: 'confirm', title: 'Archive account?', body: `“${a ? a.name : ''}” and its holdings are archived (kept for history, hidden from entry). This never deletes past snapshots.`, ok: 'Archive', danger: true, action: 'archive-account', id });
}
function moveAccount(id, dir) {
  const a = accountById(id);
  if (!a) return;
  const sibs = accountsSorted(x => x.category === a.category);
  const i = sibs.findIndex(x => x.id === id);
  const j = i + dir;
  if (j < 0 || j >= sibs.length) return;
  const tmp = sibs[i].sortOrder ?? i, other = sibs[j].sortOrder ?? j;
  sibs[i].sortOrder = other; sibs[j].sortOrder = tmp;
  markDirty(); render();
}
function deleteChild(id) {
  if (portfolio.accounts.some(a => a.childId === id && a.status !== 'archived')) { toast('Reassign or archive this child\'s 529 first.'); return; }
  portfolio.children = portfolio.children.filter(c => c.id !== id);
  portfolio.glidePaths = portfolio.glidePaths.filter(g => g.childId !== id);
  markDirty(); render();
}

function saveAccountFromDialog(acctId) {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { toast('Account name is required.'); return; }
  const category = document.getElementById('f-cat').value;
  const institution = document.getElementById('f-inst').value.trim();
  const taxTreatment = document.getElementById('f-tax').value || undefined;
  const categoryLabel = category === 'Other' ? document.getElementById('f-catlabel').value.trim() : undefined;
  const childId = category === '529' ? (document.getElementById('f-child').value || undefined) : undefined;
  if (category === 'Other' && !categoryLabel) { toast('Other needs a category label.'); return; }
  if (category === '529' && !childId) { toast('Pick a child for the 529 (add one in Accounts first).'); return; }
  if (acctId) {
    const a = accountById(acctId);
    Object.assign(a, { name, category, institution, taxTreatment, categoryLabel, childId });
  } else {
    const maxOrder = Math.max(-1, ...portfolio.accounts.filter(a => a.category === category).map(a => a.sortOrder ?? 0));
    portfolio.accounts.push({ id: uid('acct'), name, institution, category, categoryLabel, taxTreatment, childId, sortOrder: maxOrder + 1, status: 'active' });
  }
  markDirty(); closeDialog();
}
function saveChildFromDialog() {
  const label = document.getElementById('f-clabel').value.trim();
  const year = parseNum(document.getElementById('f-cyear').value);
  if (!label || !year) { toast('Name and birth year are required.'); return; }
  portfolio.children.push({ id: uid('child'), label, birthYear: year });
  markDirty(); closeDialog();
}
function saveHoldingFromDialog(acctId) {
  const ticker = document.getElementById('f-ticker').value.trim();
  if (!ticker) { toast('Ticker is required.'); return; }
  const name = document.getElementById('f-hname').value.trim() || undefined;
  let cls = document.getElementById('f-cls').value;
  const val = parseNum(document.getElementById('f-val').value);
  const basis = parseNum(document.getElementById('f-basis').value);
  if (!cls) cls = classifyTicker(ticker, portfolio.tickerMap);
  if (!cls) { toast('Unknown ticker — pick an asset class from the dropdown.'); return; }
  if (document.getElementById('f-cls').value) portfolio.tickerMap[ticker.toUpperCase()] = cls; // remember explicit pick
  const h = { id: uid('hold'), accountId: acctId, ticker, name, assetClass: cls, status: 'active' };
  if (basis != null) h.costBasis = basis;
  portfolio.holdings.push(h);
  if (ui.checkin) ui.checkin.values[h.id] = { marketValue: val != null ? String(val) : '', costBasis: basis != null ? String(basis) : '' };
  markDirty(); closeDialog();
}

function ensureGlide(childId) {
  let gp = portfolio.glidePaths.find(g => g.childId === childId);
  if (!gp) { gp = { childId, bands: [], rationale: '' }; portfolio.glidePaths.push(gp); }
  return gp;
}
function saveBandFromDialog(childId, idx) {
  const from = parseNum(document.getElementById('b-from').value);
  const to = parseNum(document.getElementById('b-to').value);
  if (from == null || to == null || to < from) { toast('Enter a valid age range.'); return; }
  const targets = {};
  let sum = 0;
  for (const g of TAXONOMY.groups) { const v = parseNum(document.getElementById('b-' + g.id).value); if (v) { targets[g.id] = v; sum += v; } }
  if (Math.abs(sum - 100) > 0.5) { toast('Band targets must sum to 100% (now ' + sum + ').'); return; }
  const gp = ensureGlide(childId);
  const sorted = gp.bands.slice().sort((a, b) => a.ageFrom - b.ageFrom);
  if (idx != null && sorted[idx]) { const band = sorted[idx]; band.ageFrom = from; band.ageTo = to; band.targets = targets; }
  else gp.bands.push({ ageFrom: from, ageTo: to, targets });
  markDirty(); closeDialog();
}
function deleteBand(childId, idx) {
  const gp = portfolio.glidePaths.find(g => g.childId === childId);
  if (!gp) return;
  const sorted = gp.bands.slice().sort((a, b) => a.ageFrom - b.ageFrom);
  const band = sorted[idx];
  gp.bands = gp.bands.filter(b => b !== band);
  markDirty(); render();
}

function saveGoalDraft() {
  const d = ui.goalDraft;
  const targets = {};
  for (const dc of TAXONOMY.detail) if (d.targets[dc.id]) targets[dc.id] = d.targets[dc.id];
  portfolio.goals.push({ effectiveDate: d.date, targets, rationale: d.rationale.trim() });
  ui.goalDraft = null; markDirty(); render(); toast('Goal saved to journal');
}

function handleConfirm() {
  const d = ui.dialog;
  if (!d) return;
  if (d.action === 'start-fresh') { portfolio = emptyPortfolio(); fileHandle = null; dirty = false; resetViewState(); closeDialog(); toast('Started fresh'); }
  else if (d.action === 'archive-account') { const a = accountById(d.id); if (a) { a.status = 'archived'; activeHoldings(d.id).forEach(h => h.status = 'archived'); } markDirty(); closeDialog(); }
  else closeDialog();
}

document.addEventListener('DOMContentLoaded', boot);

/* Expose internals for console testing during development. */
window.__AAT__ = {
  TAXONOMY, SEED_MAP, SEED_MAP_EXT, classifyTicker, migrate, emptyPortfolio, uid,
  allocate, toRows, computeDrift, activeGoal, glideTargets, historySeries,
  householdHoldings, categoryHoldings, accountHoldings, latestSnapshot,
  snapshotCSV, loadDemoData, saveFile, openFile,
  goalGroupTargets, goalDetailTargets, compositionOf, splitValue,
  get portfolio() { return portfolio; },
  set portfolio(p) { portfolio = p; },
};
</script>
