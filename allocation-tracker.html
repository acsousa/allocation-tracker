    <div style="padding:14px 20px;"><span class="text-muted" style="font-size:12px;">Link a 529 account to a child in <a data-act="nav" data-view="accounts" style="cursor:pointer;color:var(--color-accent);">Settings › Accounts</a> (edit the account). Set each child’s age-based glide path in <a data-act="nav" data-view="goal" style="cursor:pointer;color:var(--color-accent);">Review › Goals</a>.</span></div>
  </div>`;
}

/* ===============================================================
   SETTINGS › TAX PROFILE (§14, §13.1) — bracket picker + expert
   override, gain budget, household monthly savings, YTD contributions.
   =============================================================== */
function renderTaxProfile() {
  const ts = portfolio.taxSettings;
  const ref = REFERENCE_DATA;
  const rates = taxRates();
  const ov = ts.override || {};
  const advanced = !!ui.taxAdvanced || !!ts.override;
  const opt = (val, label, sel) => `<option value="${esc(val)}" ${sel ? 'selected' : ''}>${esc(label)}</option>`;
  const filingOpts = Object.keys(FILING_STATUS_LABELS).map(k => opt(k, FILING_STATUS_LABELS[k], ts.filingStatus === k)).join('');
  const bandOpts = ref.incomeBands.map(b => opt(b.key, b.label, ts.incomeBand === b.key)).join('');
  const stateOpts = opt('', '— no state income tax —', !ts.state)
    + Object.keys(ref.stateRates).sort().map(s => opt(s, `${s} · ${ref.stateRates[s].toFixed(2)}%`, ts.state === s)).join('');
  const stateNote = ts.state && ref.stateNotes[ts.state] ? `<div class="text-muted" style="font-size:12px;margin-top:4px;">${esc(ref.stateNotes[ts.state])}</div>` : '';

  const rateChip = (label, v) => `<div style="display:flex;flex-direction:column;gap:2px;"><span class="kicker" style="font-size:10px;">${label}</span><span class="tnum" style="font-size:18px;font-family:var(--font-heading);">${fmtPct(v * 100, 1)}</span></div>`;

  const advPanel = advanced ? `
    <div class="panel" style="border-color:var(--color-accent-2);">
      <div class="panel-hd" style="border-color:var(--color-accent-2);"><h4>Expert override</h4><span class="text-muted" style="font-size:12px;margin-left:auto;">blank = use derived value</span></div>
      <div style="padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;">
        <div class="field"><label>Ordinary rate (%)</label><input class="input tnum" inputmode="decimal" data-act="ov-ord" value="${ov.ordinaryRate != null ? (ov.ordinaryRate * 100) : ''}" placeholder="${(rates.r_ord * 100).toFixed(1)}"></div>
        <div class="field"><label>${abbr('QDI', 'Qualified dividends')} / ${abbr('LTCG', 'Long-term capital gains')} rate (%)</label><input class="input tnum" inputmode="decimal" data-act="ov-ltcg" value="${ov.ltcgRate != null ? (ov.ltcgRate * 100) : ''}" placeholder="${(rates.r_qdi * 100).toFixed(1)}"></div>
        <div class="field"><label>State rate (%)</label><input class="input tnum" inputmode="decimal" data-act="ov-state" value="${ov.stateRate != null ? (ov.stateRate * 100) : ''}" placeholder="${(rates.r_state * 100).toFixed(2)}"></div>
        <label class="radio" style="align-items:center;"><input type="checkbox" data-act="ov-niit" ${ov.niitApplies ? 'checked' : ''}><span class="dot"></span>Force ${abbr('NIIT', 'Net Investment Income Tax')} (3.8%)</label>
        <label class="radio" style="align-items:center;"><input type="checkbox" data-act="ov-surtax" ${ov.surtaxApplies ? 'checked' : ''}><span class="dot"></span>Force ${abbr('MA', 'Massachusetts')} 4% surtax</label>
      </div>
      <div style="padding:0 20px 18px;"><button class="btn btn-sm btn-secondary" data-act="ov-clear">Clear all overrides</button></div>
    </div>` : `<div style="padding:2px 2px 6px;"><button class="btn btn-sm btn-secondary" data-act="ov-toggle">Advanced: override derived rates…</button></div>`;

  const advAccts = portfolio.accounts.filter(a => a.status !== 'archived' && (a.category === 'Retirement' || a.category === '529'));
  const ytd = ts.ytdContributions || {};
  const ytdRows = advAccts.length ? advAccts.map(a => `<div class="drift-row" style="grid-template-columns:1fr 120px;gap:10px;align-items:center;">
      <span style="font-size:13px;">${esc(a.name)} <span class="text-muted">· ${esc(a.category)}</span></span>
      <input class="input tnum" inputmode="decimal" style="text-align:right;min-height:30px;" data-act="ts-ytd" data-account="${esc(a.id)}" value="${ytd[a.id] ? fmtEditNum(ytd[a.id]) : ''}" placeholder="0">
    </div>`).join('') : '<span class="text-muted" style="font-size:13px;">No tax-advantaged accounts yet.</span>';

  return `<div class="toolbar no-print"><div class="crumb"><span>Tax Profile</span></div>
    <span class="tag tag-accent" style="margin-left:auto;">Tax Year ${ref.taxYear}</span></div>
  <div class="panel"><div class="panel-hd"><h4>Bracket picker</h4><span class="text-muted" style="font-size:12px;margin-left:auto;">${esc(ref.source)}</span></div>
    <div style="padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;">

      <div style="width:1px;align-self:stretch;background:var(--color-divider);"></div>

      <div class="field"><label>Household savings ($/month)</label><input class="input tnum" inputmode="decimal" data-act="ts-savings" value="${ts.householdMonthlySavings ? fmtEditNum(ts.householdMonthlySavings) : ''}" placeholder="0"><span class="text-muted" style="font-size:11px;">Drives the Plan’s savings directive (§13.8).</span></div>
    </div>
    <div class="panel-hd" style="border-top:1px solid var(--color-divider);"><h4 style="font-size:13px;">YTD contributions (for headroom)</h4></div>
    <div style="padding:16px 20px 20px;display:flex;flex-direction:column;gap:8px;max-width:520px;">${ytdRows}</div>
  </div>
  <div style="padding:0 2px;"><span class="text-muted" style="font-size:12px;">Estimates only — confirm material decisions with a CPA.</span></div>`;
}

/* ===============================================================
   SETTINGS › DATA & PRIVACY (§14) — save/load, CSV, start fresh.
   Network features are omitted entirely in this build (offline-only).

/* ===============================================================
   TOAST + afterRender (dialog/toast mounting)
   =============================================================== */
let _toastTimer = null;
function toast(msg) {
  ui._toast = msg;
  const app = document.getElementById('app');
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.style.display = 'block';
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2600);
}

function afterRender() {
  const app = document.getElementById('app');
  const existing = document.getElementById('dialog-mount');
  if (existing) existing.remove();
  if (ui.dialog) {
    const mount = document.createElement('div');
    mount.id = 'dialog-mount';
    mount.innerHTML = dialogHTML();
    app.appendChild(mount);
    const first = mount.querySelector('input,select,textarea,button');
    if (first && first.tagName !== 'BUTTON') first.focus();
  }
}

/* ===============================================================
   EVENT DISPATCH (delegated)
   =============================================================== */
function boot() {
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  // Money inputs: strip grouping while editing, reformat to 1,234.00 on blur.
  document.addEventListener('focusin', e => {
    const t = e.target.closest && e.target.closest('input[data-act="ci-val"],input[data-act="ci-basis"],input[data-act="ci-nw"]');
    if (t) { const n = parseNum(t.value); t.value = n == null ? '' : String(n); }
  });
  document.addEventListener('focusout', e => {
    const t = e.target.closest && e.target.closest('input[data-act="ci-val"],input[data-act="ci-basis"],input[data-act="ci-nw"]');
    if (!t) return;
    const n = parseNum(t.value);
    t.value = n == null ? '' : fmtNum2(n);
    const act = t.dataset.act, hid = t.dataset.hid;
    if (act === 'ci-nw') ui.checkinNetWorth = t.value;
    else if (ui.checkin) { ui.checkin.values[hid] = ui.checkin.values[hid] || {}; ui.checkin.values[hid][act === 'ci-val' ? 'marketValue' : 'costBasis'] = t.value; }
    updateCheckinTotals();
    if (hid) updateBasisFlag(hid);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.dialog) closeDialog(); });
  document.addEventListener('pointermove', onDonutHover);
  document.addEventListener('pointermove', onChartHover);
  render();
  // Auto-restore the last file where the browser permits (Chrome/Edge handle,
  // or a served sibling my-portfolio.json). Falls back to the one-click reopen.
  tryAutoload().then(r => {
    if (r.loaded) { resetViewState(); render(); toast('Loaded · ' + fileName); }
    else if (r.needsClick) { ui.pendingReopen = r.name; render(); }
  }).catch(() => {});
}

/* Donut hover: update the fixed readout to the right of the donut (CSS pops the
   slice). One steady spot so it's easy to read. */
const RO_HINT = '<div class="ro-hint text-muted">Hover a slice</div>';
function onDonutHover(e) {
  const s = e.target.closest ? e.target.closest('[data-slice]') : null;
  const active = s ? s.closest('.donut-wrap') : null;
  document.querySelectorAll('.donut-readout').forEach(ro => {
    if (ro.parentElement !== active) ro.innerHTML = RO_HINT;
  });
  if (!active) return;
  const ro = active.querySelector('.donut-readout'); if (!ro) return;
  ro.innerHTML = `<div class="ro-ring text-muted">${esc(s.dataset.ring)}</div>`
    + `<div class="ro-label">${esc(s.dataset.label)}</div>`
    + `<div class="ro-pct">${s.dataset.pct}%</div>`;
}

function onClick(e) {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act, ds = t.dataset;
  switch (a) {
    case 'nav': {
      ui.view = ds.view;
      // Plan auto-generates on first open (from tax + drift + savings, §13.4–13.8).
      if (ds.view === 'plan') { const s = currentSnapshot(); if (s && !planForSnapshot(s.date)) generatePlanProposals(s); }
      render(); break;
    }
    case 'about': openDialog({ type: 'about' }); break;
    case 'save': saveFile().then(r => { if (r && r.ok) toast('Saved · ' + fileName); render(); }); break;
    case 'open': doOpen(); break;
    case 'new-checkin': startCheckin(); break;
    case 'load-demo': loadDemoData(); resetViewState(); render(); toast('Demo data loaded'); break;
    case 'onboard-start': openDialog({ type: 'account' }); break;
    case 'reopen-file': reopenPending(); break;
    case 'pos-sort': { const k = ds.key, s = ui.positionsSort || (ui.positionsSort = { key: 'category', dir: 1 }); if (s.key === k) s.dir = -s.dir; else { s.key = k; s.dir = (k === 'value' || k === 'pct' || k === 'gain') ? -1 : 1; } render(); break; }
    case 'pos-class': ui.posClass = (ui.posClass === ds.class) ? '' : ds.class; render(); break;
    case 'pos-class-clear': ui.posClass = ''; render(); break;
    case 'pos-expand': { ui.posExpanded = ui.posExpanded || {}; ui.posExpanded[ds.ticker] = !ui.posExpanded[ds.ticker]; render(); break; }
    case 'drill':
      ui.drill = { level: ds.level, category: ds.category || null, categoryLabel: ds.categorylabel || null, accountId: ds.account || null };
      if (ds.level === 'account') { const ac = accountById(ds.account); ui.drill.category = ac ? ac.category : null; ui.drill.categoryLabel = ac ? (ac.categoryLabel || null) : null; }
      ui.view = 'dashboard'; render(); break;
    case 'ci-toggle': ui.checkinOpen[ds.account] = !ui.checkinOpen[ds.account]; render(); break;
    case 'ci-discard': ui.checkin = null; ui.view = 'dashboard'; render(); break;
    case 'ci-save': saveCheckin(); break;
    case 'add-account': openDialog({ type: 'account' }); break;
    case 'edit-account': openDialog({ type: 'account', acctId: ds.account }); break;
    case 'add-child': openDialog({ type: 'child' }); break;
    case 'add-holding': openDialog({ type: 'holding', acctId: ds.account }); break;
    case 'edit-class': openDialog({ type: 'class-pick', hid: ds.hid }); break;
    case 'archive-holding': archiveHolding(ds.hid); break;
    case 'archive-account': confirmArchiveAccount(ds.account); break;
    case 'move-acct': moveAccount(ds.account, Number(ds.dir)); break;
    case 'del-child': deleteChild(ds.child); break;
    case 'pick-class': setHoldingClass(ds.hid, ds.cls); break;
    case 'comp-preset': applyCompPreset(ds.preset); break;
    case 'save-composition': saveComposition(ds.hid); break;
    case 'save-account': saveAccountFromDialog(ds.acct || null); break;
    case 'save-child': saveChildFromDialog(); break;
    case 'save-holding': saveHoldingFromDialog(ds.account); break;
    case 'add-band': openDialog({ type: 'band', child: ds.child }); break;
    case 'edit-band': openDialog({ type: 'band', child: ds.child, idx: Number(ds.idx) }); break;
    case 'del-band': deleteBand(ds.child, Number(ds.idx)); break;
    case 'save-band': saveBandFromDialog(ds.child, ds.idx === '' ? null : Number(ds.idx)); break;
    case 'goal-save': saveGoalDraft(); break;
    case 'start-fresh': openDialog({ type: 'confirm', title: 'Start fresh?', body: 'This clears all accounts, holdings, snapshots and goals in memory. Save your file first if you want to keep it. (Your saved file on disk is not touched.)', ok: 'Start fresh', danger: true, action: 'start-fresh' }); break;
    case 'export-csv': { const s = currentSnapshot(); if (s) triggerDownload(snapshotCSV(s), `snapshot-${s.date}.csv`, 'text/csv'); else toast('No snapshot to export.'); break; }
    case 'report-csv': { const s = currentSnapshot(); if (s) triggerDownload(snapshotCSV(s), `report-${s.date}.csv`, 'text/csv'); break; }
    case 'print': window.print(); break;
    case 'send-to-plan': {
      const snap = currentSnapshot(); if (!snap) { toast('No snapshot to plan against.'); break; }
      const rec = (ui._taxRecs || [])[Number(ds.rec)]; if (!rec) break;
      if (rec.kind === 'location-swap') {
        planAddMove(snap.date, { accountId: rec.aAccountId, sellTicker: rec.aTicker, buyTicker: rec.bTicker, amount: Math.round(rec.amount), taxNote: `Location swap · realizes gain on ${rec.aTicker}` });
        planAddMove(snap.date, { accountId: rec.bAccountId, sellTicker: rec.bTicker, buyTicker: rec.aTicker, amount: Math.round(rec.amount), taxNote: 'Location swap · tax-free side' });
      } else {
        planAddMove(snap.date, { accountId: rec.aAccountId, sellTicker: rec.aTicker, buyTicker: rec.muniTicker, amount: Math.round(rec.amount), taxNote: 'Muni swap' });
      }
      // Stay on the Tax tab so you can send more; the header has a "View Plan" link.
      render();
      const n = (planForSnapshot(snap.date) || { moves: [] }).moves.length;
      toast(`Added to Plan · ${n} move${n === 1 ? '' : 's'}`);
      break;
    }
    case 'plan-generate': { const s = currentSnapshot(); if (s) { generatePlanProposals(s); render(); } break; }
    case 'plan-noaction': { const s = currentSnapshot(); if (s) { const p = ensurePlan(s.date); p.noAction = true; p.moves = []; markDirty(); render(); } break; }
    case 'plan-addmove': { const s = currentSnapshot(); if (s) { planAddMove(s.date, {}); render(); } break; }
    case 'plan-del': { const s = currentSnapshot(); const p = s && planForSnapshot(s.date); if (p) { p.moves.splice(Number(ds.idx), 1); markDirty(); render(); } break; }
    case 'plan-adddir': { const s = currentSnapshot(); if (s) { const dir = savingsDirective(s); const p = ensurePlan(s.date); p.directive = dir ? { text: dir.text, splits: dir.splits } : null; markDirty(); render(); } break; }
    case 'tax-sort': {
      const k = ds.key, s = ui.taxSort || (ui.taxSort = { key: 'drag', dir: -1 });
      if (s.key === k) s.dir = -s.dir;
      else { s.key = k; s.dir = ['ticker', 'account', 'class', 'eff'].includes(k) ? 1 : -1; }
      render(); break;
    }
    case 'ov-toggle': ui.taxAdvanced = true; render(); break;
    case 'ov-clear': portfolio.taxSettings.override = null; ui.taxAdvanced = false; markDirty(); render(); break;
    case 'confirm-yes': handleConfirm(); break;
    case 'close-dialog': closeDialog(); break;
    case 'backdrop': if (!e.target.closest('[data-stop]')) closeDialog(); break;
  }
}

function onChange(e) {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act, ds = t.dataset;
  if (a === 'level') { ui.level = ds.level; render(); }
  else if (a === 'pick-snap') { ui.snapDate = t.value; render(); }
  else if (a === 'pick-goal') { ui.goalSel = t.value; render(); }
  else if (a === 'pos-snap') { ui.positionsSnap = t.value; render(); }
  else if (a === 'pos-category') { ui.posCategory = t.value; ui.posClass = ''; render(); }
  else if (a === 'toggle-529') { portfolio.meta.include529InHousehold = t.checked; markDirty(); render(); }
  else if (a === 'htab') { ui.historyTab = ds.tab; render(); }
  // Tax Profile (§13.1)
  else if (a === 'ts-filing') { portfolio.taxSettings.filingStatus = t.value; markDirty(); render(); }
  else if (a === 'ts-band') { portfolio.taxSettings.incomeBand = t.value; markDirty(); render(); }
  else if (a === 'ts-state') { portfolio.taxSettings.state = t.value; markDirty(); render(); }
  else if (a === 'ts-gainbudget') { portfolio.taxSettings.gainBudgetAnnual = parseNum(t.value) || 0; markDirty(); render(); }
  else if (a === 'ts-savings') { portfolio.taxSettings.householdMonthlySavings = parseNum(t.value) || 0; markDirty(); render(); }
  else if (a === 'ts-ytd') { const y = portfolio.taxSettings.ytdContributions = portfolio.taxSettings.ytdContributions || {}; const n = parseNum(t.value); if (n == null) delete y[ds.account]; else y[ds.account] = n; markDirty(); }
  else if (a === 'ov-ord' || a === 'ov-ltcg' || a === 'ov-state' || a === 'ov-niit' || a === 'ov-surtax') { applyOverride(a, t); render(); }
  // Plan (F8) — field edits fire on blur/change so mid-typing keeps focus.
  else if (a === 'plan-account' || a === 'plan-done' || a === 'plan-sell' || a === 'plan-buy' || a === 'plan-amount') { applyPlanEdit(a, ds, t); }
  else if (a === 'acct-cat') {
    const other = document.getElementById('f-other-wrap'), child = document.getElementById('f-child-wrap');
    if (other) other.style.display = t.value === 'Other' ? 'block' : 'none';
    if (child) child.style.display = t.value === '529' ? 'block' : 'none';
  }
}

function onInput(e) {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act, ds = t.dataset;
  // check-in fields — mutate draft WITHOUT re-render (preserve focus); recompute totals lazily
  if (a === 'ci-val')   { ui.checkin.values[ds.hid] = ui.checkin.values[ds.hid] || {}; ui.checkin.values[ds.hid].marketValue = t.value; updateCheckinTotals(); updateBasisFlag(ds.hid); }
  else if (a === 'ci-basis') { ui.checkin.values[ds.hid] = ui.checkin.values[ds.hid] || {}; ui.checkin.values[ds.hid].costBasis = t.value; updateBasisFlag(ds.hid); }
  else if (a === 'ci-note') { ui.checkin.note = t.value; }
  else if (a === 'ci-date') { ui.checkin.date = t.value; }
  else if (a === 'ci-nw') { ui.checkinNetWorth = t.value; updateCheckinTotals(); }
  else if (a === 'comp-input') { updateCompSum(); }
  else if (a === 'goal-slider' || a === 'goal-num') {
    const v = Math.max(0, Math.min(100, Math.round(Number(t.value) || 0)));
    ui.goalDraft.targets[ds.gid] = v; renderGoalLive();
  }
  else if (a === 'goal-rationale') { ui.goalDraft.rationale = t.value; toggleGoalSave(); }
  else if (a === 'goal-name') { ui.goalDraft.name = t.value; }
  else if (a === 'goal-date') { ui.goalDraft.date = t.value; }
  else if (a === 'rename-goal') { const g = portfolio.goals.find(x => x.effectiveDate === ds.date); if (g) { const v = t.value.trim(); if (v) g.name = v; else delete g.name; markDirty(); } }
  else if (a === 'set-band') { const n = parseNum(t.value); if (n != null) { portfolio.meta.driftBandPct = Math.max(1, Math.min(50, n)); markDirty(); } }
  else if (a === 'glide-rationale') { const gp = ensureGlide(ds.child); gp.rationale = t.value; markDirty(); }
}

/* Tax Profile expert override (§13.1) — blank clears a field. */
function applyOverride(act, el) {
  const ov = portfolio.taxSettings.override = portfolio.taxSettings.override || {};
  if (act === 'ov-niit') { if (el.checked) ov.niitApplies = true; else delete ov.niitApplies; }
  else if (act === 'ov-surtax') { if (el.checked) ov.surtaxApplies = true; else delete ov.surtaxApplies; }
  else {
    const key = act === 'ov-ord' ? 'ordinaryRate' : act === 'ov-ltcg' ? 'ltcgRate' : 'stateRate';
    const n = parseNum(el.value);
    if (n == null) delete ov[key]; else ov[key] = n / 100;
  }
  ui.taxAdvanced = true;
  markDirty();
}

/* Plan (F8) move-field edits. */
function applyPlanEdit(act, ds, el) {
  const snap = currentSnapshot(); if (!snap) return;
  const p = planForSnapshot(snap.date); if (!p) return;
  const m = p.moves[Number(ds.idx)]; if (!m) return;
  if (act === 'plan-account') m.accountId = el.value;
  else if (act === 'plan-done') m.done = el.checked;
  else if (act === 'plan-sell') m.sellTicker = el.value.trim().toUpperCase();
  else if (act === 'plan-buy') m.buyTicker = el.value.trim().toUpperCase();
  else if (act === 'plan-amount') m.amount = parseNum(el.value) || 0;
  markDirty(); render();
}

/* Light-touch updates that avoid a full re-render mid-typing */
function renderGoalLive() {
  markDirty();
  // update siblings + subtotals + overall sum without stealing focus
  const T = ui.goalDraft.targets;
  const sum = TAXONOMY.detail.reduce((s, d) => s + (Number(T[d.id]) || 0), 0);
  document.querySelectorAll('[data-act="goal-slider"]').forEach(el => { el.value = T[el.dataset.gid]; });
  document.querySelectorAll('[data-act="goal-num"]').forEach(el => { if (el !== document.activeElement) el.value = T[el.dataset.gid]; });
  for (const grp of TAXONOMY.groups) {
    const fam = document.getElementById('goal-fam-' + grp.id);
    if (fam) fam.textContent = Math.round(TAXONOMY.detail.filter(d => d.group === grp.id).reduce((s, d) => s + (Number(T[d.id]) || 0), 0)) + '%';
  }
  const sumEl = document.getElementById('goal-sum');
  if (sumEl) { sumEl.textContent = 'sum ' + Math.round(sum) + '%'; sumEl.style.color = Math.abs(sum - 100) < 0.5 ? '' : 'var(--color-crit)'; }
  toggleGoalSave();
}
function toggleGoalSave() {
  const sum = TAXONOMY.detail.reduce((s, d) => s + (Number(ui.goalDraft.targets[d.id]) || 0), 0);
  const btn = document.querySelector('[data-act="goal-save"]');
  if (btn) btn.disabled = !(Math.abs(sum - 100) < 0.5 && ui.goalDraft.rationale.trim().length > 0);
}

/* ===============================================================
   MUTATIONS wired from the dispatch
   =============================================================== */
async function doOpen() {
  if (dirty && !confirm('You have unsaved changes. Open another file and discard them?')) return;
  const r = await openFile();
  if (r.ok) { resetViewState(); render(); toast('Loaded · ' + fileName); }
  else if (r.error) toast('Could not open: ' + r.error);
}

function setHoldingClass(hid, cls) {
  const h = portfolio.holdings.find(x => x.id === hid);
  if (h) { h.assetClass = cls; delete h.composition; if (h.ticker) portfolio.tickerMap[h.ticker.trim().toUpperCase()] = cls; markDirty(); }
  closeDialog();
}

/* ---- Look-through composition editor ---- */
const COMP_PRESETS = {
  '90/10':     { us_large: 54, intl_dev: 36, us_bond: 10 },
  '80/20':     { us_large: 48, intl_dev: 32, us_bond: 16, intl_bond: 4 },
  '60/40':     { us_large: 36, intl_dev: 24, us_bond: 32, intl_bond: 8 },
  'three-fund':{ us_large: 54, intl_dev: 36, us_bond: 10 },
  'us-total':  US_TOTAL_SPLIT,
};
function applyCompPreset(name) {
  const preset = name === 'clear' ? {} : (COMP_PRESETS[name] || {});
  for (const dc of TAXONOMY.detail) {
    const el = document.getElementById('comp-' + dc.id);
    if (el) el.value = preset[dc.id] != null ? preset[dc.id] : '';
  }
  updateCompSum();
}
function readCompInputs() {
  const comp = {};
  let sum = 0;
  for (const dc of TAXONOMY.detail) {
    const el = document.getElementById('comp-' + dc.id);
    const v = el ? parseNum(el.value) : null;
    if (v && v > 0) { comp[dc.id] = v; sum += v; }
  }
  return { comp, sum };
}
function updateCompSum() {
  const { sum } = readCompInputs();
  const el = document.getElementById('comp-sum');
  if (el) { el.textContent = 'split sum ' + Math.round(sum) + '%'; el.style.color = (sum === 0 || Math.abs(sum - 100) < 0.5) ? '' : 'var(--color-warn)'; }
}
function saveComposition(hid) {
  const h = portfolio.holdings.find(x => x.id === hid);
  if (!h) { closeDialog(); return; }
  const { comp, sum } = readCompInputs();
  if (Object.keys(comp).length === 0) { toast('Enter at least one class %, or pick a single class above.'); return; }
  if (Math.abs(sum - 100) > 0.5) { toast('Split must sum to 100% (now ' + Math.round(sum) + ').'); return; }
  h.composition = comp;
  // primary class (chip label) = largest weight
  h.assetClass = Object.entries(comp).sort((a, b) => b[1] - a[1])[0][0];
  markDirty(); closeDialog();
}
function archiveHolding(hid) {
  const h = portfolio.holdings.find(x => x.id === hid);
  if (h) { h.status = 'archived'; if (ui.checkin) delete ui.checkin.values[hid]; markDirty(); render(); }
}
function confirmArchiveAccount(id) {
  const a = accountById(id);
  openDialog({ type: 'confirm', title: 'Archive account?', body: `“${a ? a.name : ''}” and its holdings are archived (kept for history, hidden from entry). This never deletes past snapshots.`, ok: 'Archive', danger: true, action: 'archive-account', id });
}
function moveAccount(id, dir) {
  const a = accountById(id);
  if (!a) return;
  const sibs = accountsSorted(x => x.category === a.category);
  const i = sibs.findIndex(x => x.id === id);
  const j = i + dir;
  if (j < 0 || j >= sibs.length) return;
  const tmp = sibs[i].sortOrder ?? i, other = sibs[j].sortOrder ?? j;
  sibs[i].sortOrder = other; sibs[j].sortOrder = tmp;
  markDirty(); render();
}
function deleteChild(id) {
  if (portfolio.accounts.some(a => a.childId === id && a.status !== 'archived')) { toast('Reassign or archive this child\'s 529 first.'); return; }
  portfolio.children = portfolio.children.filter(c => c.id !== id);
  portfolio.glidePaths = portfolio.glidePaths.filter(g => g.childId !== id);
  markDirty(); render();
}

function saveAccountFromDialog(acctId) {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { toast('Account name is required.'); return; }
  const category = document.getElementById('f-cat').value;
  const institution = document.getElementById('f-inst').value.trim();
  const taxTreatment = document.getElementById('f-tax').value || undefined;
  const categoryLabel = category === 'Other' ? document.getElementById('f-catlabel').value.trim() : undefined;
  const childId = category === '529' ? (document.getElementById('f-child').value || undefined) : undefined;
  if (category === 'Other' && !categoryLabel) { toast('Other needs a category label.'); return; }
  if (category === '529' && !childId) { toast('Pick a child for the 529 (add one in Accounts first).'); return; }
  if (acctId) {
    const a = accountById(acctId);
    Object.assign(a, { name, category, institution, taxTreatment, categoryLabel, childId });
  } else {
    const maxOrder = Math.max(-1, ...portfolio.accounts.filter(a => a.category === category).map(a => a.sortOrder ?? 0));
    portfolio.accounts.push({ id: uid('acct'), name, institution, category, categoryLabel, taxTreatment, childId, sortOrder: maxOrder + 1, status: 'active' });
  }
  markDirty(); closeDialog();
}
function saveChildFromDialog() {
  const label = document.getElementById('f-clabel').value.trim();
  const year = parseNum(document.getElementById('f-cyear').value);
  if (!label || !year) { toast('Name and birth year are required.'); return; }
  portfolio.children.push({ id: uid('child'), label, birthYear: year });
  markDirty(); closeDialog();
}
function saveHoldingFromDialog(acctId) {
  const ticker = document.getElementById('f-ticker').value.trim();
  if (!ticker) { toast('Ticker is required.'); return; }
  const name = document.getElementById('f-hname').value.trim() || undefined;
  let cls = document.getElementById('f-cls').value;
  const val = parseNum(document.getElementById('f-val').value);
  const basis = parseNum(document.getElementById('f-basis').value);
  if (!cls) cls = classifyTicker(ticker, portfolio.tickerMap);
  if (!cls) { toast('Unknown ticker — pick an asset class from the dropdown.'); return; }
  if (document.getElementById('f-cls').value) portfolio.tickerMap[ticker.toUpperCase()] = cls; // remember explicit pick
  const h = { id: uid('hold'), accountId: acctId, ticker, name, assetClass: cls, status: 'active' };
  if (basis != null) h.costBasis = basis;
  portfolio.holdings.push(h);
  if (ui.checkin) ui.checkin.values[h.id] = { marketValue: val != null ? String(val) : '', costBasis: basis != null ? String(basis) : '' };
  markDirty(); closeDialog();
}

function ensureGlide(childId) {
  let gp = portfolio.glidePaths.find(g => g.childId === childId);
  if (!gp) { gp = { childId, bands: [], rationale: '' }; portfolio.glidePaths.push(gp); }
  return gp;
}
function saveBandFromDialog(childId, idx) {
  const from = parseNum(document.getElementById('b-from').value);
  const to = parseNum(document.getElementById('b-to').value);
  if (from == null || to == null || to < from) { toast('Enter a valid age range.'); return; }
  const targets = {};
  let sum = 0;
  for (const g of TAXONOMY.groups) { const v = parseNum(document.getElementById('b-' + g.id).value); if (v) { targets[g.id] = v; sum += v; } }
  if (Math.abs(sum - 100) > 0.5) { toast('Band targets must sum to 100% (now ' + sum + ').'); return; }
  const gp = ensureGlide(childId);
  const sorted = gp.bands.slice().sort((a, b) => a.ageFrom - b.ageFrom);
  if (idx != null && sorted[idx]) { const band = sorted[idx]; band.ageFrom = from; band.ageTo = to; band.targets = targets; }
  else gp.bands.push({ ageFrom: from, ageTo: to, targets });
  markDirty(); closeDialog();
}
function deleteBand(childId, idx) {
  const gp = portfolio.glidePaths.find(g => g.childId === childId);
  if (!gp) return;
  const sorted = gp.bands.slice().sort((a, b) => a.ageFrom - b.ageFrom);
  const band = sorted[idx];
  gp.bands = gp.bands.filter(b => b !== band);
  markDirty(); render();
}

function saveGoalDraft() {
  const d = ui.goalDraft;
  const targets = {};
  for (const dc of TAXONOMY.detail) if (d.targets[dc.id]) targets[dc.id] = d.targets[dc.id];
  const entry = { effectiveDate: d.date, targets, rationale: d.rationale.trim() };
  if (d.name && d.name.trim()) entry.name = d.name.trim();
  portfolio.goals.push(entry);
  ui.goalDraft = null; markDirty(); render(); toast('Goal saved to journal');
}

function handleConfirm() {
  const d = ui.dialog;
  if (!d) return;
  if (d.action === 'start-fresh') { portfolio = emptyPortfolio(); fileHandle = null; dirty = false; resetViewState(); closeDialog(); toast('Started fresh'); }
  else if (d.action === 'archive-account') { const a = accountById(d.id); if (a) { a.status = 'archived'; activeHoldings(d.id).forEach(h => h.status = 'archived'); } markDirty(); closeDialog(); }
  else closeDialog();
}

document.addEventListener('DOMContentLoaded', boot);

/* Expose internals for console testing during development. */
window.__AAT__ = {
  TAXONOMY, SEED_MAP, SEED_MAP_EXT, classifyTicker, migrate, emptyPortfolio, uid,
  allocate, toRows, computeDrift, activeGoal, glideTargets, historySeries,
  householdHoldings, categoryHoldings, accountHoldings, latestSnapshot,
  snapshotCSV, loadDemoData, saveFile, openFile,
  goalGroupTargets, goalDetailTargets, compositionOf, splitValue,
  holdingBasisIssue, checkinBasisIssues, snapshotByDate,
  get portfolio() { return portfolio; },
  set portfolio(p) { portfolio = p; },
  get ui() { return ui; },
};
</script>
