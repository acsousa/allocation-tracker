<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Asset Allocation Tracker</title>
<!--
  Asset Allocation Tracker — single-file, offline, zero-network.
  Spec: asset-allocation-tool-spec.md (v1.2). Build: full v1 (M1–M6).

  Structure of this file:
    <style>   — all CSS, driven by :root custom properties (design tokens)
    <body>    — app shell (mounted by JS)
    <script>  — TAXONOMY, SEED_MAP, schema/migration, calc, render, persistence

  No CDN, no fetch, no external fonts. Verifiable offline.
-->
<style>
  /* ============================================================
     "Industry" design system — inlined, zero-network (spec §10).
     Source of truth for tokens/components was the Design project's
     styles.css; the Google-Fonts @import is intentionally dropped so
     the file makes NO network requests. Barlow/Barlow Condensed stay
     in the stack for users who have them; otherwise system-ui.
     ============================================================ */
  :root {
    --color-bg: #f2f2f3;
    --color-surface: #e9e9ea;
    --color-text: #1d1f20;
    --color-accent: #5980a6;
    --color-accent-2: #728fab;
    --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);

    --color-neutral-100: #f5f5f8; --color-neutral-200: #e7e7ea;
    --color-neutral-300: #d4d4d7; --color-neutral-400: #b7b7ba;
    --color-neutral-500: #98989b; --color-neutral-600: #7a7a7d;
    --color-neutral-700: #5d5d60; --color-neutral-800: #424244;
    --color-neutral-900: #2b2b2d;

    --color-accent-100: #eef6ff; --color-accent-200: #d6ebff;
    --color-accent-300: #b5d9fd; --color-accent-400: #94bce3;
    --color-accent-500: #749dc4; --color-accent-600: #597ea3;
    --color-accent-700: #416180; --color-accent-800: #2c455d;
    --color-accent-900: #1d2d3d;

    --color-accent-2-100: #eef6ff; --color-accent-2-200: #d6ebff;
    --color-accent-2-300: #bdd8f2; --color-accent-2-400: #9ebbd8;
    --color-accent-2-500: #7e9cb8; --color-accent-2-600: #627d98;
    --color-accent-2-700: #486077; --color-accent-2-800: #314457;
    --color-accent-2-900: #1f2d3a;

    /* status — kept muted to sit in the blueprint palette */
    --color-ok:   #4a7a5c;
    --color-warn: #a6772f;
    --color-crit: #a6493f;

    /* rollup-group chart colors (6) — mockup legend order */
    --g-stocks:      #1d2d3d;  /* accent-900 */
    --g-bonds:       #416180;  /* accent-700 */
    --g-real_assets: #749dc4;  /* accent-500 */
    --g-crypto:      #94bce3;  /* accent-400 */
    --g-cash:        #b5d9fd;  /* accent-300 */
    --g-blend_other: #b7b7ba;  /* neutral-400 */

    /* 14 detail-class chart colors — grouped by family for a coherent detail donut */
    --c-us_large:  #14212e; --c-us_mid:  #24384a; --c-us_small: #34506a;
    --c-us_total:  #1d2d3d; --c-intl_dev:#5a83a8; --c-em:       #7ea7cc;
    --c-us_bond:   #314457; --c-intl_bond:#5e7d97;
    --c-reit:      #6f97b9; --c-commod:  #9ebbd8;
    --c-crypto:    #94bce3;
    --c-cash:      #98989b;
    --c-blend:     #b7b7ba; --c-other:   #d4d4d7;

    --font-heading: "Barlow Condensed", system-ui, "Segoe UI", sans-serif;
    --font-heading-weight: 600;
    --font-body: "Barlow", system-ui, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    --space-1: 3.4px; --space-2: 6.8px; --space-3: 10.2px;
    --space-4: 13.6px; --space-6: 20.4px; --space-8: 27.2px;

    --radius-sm: 2px; --radius-md: 4px; --radius-lg: 7px;

    --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);
    --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);
    --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--color-bg); color: var(--color-text);
    font-family: var(--font-body); font-size: 15px; line-height: 1.55; font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-heading); font-weight: var(--font-heading-weight);
    line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
  }
  h1 { font-size: 42px; } h2 { font-size: 30px; } h3 { font-size: 24px; }
  h4 { font-size: 20px; } h5 { font-size: 16px; }
  h6 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; margin: 0; }
  p { margin: 0 0 var(--space-3); }
  a { color: var(--color-accent); text-underline-offset: 3px; }
  a:hover { color: var(--color-accent-700); }
  .mono { font-family: var(--mono); }
  .tnum { font-variant-numeric: tabular-nums; }
  .text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
  .kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent); }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  ::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }
  .hr { height: 1px; border: 0; margin: var(--space-4) 0; background: var(--color-divider); }

  /* — blueprint frame + corner registration marks — */
  .blueprint { position: relative; border: 1px solid var(--color-divider); border-radius: 0; background: transparent; }
  .blueprint > .corner { position: absolute; width: 11px; height: 11px; color: color-mix(in srgb, var(--color-text) 55%, transparent); }
  .blueprint > .corner::before, .blueprint > .corner::after { content: ""; position: absolute; background: currentColor; }
  .blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }
  .blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }
  .blueprint > .corner.tl { top: -6px; left: -6px; }
  .blueprint > .corner.tr { top: -6px; right: -6px; }
  .blueprint > .corner.bl { bottom: -6px; left: -6px; }
  .blueprint > .corner.br { bottom: -6px; right: -6px; }

  /* — buttons — */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer; text-decoration: none;
    font-family: var(--font-heading); font-weight: var(--font-heading-weight);
    font-size: 14px; line-height: 1.2; color: var(--color-text);
    background: transparent; border: 1px solid var(--color-divider);
    padding: var(--space-2) calc(var(--space-3) * 1.2); border-radius: 0;
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: var(--color-accent); color: var(--color-bg); border-color: var(--color-accent); }
  .btn-primary:hover { background: var(--color-accent-600); }
  .btn-primary:active { background: var(--color-accent-700); }
  .btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
  .btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
  .btn-ghost { color: var(--color-accent); border-color: transparent; padding-inline: var(--space-2); }
  .btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
  .btn-danger { color: var(--color-crit); border-color: color-mix(in srgb, var(--color-crit) 45%, transparent); }
  .btn-danger:hover { background: color-mix(in srgb, var(--color-crit) 10%, transparent); }
  .btn-sm { font-size: 12.5px; padding: 4px 9px; }
  .btn-block { width: 100%; }

  /* — forms — */
  .field > label { display: block; font-size: 12px; margin-bottom: 5px; color: color-mix(in srgb, var(--color-text) 70%, transparent); }
  .input {
    width: 100%; min-height: 36px; padding: 6px 10px; font: inherit; font-size: 14px;
    color: var(--color-text); caret-color: var(--color-accent);
    background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 0;
  }
  .input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
  .input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
  select.input { min-height: 34px; }
  textarea.input { min-height: 80px; resize: vertical; line-height: 1.5; }
  .seg { display: inline-flex; overflow: hidden; border: 1px solid var(--color-divider); border-radius: 0; }
  .seg-opt { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; font-size: 13px; cursor: pointer; user-select: none; }
  .seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
  .seg-opt input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
  .seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }
  .seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }

  /* — cards / tags — */
  .card { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3); border-radius: 0; background: transparent; border: 1px solid var(--color-divider); }
  .card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
  .card-title { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 17px; line-height: 1.2; }
  .card-meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: color-mix(in srgb, var(--color-text) 50%, transparent); }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; letter-spacing: 0.02em; padding: 3px 10px; border-radius: 0; }
  .tag-accent  { background: var(--color-accent-100); color: var(--color-accent-800); }
  .tag-accent-2{ background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
  .tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
  .tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }
  .tag-ok   { background: color-mix(in srgb, var(--color-ok) 16%, transparent);   color: var(--color-ok); }
  .tag-warn { background: color-mix(in srgb, var(--color-warn) 16%, transparent); color: var(--color-warn); }
  .tag-crit { background: color-mix(in srgb, var(--color-crit) 16%, transparent); color: var(--color-crit); }

  /* — nav / tables — */
  .nav { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-6); border-bottom: 1px solid var(--color-divider); }
  .nav-brand { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 18px; }
  .nav a { color: inherit; text-decoration: none; font-size: 14px; cursor: pointer; }
  .nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }
  .table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .table th { text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 60%, transparent); padding: var(--space-2); border-bottom: 1px solid var(--color-divider); }
  .table td { padding: var(--space-2); border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent); }
  .table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }

  /* — dialog — */
  .dialog-backdrop { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: var(--space-6); background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent); }
  .dialog { width: min(560px, 100%); max-height: 88vh; overflow: auto; display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-6); border-radius: 0; background: var(--color-bg); border: 1px solid var(--color-text); box-shadow: var(--shadow-lg); }
  .dialog-title { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 22px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }

  /* — app shell / layout — */
  #app { min-height: 100vh; display: flex; flex-direction: column; }
  .shell { max-width: 1280px; width: 100%; margin: 0 auto; }
  .view { padding: var(--space-6) var(--space-6) var(--space-8); display: flex; flex-direction: column; gap: var(--space-6); }
  .panel { border: 1px solid var(--color-divider); }
  .panel-hd { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-divider); }
  .panel-hd h4 { margin: 0; }
  .grid-kpi { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--color-divider); }
  .kpi { padding: var(--space-4) var(--space-6); border-right: 1px solid var(--color-divider); }
  .kpi:last-child { border-right: 0; }
  .kpi-val { font-family: var(--font-heading); font-size: 32px; line-height: 1.1; }
  .toolbar { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-4); border: 1px solid var(--color-divider); }
  .crumb { display: flex; align-items: center; gap: 8px; font-family: var(--font-heading); font-size: 16px; }
  .crumb .sep { color: color-mix(in srgb, var(--color-text) 40%, transparent); }
  .crumb a { cursor: pointer; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; }
  .swatch { width: 10px; height: 10px; flex: none; display: inline-block; }
  .drift-row { display: grid; grid-template-columns: 130px 1fr 150px; align-items: center; gap: 12px; }
  .empty { max-width: 640px; margin: 8vh auto; text-align: center; display: flex; flex-direction: column; gap: var(--space-4); align-items: center; }
  .step-dots { display: flex; gap: 8px; align-items: center; }
  .step-dot { width: 9px; height: 9px; border: 1px solid var(--color-accent); }
  .step-dot.on { background: var(--color-accent); }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--color-text); color: var(--color-bg); padding: 10px 16px; font-family: var(--font-heading); font-size: 14px; box-shadow: var(--shadow-lg); }
  .save-dirty { background: var(--color-accent); color: var(--color-bg); border-color: var(--color-accent); }

  /* — print / F7 report (spec §10) — */
  .report { display: none; }
  .report.show-screen { display: block; }   /* on-screen preview in the Report view */
  @media print {
    @page { margin: 14mm; }
    body { background: #fff; }
    .no-print, .nav, .toolbar, .toast, .dialog-backdrop { display: none !important; }
    .app-body > *:not(.report) { display: none !important; }
    .report { display: block !important; }
    .report .rep-section { break-inside: avoid; page-break-inside: avoid; }
    .report .page-break { break-before: page; page-break-before: always; }
    .blueprint > .corner { display: none; }
    a { color: var(--color-text); text-decoration: none; }
  }
</style>

<div id="app"></div>

<script>
"use strict";
/* ================================================================
   PX4-unrelated. Asset Allocation Tracker — application script.
   Everything below is vanilla JS. No build step, no dependencies.
   ================================================================ */

/* ---------------------------------------------------------------
   TAXONOMY — the 14 detail classes and their rollup groups (spec §4a)
   --------------------------------------------------------------- */
const TAXONOMY = {
  // id: stable key stored in data; label: display; group: rollup; cssVar: color token
  detail: [
    { id: 'us_large',  label: 'US Large Cap',            group: 'stocks',      cssVar: '--c-uslarge'  },
    { id: 'us_mid',    label: 'US Mid Cap',              group: 'stocks',      cssVar: '--c-usmid'    },
    { id: 'us_small',  label: 'US Small Cap',            group: 'stocks',      cssVar: '--c-ussmall'  },
    { id: 'us_total',  label: 'US Total Market',         group: 'stocks',      cssVar: '--c-ustotal'  },
    { id: 'intl_dev',  label: 'International Developed',  group: 'stocks',      cssVar: '--c-intl'     },
    { id: 'em',        label: 'Emerging Markets',        group: 'stocks',      cssVar: '--c-em'       },
    { id: 'us_bond',   label: 'US Bonds',                group: 'bonds',       cssVar: '--c-usbond'   },
    { id: 'intl_bond', label: 'International Bonds',      group: 'bonds',       cssVar: '--c-intlbond' },
    { id: 'reit',      label: 'Real Estate / REITs',     group: 'real_assets', cssVar: '--c-reit'     },
    { id: 'commod',    label: 'Commodities',             group: 'real_assets', cssVar: '--c-commod'   },
    { id: 'crypto',    label: 'Crypto',                  group: 'crypto',      cssVar: '--c-crypto'   },
    { id: 'cash',      label: 'Cash & Equivalents',      group: 'cash',        cssVar: '--c-cash'     },
    { id: 'blend',     label: 'Target Date / Blend',     group: 'blend_other', cssVar: '--c-blend'    },
    { id: 'other',     label: 'Other / Alternatives',    group: 'blend_other', cssVar: '--c-other'    },
  ],
  groups: [
    { id: 'stocks',      label: 'Stocks'       },
    { id: 'bonds',       label: 'Bonds'        },
    { id: 'real_assets', label: 'Real Assets'  },
    { id: 'crypto',      label: 'Crypto'       },
    { id: 'cash',        label: 'Cash'         },
    { id: 'blend_other', label: 'Blend/Other'  },
  ],
};

const DETAIL_BY_ID = Object.fromEntries(TAXONOMY.detail.map(d => [d.id, d]));
const GROUP_BY_ID  = Object.fromEntries(TAXONOMY.groups.map(g => [g.id, g]));
function detailLabel(id) { return (DETAIL_BY_ID[id] || {}).label || id; }
function cssVarValue(name, fallback) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}
function detailColor(id) { return cssVarValue('--c-' + id, '#b7b7ba'); }
function rollupOf(detailId) { return (DETAIL_BY_ID[detailId] || {}).group || 'blend_other'; }

const ACCOUNT_CATEGORIES = ['Retirement', '529', 'Non-Retirement', 'Other'];
const TAX_TREATMENTS = ['Pre-tax', 'Roth', 'Taxable', 'Tax-free'];

/* ---------------------------------------------------------------
   SEED TICKER MAP (spec §9 / §11) — best-effort, user-overridable.
   Keys are UPPERCASE tickers; values are detail-class ids above.

   Coverage target: the common ~90% of retail holdings.
   --------------------------------------------------------------- */
const SEED_MAP = {

  AAPL:'us_large', MSFT:'us_large', GOOG:'us_large', GOOGL:'us_large', AMZN:'us_large',
  NVDA:'us_large', META:'us_large', TSLA:'us_large', BRK_B:'us_large', 'BRK.B':'us_large',
  JPM:'us_large', V:'us_large', MA:'us_large', UNH:'us_large', JNJ:'us_large',
  XOM:'us_large', PG:'us_large', HD:'us_large', COST:'us_large', WMT:'us_large',
  KO:'us_large', PEP:'us_large', DIS:'us_large', NFLX:'us_large', ADBE:'us_large',
  CRM:'us_large', AMD:'us_large', INTC:'us_large', CSCO:'us_large', ORCL:'us_large',
  BAC:'us_large', WFC:'us_large', T:'us_large', VZ:'us_large', PFE:'us_large',
  MRK:'us_large', ABBV:'us_large', LLY:'us_large', AVGO:'us_large', TXN:'us_large',
  QCOM:'us_large', HON:'us_large', UNP:'us_large', LOW:'us_large', MCD:'us_large',
  NKE:'us_large', SBUX:'us_large', BA:'us_large', CAT:'us_large', GE:'us_large',

  // ---- US Mid Cap ----
  VO:'us_mid', IJH:'us_mid', VIMAX:'us_mid', IWR:'us_mid', SCHM:'us_mid',
  MDY:'us_mid', VMBS:'us_mid', FSMDX:'us_mid', IWS:'us_mid', IWP:'us_mid',

  // ---- US Small Cap ----
  VB:'us_small', IJR:'us_small', AVUV:'us_small', VBR:'us_small', VBK:'us_small',
  IWM:'us_small', SCHA:'us_small', VSMAX:'us_small', VTWO:'us_small', FSSNX:'us_small',
  IJS:'us_small', IJT:'us_small', DFSV:'us_small',

  // ---- International Developed ----
  VEA:'intl_dev', IEFA:'intl_dev', VXUS:'intl_dev', IXUS:'intl_dev', VTIAX:'intl_dev',
  FTIHX:'intl_dev', SCHF:'intl_dev', EFA:'intl_dev', VGK:'intl_dev', VPL:'intl_dev',
  IEUR:'intl_dev', FZILX:'intl_dev', VT:'intl_dev', ACWI:'intl_dev', VEU:'intl_dev',
  IDEV:'intl_dev', SWISX:'intl_dev', VWIGX:'intl_dev', EFV:'intl_dev', EFG:'intl_dev',
  VYMI:'intl_dev', VXF:'us_mid',

  // ---- Emerging Markets ----
  VWO:'em', IEMG:'em', EEM:'em', VEMAX:'em', SCHE:'em',
  SPEM:'em', FPADX:'em', EMXC:'em', VWOB:'intl_bond',

  // ---- US Bonds ----
  BND:'us_bond', AGG:'us_bond', VBTLX:'us_bond', FXNAX:'us_bond', SCHZ:'us_bond',

/* ---------------------------------------------------------------
   SCHEMA + MIGRATION (spec §10)
   --------------------------------------------------------------- */
const SCHEMA_VERSION = 1;

function emptyPortfolio() {
  return {
    meta: { schemaVersion: SCHEMA_VERSION, driftBandPct: 5 },
    children: [],
    accounts: [],
    holdings: [],
    snapshots: [],
    goals: [],
    glidePaths: [],
    tickerMap: {},
  };
}

// Reject newer-major files; migrate older ones silently.
function migrate(data) {
  if (!data || typeof data !== 'object') throw new Error('Not a portfolio file.');
  const v = (data.meta && data.meta.schemaVersion) || 0;
  if (v > SCHEMA_VERSION) {
    throw new Error(
      `This file was made by a newer version (schema ${v}). ` +
      `Update the tracker to open it.`
    );
  }
  // migration stubs land here as versions advance, e.g.:
  // if (v < 2) { ...transform...; data.meta.schemaVersion = 2; }
  const base = emptyPortfolio();
  const merged = Object.assign(base, data);
  merged.meta = Object.assign(base.meta, data.meta || {});
  merged.meta.schemaVersion = SCHEMA_VERSION;
  return merged;
}

/* ---------------------------------------------------------------
   ID helper — crypto.randomUUID with fallback (offline-safe)
   --------------------------------------------------------------- */
function uid(prefix) {
  const rnd = (self.crypto && self.crypto.randomUUID)
    ? self.crypto.randomUUID()
    : 'xxxxxxxxyxxxx'.replace(/[xy]/g, c => {
        const r = (self.crypto ? self.crypto.getRandomValues(new Uint8Array(1))[0] : Math.floor(Math.random()*256)) & 15;
        const val = c === 'x' ? r : (r & 0x3) | 0x8;
        return val.toString(16);
      });
  return (prefix ? prefix + '_' : '') + rnd;
}

/* ---------------------------------------------------------------
   CLASSIFICATION — user map wins over seed (spec §9)
   --------------------------------------------------------------- */
function classifyTicker(ticker, tickerMap) {
  if (!ticker) return null;
  const key = String(ticker).trim().toUpperCase();
  if (!key) return null;
  if (tickerMap && Object.prototype.hasOwnProperty.call(tickerMap, key)) return tickerMap[key];
  if (Object.prototype.hasOwnProperty.call(SEED_MAP, key)) return SEED_MAP[key];
  return null; // unknown → caller prompts with 14-class picker
}

/* ===============================================================
   CALC LAYER — pure functions over the portfolio object.
   No DOM, no side effects. Everything the dashboard/report needs.
   =============================================================== */

function accountById(id)  { return portfolio.accounts.find(a => a.id === id) || null; }
function childById(id)    { return portfolio.children.find(c => c.id === id) || null; }

function sortedSnapshots() {
  return portfolio.snapshots.slice().sort((a, b) => a.date.localeCompare(b.date));
}
function latestSnapshot() {
  const s = sortedSnapshots();
  return s.length ? s[s.length - 1] : null;
}
function snapshotByDate(date) {
  return portfolio.snapshots.find(s => s.date === date) || null;
}

/* Map holdingId -> {marketValue, costBasis} for a snapshot. */
function valueIndex(snapshot) {
  const idx = {};
  if (snapshot) for (const v of snapshot.values) idx[v.holdingId] = v;
  return idx;
}

/* Active (non-archived) holdings, optionally scoped to an account. */
function activeHoldings(accountId) {
  return portfolio.holdings.filter(h =>
    h.status !== 'archived' &&
    (accountId == null || h.accountId === accountId)
  );
}

/* Holdings belonging to accounts matching a predicate. */
function holdingsWhereAccount(pred) {
  const ok = new Set(portfolio.accounts.filter(pred).map(a => a.id));
  return portfolio.holdings.filter(h => ok.has(h.accountId));
}

/*
  Allocation for a set of holdings against a snapshot's values.
  Returns { detail:{id:value}, group:{id:value}, total, byHolding:[...] }.
  Only holdings with a positive value in the snapshot contribute.
*/
function allocate(holdings, snapshot) {
  const idx = valueIndex(snapshot);
  const detail = {};
  const group = {};
  const byHolding = [];
  let total = 0;
  for (const h of holdings) {
    const v = idx[h.id];
    if (!v) continue;
    const mv = Number(v.marketValue) || 0;
    if (mv === 0) continue;
    const cls = h.assetClass || 'other';
    const grp = rollupOf(cls);
    detail[cls] = (detail[cls] || 0) + mv;
    group[grp] = (group[grp] || 0) + mv;
    total += mv;
    const cb = (v.costBasis != null ? Number(v.costBasis)
             : (h.costBasis != null ? Number(h.costBasis) : null));
    byHolding.push({
      holding: h, marketValue: mv, costBasis: cb,
      gain: cb != null ? mv - cb : null,
      gainPct: (cb != null && cb !== 0) ? (mv - cb) / cb : null,
    });
  }
  return { detail, group, total, byHolding };
}

/* Convert a {id:value} map + total into sorted [{id,label,color,value,pct}]. */
function toRows(valueMap, total, level /* 'detail'|'group' */) {
  const order = level === 'group'
    ? TAXONOMY.groups.map(g => g.id)
    : TAXONOMY.detail.map(d => d.id);
  const rows = [];
  for (const id of order) {
    const value = valueMap[id] || 0;
    if (value === 0) continue;
    rows.push({
      id,
      label: level === 'group' ? GROUP_BY_ID[id].label : detailLabel(id),
      color: level === 'group' ? groupColor(id) : detailColor(id),
      value,
      pct: total > 0 ? (value / total) * 100 : 0,
    });
  }
  return rows;
}
/* Rollup-group color comes from its own token (mockup legend order). */
function groupColor(groupId) { return cssVarValue('--g-' + groupId, '#b7b7ba'); }

/* ---- Scopes (spec §4/§5): household EXCLUDES 529 (measured vs glide). ---- */
function householdHoldings() {
  return holdingsWhereAccount(a => a.status !== 'archived' && a.category !== '529')
    .filter(h => h.status !== 'archived');
}
function categoryHoldings(category) {
  return holdingsWhereAccount(a => a.status !== 'archived' && a.category === category)
    .filter(h => h.status !== 'archived');
}
function accountHoldings(accountId) {
  return activeHoldings(accountId);
}

/* ---- Goals (append-only journal; active = latest effective <= date) ---- */
function activeGoal(asOfDate) {
  const eligible = portfolio.goals
    .filter(g => !asOfDate || g.effectiveDate <= asOfDate)
    .sort((a, b) => a.effectiveDate.localeCompare(b.effectiveDate));
  return eligible.length ? eligible[eligible.length - 1] : null;
}

/*
  Drift = actual% - target%. Positive = overweight.
  targets keyed by the same level as actualRows (detail or group ids).
  Returns [{id,label,actualPct,targetPct,driftPct,breach,valueDelta}].
*/
function computeDrift(actualRows, total, targets, band) {
  const bandPct = band != null ? band : (portfolio.meta.driftBandPct || 5);
  const byId = Object.fromEntries(actualRows.map(r => [r.id, r]));
  const ids = new Set([...Object.keys(targets || {}), ...actualRows.map(r => r.id)]);
  const out = [];
  for (const id of ids) {
    const targetPct = (targets && targets[id]) || 0;
    const r = byId[id];
    const actualPct = r ? r.pct : 0;
    const driftPct = actualPct - targetPct;
    out.push({
      id,
      label: GROUP_BY_ID[id] ? GROUP_BY_ID[id].label : detailLabel(id),
      color: GROUP_BY_ID[id] ? groupColor(id) : detailColor(id),
      actualPct, targetPct, driftPct,
      breach: Math.abs(driftPct) > bandPct,
      valueDelta: total * (driftPct / 100), // ≈ $ over/under target
    });
  }
  // stable order by taxonomy
  const rank = {};
  TAXONOMY.groups.forEach((g, i) => rank[g.id] = i);
  TAXONOMY.detail.forEach((d, i) => rank[d.id] = 100 + i);
  out.sort((a, b) => (rank[a.id] ?? 999) - (rank[b.id] ?? 999));
  return out;
}

/* ---- 529 glide paths: child age → matching band's targets ---- */
function childAge(birthYear, asOfDate) {
  const year = asOfDate ? Number(asOfDate.slice(0, 4)) : new Date().getFullYear();
  return Math.max(0, year - Number(birthYear));
}
function glideTargets(childId, asOfDate) {
  const gp = portfolio.glidePaths.find(g => g.childId === childId);
  if (!gp) return null;
  const child = childById(childId);
  if (!child) return null;
  const age = childAge(child.birthYear, asOfDate);
  const band = (gp.bands || []).find(b => age >= b.ageFrom && age <= b.ageTo);
  return band ? { targets: band.targets, age, band, rationale: gp.rationale } : { targets: null, age };
}

/* ---- History: per-snapshot rollup series for the stacked area (F4) ---- */
function historySeries(scope /* 'household'|category|null=all */) {
  const snaps = sortedSnapshots();
  const pickHoldings = scope == null || scope === 'all'
    ? () => portfolio.holdings.filter(h => h.status !== 'archived')
    : scope === 'household' ? householdHoldings
    : () => categoryHoldings(scope);
  return snaps.map(s => {
    const a = allocate(pickHoldings(), s);
    return { date: s.date, total: a.total, group: a.group, detail: a.detail };
  });
}

/* ===============================================================
   CSV EXPORT (F6/F7) — plain, Excel-friendly.
   =============================================================== */
function csvEscape(v) {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(rows) { return rows.map(r => r.map(csvEscape).join(',')).join('\r\n'); }

function snapshotCSV(snapshot) {
  const idx = valueIndex(snapshot);
  const rows = [['Account', 'Category', 'Ticker', 'Name', 'Asset Class', 'Rollup', 'Market Value', 'Cost Basis', 'Unrealized Gain']];
  for (const h of portfolio.holdings) {
    const v = idx[h.id];
    if (!v) continue;
    const acct = accountById(h.accountId) || {};
    const cb = v.costBasis != null ? v.costBasis : (h.costBasis != null ? h.costBasis : '');
    const gain = (cb !== '' && cb != null) ? (Number(v.marketValue) - Number(cb)) : '';
    rows.push([
      acct.name || '', acct.category || '', h.ticker || '', h.name || '',
      detailLabel(h.assetClass), GROUP_BY_ID[rollupOf(h.assetClass)].label,
      v.marketValue, cb, gain,
    ]);
  }
  return toCSV(rows);
}

/* ===============================================================
   PERSISTENCE (spec §10) — file is the source of truth.
   File System Access API on Chrome/Edge; download/upload fallback.
   =============================================================== */
const HAS_FSA = typeof window !== 'undefined'
  && 'showSaveFilePicker' in window && 'showOpenFilePicker' in window;

function serialize() { return JSON.stringify(portfolio, null, 2); }

function triggerDownload(text, name, mime) {
  const blob = new Blob([text], { type: mime || 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function saveFile(forceNew) {
  const text = serialize();
  if (HAS_FSA) {
    try {
      if (!fileHandle || forceNew) {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: fileName,
          types: [{ description: 'Portfolio JSON', accept: { 'application/json': ['.json'] } }],
        });
        fileName = fileHandle.name || fileName;
      }
      const w = await fileHandle.createWritable();
      await w.write(text); await w.close();
      dirty = false; updateDirtyIndicator();
      return { ok: true, via: 'fsa' };
    } catch (e) {
      if (e && e.name === 'AbortError') return { ok: false, aborted: true };
      // fall through to download
    }
  }
  triggerDownload(text, fileName, 'application/json');
  dirty = false; updateDirtyIndicator();
  return { ok: true, via: 'download' };
}

async function openFile() {
  if (HAS_FSA) {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'Portfolio JSON', accept: { 'application/json': ['.json'] } }],
      });
      const file = await handle.getFile();
      const data = JSON.parse(await file.text());
      portfolio = migrate(data);
      fileHandle = handle; fileName = handle.name || fileName;
      dirty = false;
      return { ok: true };
    } catch (e) {
      if (e && e.name === 'AbortError') return { ok: false, aborted: true };
      return { ok: false, error: e.message };
    }
  }
  // fallback: hidden <input type=file>
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.json,application/json';
    input.onchange = async () => {
      const file = input.files && input.files[0];
      if (!file) return resolve({ ok: false, aborted: true });
      try {
        const data = JSON.parse(await file.text());
        portfolio = migrate(data);
        fileHandle = null; fileName = file.name || fileName; dirty = false;
        resolve({ ok: true });
      } catch (e) { resolve({ ok: false, error: e.message }); }
    };
    input.click();
  });
}

/* Autosave reminder if there are unsaved changes (spec §10). */
window.addEventListener('beforeunload', (e) => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; return ''; }
});

function todayISO() {

/* ===============================================================
   SVG CHART BUILDERS — hand-rolled, no library (spec §10)
   =============================================================== */
const CIRC = 2 * Math.PI * 70; // r=70 circumference for the main donut

function donutSVG(rows, opts) {
  opts = opts || {};
  const size = opts.size || 170, r = 70, C = CIRC;
  const total = rows.reduce((s, x) => s + x.value, 0);
  let off = 0, slices = '';
  if (total > 0) {
    for (const row of rows) {
      const len = (row.value / total) * C;
      slices += `<circle cx="90" cy="90" r="${r}" fill="none" stroke-width="20" stroke="${row.color}" `
        + `stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"></circle>`;
      off += len;
    }
  } else {
    slices = `<circle cx="90" cy="90" r="${r}" fill="none" stroke-width="20" stroke="var(--color-neutral-300)"></circle>`;
  }
  const top = esc(opts.label || 'ACTUAL');
  const sub = opts.sub ? `<text x="90" y="104" text-anchor="middle" style="font-family:var(--font-heading);font-size:13px;fill:var(--color-accent-700);">${esc(opts.sub)}</text>` : '';
  const ty = opts.sub ? 86 : 96;
  return `<svg viewBox="0 0 180 180" width="${size}" height="${size}" role="img" aria-label="${top} allocation donut">
    <g transform="rotate(-90 90 90)">${slices}</g>
    <text x="90" y="${ty}" text-anchor="middle" style="font-family:var(--font-heading);font-size:15px;fill:var(--color-text);">${top}</text>${sub}
  </svg>`;
}

/* Concentric donut: actual = outer ring, goal = inner ring, shared colors
   so each class can be compared arc-to-arc between the two rings. */
function concentricDonutSVG(actualRows, goalRows) {
  const cx = 110, cy = 110;
  function ring(r, w, rows) {
    const C = 2 * Math.PI * r;
    const total = rows.reduce((s, x) => s + x.value, 0);
    let off = 0, out = '';
    if (total > 0) for (const row of rows) {
      const len = (row.value / total) * C;
      out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke-width="${w}" stroke="${row.color}" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"></circle>`;
      off += len;
    } else out = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke-width="${w}" stroke="var(--color-neutral-300)"></circle>`;
    return out;
  }
  const outer = ring(82, 20, actualRows);
  const inner = goalRows ? ring(54, 15, goalRows) : '';
  return `<svg viewBox="0 0 220 220" width="206" height="206" role="img" aria-label="Actual versus goal allocation, concentric rings">
    <g transform="rotate(-90 ${cx} ${cy})">${outer}${inner}</g>
    <text x="${cx}" y="${goalRows ? 106 : 116}" text-anchor="middle" style="font-family:var(--font-heading);font-size:14px;fill:var(--color-text);">ACTUAL</text>
    ${goalRows ? `<text x="${cx}" y="124" text-anchor="middle" style="font-family:var(--font-heading);font-size:12px;fill:var(--color-accent-700);">vs GOAL</text>` : ''}
  </svg>`;
}

function miniArcSVG(pct) {
  const r = 24, C = 2 * Math.PI * r, len = (Math.max(0, Math.min(100, pct)) / 100) * C;
  return `<svg viewBox="0 0 60 60" width="52" height="52" role="img" aria-hidden="true">
    <g transform="rotate(-90 30 30)" fill="none" stroke-width="9">
      <circle cx="30" cy="30" r="${r}" stroke="var(--color-neutral-300)" stroke-dasharray="${C.toFixed(1)} ${C.toFixed(1)}"></circle>
      <circle cx="30" cy="30" r="${r}" stroke="var(--color-accent-700)" stroke-dasharray="${len.toFixed(1)} ${C.toFixed(1)}"></circle>
    </g></svg>`;
}

/* One drift bar: zero-centred, shaded band, darkens on breach. */
function driftTrackSVG(driftPct, band) {
  const W = 320, cx = 160, px = 12.5;
  const bandW = Math.min(band * px * 2, W);
  const bandX = cx - Math.min(band * px, W / 2);
  const w = Math.max(Math.min(Math.abs(driftPct) * px, 160), driftPct === 0 ? 0 : 2);
  const barX = driftPct >= 0 ? cx : cx - w;
  const breach = Math.abs(driftPct) > band;
  const fill = breach ? 'var(--color-accent-900)' : 'var(--color-accent-500)';
  return `<svg viewBox="0 0 320 26" height="26" style="width:100%;" role="img" aria-label="drift ${fmtPctSigned(driftPct)}">
    <rect x="${bandX.toFixed(1)}" y="3" width="${bandW.toFixed(1)}" height="20" fill="var(--color-accent-100)"></rect>
    <line x1="${cx}" y1="0" x2="${cx}" y2="26" stroke="var(--color-text)" stroke-width="1" opacity="0.45"></line>
    <rect x="${barX.toFixed(1)}" y="7" width="${w.toFixed(1)}" height="12" fill="${fill}"></rect>
  </svg>`;
}

/* Stacked area of value by group across snapshots. */
function stackedAreaSVG(series, opts) {
  opts = opts || {};
  const W = 320, H = 110, base = H, n = series.length;
  if (n === 0) return '<div class="text-muted" style="padding:20px;">No snapshots yet.</div>';
  const maxTotal = Math.max(1, ...series.map(s => s.total));
  const xOf = i => n === 1 ? W / 2 : (i / (n - 1)) * W;
  const yOf = v => base - (v / maxTotal) * (H - 6);
  const keys = TAXONOMY.groups.map(g => g.id);
  let polys = '';
  const cum = series.map(() => 0);
  for (const k of keys) {
    const tops = [], bots = [];
    let any = false;
    for (let i = 0; i < n; i++) {
      const bottom = cum[i];
      const val = (series[i].group[k] || 0);
      const top = bottom + val;
      if (val > 0) any = true;
      bots.push([xOf(i), yOf(bottom)]);
      tops.push([xOf(i), yOf(top)]);
      cum[i] = top;
    }
    if (!any) continue;
    const pts = tops.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')
      + ' ' + bots.reverse().map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    polys += `<polygon points="${pts}" fill="${groupColor(k)}"></polygon>`;
  }
  const labels = n > 1
    ? `<text x="0" y="124">${esc(series[0].date)}</text><text x="${(W - 44).toFixed(0)}" y="124">${esc(series[n - 1].date)}</text>`
    : `<text x="0" y="124">${esc(series[0].date)}</text>`;
  return `<svg viewBox="0 0 320 130" style="width:100%;height:180px;" role="img" aria-label="Stacked area of value by asset class">
    <line x1="0" y1="${base}" x2="320" y2="${base}" stroke="var(--color-divider)"></line>
    ${polys}
    <g style="font-size:9px;fill:var(--color-text);opacity:0.55;font-family:var(--font-body);">${labels}</g>
  </svg>`;
}

/* Multi-line chart: lines = [{label,color,points:[v...]}] over shared x. */
function multiLineSVG(dates, lines) {
  const W = 320, H = 110, base = H, n = dates.length;
  if (n === 0) return '<div class="text-muted" style="padding:20px;">No snapshots yet.</div>';
  const allV = lines.flatMap(l => l.points);
  const maxV = Math.max(1, ...allV);
  const xOf = i => n === 1 ? W / 2 : (i / (n - 1)) * W;
  const yOf = v => base - (v / maxV) * (H - 6);
  let paths = '';
  for (const l of lines) {
    const pts = l.points.map((v, i) => `${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ');
    paths += `<polyline points="${pts}" fill="none" stroke="${l.color}" stroke-width="2"></polyline>`;
    const last = l.points.length - 1;
    paths += `<circle cx="${xOf(last).toFixed(1)}" cy="${yOf(l.points[last]).toFixed(1)}" r="2.5" fill="${l.color}"></circle>`;
  }
  const labels = n > 1
    ? `<text x="0" y="124">${esc(dates[0])}</text><text x="${(W - 44).toFixed(0)}" y="124">${esc(dates[n - 1])}</text>`
    : `<text x="0" y="124">${esc(dates[0])}</text>`;
  return `<svg viewBox="0 0 320 130" style="width:100%;height:180px;" role="img" aria-label="Growth lines">
    <line x1="0" y1="${base}" x2="320" y2="${base}" stroke="var(--color-divider)"></line>
    ${paths}
    <g style="font-size:9px;fill:var(--color-text);opacity:0.55;font-family:var(--font-body);">${labels}</g>
  </svg>`;
}

/* Small 100% stacked bar for allocation-% over time (one bar per snapshot). */
function pctStackSVG(series) {
  const n = series.length;
  if (n === 0) return '<div class="text-muted" style="padding:20px;">No snapshots yet.</div>';
  const W = 320, H = 110, gap = 6;
  const bw = (W - gap * (n - 1)) / n;
  const keys = TAXONOMY.groups.map(g => g.id);
  let bars = '';
  series.forEach((s, i) => {
    const x = i * (bw + gap);
    let y = 0;
    for (const k of keys) {
      const v = s.group[k] || 0;
      if (v <= 0 || s.total <= 0) continue;
      const h = (v / s.total) * H;
      bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${groupColor(k)}"></rect>`;
      y += h;
    }
  });
  const labels = n > 1
    ? `<text x="0" y="124">${esc(series[0].date)}</text><text x="${(W - 44).toFixed(0)}" y="124">${esc(series[n - 1].date)}</text>`
    : `<text x="0" y="124">${esc(series[0].date)}</text>`;
  return `<svg viewBox="0 0 320 130" style="width:100%;height:180px;" role="img" aria-label="Allocation percent over time">
    ${bars}
    <g style="font-size:9px;fill:var(--color-text);opacity:0.55;font-family:var(--font-body);">${labels}</g>
  </svg>`;
}

function corners() { return '<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>'; }

/* ===============================================================
   RENDER ROUTER + SHELL
   =============================================================== */
function rerender() { render(); }

/* Reset all view/draft state — used after loading a new dataset (demo/open/fresh). */
function resetViewState() {
  ui.view = 'dashboard'; ui.snapDate = null; ui.level = 'group';
  ui.drill = { level: 'household', category: null, accountId: null };
  ui.checkin = null; ui.goalDraft = null; ui.historyTab = 'value';
}

function render() {
  const app = document.getElementById('app');
  const hasData = portfolio.accounts.some(a => a.status !== 'archived');
  if (!hasData) { app.innerHTML = shellHTML(emptyStateHTML()); afterRender(); return; }

  let body;
  switch (ui.view) {
    case 'checkin':  body = renderCheckin();  break;
    case 'history':  body = renderHistory();  break;
    case 'goal':     body = renderGoal();     break;
    case 'report':   body = renderReport();   break;
    case 'accounts': body = renderAccounts(); break;
    default:         body = renderDashboard();
  }
  // The report markup is always in the DOM (hidden) so print + preview share it.
  const reportHidden = ui.view === 'report' ? '' : reportHTML(currentSnapshot());
  app.innerHTML = shellHTML(navHTML() + `<div class="app-body">${body}${reportHidden ? `<div class="report">${reportHidden}</div>` : ''}</div>`);
  afterRender();
}

function shellHTML(inner) { return `<div class="shell">${inner}</div>`; }

function navHTML() {
  const tabs = [['dashboard', 'Dashboard'], ['checkin', 'Check-in'], ['history', 'History'], ['goal', 'Goal'], ['report', 'Report'], ['accounts', 'Accounts']];
  const links = tabs.map(([v, label]) =>
    `<a data-act="nav" data-view="${v}" ${ui.view === v ? 'aria-current="page"' : ''}>${label}</a>`).join('');
  const saveCls = dirty ? 'btn btn-sm save-dirty' : 'btn btn-sm btn-secondary';
  const savedNote = dirty ? 'unsaved changes' : (HAS_FSA && fileHandle ? esc(fileName) : esc(fileName));
  return `<div class="nav no-print">
    <span class="nav-brand">Allocation Tracker</span>
    <div style="display:flex;gap:20px;align-items:center;margin-right:auto;margin-left:24px;">${links}</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="text-muted" style="font-size:12px;">${savedNote}</span>
      <button class="${saveCls}" data-act="save">Save</button>
      <button class="btn btn-sm btn-secondary" data-act="open">Open</button>
      <button class="btn btn-sm btn-primary" data-act="new-checkin">New check-in</button>
    </div>
  </div>`;
}

function emptyStateHTML() {
  return `<div class="nav no-print"><span class="nav-brand">Allocation Tracker</span></div>
  <div class="empty">
    <span class="tag tag-outline">Local · offline · your data never leaves this file</span>
    <h1 style="margin:0;">See what you actually own.</h1>
    <p class="text-muted" style="max-width:56ch;">Track true asset allocation across every account, compare it to a goal, and watch it over time. No accounts, no cloud — a single file you keep and can hand to a friend.</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px;">
      <button class="btn btn-primary" data-act="onboard-start">Start — add your first account</button>
      <button class="btn btn-secondary" data-act="load-demo">Load demo data</button>
      <button class="btn btn-secondary" data-act="open">Open a saved file</button>
    </div>
    <p class="text-muted" style="font-size:12px;margin-top:16px;">Three steps, about three minutes: add one account, add one holding, set one goal.</p>
  </div>`;
}

/* ===============================================================
   DASHBOARD (F2 / F3 / F4)
   =============================================================== */
function renderDashboard() {
  const snap = currentSnapshot();
  if (!snap) return dashNoSnapshotHTML();

  const drill = ui.drill;
  const is529 = drill.level === 'category' && drill.category === '529';
  let holdings, scopeLabel, goalTargets, goalNote, glideInfo = null;

  if (drill.level === 'household') { holdings = householdHoldings(); scopeLabel = 'Household'; }
  else if (drill.level === 'category') {
    holdings = categoryHoldings(drill.category); scopeLabel = drill.category;
  } else {
    holdings = accountHoldings(drill.accountId);
    const acct = accountById(drill.accountId); scopeLabel = acct ? acct.name : 'Account';
  }

  const alloc = allocate(holdings, snap);
  const level = ui.level;
  const actualRows = toRows(level === 'group' ? alloc.group : alloc.detail, alloc.total, level);

  // goal / glide targets for this scope
  const goal = activeGoal(snap.date);
  if (drill.level === 'account') {
    const acct = accountById(drill.accountId);
    if (acct && acct.category === '529' && acct.childId) {
      glideInfo = glideTargets(acct.childId, snap.date);
      goalTargets = glideInfo && glideInfo.targets; goalNote = '529 glide band';
    } else { goalTargets = goal && rollupTargets(goal, level); goalNote = goal ? 'Household goal ' + goal.effectiveDate : null; }
  } else if (is529) {
    goalTargets = null; goalNote = 'Per-child glide (drill into a child account)';
  } else {
    goalTargets = goal && rollupTargets(goal, level); goalNote = goal ? 'Household goal ' + goal.effectiveDate : null;
  }

  const band = portfolio.meta.driftBandPct || 5;
  const drift = goalTargets ? computeDrift(actualRows, alloc.total, goalTargets, band) : [];
  const breaches = drift.filter(d => d.breach);

  return `
    ${dashToolbarHTML(snap)}
    ${dashKpiHTML(snap, alloc, goal, band, breaches.length)}
    <div class="panel" style="display:grid;grid-template-columns:1fr 1fr;">
      ${dashDonutsHTML(actualRows, goalTargets, alloc, snap, scopeLabel, goalNote, level, glideInfo)}
      ${dashDriftHTML(drift, band, breaches, goalTargets)}
    </div>
    ${dashCategoriesHTML(snap)}
    ${dashHistoryStripHTML()}
  `;
}

function rollupTargets(goal, level) {
  // Goals are stored at rollup level; if viewing detail, we still compare
  // actual-detail against the rollup goal by mapping each detail's group %.
  if (!goal) return null;
  if (level === 'group') return goal.targets;
  // detail view: spread each group target is not meaningful → return null so
  // detail view shows actual only, no drift bars (avoids fabricated targets).
  return null;
}

function dashToolbarHTML(snap) {
  const snaps = sortedSnapshots().slice().reverse();
  const opts = snaps.map((s, i) =>
    `<option value="${s.date}" ${s.date === snap.date ? 'selected' : ''}>${s.date}${i === 0 ? ' (latest)' : ''}</option>`).join('');
  const d = ui.drill;
  let crumb = `<a data-act="drill" data-level="household">Household</a>`;
  if (d.level === 'household') {
    crumb = `<span>Household</span><span class="sep">›</span><span class="text-muted">Category</span><span class="sep">›</span><span class="text-muted">Account</span>`;
  } else if (d.level === 'category') {
    crumb += `<span class="sep">›</span><span>${esc(d.category)}</span><span class="sep">›</span><span class="text-muted">Account</span>`;
  } else {
    const acct = accountById(d.accountId);
    crumb += `<span class="sep">›</span><a data-act="drill" data-level="category" data-category="${esc(acct ? acct.category : '')}">${esc(acct ? acct.category : '')}</a><span class="sep">›</span><span>${esc(acct ? acct.name : '')}</span>`;
  }
  return `<div class="toolbar no-print">
    <div class="crumb">${crumb}</div>
    <div class="seg" style="margin-left:auto;">
      <label class="seg-opt"><input type="radio" name="lvl" ${ui.level === 'group' ? 'checked' : ''} data-act="level" data-level="group">Rollup (6)</label>
      <label class="seg-opt"><input type="radio" name="lvl" ${ui.level === 'detail' ? 'checked' : ''} data-act="level" data-level="detail">Detail (14)</label>
    </div>
    <div class="field" style="width:170px;">
      <select class="input" data-act="pick-snap">${opts}</select>
    </div>
  </div>`;
}

function dashKpiHTML(snap, alloc, goal, band, breachCount) {
  const snaps = sortedSnapshots();
  const idx = snaps.findIndex(s => s.date === snap.date);
  const prev = idx > 0 ? snaps[idx - 1] : null;
  let deltaHTML = '<div class="text-muted" style="font-size:12px;">first snapshot</div>';
  if (prev) {
    const prevAlloc = allocate(householdHoldings(), prev);
    const d = alloc.total - prevAlloc.total;
    deltaHTML = `<div class="text-muted" style="font-size:12px;">${fmtMoneySigned(d)} vs ${prev.date}</div>`;
  }
  const withBasis = alloc.byHolding.filter(h => h.gain != null);
  const totalGain = withBasis.reduce((s, h) => s + h.gain, 0);
  const goalStr = goal ? Object.entries(goal.targets).map(([, v]) => v).join('/') : '—';
  return `<div class="grid-kpi">
    <div class="kpi">
      <div class="kicker">${esc(drillScopeLabel())} total</div>
      <div class="kpi-val tnum">${fmtMoney(alloc.total)}</div>
      ${deltaHTML}
    </div>
    <div class="kpi">
      <div class="kicker">Unrealized gain</div>
      <div class="kpi-val tnum">${withBasis.length ? fmtMoneySigned(totalGain) : '—'}</div>
      <div class="text-muted" style="font-size:12px;">${withBasis.length} of ${alloc.byHolding.length} holdings with basis</div>
    </div>
    <div class="kpi">
      <div class="kicker">Goal in force</div>
      <div class="kpi-val tnum">${goal ? esc(goal.effectiveDate) : '—'}</div>
      <div class="text-muted" style="font-size:12px;">${goal ? goalStr + ' rollup' : 'no goal set'}</div>
    </div>
    <div class="kpi">
      <div class="kicker">Drift band</div>
      <div class="kpi-val tnum">±${band}%</div>
      <div style="margin-top:4px;">${breachCount ? `<span class="tag tag-crit">${breachCount} class${breachCount > 1 ? 'es' : ''} breached</span>` : `<span class="tag tag-ok">within band</span>`}</div>
    </div>
  </div>`;
}

function drillScopeLabel() {
  const d = ui.drill;
  if (d.level === 'household') return 'Household';
  if (d.level === 'category') return d.category;
  const a = accountById(d.accountId); return a ? a.name : 'Account';
}

function legendHTML(actualRows, goalTargets) {
  return actualRows.map(r => {
    const g = goalTargets && goalTargets[r.id];
    const pair = g != null ? `${r.pct.toFixed(0)} / ${g}` : `${r.pct.toFixed(0)}%`;
    return `<div class="legend-item"><span class="swatch" style="background:${r.color}"></span><span>${esc(r.label)}</span><span class="text-muted">${pair}</span></div>`;
  }).join('');
}

function dashDonutsHTML(actualRows, goalTargets, alloc, snap, scopeLabel, goalNote, level, glideInfo) {
  const goalRows = goalTargets ? Object.entries(goalTargets).map(([id, pct]) => ({
    id, color: level === 'group' ? groupColor(id) : detailColor(id), value: pct, pct,
    label: GROUP_BY_ID[id] ? GROUP_BY_ID[id].label : detailLabel(id),
  })) : null;
  const ringKey = goalRows
    ? `<div class="text-muted" style="font-size:11px;display:flex;gap:14px;justify-content:center;">
         <span>◯ outer = actual</span><span>◯ inner = goal</span></div>`
    : `<div class="text-muted" style="font-size:11px;text-align:center;">${esc(goalNote || 'No goal for this scope')}</div>`;
  return `<div style="padding:20px;border-right:1px solid var(--color-divider);">
    <div class="panel-hd" style="padding:0 0 14px;border:0;"><h4>Actual vs Goal</h4>${glideInfo ? `<span class="tag tag-accent-2" style="margin-left:auto;">age ${glideInfo.age}</span>` : ''}</div>
    <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;">
      <figure class="blueprint" style="padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;flex:none;">${corners()}
        ${concentricDonutSVG(actualRows, goalRows)}
        <figcaption>${esc(snap.date)} · ${fmtMoney(alloc.total)}</figcaption>
        ${ringKey}
      </figure>
      <div style="flex:1;min-width:170px;">
        ${goalNote ? `<div class="text-muted" style="font-size:12px;margin-bottom:10px;">${esc(goalNote)}</div>` : ''}
        <div class="legend" style="flex-direction:column;gap:9px;">${legendHTML(actualRows, goalTargets)}</div>
      </div>
    </div>
  </div>`;
}

function dashDriftHTML(drift, band, breaches, goalTargets) {
  if (!goalTargets) {
    return `<div style="padding:20px;">
      <div class="panel-hd" style="padding:0 0 14px;border:0;"><h4>Drift vs goal</h4></div>
      <p class="text-muted" style="font-size:13px;">Switch to Rollup (6) or drill into an account to compare against a target. Detail-level goals aren't defined.</p>
    </div>`;
  }
  const rowsHTML = drift.map(d => `
    <div class="drift-row">
      <span style="font-size:13px;">${esc(d.label)}</span>
      ${driftTrackSVG(d.driftPct, band)}
      <span style="font-size:13px;text-align:right;" class="tnum">${fmtPctSigned(d.driftPct)} <span class="text-muted">${d.targetPct ? '≈ ' + fmtMoney(Math.abs(d.valueDelta)) : ''}</span></span>
    </div>`).join('');
  const hints = breaches.sort((a, b) => Math.abs(b.driftPct) - Math.abs(a.driftPct)).map(b => `
    <div class="blueprint" style="margin-top:12px;padding:14px;">${corners()}
      <div style="font-family:var(--font-heading);font-size:16px;">${esc(b.label)} ${b.driftPct > 0 ? 'overweight' : 'underweight'} ${fmtPctSigned(b.driftPct)} (≈ ${fmtMoney(Math.abs(b.valueDelta))})</div>
      <p class="text-muted" style="margin:4px 0 0;font-size:13px;">Consider adjusting inside tax-advantaged accounts first. Informational only — no trade instructions.</p>
    </div>`).join('');
  return `<div style="padding:20px;">
    <div class="panel-hd" style="padding:0 0 14px;border:0;"><h4>Drift vs goal</h4><span class="text-muted" style="font-size:12px;margin-left:auto;">band ±${band}% absolute</span></div>
    <div style="display:flex;flex-direction:column;gap:10px;">${rowsHTML || '<span class="text-muted">No allocation yet.</span>'}</div>
    ${hints || `<div class="blueprint" style="margin-top:12px;padding:14px;">${corners()}<div class="text-muted" style="font-size:13px;">All classes within the ±${band}% band. Nothing to rebalance.</div></div>`}
  </div>`;
}

function dashCategoriesHTML(snap) {
  if (ui.drill.level !== 'household') return '';
  const gt = grandTotal(snap);
  const cards = [];
  for (const cat of CATEGORY_ORDER) {
    const accts = accountsSorted(a => a.category === cat);
    if (cat === '529') {
      // one card per child that has a 529 account
      for (const acct of accts) {
        const child = childById(acct.childId);
        const a = allocate(accountHoldings(acct.id), snap);
        const g = glideTargets(acct.childId, snap.date);
        const share = gt > 0 ? (a.total / gt) * 100 : 0;
        const gr = toRows(a.group, a.total, 'group');
        let meta = 'age ' + (g ? g.age : '?');
        if (g && g.targets) {
          const gd = computeDrift(gr, a.total, g.targets, 999).filter(x => x.targetPct > 0);
          meta = gd.map(x => `${x.label} ${x.actualPct.toFixed(0)}/${x.targetPct}`).slice(0, 2).join(' · ');
        }
        cards.push(catCardHTML(`529 · ${child ? child.label : ''} (${g ? g.age : '?'})`, acct.name, a.total, share, meta, { level: 'account', accountId: acct.id }));
      }
      continue;
    }
    if (!accts.length) continue;
    const holdings = accts.flatMap(a => accountHoldings(a.id));
    const a = allocate(holdings, snap);
    if (a.total === 0 && !accts.length) continue;
    const share = gt > 0 ? (a.total / gt) * 100 : 0;
    cards.push(catCardHTML('Category', cat, a.total, share, `${accts.length} account${accts.length > 1 ? 's' : ''}`, { level: 'category', category: cat }));
  }
  if (!cards.length) return '';
  return `<div class="panel">
    <div class="panel-hd"><h4>Categories — click to drill in</h4></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;padding:20px;">${cards.join('')}</div>
  </div>`;
}

function catCardHTML(kicker, name, value, share, meta, drillTarget) {

  return `<div class="card blueprint" style="cursor:pointer;gap:6px;" ${dattr}>${corners()}
    <span class="card-kicker">${esc(kicker)}</span>

/* ===============================================================
   CHECK-IN (F1) — clone latest, overtype, ≤10 min
   =============================================================== */
/* Build the check-in draft in place — NO render() (so it's safe to call
   from inside render() via renderCheckin without re-entrancy). */
function ensureCheckinDraft() {
  if (ui.checkin) return;
  const base = latestSnapshot();
  const values = {};
  const activeIds = new Set(activeHoldings().map(h => h.id));
  if (base) {
    for (const v of base.values) {
      if (activeIds.has(v.holdingId)) values[v.holdingId] = { marketValue: v.marketValue, costBasis: v.costBasis };
    }
  }
  for (const h of activeHoldings()) if (!values[h.id]) values[h.id] = { marketValue: '', costBasis: '' };
  const open = {};
  const firstAcct = accountsSorted()[0];
  if (firstAcct) open[firstAcct.id] = true;
  ui.checkin = { date: todayISO(), baseDate: base ? base.date : null, note: '', values };
  ui.checkinOpen = open;
  ui.checkinNetWorth = '';
}
function startCheckin() { ui.checkin = null; ensureCheckinDraft(); ui.view = 'checkin'; render(); }

function checkinTotal() {
  let t = 0;
  for (const h of activeHoldings()) {
    const v = ui.checkin.values[h.id];
    const mv = v ? parseNum(v.marketValue) : null;
    if (mv) t += mv;
  }
  return t;
}
function checkinSanityHTML(total) {
  const nw = parseNum(ui.checkinNetWorth);
  if (nw == null || nw <= 0) return '<span class="text-muted" style="font-size:12px;">Enter your net-worth number to sanity-check.</span>';
  const d = total - nw, pct = (d / nw) * 100, within = Math.abs(pct) <= 2;
  return `<span class="tag ${within ? 'tag-ok' : 'tag-warn'}">Off by ${fmtMoney(Math.abs(d))} · ${Math.abs(pct).toFixed(2)}% — ${within ? 'within tolerance' : 'check entries'}</span>`;
}
/* Live-update the sanity footer without a full re-render (keeps input focus). */
function updateCheckinTotals() {
  if (!ui.checkin) return;
  const total = checkinTotal();
  const tEl = document.getElementById('ci-total'); if (tEl) tEl.textContent = fmtMoney(total);
  const sEl = document.getElementById('ci-sanity'); if (sEl) sEl.innerHTML = checkinSanityHTML(total);
}

function renderCheckin() {
  ensureCheckinDraft();
  const ci = ui.checkin;
  const baseVals = ci.baseDate ? valueIndex(snapshotByDate(ci.baseDate)) : {};
  const accts = accountsSorted();

  const acctBlocks = accts.map(acct => {
    const open = !!ui.checkinOpen[acct.id];
    const holds = activeHoldings(acct.id);
    let acctTotal = 0, baseTotal = 0;
    for (const h of holds) {
      const mv = parseNum((ci.values[h.id] || {}).marketValue) || 0; acctTotal += mv;
      const bv = baseVals[h.id] ? Number(baseVals[h.id].marketValue) : 0; baseTotal += bv;
    }
    const delta = acctTotal - baseTotal;
    const head = `<div style="display:flex;align-items:center;gap:12px;padding:12px 20px;${open ? 'background:color-mix(in srgb, var(--color-text) 4%, transparent);' : ''}cursor:pointer;" data-act="ci-toggle" data-account="${esc(acct.id)}">
      <span class="text-muted" style="font-size:14px;width:12px;">${open ? '–' : '+'}</span>
      <span style="font-family:var(--font-heading);font-size:18px;">${esc(acct.name)}</span>
      <span class="tag tag-accent">${esc(acct.categoryLabel || acct.category)}</span>
      ${acct.taxTreatment ? `<span class="tag tag-outline">${esc(acct.taxTreatment)}</span>` : ''}
      <span class="text-muted tnum" style="font-size:12px;margin-left:auto;">${fmtMoney(acctTotal)} ${baseTotal ? `<span style="color:var(--color-accent-700);">${fmtMoneySigned(delta)}</span>` : ''}</span>
    </div>`;
    if (!open) return `<div style="border-bottom:1px solid var(--color-divider);">${head}</div>`;

    const rows = holds.map(h => {
      const v = ci.values[h.id] || {};
      const prev = baseVals[h.id] ? fmtMoney(baseVals[h.id].marketValue) : '—';
      const mv = parseNum(v.marketValue), cb = parseNum(v.costBasis);
      const gain = (mv != null && cb != null) ? mv - cb : null;
      return `<tr>
        <td style="padding-left:20px;font-family:var(--font-heading);font-size:15px;">${esc(h.ticker)}</td>
        <td>
          <span class="tag tag-accent" style="cursor:pointer;gap:6px;" data-act="edit-class" data-hid="${esc(h.id)}">${esc(detailLabel(h.assetClass))}<span class="text-muted" style="font-size:10px;">edit</span></span>
          ${h.name ? `<span class="text-muted" style="font-size:11px;margin-left:8px;">${esc(h.name)}</span>` : ''}
        </td>
        <td class="text-muted tnum" style="text-align:right;">${prev}</td>
        <td><input class="input tnum" style="min-height:32px;text-align:right;" inputmode="decimal" value="${esc(v.marketValue)}" data-act="ci-val" data-hid="${esc(h.id)}" placeholder="0"></td>
        <td><input class="input tnum" style="min-height:32px;text-align:right;" inputmode="decimal" value="${esc(v.costBasis)}" data-act="ci-basis" data-hid="${esc(h.id)}" placeholder="—"></td>
        <td class="tnum" style="text-align:right;padding-right:8px;color:${gain != null && gain < 0 ? 'var(--color-crit)' : 'var(--color-accent-700)'};">${gain != null ? fmtMoneySigned(gain) : '—'}</td>
        <td style="width:34px;text-align:right;padding-right:16px;"><button class="btn btn-ghost btn-sm" title="Archive holding" data-act="archive-holding" data-hid="${esc(h.id)}">✕</button></td>
      </tr>`;
    }).join('');

    return `<div style="border-bottom:1px solid var(--color-divider);">
      ${head}
      <table class="table">
        <thead><tr>
          <th style="width:96px;padding-left:20px;">Ticker</th>
          <th>Asset class <span class="text-muted" style="text-transform:none;letter-spacing:0;">auto</span></th>
          <th style="width:120px;text-align:right;">Last value</th>
          <th style="width:150px;text-align:right;">Current value</th>
          <th style="width:130px;text-align:right;">Cost basis <span class="text-muted" style="text-transform:none;letter-spacing:0;">opt.</span></th>
          <th style="width:120px;text-align:right;">Unrealized</th>
          <th></th>
        </tr></thead>
        <tbody>${rows || '<tr><td colspan="7" class="text-muted" style="padding:14px 20px;">No holdings yet.</td></tr>'}</tbody>
      </table>
      <div style="padding:10px 20px;"><button class="btn btn-ghost btn-sm" data-act="add-holding" data-account="${esc(acct.id)}">+ Add holding</button></div>
    </div>`;
  }).join('');

  const total = checkinTotal();
  const sanity = checkinSanityHTML(total);

  return `<div class="panel">
    <div style="display:flex;align-items:flex-end;gap:20px;padding:18px 20px;border-bottom:1px solid var(--color-divider);">
      <div>
        <h3 style="margin:0 0 4px;">New check-in</h3>
        <span class="text-muted" style="font-size:13px;">${ci.baseDate ? `Prefilled from ${esc(ci.baseDate)} · overtype what changed` : 'First snapshot — enter current values'}</span>
      </div>
      <div class="field" style="width:150px;margin-left:8px;"><label>Snapshot date</label><input class="input" type="date" value="${esc(ci.date)}" data-act="ci-date"></div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:10px;">
        <button class="btn btn-secondary" data-act="ci-discard">Discard</button>
        <button class="btn btn-secondary" data-act="add-account">+ Account</button>
        <button class="btn btn-primary" data-act="ci-save">Save snapshot</button>
      </div>
    </div>
    ${acctBlocks || '<div class="text-muted" style="padding:20px;">No accounts. Add one to start.</div>'}
    <div style="display:flex;align-items:center;gap:20px;padding:18px 20px;flex-wrap:wrap;">
      <div>
        <div class="kicker">Snapshot total</div>
        <div id="ci-total" style="font-family:var(--font-heading);font-size:30px;line-height:1.1;" class="tnum">${fmtMoney(total)}</div>
      </div>
      <div class="field" style="width:190px;border-left:1px solid var(--color-divider);padding-left:20px;"><label>Net worth tracker says</label><input class="input tnum" inputmode="decimal" placeholder="optional" value="${esc(ui.checkinNetWorth)}" data-act="ci-nw"></div>
      <div id="ci-sanity" style="align-self:flex-end;padding-bottom:6px;">${sanity}</div>
      <div class="field" style="margin-left:auto;width:320px;"><label>Snapshot note (optional)</label><input class="input" value="${esc(ci.note)}" data-act="ci-note" placeholder="e.g. Bonds still light after top-up."></div>
    </div>
  </div>`;
}

function saveCheckin() {
  const ci = ui.checkin;
  const values = [];
  for (const h of activeHoldings()) {
    const v = ci.values[h.id] || {};
    const mv = parseNum(v.marketValue);
    if (mv == null) continue; // skip blank
    const entry = { holdingId: h.id, marketValue: mv };
    const cb = parseNum(v.costBasis);
    if (cb != null) entry.costBasis = cb;
    values.push(entry);
  }
  if (!values.length) { toast('Enter at least one value before saving.'); return; }
  const existing = snapshotByDate(ci.date);
  if (existing) { existing.values = values; existing.note = ci.note; }
  else portfolio.snapshots.push({ date: ci.date, values, note: ci.note });
  markDirty();
  ui.snapDate = ci.date; ui.checkin = null; ui.view = 'dashboard';
  render();
  toast('Snapshot saved · ' + ci.date);
}

  } else if (ui.historyTab === 'pct') {
    chart = pctStackSVG(series);

    const lines = cats.map((cat, i) => ({
      label: cat, color: cssVarValue(palette[i], '#888'),

      <div class="legend" style="padding:0 20px 20px;">${legend}</div>
