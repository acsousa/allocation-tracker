    </tr>`;
  }).join('');
  const anySuspect = accts.some(a => { const v = accountVehicle(a); return (v === 'ira' || v === '401k') && retireBucketOf(a) === 'taxable'; });
  const intro = `<div style="padding:14px 20px 4px;"><span class="text-muted" style="font-size:12px;">Each account's balance is grown and taxed by its bucket. A mistagged account throws off every number — edit the vehicle or tax treatment right here. 529 college accounts are excluded (they have their own tab).</span></div>`;
  const table = `<table class="table"><thead><tr><th>Account</th><th>Vehicle</th><th>Tax treatment</th><th>Retirement bucket</th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="text-muted" style="padding:14px 20px;">No non-529 accounts yet.</td></tr>'}</tbody></table>`;

  if (confirmed) {

    return `<div class="panel">${scopeRow || ''}<details${scopeRow ? ' style="border-top:1px solid var(--color-line-2);"' : ''}><summary style="padding:14px 20px;cursor:pointer;font-family:var(--font-heading);display:flex;align-items:center;gap:10px;">Account mapping <span class="tag tag-ok" style="font-size:10px;">confirmed</span> <span class="text-muted" style="font-size:12px;font-family:var(--font-body);">${accts.length} account${accts.length === 1 ? '' : 's'} — click to review or edit</span></summary>
      ${intro}${table}
      <div style="padding:12px 20px 18px;">${anySuspect ? `<span class="text-muted" style="font-size:12px;">Highlighted rows look like retirement accounts tagged “Taxable” — fix them if so.</span>` : ''}</div>
    </details></div>`;
  }
  return `<div class="panel" style="border-color:var(--color-accent);">
    <div class="panel-hd" style="border-color:var(--color-accent);"><h4>First, confirm your accounts</h4>

}

function renderRetire() {
  if (!portfolio.accounts.some(a => a.status !== 'archived' && a.category !== '529'))
    return retireEmptyState('Add a non-529 account and record a check-in, then set your retirement inputs to project your balances, spending success, and the Roth-vs-traditional answer.');
  if (!latestSnapshot())
    return retireEmptyState('Record at least one check-in (snapshot) so the projection has starting balances to grow.');
  const rs = portfolio.retirementSettings;
  const confirmed = !!rs.mappingConfirmed;
  const header = `<div class="toolbar no-print"><div class="crumb"><span>Retirement planning</span></div>
    <span class="tag ${dollarModeIsFuture() ? 'tag-warn' : 'tag-accent'}" style="margin-left:auto;">${dollarModeIsFuture() ? 'Future dollars' : "Today's dollars"}</span>
    <a data-act="nav" data-view="retirement" style="margin-left:12px;cursor:pointer;color:var(--color-accent);">Edit inputs →</a></div>`;
  if (!confirmed) {
    const lead = `<div class="panel" style="background:var(--color-accent-100);border-color:var(--color-accent);"><div style="padding:18px 20px;">
      <div style="font-family:var(--font-heading);font-size:16px;margin-bottom:4px;">Will your savings last through retirement?</div>
      <p style="font-size:13px;line-height:1.6;margin:0;" class="text-muted">This tool grows your accounts to retirement, then spends them down — running it a thousand times over different market outcomes — to show the range of where you could land, how your spending performs under the assumptions, and how Roth and pre-tax savings compare. Everything is in today's dollars (inflation already removed). One quick step first:</p>
    </div></div>`;
    return header + `<div style="display:flex;flex-direction:column;gap:22px;margin-top:16px;">${lead}${retireMappingPanel(false)}</div>`;
  }

  const model = retireModel();
  const { cfg, base, det, verdict, conv, verdictWithConv } = model;
  const endBand = base.bands[base.bands.length - 1];
  const spend = cfg.spend;
  const retBand = base.bands.find(b => b.age === cfg.retireAge);
  const inflPct = rs.inflationPct != null ? rs.inflationPct : 2.5;
  const infl = inflPct / 100;
  const nominalAt = (real, atAge) => real * Math.pow(1 + infl, Math.max(0, atAge - cfg.currentAge));
  // Display unit: when "Future dollars" is on, every year-tied figure is re-inflated to that year.
  const future = dollarModeIsFuture();
  const M = (real, atAge) => future ? nominalAt(real, atAge) : real;   // display money for an age
  const dispBands = future ? base.bands.map(b => ({ age: b.age, p10: nominalAt(b.p10, b.age), p25: nominalAt(b.p25, b.age), p50: nominalAt(b.p50, b.age), p75: nominalAt(b.p75, b.age), p90: nominalAt(b.p90, b.age) })) : base.bands;
  const dispEndBand = dispBands[dispBands.length - 1];
  const dispRetBand = dispBands.find(b => b.age === cfg.retireAge);
  const unitTag = future ? 'Future (actual) dollars' : "Today's dollars";

  // Account-scope control — embedded as the top row of the account-mapping panel (below).
  const scopeRadio = (mode, label) => `<label style="display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;"><input type="radio" name="rdscope" data-act="rd-scope" data-mode="${mode}" ${(rs.accountScope || 'retirement') === mode ? 'checked' : ''} style="margin:0;">${esc(label)}</label>`;
  const scopeRow = `<div style="padding:14px 20px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;">
    <span style="font-size:13px;font-weight:600;">Model which accounts?</span>
    ${scopeRadio('retirement', 'Retirement accounts only')}
    ${scopeRadio('all', 'All accounts (incl. taxable brokerage)')}
    <span class="text-muted" style="font-size:11px;flex:1;min-width:200px;">Retirement-only counts your 401(k), IRA, Roth and HSA. Adding taxable brokerage gives an early-retirement “bridge” to spend before 59½.</span>
  </div>`;

  // Section 1 — Fan chart
  const fan = `<section>
    <div class="kicker" style="margin-bottom:6px;">Your projected balance · ${unitTag.toLowerCase()}</div>
    <div class="panel"><div class="panel-hd"><h4>Where your money could land, by age</h4>
      <span class="text-muted" style="font-size:12px;margin-left:auto;">${(cfg.paths).toLocaleString()} simulations</span></div>
    <div style="padding:18px 20px;">
      <p class="text-muted" style="font-size:12px;line-height:1.6;margin:0 0 6px;">${future
        ? `Every figure here is in <b>future (actual) dollars</b> — inflated to each year's sticker price at ${fmtPct(inflPct, 1)} inflation. The numbers look big, but their buying power matches the today's-dollars view.`
        : `Every figure here is in <b>today's dollars</b> (inflation already removed), so you can compare it to what money buys now.`} The dark line is the median at each age; it is not one simulated path. Shaded bands show the middle 50% and 80% of simulated balances. Outcomes can fall outside these bands. ${retBand ? `At your retirement age ${cfg.retireAge} the median simulated balance is <b>${fmtCompactMoney(dispRetBand ? dispRetBand.p50 : retBand.p50)}</b>${future ? ` in actual dollars of that year — <b>${fmtCompactMoney(retBand.p50)}</b> in today's buying power` : ` in today's dollars — about <b>${fmtCompactMoney(nominalAt(retBand.p50, cfg.retireAge))}</b> in actual dollars of that year (at ${fmtPct(inflPct, 1)} inflation)`}.` : ''} Hover any age to read the numbers.</p>
      <p class="text-muted" style="font-size:11px;margin:0 0 12px;">Investment mix: ${cfg.weightsTarget ? `glides from your current allocation to a more conservative target by age ${cfg.retireAge} (auto de-risking).` : `held at your <b>current allocation</b> for the whole projection — it does not automatically de-risk with age.`} Change this under Edit inputs → Strategy. Based on the return, volatility, and inflation assumptions in the <b>Assumptions</b> section below — all editable.</p>
      <div id="retire-fan">${fanChartSVG(dispBands, { age: cfg.retireAge, label: 'Retire at' }, 'retirefan')}</div>
    </div></div></section>`;

  // Section 2 — Spending success (walk the user through it)
  const sliderMin = 20000, sliderMax = Math.max(200000, Math.round(spend * 1.5 / 5000) * 5000);
  const success = `<section>
    <div class="kicker" style="margin-bottom:6px;">Can you afford your spending?</div>
    <div class="panel"><div class="panel-hd"><h4>Spending confidence</h4></div>
    <div style="padding:20px;">
      <div style="font-size:15px;line-height:1.5;margin-bottom:10px;">Out of ${cfg.paths.toLocaleString()} simulated futures, your savings cover <b id="retire-spend-label">${fmtMoney(spend)}</b>/yr of spending (in today's dollars) all the way to age ${RETIRE_DATA.endAge} in <b id="retire-success" style="color:var(--color-accent-700);font-size:22px;">${fmtPct(base.success * 100, 0)}</b> of them.</div>
      <p class="text-muted" style="font-size:12px;line-height:1.6;margin:0 0 14px;">This is the share of simulated paths that fund the spending target under your assumptions, not a guarantee or a calibrated probability of real-world success. The chart shows the median and percentile bands; 10% of simulated ending balances are at or below the 10th percentile. Lower spending, higher savings, or later retirement can improve the modeled results.</p>
      <label style="font-size:12px;font-weight:600;">Try a different spending level</label>
      <input type="range" min="${sliderMin}" max="${sliderMax}" step="2500" value="${spend}" data-act="rd-spend" style="width:100%;margin-top:6px;">
      <div style="display:flex;justify-content:space-between;font-size:11px;" class="text-muted"><span>${fmtCompactMoney(sliderMin)}/yr</span><span>drag to see how confidence changes</span><span>${fmtCompactMoney(sliderMax)}/yr</span></div>
    </div></div></section>`;

  // Section 3 — Roth/Traditional verdict
  const vcol = verdict.verdict === 'Roth' ? 'var(--color-accent-700)' : 'var(--color-accent-900)';
  const hasSpouse = !!(rs.birthYears && rs.birthYears[1]);
  const thenFootnote = hasSpouse
    ? `you and your spouse as a couple. A surviving spouse filing alone would face about ${fmtPct(verdict.rThenSurvivor * 100, 0)}.`
    : `on your projected retirement income.`;
  const verdictCard = `<section>
    <div class="kicker" style="margin-bottom:6px;">This year's savings</div>
    <div class="panel" style="border-color:${vcol};"><div class="panel-hd" style="border-color:${vcol};"><h4>Save as <span style="color:${vcol};">${verdict.verdict}</span> this year</h4></div>
    <div style="padding:20px;">
      <p class="text-muted" style="font-size:12px;line-height:1.6;margin:0 0 12px;">Roth means you pay tax now; traditional (pre-tax) means you pay it in retirement. Whichever rate is lower wins. We compare your tax rate on the last dollar you'd save today against the rate you're on track to pay in retirement.</p>
      <div style="display:flex;gap:26px;flex-wrap:wrap;margin-bottom:12px;align-items:center;">
        <div><span class="kicker" style="font-size:10px;">Your rate now</span><div class="tnum" style="font-size:24px;font-family:var(--font-heading);">${fmtPct(verdict.rNow * 100, 1)}</div></div>
        <div style="font-size:18px;color:var(--color-text);opacity:0.4;">vs</div>
        <div><span class="kicker" style="font-size:10px;">Your likely rate in retirement</span><div class="tnum" style="font-size:24px;font-family:var(--font-heading);">${fmtPct(verdict.rThen * 100, 1)}</div><span class="text-muted" style="font-size:11px;">${thenFootnote}</span></div>
      </div>
      <p style="font-size:13px;line-height:1.6;margin:0;">${esc(verdict.why)}</p>
      ${verdictWithConv && verdictWithConv.verdict !== verdict.verdict ? `<p class="text-muted" style="font-size:12px;margin:8px 0 0;">With Roth conversions turned on (below), your future rate falls and this flips to <b>${verdictWithConv.verdict}</b>.</p>` : ''}
    </div></div></section>`;

  // Section 4 — Marginal-rate chart
  const marginalCard = `<section>
    <div class="panel"><div class="panel-hd"><h4>Tax rate: now vs. in retirement</h4></div>
    <div style="padding:20px;">${marginalCompareSVG(verdict.rNow, verdict.rThenJoint, verdict.rThenSurvivor)}
      <p class="text-muted" style="font-size:11px;margin:14px 0 0;line-height:1.6;">Your retirement rate is driven by the income you'll draw — pre-tax withdrawals, required minimum withdrawals after ${det.rmdAge}, and the taxable part of Social Security. A surviving spouse files single, which uses a smaller standard deduction and tighter brackets, so that rate is usually higher.</p>
    </div></div></section>`;

  // Section 5 — Conversion window
  let convCard = '';
  if (cfg.conversionFill > 0 && conv) {
    convCard = `<section>
      <div class="kicker" style="margin-bottom:6px;">Optional strategy</div>
      <div class="panel"><div class="panel-hd"><h4>Roth conversion window</h4><span class="text-muted" style="font-size:12px;margin-left:auto;">fill the ${esc(rs.conversionFillBracket)} bracket, ages ${cfg.retireAge}–${det.rmdAge}</span></div>
      <div style="padding:20px;">
        <p class="text-muted" style="font-size:12px;line-height:1.6;margin:0 0 14px;">In the low-income years between retiring and your first required withdrawal, you can move pre-tax money into Roth while your rate is low. That shrinks the forced withdrawals (and the tax) later.</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;">
          <div><span class="kicker" style="font-size:10px;">Total moved to Roth</span><div class="tnum" style="font-size:18px;font-family:var(--font-heading);">${fmtMoney(conv.converted)}</div></div>
          <div><span class="kicker" style="font-size:10px;">Tax paid (from taxable)</span><div class="tnum" style="font-size:18px;font-family:var(--font-heading);">${fmtMoney(conv.convTax)}</div></div>
          <div><span class="kicker" style="font-size:10px;">First required withdrawal, without → with</span><div class="tnum" style="font-size:18px;font-family:var(--font-heading);">${fmtMoney(conv.firstRmdWithout)} → ${fmtMoney(conv.firstRmdWith)}</div></div>
        </div>
      </div></div></section>`;
  }

  // Section 6 — audit table + assumptions (both collapsed)
  // Flows cell: the total in/out, plus a plain-language line of where a drawing year's cash came from.
  // Breakdown of the withdrawal only — its parts sum exactly to the Flows figure. Social Security and
  // pensions are outside income (they reduce what must be withdrawn), so they're noted separately, not summed in.
  const flowSources = r => {
    if (r.phase !== 'decum' || !r.src) return '';
    const s = r.src, parts = [], m = v => fmtCompactMoney(M(v, r.age));
    if ((s.rmd || 0) > 50) parts.push(`RMD ${m(s.rmd)}`);
    if ((s.taxable || 0) > 50) parts.push(`taxable ${m(s.taxable)}`);
    if ((s.pretax || 0) > 50) parts.push(`pre-tax ${m(s.pretax)}`);
    if ((s.roth || 0) > 50) parts.push(`Roth ${m(s.roth)}`);
    if ((s.taxfree || 0) > 50) parts.push(`HSA ${m(s.taxfree)}`);
    const income = (s.ss || 0) + (s.pension || 0);
    const incomeNote = income > 50 ? `<div class="text-muted" style="font-size:10px;line-height:1.35;font-family:var(--font-body);letter-spacing:0;white-space:normal;opacity:0.8;">+ ${fmtCompactMoney(M(income, r.age))} income (SS${(s.pension || 0) > 50 ? ' + pension' : ''}) covered the rest</div>` : '';
    const withdrawalNote = parts.length ? `<div class="text-muted" style="font-size:10px;line-height:1.35;font-family:var(--font-body);letter-spacing:0;white-space:normal;margin-top:2px;">from ${parts.join(' · ')}</div>` : '';
    return withdrawalNote + incomeNote;
  };
  const detRows = det.detTable.filter(r => r.age % 2 === 0 || r.phase !== 'accum').map(r => `<tr>
      <td class="tnum" style="vertical-align:top;">${r.age}</td><td style="vertical-align:top;">${r.phase === 'accum' ? 'Saving' : r.phase === 'decum' ? 'Drawing' : 'Start'}</td>
      <td class="tnum" style="text-align:right;vertical-align:top;">${fmtPct((r.r || 0) * 100, 1)}</td>
      <td class="tnum" style="text-align:right;vertical-align:top;min-width:150px;">${r.phase === 'accum' ? fmtMoney(M(r.contrib || 0, r.age)) : r.phase === 'decum' ? '−' + fmtMoney(M(r.withdrawn || 0, r.age)) : '—'}${flowSources(r)}</td>
      <td class="tnum" style="text-align:right;vertical-align:top;">${r.phase === 'decum' ? fmtMoney(M(r.rmd || 0, r.age)) : '—'}</td>
      <td class="tnum" style="text-align:right;vertical-align:top;">${fmtMoney(M(r.tax || 0, r.age))}</td>
      <td class="tnum" style="text-align:right;vertical-align:top;">${fmtMoney(M(r.total || 0, r.age))}</td></tr>`).join('');
  const detTable = `<div class="panel"><details><summary style="padding:14px 20px;cursor:pointer;font-family:var(--font-heading);">Show the year-by-year constant-return projection — check the math</summary>
    <div style="padding:6px 20px 2px;"><p class="text-muted" style="font-size:12px;line-height:1.6;margin:0;"><b>Flows</b> is money moving in or out of your accounts that year: in <b>saving</b> years the contributions you add; in <b>drawing</b> years the total pulled out (shown negative) to cover spending plus taxes. The “from …” line splits that withdrawal into its sources — RMD, then taxable, pre-tax, Roth, HSA in the order the model spends them — and those parts add up to the Flows figure. Any Social Security or pension is separate outside income that covers the rest, so it's noted apart, not added into Flows. All amounts in ${unitTag.toLowerCase()}.</p></div>
    <div style="overflow-x:auto;"><table class="table"><thead><tr><th>Age</th><th>Phase</th><th style="text-align:right;">Return</th><th style="text-align:right;">${abbr('Flows', 'Contributions in (saving years) or total withdrawals out (drawing years); out is shown negative')}</th><th style="text-align:right;">${abbr('RMD', 'Required Minimum Distribution')}</th><th style="text-align:right;">Tax</th><th style="text-align:right;">Balance</th></tr></thead><tbody>${detRows}</tbody></table></div>
    </details></div>`;

  // RMD schedule (collapsed) — required withdrawals by age from the median pre-tax path.
  const rmdRows = det.detTable.filter(r => r.phase === 'decum' && r.age >= det.rmdAge && (r.rmd || 0) > 0).map(r => {
    const div = rmdDivisor(r.age), base = (r.rmd || 0) * div; // balance the RMD is figured on
    return `<tr><td class="tnum">${r.age}</td><td class="tnum" style="text-align:right;">${fmtMoney(M(base, r.age))}</td><td class="tnum" style="text-align:right;">${div.toFixed(1)}</td><td class="tnum" style="text-align:right;"><b>${fmtMoney(M(r.rmd, r.age))}</b></td></tr>`;
  }).join('');
  const rmdCard = `<div class="panel"><details><summary style="padding:14px 20px;cursor:pointer;font-family:var(--font-heading);">Your required withdrawal (${abbr('RMD', 'Required Minimum Distribution')}) schedule — starts at age ${det.rmdAge}</summary>
    <div style="padding:8px 20px 4px;"><p class="text-muted" style="font-size:12px;line-height:1.6;margin:0;">Starting at age ${det.rmdAge}, the IRS makes you withdraw a minimum from pre-tax accounts each year (your pre-tax balance ÷ an IRS life-expectancy factor). These are the amounts on your <b>median</b> projected path, in ${unitTag.toLowerCase()} — bigger pre-tax balances mean bigger forced withdrawals and more tax, which is what the Roth conversion window can soften.</p></div>
    ${rmdRows ? `<div style="overflow-x:auto;"><table class="table"><thead><tr><th>Age</th><th style="text-align:right;">Pre-tax balance</th><th style="text-align:right;">IRS factor</th><th style="text-align:right;">Required withdrawal</th></tr></thead><tbody>${rmdRows}</tbody></table></div>` : `<div style="padding:0 20px 18px;"><span class="text-muted" style="font-size:13px;">No required withdrawals projected — little or no pre-tax balance remains by age ${det.rmdAge}.</span></div>`}
    </details></div>`;

  return `<div style="display:flex;flex-direction:column;gap:26px;margin-top:4px;">${outlookHeaderBlock('Retirement planning', 'retirement')}${retireMappingPanel(true, scopeRow)}${fan}${success}${verdictCard}${marginalCard}${convCard}${rmdCard}${detTable}${retireAssumptionsPanel(model)}</div>`;
}

// Assumptions panel (§4, §6.1, §6.7) — editable μ/σ + declared simplifications.
function retireAssumptionsPanel(model) {
  const rs = portfolio.retirementSettings;
  const eff = rs.muSigma ? Object.assign({}, RETIRE_DATA.muSigma, rs.muSigma) : RETIRE_DATA.muSigma;
  const inflPct = rs.inflationPct != null ? rs.inflationPct : 2.5;
  // Fixed-layout table so the two columns fit their half-width with no horizontal scrollbar.
  const th = 'letter-spacing:0.01em;white-space:normal;font-size:10px;';
  const headerRow = `<tr>
    <th style="text-align:left;${th}">Asset class</th>
    <th style="text-align:right;${th}">${abbr('Return', 'Expected geometric annual return before inflation. Real growth equals (1 + nominal return) / (1 + inflation) − 1.')} <span class="text-muted" style="font-weight:400;">nominal&nbsp;%</span></th>
    <th style="text-align:right;${th}">${abbr('Volatility', 'Standard deviation of yearly returns — how much a typical year swings above or below the average. Higher = bumpier.')} <span class="text-muted" style="font-weight:400;">%</span></th></tr>`;
  const rowFor = d => {
    const [mu, sg] = eff[d.id] || RETIRE_DATA.muSigma.other;
    const muNet = Math.round(((1 + mu / 100) * (1 + inflPct / 100) - 1) * 1000) / 10; // geometric nominal return
    const inp = (act, v) => `<input class="input tnum" style="min-height:28px;padding:2px 4px;text-align:right;width:100%;box-sizing:border-box;" inputmode="decimal" data-act="${act}" data-cls="${d.id}" value="${v}">`;
    return `<tr>
      <td style="font-size:12px;"><span class="swatch" style="background:${detailColor(d.id)};margin-right:7px;"></span>${esc(d.label)}</td>
      <td>${inp('rd-mu', muNet)}</td>
      <td>${inp('rd-sigma', sg)}</td></tr>`;
  };
  const classes = TAXONOMY.detail.filter(d => d.id !== 'us_total');
  const half = Math.ceil(classes.length / 2);
  const tbl = list => `<table class="table" style="font-size:12px;table-layout:fixed;width:100%;">
    <colgroup><col style="width:44%"><col style="width:28%"><col style="width:28%"></colgroup>
    <thead>${headerRow}</thead><tbody>${list.map(rowFor).join('')}</tbody></table>`;

  const sims = [
    ['Account access is simplified', 'Roth and HSA balances are treated as tax-free spending funds. The model does not track Roth basis, five-year rules, qualified HSA expenses, or early-withdrawal exceptions. This can overstate accessible money, especially before age 59½.'],
    ['Some future taxes can be understated', 'Social Security and NIIT thresholds are held constant in today’s dollars, although these statutory thresholds are not inflation-indexed. Ongoing taxable-account dividend and distribution taxes during retirement are not separately modeled.'],
    ['Household and conversion estimates are approximate', 'Spouse-specific required distributions, survivor Social Security, historic RMD age rules, and the full tax cost of funding Roth conversions are not modeled. Review these separately before acting.'],
    ['Nominal and real returns', 'Return inputs are geometric annual rates before inflation. We convert them using (1 + nominal) / (1 + inflation) − 1 and store real rates. Changing inflation preserves stored real assumptions and changes their nominal equivalent.'],
    ['Social Security taxation depends on income', 'Federal taxable benefits use combined income and filing status, capped at 85%. Tax-exempt interest, unusual income exclusions and lump-sum elections are not modeled. Married filing separately assumes you lived together. State taxation remains an approximation.'],
    ['No IRMAA (Medicare premium surcharge)', 'High retirement income (roughly above $212k for a couple) raises Medicare premiums. We don\'t model that surcharge, so taxes are slightly understated at high incomes.'],
    ['No ACA health-subsidy bridge', 'Retiring before 65 can qualify you for subsidized health insurance if income is kept low. We don\'t model those savings.'],
    ['One state tax rate, held constant', 'We use your current state rate for all years. Moving to a no-income-tax state in retirement would lower the retirement rate and push the Roth/traditional call toward traditional.'],
    ['Yearly (not monthly) steps', 'The simulation advances one year at a time — fast and accurate enough for planning, but it can\'t capture within-year timing.'],
    ['One blended portfolio, not per-fund', 'We roll your whole mix into a single return each year rather than simulating each fund and rebalancing — simpler and robust at this altitude.'],
    ['Both spouses\' Social Security start at your claim age', 'A simplification; if your spouse claims at a very different age the timing will be slightly off.'],
  ];
  return `<div class="panel"><details><summary style="padding:14px 20px;cursor:pointer;font-family:var(--font-heading);">Assumptions — returns, volatility, inflation &amp; simplifications</summary>
    <div style="padding:8px 20px 18px;">
      <div class="kicker" style="margin:6px 0 4px;">Expected return &amp; volatility by asset class — editable, saved to your file</div>
      <p class="text-muted" style="font-size:12px;line-height:1.6;margin:0 0 12px;">These are <b>nominal geometric returns</b>, before inflation. The real return is (1 + nominal return) / (1 + inflation) − 1. For example, an 8% nominal return with ${fmtPct(inflPct, 1)} inflation gives ${fmtPct(((1.08 / (1 + inflPct / 100)) - 1) * 100, 1)} real growth. Volatility controls the spread of annual log returns in the simulation. These editable defaults are assumptions, not forecasts.</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 28px;">
        <div style="min-width:0;">${tbl(classes.slice(0, half))}</div>
        <div style="min-width:0;">${tbl(classes.slice(half))}</div>
      </div>
      ${rs.muSigma ? `<div style="margin-top:10px;"><button class="btn btn-sm btn-secondary" data-act="rd-reset-musigma">Reset returns to defaults</button></div>` : ''}

      <div class="kicker" style="margin:20px 0 4px;">Inflation (for converting today's dollars → actual future dollars)</div>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
        <div class="field" style="width:150px;margin:0;"><label>Assumed inflation (%/yr)</label><input class="input tnum" inputmode="decimal" data-act="rd-inflation" value="${inflPct}" placeholder="2.5"></div>
        <span class="text-muted" style="font-size:12px;line-height:1.6;flex:1;min-width:220px;">Long-run US inflation has averaged about 2.5–3%/yr. This does <b>not</b> change the projection (that runs in today's dollars) — it's only used to also show the “actual dollars” figures, so you can see both what the balance is worth today and its bigger sticker number in the future.</span>
      </div>

      <div class="kicker" style="margin:20px 0 6px;">Simplifications — what this model leaves out</div>
      <div style="display:flex;flex-direction:column;gap:9px;">${sims.map(([t, d]) => `<div style="font-size:12px;line-height:1.55;"><b>${esc(t)}.</b> <span class="text-muted">${esc(d)}</span></div>`).join('')}</div>
    </div></details></div>`;
}

/* ===============================================================
   SETTINGS › RETIREMENT (spec §3) — the modeler's inputs.
   =============================================================== */
function renderRetireSettings() {
  const rs = portfolio.retirementSettings || defaultRetirementSettings();
  const nowYear = new Date().getFullYear();
  const inferred = retireInferContributions();
  const start = retireStartBuckets();
  const lim = REFERENCE_DATA.contribLimits;
  const hasSpouse = !!rs.birthYears[1];
  const persons = hasSpouse ? 2 : 1;
  // Per-bucket ceilings used for the over-contribution check (per-person limits × earners).
  const maxes = { pretax: (lim.k401_elective + lim.ira) * persons, roth: (lim.k401_elective + lim.ira) * persons, taxfree: lim.hsa_family };
  const bkt = (label, key) => `<div><span class="kicker" style="font-size:10px;">${label}</span><div class="tnum" style="font-size:16px;font-family:var(--font-heading);">${fmtMoney(start[key])}</div></div>`;
  const num = (label, act, val, ph, hint) => `<div class="field"><label>${label}</label><input class="input tnum" inputmode="decimal" data-act="${act}" value="${val === '' || val == null ? '' : val}" placeholder="${ph || ''}">${hint ? `<span class="text-muted" style="font-size:11px;">${hint}</span>` : ''}</div>`;
  const radio = (name, act, mode, on, label) => `<label style="display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;"><input type="radio" name="${name}" data-act="${act}" data-mode="${mode}" ${on ? 'checked' : ''} style="margin:0;">${esc(label)}</label>`;
  const ssEstimate = rs.ssPIA === 'estimate' || !rs.ssPIA;
  const contrib = Object.assign({ pretax: 0, taxable: 0, roth: 0, taxfree: 0 }, inferred || {}, rs.contribOverride || {});
  const allocMode = rs.retirementAllocation && rs.retirementAllocation !== 'current' ? 'target' : 'current';
  const convOpt = v => `<option value="${v}" ${rs.conversionFillBracket === v ? 'selected' : ''}>${v === 'off' ? 'Off' : 'Fill ' + v + ' bracket'}</option>`;
  // Contribution field with an over-limit warning when the entered amount exceeds the bucket ceiling.
  const contribField = (label, act, key) => {
    const val = contrib[key], over = maxes[key] != null && Number(val) > maxes[key] + 0.5;
    return `<div class="field"><label>${label}</label><input class="input tnum${over ? ' input-warn' : ''}" inputmode="decimal" data-act="${act}" value="${fmtEditNum(val)}" placeholder="0" style="${over ? 'border-color:var(--color-accent-900);' : ''}">${over ? `<span style="font-size:11px;color:var(--color-accent-900);">Over the ${fmtMoney(maxes[key])} limit${persons === 2 ? ' (you + spouse)' : ''} — double-check.</span>` : ''}</div>`;
  };
  const contribScope = hasSpouse ? 'you + your spouse combined' : 'you';

  // Pensions & other guaranteed income (§ follow-on) — each stream reduces withdrawals and is taxed as ordinary income.
  const pensions = rs.pensions || [];
  const pensionRows = pensions.map((p, i) => `
    <div style="display:grid;grid-template-columns:1.5fr 1.1fr 0.8fr 0.9fr auto;gap:12px;align-items:end;padding:14px 0;border-top:1px solid var(--color-line-2);">
      <div class="field" style="margin:0;"><label>Name</label><input class="input" data-act="rd-pension" data-idx="${i}" data-key="label" value="${esc(p.label || '')}" placeholder="e.g. Teacher's pension"></div>
      <div class="field" style="margin:0;"><label>Amount ($/yr)</label><input class="input tnum" inputmode="decimal" data-act="rd-pension" data-idx="${i}" data-key="amountReal" value="${p.amountReal ? fmtEditNum(p.amountReal) : ''}" placeholder="24,000"></div>
      <div class="field" style="margin:0;"><label>Starts at age</label><input class="input tnum" inputmode="numeric" data-act="rd-pension" data-idx="${i}" data-key="startAge" value="${p.startAge != null ? p.startAge : ''}" placeholder="65"></div>
      <div class="field" style="margin:0;"><label>${abbr('To survivor', 'Share of the pension that keeps being paid after the first spouse dies — 100% for a full joint-and-survivor pension, 50% for a half-survivor, 0% if it stops')} (%)</label><input class="input tnum" inputmode="numeric" data-act="rd-pension" data-idx="${i}" data-key="survivorPct" value="${p.survivorPct != null ? p.survivorPct : 100}" placeholder="100"></div>
      <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding-bottom:2px;">
        <label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;white-space:nowrap;"><input type="checkbox" data-act="rd-pension" data-idx="${i}" data-key="cola" ${p.cola !== false ? 'checked' : ''} style="margin:0;">${abbr('COLA', 'Cost-of-living adjustment — the pension rises with inflation each year, keeping its buying power')}</label>
        <button class="btn btn-sm btn-ghost" data-act="rd-pension-del" data-idx="${i}" style="color:var(--color-crit);padding:2px 6px;">Remove</button>
      </div>
    </div>`).join('');
  const pensionPanel = `<div class="panel"><div class="panel-hd"><h4>Pensions &amp; other guaranteed income</h4><span class="text-muted" style="font-size:12px;margin-left:auto;">annual amount, today's dollars</span></div>
    <div style="padding:20px;">
      <p class="text-muted" style="font-size:12px;line-height:1.6;margin:0 0 4px;">Add any pension, annuity, or other lifetime income you'll receive on top of Social Security. Each one lowers how much you draw from your accounts and is taxed as ordinary income. Tick <b>COLA</b> if it rises with inflation (keeps its buying power); leave it off for a fixed pension whose real value erodes over the years. <b>To survivor</b> is the share that keeps paying if the first spouse dies.</p>
      ${pensions.length ? pensionRows : '<p class="text-muted" style="font-size:13px;margin:10px 0 2px;">No pensions added yet.</p>'}
      <div style="margin-top:14px;"><button class="btn btn-sm btn-primary" data-act="rd-pension-add">+ Add a pension</button></div>
    </div></div>`;

  return `<div class="toolbar no-print"><div class="crumb"><span>Retirement</span></div>
    <a data-act="nav" data-view="retire" style="margin-left:auto;cursor:pointer;color:var(--color-accent);">View projection →</a></div>
  <div style="display:flex;flex-direction:column;gap:22px;margin-top:8px;">

  <div class="panel"><div class="panel-hd"><h4>You &amp; your household</h4></div>
    <div style="padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;">
      ${num('Your birth year', 'rd-birth-you', rs.birthYears[0], String(nowYear - 40))}
      ${num('Spouse birth year (optional)', 'rd-birth-spouse', rs.birthYears[1] || '', 'none')}
      ${num('Target retirement age', 'rd-retire-age', rs.retirementAge, '65')}

/* ===============================================================
   REVIEW › COLLEGE PLANNING — Monte Carlo 529 projector per child.
   Only reachable when the household has children.
   =============================================================== */
function renderCollege() {
  const future = dollarModeIsFuture();
  const inflPct = (portfolio.retirementSettings && portfolio.retirementSettings.inflationPct != null) ? portfolio.retirementSettings.inflationPct : 2.5;
  const infl = inflPct / 100;
  const header = `<div class="toolbar no-print"><div class="crumb"><span>College planning</span></div>
    <span class="tag ${future ? 'tag-warn' : 'tag-accent'}" style="margin-left:auto;">${future ? 'Future dollars' : "Today's dollars"}</span></div>`;
  if (!portfolio.children.length)
    return header + `<div class="panel"><div style="padding:30px 24px;text-align:center;"><p class="text-muted" style="max-width:460px;margin:0 auto;font-size:14px;line-height:1.6;">Add a child in <a data-act="nav" data-view="household" style="cursor:pointer;color:var(--color-accent);">Settings › Household</a> to plan for college.</p></div></div>`;
  if (!latestSnapshot())
    return header + `<div class="panel"><div style="padding:30px 24px;text-align:center;"><p class="text-muted" style="max-width:460px;margin:0 auto;font-size:14px;line-height:1.6;">Record a check-in first so the projection has a starting 529 balance to grow.</p></div></div>`;

  const cs = portfolio.collegeSettings || defaultCollegeSettings();
  const lead = `<div class="panel" style="background:var(--color-accent-100);border-color:var(--color-accent);"><div style="padding:18px 20px;">
    <div style="font-family:var(--font-heading);font-size:16px;margin-bottom:4px;">Will each 529 cover college?</div>
    <p style="font-size:13px;line-height:1.6;margin:0;" class="text-muted">For every child we grow their 529 to college age using its glide path, then draw the yearly cost — run a thousand times — to show whether the money lasts all the way through. Set the age-based glide in <a data-act="nav" data-view="goal" style="cursor:pointer;color:var(--color-accent);">Review › Goals</a>. Toggle below to read the numbers in today's or future dollars.</p>
  </div></div>`;

  const blocks = portfolio.children.map(child => {
    const cid = child.id, oc = (cs.byChild && cs.byChild[cid]) || {};
    const accts = child529Accounts(cid);
    const startBal = collegeStartBalance(cid);
    const age = childAge(child.birthYear);
    const model = collegeModel(cid);
    const { cfg, base } = model;
    // Display unit: inflate each year-tied figure to that year when "Future dollars" is on.
    const cAge = cfg.currentAge;
    const nomAt = (real, atAge) => real * Math.pow(1 + infl, Math.max(0, atAge - cAge));
    const M = (real, atAge) => future ? nomAt(real, atAge) : real;
    const dispBands = future ? base.bands.map(b => ({ age: b.age, p10: nomAt(b.p10, b.age), p25: nomAt(b.p25, b.age), p50: nomAt(b.p50, b.age), p75: nomAt(b.p75, b.age), p90: nomAt(b.p90, b.age) })) : base.bands;
    const unit = future ? 'future dollars' : "today's dollars";
    const totalCost = future ? Array.from({ length: base.remainingYears }, (_, i) => nomAt(cfg.annualCost, Math.max(cfg.startAge, cAge) + i)).reduce((s, v) => s + v, 0) : cfg.annualCost * base.remainingYears;
    const startBand = dispBands.find(b => b.age === cfg.startAge);
    const successPct = fmtPct(base.fullSuccess * 100, 0);
    const yrsFunded = base.avgYearsFunded.toFixed(1);
    const costMin = 10000, costMax = 90000;
    const noAcct = accts.length === 0;
    const fanId = 'collegefan-' + cid;
    // Glide-path transition note — the aggressive→conservative shift is pulled from Review › Goals.
    const gp = portfolio.glidePaths.find(g => g.childId === cid);
    let glideNote;
    if (gp && gp.bands && gp.bands.length) {
      const band = gp.bands.find(b => age >= b.ageFrom && age <= b.ageTo) || gp.bands[gp.bands.length - 1];
      const alloc = band && band.targets ? TAXONOMY.groups.filter(g2 => band.targets[g2.id]).map(g2 => `${g2.label.split(' ')[0]} ${band.targets[g2.id]}%`).join(' · ') : '';
      glideNote = `<p class="text-muted" style="font-size:12px;line-height:1.6;margin:0 0 14px;"><b>Risk glides down automatically.</b> This uses ${esc(child.label)}'s age-based 529 glide path from <a data-act="nav" data-view="goal" style="cursor:pointer;color:var(--color-accent);">Goals</a>, which shifts from stock-heavy toward bonds &amp; cash as college nears. At age ${age} it's currently ${alloc || 'set there'}.</p>`;
    } else {
      glideNote = `<p class="text-muted" style="font-size:12px;line-height:1.6;margin:0 0 14px;"><b>No age-based glide set.</b> Using a steady 60/40 mix throughout. For a realistic projection, set an aggressive-early → conservative-near-college glide in <a data-act="nav" data-view="goal" style="cursor:pointer;color:var(--color-accent);">Review › Goals</a>.</p>`;
    }
    return `<section>
      <div class="kicker" style="margin-bottom:6px;">${esc(child.label)} · age ${age} · college in ${Math.max(0, cfg.startAge - age)} year${cfg.startAge - age === 1 ? '' : 's'}</div>
      <div class="panel"><div class="panel-hd"><h4>${esc(child.label)}'s 529</h4>
        <span class="text-muted" style="font-size:12px;margin-left:auto;">${noAcct ? 'no 529 account linked yet' : `${fmtMoney(startBal)} saved today`}</span></div>
      <div style="padding:20px;">
        ${noAcct ? `<p class="text-muted" style="font-size:13px;margin:0 0 14px;">No 529 account is linked to ${esc(child.label)}. Link one in <a data-act="nav" data-view="accounts" style="cursor:pointer;color:var(--color-accent);">Settings › Accounts</a> (edit the account, set category 529 and pick the child). The projection below assumes a $0 starting balance until then.</p>` : ''}
        ${glideNote}
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:16px;">
          <div class="field"><label>Cost per year</label><input class="input tnum" inputmode="decimal" data-act="cl-cost" data-child="${esc(cid)}" value="${fmtEditNum(cfg.annualCost)}" placeholder="35,000"><span class="text-muted" style="font-size:11px;">all-in: tuition, room &amp; board · today's dollars</span></div>
          <div class="field"><label>Years of college</label><input class="input tnum" inputmode="numeric" data-act="cl-years" data-child="${esc(cid)}" value="${cfg.years}" placeholder="4"></div>
          <div class="field"><label>Starting age</label><input class="input tnum" inputmode="numeric" data-act="cl-startage" data-child="${esc(cid)}" value="${cfg.startAge}" placeholder="18"><span class="text-muted" style="font-size:11px;">first tuition year</span></div>
          <div class="field"><label>You add each year</label><input class="input tnum" inputmode="decimal" data-act="cl-contrib" data-child="${esc(cid)}" value="${fmtEditNum(cfg.annualContrib)}" placeholder="0"><span class="text-muted" style="font-size:11px;">today's dollars</span></div>
        </div>
        <div style="font-size:15px;line-height:1.5;margin-bottom:8px;">That's <b>${fmtMoney(totalCost)}</b> total over ${base.remainingYears} remaining years${future ? ` in future dollars` : ` in today's dollars`}. This 529 covers <b>all ${base.remainingYears} remaining years in <span style="color:var(--color-accent-700);">${successPct}</span></b> of outcomes${base.fullSuccess < 1 ? `, and on average funds <b>${yrsFunded}</b> of ${base.remainingYears} remaining years` : ''}.</div>
        <p class="text-muted" style="font-size:12px;line-height:1.6;margin:0 0 12px;">The 529 grows while you save, then is drawn down across the <b>${cfg.years} college years (ages ${cfg.startAge}–${cfg.startAge + cfg.years - 1})</b> — the shaded band on the chart. Each college-age balance is shown after that year’s tuition payment. If college has already started, this assumes the current year’s bill is still unpaid; earlier years are excluded from the funding result. ${startBand ? `After the first tuition payment at age ${cfg.startAge}, the median simulated balance is <b>${fmtCompactMoney(startBand.p50)}</b> (middle 80%: ${fmtCompactMoney(startBand.p10)}–${fmtCompactMoney(startBand.p90)}).` : ''} Hover the chart to read any age. All figures in ${unit}.</p>
        ${fanChartSVG(dispBands, { age: cfg.startAge, label: 'College at' }, fanId, { tickEvery: (base.bands[base.bands.length - 1].age - base.bands[0].age) <= 18 ? 2 : 5, shadeFrom: cfg.startAge, shadeTo: cfg.startAge + cfg.years - 1, shadeLabel: 'college years' })}
      </div></div>
    </section>`;
  }).join('');

  return `<div style="display:flex;flex-direction:column;gap:26px;margin-top:4px;">${outlookHeaderBlock('College planning', null)}${lead}${blocks}</div>`;
}

/* College field commit (per child). */
function applyCollegeSetting(a, ds, el) {
  const cs = portfolio.collegeSettings = portfolio.collegeSettings || defaultCollegeSettings();
  cs.byChild = cs.byChild || {};
  const oc = cs.byChild[ds.child] = cs.byChild[ds.child] || {};
  if (a === 'cl-cost') oc.annualCostReal = parseNum(el.value) || 0;
  else if (a === 'cl-years') oc.years = Math.max(1, Math.min(10, parseInt(el.value, 10) || 4));
  else if (a === 'cl-startage') oc.startAge = Math.max(15, Math.min(25, parseInt(el.value, 10) || 18));
  else if (a === 'cl-contrib') oc.annualContribReal = parseNum(el.value) || 0;
  markDirty();
}

let dialogReturnFocus = null;
function focusIdentity(el) {
  return el && el.matches('[data-act], [id]') ? { id: el.id, data: { ...el.dataset } } : null;
}
function restoreFocus(identity) {
  if (!identity) return;
  const candidates = identity.id ? [document.getElementById(identity.id)] : Array.from(document.querySelectorAll('[data-act]'));
  const el = candidates.find(el => el && Object.entries(identity.data).every(([key, value]) => el.dataset[key] === value));
  if (el) el.focus({ preventScroll: true });
}
function openDialog(d) { dialogReturnFocus = focusIdentity(document.activeElement); ui.dialog = d; render(); }
function closeDialog() { ui.dialog = null; render(); restoreFocus(dialogReturnFocus); dialogReturnFocus = null; }

  } else if (d.type === 'about') {

  }
  return `<div class="dialog-backdrop no-print" data-act="backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1" data-stop="1">${inner}</div></div>`;

/* ===============================================================
   TOAST + afterRender (dialog/toast mounting)
   =============================================================== */
let _toastTimer = null;
function toast(msg) {
  ui._toast = msg;
  const app = document.getElementById('app');
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite'); el.setAttribute('aria-atomic', 'true'); document.body.appendChild(el); }
  el.textContent = msg; el.style.display = 'block';
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2600);
}

function afterRender() {
  const app = document.getElementById('app');
  const existing = document.getElementById('dialog-mount');
  if (existing) existing.remove();
  if (ui.dialog) {
    const mount = document.createElement('div');
    mount.id = 'dialog-mount';
    mount.innerHTML = dialogHTML();
    app.appendChild(mount);
    const title = mount.querySelector('.dialog-title');
    if (title) title.id = 'dialog-title';
    const shell = app.querySelector('.shell');
    if (shell) shell.inert = true;
    const first = mount.querySelector('input,select,textarea,button') || mount.querySelector('.dialog');
    if (first) first.focus();
  }
  enhanceAccessibility(app);
}

// Shared markup is generated by several views. Associate every field label after
// rendering so new fields receive the same accessible name automatically.
function enhanceAccessibility(root) {
  root.querySelectorAll('.field').forEach((field, index) => {
    const label = field.querySelector('label');
    const control = field.querySelector('input,select,textarea');
    if (!label || !control || label.contains(control)) return;
    if (!control.id) control.id = 'field-' + index;
    label.htmlFor = control.id;
  });
  root.querySelectorAll('a[data-act]:not([href]),span[data-act],div[data-act]').forEach(el => {
    if (el.dataset.act === 'backdrop' || el.querySelector('button,input,select,textarea')) return;
    el.setAttribute('role', 'button'); el.tabIndex = 0;
  });
  root.querySelectorAll('[data-act="nav"]').forEach(el => {
    if (el.dataset.view === ui.view || el.classList.contains('active')) el.setAttribute('aria-current', 'page');
  });
  root.querySelectorAll('[data-act="toggle-drawer"]').forEach(el => el.setAttribute('aria-expanded', String(!!ui.drawer)));
  root.querySelectorAll('table.table').forEach(table => {
    if (table.parentElement.classList.contains('table-scroll')) return;
    const wrap = document.createElement('div');
    wrap.className = 'table-scroll'; wrap.tabIndex = 0;
    wrap.setAttribute('role', 'region'); wrap.setAttribute('aria-label', 'Data table; scroll horizontally for more columns');
    table.replaceWith(wrap); wrap.appendChild(table);
  });
}

/* ===============================================================
   EVENT DISPATCH (delegated)
   =============================================================== */
function boot() {
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  // Money inputs: strip grouping while editing, reformat to 1,234.00 on blur.
  document.addEventListener('focusin', e => {
    const t = e.target.closest && e.target.closest('input[data-act="ci-val"],input[data-act="ci-basis"],input[data-act="ci-nw"]');
    if (t) { const n = parseNum(t.value); t.value = n == null ? '' : String(n); }
  });
  document.addEventListener('focusout', e => {
    const t = e.target.closest && e.target.closest('input[data-act="ci-val"],input[data-act="ci-basis"],input[data-act="ci-nw"]');
    if (!t) return;
    const n = parseNum(t.value);
    t.value = n == null ? '' : fmtNum2(n);
    const act = t.dataset.act, hid = t.dataset.hid;
    if (act === 'ci-nw') ui.checkinNetWorth = t.value;
    else if (ui.checkin) { ui.checkin.values[hid] = ui.checkin.values[hid] || {}; ui.checkin.values[hid][act === 'ci-val' ? 'marketValue' : 'costBasis'] = t.value; }
    updateCheckinTotals();
    if (hid) updateBasisFlag(hid);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && ui.dialog) { e.preventDefault(); closeDialog(); return; }
    if (ui.dialog && e.key === 'Tab') {
      const modal = document.querySelector('[role="dialog"]');
      const stops = modal ? Array.from(modal.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"],a[href]')).filter(el => el.getClientRects().length) : [];
      const first = stops[0], last = stops[stops.length - 1];
      if (!first) { e.preventDefault(); if (modal) modal.focus(); }
      else if (e.shiftKey && (document.activeElement === first || document.activeElement === modal)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"]')) {
      e.preventDefault(); e.target.click(); return;
    }
    // Cmd/Ctrl+S → save the file (fast save before leaving).
    if ((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      saveFile().then(r => { if (r && r.ok) { toast('Saved · ' + fileName); render(); } });
    }
  });
  document.addEventListener('pointermove', onDonutHover);
  document.addEventListener('pointermove', onChartHover);
  document.addEventListener('pointermove', onFanHover);
  render();
  // Auto-restore the last file where the browser permits (Chrome/Edge handle,
  // when its permission persists). Falls back to the one-click reopen.
  tryAutoload().then(r => {
    if (r.loaded) { resetViewState(); render(); toast('Loaded · ' + fileName); }
    else if (r.needsClick) { ui.pendingReopen = r.name; render(); }
  }).catch(() => {});
}

/* Keep slice values in the ring's center so the chart stays in one place. */
function onDonutHover(e) {
  const slice = e.target.closest ? e.target.closest('[data-slice]') : null;
  const active = slice ? slice.closest('.donut-wrap') : null;
  document.querySelectorAll('.donut-wrap').forEach(wrap => {
    const detail = wrap.querySelector('.donut-center-hover');
    const idle = wrap.querySelector('.donut-center-default');
    if (!detail || !idle) return;
    const selected = wrap === active;
    detail.style.display = selected ? '' : 'none';
    idle.style.display = selected ? 'none' : '';
    if (!selected) return;
    detail.querySelector('.donut-center-ring').textContent = slice.dataset.ring.toUpperCase();
    detail.querySelector('.donut-center-pct').textContent = slice.dataset.pct + '%';
    const label = detail.querySelector('.donut-center-label');
    label.textContent = slice.dataset.label;
    if (label.getComputedTextLength() > 74) {
      label.setAttribute('textLength', '74');
      label.setAttribute('lengthAdjust', 'spacingAndGlyphs');
    } else {
      label.removeAttribute('textLength');
      label.removeAttribute('lengthAdjust');
    }
  });
}

function onClick(e) {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act, ds = t.dataset;
  switch (a) {
    case 'nav': {
      // Settings drawer: opens when you enter a settings pane, closes when you leave for a non-settings view.
      const wasSettings = SETTINGS_VIEWS.includes(ui.view);
      const nowSettings = SETTINGS_VIEWS.includes(ds.view);
      ui.view = ds.view;
      if (nowSettings && !wasSettings) ui.drawer = true;
      else if (!nowSettings) ui.drawer = false;
      // Plan auto-generates on first open (from tax + drift + savings, §13.4–13.8).
      if (ds.view === 'plan') { const s = currentSnapshot(); if (s && !planForSnapshot(s.date)) generatePlanProposals(s); }
      render(); window.scrollTo(0, 0); break;
    }
    case 'about': openDialog({ type: 'about' }); break;
    case 'landing-open': {
      // "Open the app": straight to the dashboard if data exists, else offer the
      // load-data / start-fresh / demo choice + how-it-works in an onboarding popup.
      if (portfolio.accounts.some(a => a.status !== 'archived')) { ui.view = 'dashboard'; render(); window.scrollTo(0, 0); }
      else openDialog({ type: 'onboard' });
      break;
    }
    case 'onboard-scratch': ui.dialog = null; ui.view = 'accounts'; ui.drawer = true; render(); window.scrollTo(0, 0); break;
    case 'lp-scroll': { const el = document.getElementById(ds.target); if (el) el.scrollIntoView({ behavior: 'smooth' }); break; }
    case 'toggle-drawer': ui.drawer = !ui.drawer; render(); break;
    case 'toggle-theme': toggleTheme(); break;
    case 'save': saveFile().then(r => { if (r && r.ok) toast('Saved · ' + fileName); render(); }); break;
    case 'open': doOpen(); break;
    case 'new-checkin': startCheckin(); break;
    case 'load-demo': loadDemoData(); resetViewState(); ui.dialog = null; ui.view = ['retire', 'college'].includes(ds.view) ? ds.view : 'dashboard'; ui.drawer = false; render(); window.scrollTo(0, 0); toast('Demo data loaded'); break;
    case 'onboard-start': openDialog({ type: 'account' }); break;
    case 'open-import': {
      const first = portfolio.accounts.find(a => a.status !== 'archived');
      ui.import = { accountId: first ? first.id : '', text: '', parsed: null, addSet: {} };
      openDialog({ type: 'import' }); break;
    }
    case 'import-parse': { ui.import = ui.import || {}; ui.import.parsed = parseImportRows(ui.import.text || ''); render(); break; }
    case 'import-apply': {
      const imp = ui.import; if (!imp || !imp.parsed) break;
      ensureCheckinDraft(); const ci = ui.checkin;
      const mc = importMatches(); let filled = 0, added = 0;
      ci.basisSet = ci.basisSet || {};
      for (const r of mc.matched) {
        const cv = ci.values[r.holdingId] = ci.values[r.holdingId] || {};
        cv.marketValue = fmtEditNum(r.value);
        if (r.costBasis != null) { cv.costBasis = fmtEditNum(r.costBasis); ci.basisSet[r.holdingId] = true; }
        filled++;
      }
      for (const r of mc.created) {
        if (imp.addSet && imp.addSet[r.ticker] === false) continue;
        const cls = classifyTicker(r.ticker, portfolio.tickerMap) || 'other';
        const h = { id: uid('h'), accountId: imp.accountId, ticker: r.ticker, name: r.name || undefined, assetClass: cls, status: 'active' };
        portfolio.holdings.push(h);
        ci.values[h.id] = { marketValue: fmtEditNum(r.value) };
        if (r.costBasis != null) { ci.values[h.id].costBasis = fmtEditNum(r.costBasis); ci.basisSet[h.id] = true; }
        added++;
      }
      ui.import = null; markDirty(); closeDialog(); render();
      toast(`Imported ${filled} value${filled === 1 ? '' : 's'}${added ? ` · added ${added} holding${added === 1 ? '' : 's'}` : ''}`);
      break;
    }
    case 'reopen-file': reopenPending(); break;
    case 'pos-sort': { const k = ds.key, s = ui.positionsSort || (ui.positionsSort = { key: 'category', dir: 1 }); if (s.key === k) s.dir = -s.dir; else { s.key = k; s.dir = (k === 'value' || k === 'pct' || k === 'gain') ? -1 : 1; } render(); break; }
    case 'pos-class': ui.posClass = (ui.posClass === ds.class) ? '' : ds.class; render(); break;
    case 'pos-class-clear': ui.posClass = ''; render(); break;
    case 'pos-expand': { ui.posExpanded = ui.posExpanded || {}; ui.posExpanded[ds.ticker] = !ui.posExpanded[ds.ticker]; render(); break; }
    case 'drill':
      ui.drill = { level: ds.level, category: ds.category || null, categoryLabel: ds.categorylabel || null, accountId: ds.account || null };
      if (ds.level === 'account') { const ac = accountById(ds.account); ui.drill.category = ac ? ac.category : null; ui.drill.categoryLabel = ac ? (ac.categoryLabel || null) : null; }
      ui.view = 'dashboard'; render(); break;
    case 'ci-toggle': ui.checkinOpen[ds.account] = !ui.checkinOpen[ds.account]; render(); break;
    case 'ci-review': { ui.checkin.reviewed = ui.checkin.reviewed || {}; ui.checkin.reviewed[ds.account] = !ui.checkin.reviewed[ds.account]; render(); break; }
    case 'ci-discard': ui.checkin = null; ui.view = 'dashboard'; render(); break;
    case 'ci-save': saveCheckin(); break;
    case 'add-account': openDialog({ type: 'account' }); break;
    case 'edit-account': openDialog({ type: 'account', acctId: ds.account }); break;
    case 'add-child': openDialog({ type: 'child' }); break;
    case 'add-holding': openDialog({ type: 'holding', acctId: ds.account }); break;
    case 'edit-class': openDialog({ type: 'class-pick', hid: ds.hid }); break;
    case 'archive-holding': archiveHolding(ds.hid); break;
    case 'archive-account': confirmArchiveAccount(ds.account); break;
    case 'move-acct': moveAccount(ds.account, Number(ds.dir)); break;
    case 'del-child': deleteChild(ds.child); break;
    case 'pick-class': setHoldingClass(ds.hid, ds.cls); break;
    case 'comp-preset': applyCompPreset(ds.preset); break;
    case 'save-composition': saveComposition(ds.hid); break;
    case 'save-account': saveAccountFromDialog(ds.acct || null); break;
    case 'save-child': saveChildFromDialog(); break;
    case 'save-holding': saveHoldingFromDialog(ds.account); break;
    case 'add-band': openDialog({ type: 'band', child: ds.child }); break;
    case 'edit-band': openDialog({ type: 'band', child: ds.child, idx: Number(ds.idx) }); break;
    case 'del-band': deleteBand(ds.child, Number(ds.idx)); break;
    case 'save-band': saveBandFromDialog(ds.child, ds.idx === '' ? null : Number(ds.idx)); break;
    case 'goal-save': saveGoalDraft(); break;

    case 'export-csv': { const s = currentSnapshot(); if (s) triggerDownload(snapshotCSV(s), `snapshot-${s.date}.csv`, 'text/csv'); else toast('No snapshot to export.'); break; }

        planAddMove(snap.date, { accountId: rec.bAccountId, sellTicker: rec.bTicker, buyTicker: rec.aTicker, amount: Math.round(rec.amount), source: 'tax-swap', taxNote: 'Location swap · tax-free side' });

      break;
    }
    case 'plan-generate': { const s = currentSnapshot(); if (s) { generatePlanProposals(s); render(); } break; }
    case 'plan-noaction': { const s = currentSnapshot(); if (s) { const p = ensurePlan(s.date); p.noAction = true; p.moves = []; markDirty(); render(); } break; }
    case 'plan-addmove': { const s = currentSnapshot(); if (s) { planAddMove(s.date, {}); render(); } break; }
    case 'plan-del': { const s = currentSnapshot(); const p = s && planForSnapshot(s.date); if (p) { p.moves.splice(Number(ds.idx), 1); markDirty(); render(); } break; }
    case 'plan-adddir': { const s = currentSnapshot(); if (s) { const dir = savingsDirective(s); const p = ensurePlan(s.date); p.directive = dir ? { text: dir.text, splits: dir.splits } : null; markDirty(); render(); } break; }
    case 'tax-sort': {
      const k = ds.key, s = ui.taxSort || (ui.taxSort = { key: 'drag', dir: -1 });
      if (s.key === k) s.dir = -s.dir;
      else { s.key = k; s.dir = ['ticker', 'account', 'class', 'eff'].includes(k) ? 1 : -1; }
      render(); break;
    }
    case 'ov-toggle': ui.taxAdvanced = true; render(); break;
    case 'ov-clear': portfolio.taxSettings.override = null; ui.taxAdvanced = false; markDirty(); render(); break;
    // Retirement modeler
    case 'dollar-mode': ui.dollarMode = ds.mode === 'future' ? 'future' : 'today'; render(); break; // display-only; no re-sim
    case 'rd-confirm-mapping': portfolio.retirementSettings.mappingConfirmed = true; invalidateRetireCache(); markDirty(); render(); break;
    case 'rd-unconfirm': portfolio.retirementSettings.mappingConfirmed = false; markDirty(); render(); break;
    case 'rd-reset-musigma': portfolio.retirementSettings.muSigma = null; invalidateRetireCache(); markDirty(); render(); break;
    case 'rd-contrib-reset': portfolio.retirementSettings.contribOverride = null; invalidateRetireCache(); markDirty(); render(); break;
    case 'rd-pension-add': {
      const rs = portfolio.retirementSettings; rs.pensions = rs.pensions || [];
      rs.pensions.push({ label: '', amountReal: 0, startAge: rs.retirementAge || 65, cola: true, survivorPct: 100 });
      invalidateRetireCache(); markDirty(); render(); break;
    }
    case 'rd-pension-del': {
      const rs = portfolio.retirementSettings; if (rs.pensions) rs.pensions.splice(Number(ds.idx), 1);
      invalidateRetireCache(); markDirty(); render(); break;
    }
    case 'rd-maxout': {
      const rs = portfolio.retirementSettings, lim = REFERENCE_DATA.contribLimits, persons = rs.birthYears[1] ? 2 : 1;
      // Max the tax-advantaged accounts: 401(k) pre-tax, Roth IRA, family HSA.
      rs.contribOverride = Object.assign({}, rs.contribOverride || {}, { pretax: lim.k401_elective * persons, roth: lim.ira * persons, taxfree: lim.hsa_family });
      invalidateRetireCache(); markDirty(); render(); toast('Contributions set to this year’s IRS maximums'); break;
    }
    case 'confirm-yes': handleConfirm(); break;
    case 'close-dialog': closeDialog(); break;
    case 'backdrop': if (!e.target.closest('[data-stop]')) closeDialog(); break;
  }
}

function onChange(e) {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act, ds = t.dataset;
  if (a === 'level') { ui.level = ds.level; render(); }
