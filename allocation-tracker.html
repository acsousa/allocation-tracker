}

/* ===============================================================
   CHECK-IN (F1) — clone latest, overtype, ≤10 min
   =============================================================== */
/* Build the check-in draft in place — NO render() (so it's safe to call
   from inside render() via renderCheckin without re-entrancy). */
function ensureCheckinDraft() {
  if (ui.checkin) return;
  const base = latestSnapshot();
  const values = {};
  const activeIds = new Set(activeHoldings().map(h => h.id));
  if (base) {
    for (const v of base.values) {
      if (activeIds.has(v.holdingId)) values[v.holdingId] = { marketValue: v.marketValue, costBasis: v.costBasis };
    }
  }
  for (const h of activeHoldings()) if (!values[h.id]) values[h.id] = { marketValue: '', costBasis: '' };
  const open = {};
  const firstAcct = accountsSorted()[0];
  if (firstAcct) open[firstAcct.id] = true;
  ui.checkin = { date: todayISO(), baseDate: base ? base.date : null, note: '', values, basisSet: {} };
  ui.checkinOpen = open;
  ui.checkinNetWorth = '';
}
function startCheckin() { ui.checkin = null; ensureCheckinDraft(); ui.view = 'checkin'; ui.drawer = false; render(); window.scrollTo(0, 0); }

function checkinTotal() {
  let t = 0;
  for (const h of activeHoldings()) {
    const v = ui.checkin.values[h.id];
    const mv = v ? parseNum(v.marketValue) : null;
    if (mv) t += mv;
  }
  return t;
}
function checkinSanityHTML(total) {
  const nw = parseNum(ui.checkinNetWorth);
  if (nw == null || nw <= 0) return '<span class="text-muted" style="font-size:12px;">Enter your net-worth number to sanity-check.</span>';
  const d = total - nw, pct = (d / nw) * 100, within = Math.abs(pct) <= 2;
  return `<span class="tag ${within ? 'tag-ok' : 'tag-warn'}">Off by ${fmtMoney2(Math.abs(d))} · ${Math.abs(pct).toFixed(2)}% — ${within ? 'within tolerance' : 'check entries'}</span>`;
}
/* Live-update the sanity footer without a full re-render (keeps input focus). */
function updateCheckinTotals() {
  if (!ui.checkin) return;
  const total = checkinTotal();
  const tEl = document.getElementById('ci-total'); if (tEl) tEl.textContent = fmtMoney2(total);
  const sEl = document.getElementById('ci-sanity'); if (sEl) sEl.innerHTML = checkinSanityHTML(total);
}

/* Strict cost-basis rule (later check-ins): if a holding's value changed but its
   cost basis was left unchanged (and non-blank), the basis is stale — buys/sells
   move basis. The user must update it or clear it to blank before saving. Holdings
   with no tracked basis are unaffected. */
function holdingBasisIssue(h, baseVals) {
  const ci = ui.checkin;
  if (!ci || !ci.baseDate) return false;
  if (ci.basisSet && ci.basisSet[h.id]) return false;      // basis imported or edited this check-in → authoritative
  const base = (baseVals || valueIndex(snapshotByDate(ci.baseDate)))[h.id];
  if (!base) return false;                                 // new holding this check-in
  const v = ci.values[h.id] || {};
  const curVal = parseNum(v.marketValue);
  if (curVal == null || curVal === Number(base.marketValue)) return false; // value unchanged/blank
  const curBasis = parseNum(v.costBasis);
  if (curBasis == null) return false;                      // basis blank → allowed
  const baseBasis = base.costBasis != null ? Number(base.costBasis) : null;
  if (baseBasis == null) return false;                     // basis newly added → allowed
  return curBasis === baseBasis;                           // value changed, basis untouched
}
function checkinBaseVals() { return ui.checkin && ui.checkin.baseDate ? valueIndex(snapshotByDate(ui.checkin.baseDate)) : {}; }
function checkinBasisIssues() { const bv = checkinBaseVals(); return activeHoldings().filter(h => holdingBasisIssue(h, bv)); }

/* Live flag update for one holding + its account badge + the header count. */
function updateBasisFlag(hid) {
  if (!ui.checkin) return;
  const h = portfolio.holdings.find(x => x.id === hid);
  if (!h) return;
  const bv = checkinBaseVals();
  const issue = holdingBasisIssue(h, bv);
  const inp = document.getElementById('ci-basis-' + hid);
  if (inp) inp.classList.toggle('basis-flag', issue);
  const hint = document.getElementById('ci-basishint-' + hid);
  if (hint) hint.textContent = issue ? 'update or clear' : '';
  const badge = document.getElementById('ci-acctbadge-' + h.accountId);
  if (badge) { const n = activeHoldings(h.accountId).filter(x => holdingBasisIssue(x, bv)).length; badge.innerHTML = n ? `<span class="tag tag-warn">${n} basis</span>` : ''; }
  const total = activeHoldings().filter(x => holdingBasisIssue(x, bv)).length;
  const hdr = document.getElementById('ci-issue-badge');
  if (hdr) hdr.innerHTML = total ? `<span class="tag tag-warn">${total} need cost basis</span>` : '';
}

/* One account's collapsible block in the check-in. */
// An account is "updated" in this check-in if any holding value differs from
// the prefilled baseline (or is a newly added/imported holding with a value).
function checkinAccountUpdated(acct, ci, baseVals) {
  for (const h of activeHoldings(acct.id)) {
    const cur = parseNum((ci.values[h.id] || {}).marketValue);
    const base = baseVals[h.id] != null ? Number(baseVals[h.id].marketValue) : null;
    if (cur != null && (base == null || Math.abs(cur - base) > 0.005)) return true;
  }
  return false;
}

function checkinAccountBlock(acct, ci, baseVals) {
  const open = !!ui.checkinOpen[acct.id];
  const holds = activeHoldings(acct.id);
  const updated = checkinAccountUpdated(acct, ci, baseVals);
  const reviewed = ui.checkin && ui.checkin.reviewed && ui.checkin.reviewed[acct.id];
  const acctIssues = holds.filter(h => holdingBasisIssue(h, baseVals)).length;
  let acctTotal = 0, baseTotal = 0;
  for (const h of holds) {
    const mv = parseNum((ci.values[h.id] || {}).marketValue) || 0; acctTotal += mv;
    const bv = baseVals[h.id] ? Number(baseVals[h.id].marketValue) : 0; baseTotal += bv;
  }
  const delta = acctTotal - baseTotal;
  const head = `<div style="display:flex;align-items:center;gap:12px;padding:12px 20px;${open ? 'background:color-mix(in srgb, var(--color-text) 4%, transparent);' : ''}cursor:pointer;" data-act="ci-toggle" data-account="${esc(acct.id)}">
      <span class="text-muted" style="font-size:14px;width:12px;">${open ? '–' : '+'}</span>
      <span style="font-family:var(--font-heading);font-size:18px;">${esc(acct.name)}</span>
      ${acct.institution ? `<span class="text-muted" style="font-size:13px;">${esc(acct.institution)}</span>` : ''}
      ${acct.taxTreatment ? `<span class="tag tag-outline">${esc(acct.taxTreatment)}</span>` : ''}
      <button class="btn btn-ghost btn-sm" title="Edit account" data-act="edit-account" data-account="${esc(acct.id)}">edit</button>
      ${updated
        ? '<span class="tag tag-ok" style="font-size:9px;opacity:0.9;" title="A value changed from last check-in">✓ updated</span>'
        : (reviewed
          ? `<button class="btn btn-ghost btn-sm" data-act="ci-review" data-account="${esc(acct.id)}" title="Marked reviewed — click to undo" style="padding:0 4px;"><span class="tag tag-neutral" style="font-size:9px;">✓ reviewed</span></button>`
          : `<button class="btn btn-ghost btn-sm" data-act="ci-review" data-account="${esc(acct.id)}" title="No change this quarter? Mark it reviewed" style="font-size:10px;padding:1px 6px;">mark reviewed</button>`)}
      <span id="ci-acctbadge-${esc(acct.id)}" style="margin-left:auto;">${acctIssues ? `<span class="tag tag-warn">${acctIssues} basis</span>` : ''}</span>
      <span class="text-muted tnum" style="font-size:12px;${acctIssues ? '' : 'margin-left:auto;'}">${fmtMoney2(acctTotal)} ${baseTotal ? `<span style="color:var(--color-accent-700);">${fmtMoneySigned2(delta)}</span>` : ''}</span>
    </div>`;
  if (!open) return `<div style="border-bottom:1px solid var(--color-divider);">${head}</div>`;

  const rows = holds.map(h => {
    const v = ci.values[h.id] || {};
    const prev = baseVals[h.id] ? fmtMoney2(baseVals[h.id].marketValue) : '—';
    const mv = parseNum(v.marketValue), cb = parseNum(v.costBasis);
    const gain = (mv != null && cb != null) ? mv - cb : null;
    const issue = holdingBasisIssue(h, baseVals);
    return `<tr>
        <td style="padding-left:20px;font-family:var(--font-heading);font-size:15px;">${esc(h.ticker)}</td>
        <td>
          <span class="tag ${compositionOf(h) ? 'tag-accent-2' : 'tag-accent'}" style="cursor:pointer;gap:6px;" data-act="edit-class" data-hid="${esc(h.id)}">${compositionOf(h) ? 'Split · ' : ''}${esc(detailLabel(h.assetClass))}<span class="text-muted" style="font-size:10px;">edit</span></span>
          ${h.name ? `<span class="text-muted" style="font-size:11px;margin-left:8px;">${esc(h.name)}</span>` : ''}
        </td>
        <td class="text-muted tnum" style="text-align:right;">${prev}</td>
        <td><input class="input tnum" style="min-height:32px;text-align:right;" inputmode="decimal" value="${esc(fmtEditNum(v.marketValue))}" data-act="ci-val" data-hid="${esc(h.id)}" placeholder="0.00"></td>
        <td><input id="ci-basis-${esc(h.id)}" class="input tnum ${issue ? 'basis-flag' : ''}" style="min-height:32px;text-align:right;" inputmode="decimal" value="${esc(fmtEditNum(v.costBasis))}" data-act="ci-basis" data-hid="${esc(h.id)}" placeholder="—"><div id="ci-basishint-${esc(h.id)}" style="font-size:10px;text-align:right;color:var(--color-warn);">${issue ? 'update or clear' : ''}</div></td>
        <td class="tnum" style="text-align:right;padding-right:8px;color:${gain != null && gain < 0 ? 'var(--color-crit)' : 'var(--color-accent-700)'};">${gain != null ? fmtMoneySigned2(gain) : '—'}</td>
        <td style="width:34px;text-align:right;padding-right:16px;"><button class="btn btn-ghost btn-sm" title="Archive holding" data-act="archive-holding" data-hid="${esc(h.id)}">✕</button></td>
      </tr>`;
  }).join('');

  return `<div style="border-bottom:1px solid var(--color-divider);">
      ${head}
      <table class="table">
        <thead><tr>
          <th style="width:96px;padding-left:20px;">Ticker</th>
          <th>Asset class <span class="text-muted" style="text-transform:none;letter-spacing:0;">auto</span></th>
          <th style="width:120px;text-align:right;">Last value</th>
          <th style="width:150px;text-align:right;">Current value</th>
          <th style="width:130px;text-align:right;">Cost basis <span class="text-muted" style="text-transform:none;letter-spacing:0;">opt.</span></th>
          <th style="width:120px;text-align:right;">Unrealized</th>
          <th></th>
        </tr></thead>
        <tbody>${rows || '<tr><td colspan="7" class="text-muted" style="padding:14px 20px;">No holdings yet.</td></tr>'}</tbody>
      </table>
      <div style="padding:10px 20px;"><button class="btn btn-ghost btn-sm" data-act="add-holding" data-account="${esc(acct.id)}">+ Add holding</button></div>
    </div>`;
}

function renderCheckin() {
  // §14: Check-In empty state doubles as first-run onboarding.
  if (!portfolio.accounts.some(a => a.status !== 'archived')) return renderCheckinEmpty();
  ensureCheckinDraft();
  const ci = ui.checkin;
  const baseVals = ci.baseDate ? valueIndex(snapshotByDate(ci.baseDate)) : {};

  const groups = accountGroups();
  const acctBlocks = groups.map(g => {
    let gTotal = 0;
    for (const acct of g.accounts) for (const h of activeHoldings(acct.id)) gTotal += parseNum((ci.values[h.id] || {}).marketValue) || 0;
    const header = `<div style="display:flex;align-items:baseline;gap:10px;padding:14px 20px 8px;border-bottom:1px solid var(--color-divider);background:color-mix(in srgb, var(--color-text) 2%, transparent);">
      <span class="kicker" style="font-size:11px;">${esc(g.label)}</span>
      <span class="text-muted" style="font-size:11px;">${g.accounts.length} account${g.accounts.length > 1 ? 's' : ''}</span>
      <span class="text-muted tnum" style="font-size:12px;margin-left:auto;">${fmtMoney2(gTotal)}</span>
    </div>`;
    return header + g.accounts.map(acct => checkinAccountBlock(acct, ci, baseVals)).join('');
  }).join('');

  const total = checkinTotal();
  const sanity = checkinSanityHTML(total);
  const issueCount = checkinBasisIssues().length;
  const _allAccts = portfolio.accounts.filter(a => a.status !== 'archived');
  const _doneCount = _allAccts.filter(a => checkinAccountUpdated(a, ci, baseVals) || (ci.reviewed && ci.reviewed[a.id])).length;
  const doneTag = _allAccts.length ? `<span class="tag ${_doneCount === _allAccts.length ? 'tag-ok' : 'tag-neutral'}" title="An account counts as done once a value changed or you marked it reviewed">${_doneCount}/${_allAccts.length} accounts done</span>` : '';

  return `<div class="panel">
    <div style="display:flex;align-items:flex-end;gap:20px;padding:18px 20px;border-bottom:1px solid var(--color-divider);flex-wrap:wrap;">
      <div>
        <h3 style="margin:0 0 4px;">New check-in</h3>
        <span class="text-muted" style="font-size:13px;">${ci.baseDate ? `Prefilled from ${esc(ci.baseDate)} · overtype what changed. If you change a value, update or clear its cost basis.` : 'First snapshot — enter current values'}</span>
      </div>
      <div class="field" style="width:150px;margin-left:8px;"><label>Snapshot date</label><input class="input" type="date" value="${esc(ci.date)}" data-act="ci-date"></div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        ${doneTag}
        <span id="ci-issue-badge">${issueCount ? `<span class="tag tag-warn">${issueCount} need cost basis</span>` : ''}</span>
        <button class="btn btn-secondary" data-act="ci-discard">Discard check-in</button>
        <button class="btn btn-secondary" data-act="add-account">Add account</button>
        <button class="btn btn-secondary" data-act="open-import" title="Paste or upload a brokerage export to fill values">Import</button>
        <button class="btn btn-primary" data-act="ci-save">Save snapshot</button>
      </div>
    </div>
    ${acctBlocks || '<div class="text-muted" style="padding:20px;">No accounts. Add one to start.</div>'}
    <div style="display:flex;align-items:center;gap:20px;padding:18px 20px;flex-wrap:wrap;">
      <div>
        <div class="kicker">Snapshot total</div>
        <div id="ci-total" style="font-family:var(--font-heading);font-size:30px;line-height:1.1;" class="tnum">${fmtMoney2(total)}</div>
      </div>
      <div class="field" style="width:190px;border-left:1px solid var(--color-divider);padding-left:20px;"><label>Net worth tracker says</label><input class="input tnum" inputmode="decimal" placeholder="optional" value="${esc(ui.checkinNetWorth)}" data-act="ci-nw"></div>
      <div id="ci-sanity" style="align-self:flex-end;padding-bottom:6px;">${sanity}</div>
      <div class="field" style="margin-left:auto;width:320px;"><label>Snapshot note (optional)</label><input class="input" value="${esc(ci.note)}" data-act="ci-note" placeholder="e.g. Bonds still light after top-up."></div>
    </div>
  </div>`;
}

function saveCheckin() {
  const ci = ui.checkin;
  // Strict cost-basis rule: block save while any changed-value holding still has
  // an untouched cost basis. Expand the offending accounts so the flags show.
  const issues = checkinBasisIssues();
  if (issues.length) {
    for (const h of issues) ui.checkinOpen[h.accountId] = true;
    render();
    toast(`Update or clear cost basis for ${issues.length} holding${issues.length > 1 ? 's' : ''} whose value changed.`);
    return;
  }
  const values = [];
  for (const h of activeHoldings()) {
    const v = ci.values[h.id] || {};
    const mv = parseNum(v.marketValue);
    if (mv == null) continue; // skip blank
    const entry = { holdingId: h.id, marketValue: mv };
    const cb = parseNum(v.costBasis);
    if (cb != null) entry.costBasis = cb;
    values.push(entry);
  }
  if (!values.length) { toast('Enter at least one value before saving.'); return; }
  const existing = snapshotByDate(ci.date);
  if (existing) { existing.values = values; existing.note = ci.note; }
  else portfolio.snapshots.push({ date: ci.date, values, note: ci.note });
  markDirty();
  ui.snapDate = ci.date; ui.checkin = null; ui.view = 'dashboard';
  render();
  toast('Snapshot saved · ' + ci.date);
}

    const cats = ['Retirement', '529', 'Non-Retirement', 'Other'];

}

/* ===============================================================
   GOAL & JOURNAL (F5)
   =============================================================== */
function renderGoal() {
  const goal = activeGoal(todayISO());
  const detail = GOAL_DETAIL; // US Total Market is a blend, not a settable target
  const draft = ui.goalDraft || (ui.goalDraft = {
    date: todayISO(),
    name: '',
    targets: (() => { const dt = goalDetailTargets(goal); return Object.fromEntries(detail.map(d => [d.id, dt && dt[d.id] != null ? dt[d.id] : 0])); })(),
    rationale: '',
  });
  const sum = detail.reduce((s, d) => s + (Number(draft.targets[d.id]) || 0), 0);
  // 14 classes grouped by rollup family, each family showing its subtotal.
  const inputs = TAXONOMY.groups.map(grp => {
    const kids = detail.filter(d => d.group === grp.id);
    const famSum = kids.reduce((s, d) => s + (Number(draft.targets[d.id]) || 0), 0);
    const rows = kids.map(d => `
      <div class="drift-row" style="grid-template-columns:150px 1fr 58px;gap:10px;">
        <span style="font-size:13px;"><span class="swatch" style="background:${detailColor(d.id)};margin-right:6px;"></span>${esc(d.label)}</span>
        <input type="range" min="0" max="100" step="1" value="${draft.targets[d.id]}" data-act="goal-slider" data-gid="${d.id}" style="width:100%;">
        <input class="input tnum" style="text-align:right;min-height:28px;padding:3px 6px;" inputmode="numeric" value="${draft.targets[d.id]}" data-act="goal-num" data-gid="${d.id}">
      </div>`).join('');
    return `<div style="margin-bottom:4px;">
      <div style="display:flex;align-items:baseline;gap:8px;margin:8px 0 4px;border-bottom:1px solid var(--color-divider);padding-bottom:2px;">
        <span class="kicker" style="font-size:10px;">${esc(grp.label)}</span>
        <span class="text-muted tnum" id="goal-fam-${grp.id}" style="font-size:11px;margin-left:auto;">${Math.round(famSum)}%</span>
      </div>${rows}</div>`;
  }).join('');
  const sumOk = Math.abs(sum - 100) < 0.5;
  const canSave = sumOk && draft.rationale.trim().length > 0;

  const timeline = portfolio.goals.slice().sort((a, b) => b.effectiveDate.localeCompare(a.effectiveDate)).map((g, i) => `
    <div style="display:grid;grid-template-columns:100px 1fr;gap:14px;border-left:1px solid var(--color-divider);padding:0 0 14px 14px;position:relative;">
      <span class="text-muted tnum" style="font-size:12px;">${esc(g.effectiveDate)}${i === 0 ? ' <span class="tag tag-accent">current</span>' : ''}</span>
      <div>
        <input class="input" style="min-height:28px;padding:3px 8px;font-family:var(--font-heading);max-width:280px;margin-bottom:4px;" value="${esc(g.name || '')}" placeholder="Name this goal (optional)" data-act="rename-goal" data-date="${esc(g.effectiveDate)}">
        <div style="font-size:13px;font-family:var(--font-heading);">${(() => { const gg = goalGroupTargets(g) || {}; return TAXONOMY.groups.filter(x => gg[x.id]).map(x => `${x.label.split(' ')[0]} ${Math.round(gg[x.id])}%`).join(' · '); })()}</div>
        <p class="text-muted" style="margin:2px 0 0;font-size:13px;">${esc(g.rationale || '(no rationale recorded)')}</p>
      </div>
    </div>`).join('') || '<span class="text-muted">No goals recorded yet.</span>';

  return `<div class="toolbar no-print"><div class="crumb"><span>Goal &amp; journal</span></div></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;">
    <div class="panel">
      <div class="panel-hd"><h4>Household target — 13 classes</h4><span id="goal-sum" class="tnum text-muted" style="margin-left:auto;font-size:13px;color:${sumOk ? '' : 'var(--color-crit)'};">sum ${Math.round(sum)}%</span></div>
      <div style="padding:20px;display:flex;flex-direction:column;gap:10px;">
        ${inputs}
        <div class="field" style="margin-top:10px;"><label>Goal name (optional)</label>
          <input class="input" data-act="goal-name" value="${esc(draft.name || '')}" placeholder="e.g. Growth tilt, Home-fund glidedown"></div>
        <div class="field"><label>Why is the goal changing? (required — this is the journal)</label>
          <textarea class="input" data-act="goal-rationale" placeholder="e.g. Trimmed equities 5% into bonds as we near the home-fund milestone.">${esc(draft.rationale)}</textarea></div>
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="field" style="width:150px;"><label>Effective date</label><input class="input" type="date" value="${esc(draft.date)}" data-act="goal-date"></div>
          <button class="btn btn-primary" style="margin-left:auto;align-self:flex-end;" data-act="goal-save" ${canSave ? '' : 'disabled'}>Save goal change</button>
        </div>
        ${!sumOk ? '<span class="text-muted" style="font-size:12px;color:var(--color-warn);">Targets must sum to 100% to save.</span>' : ''}
        ${sumOk && !draft.rationale.trim() ? '<span class="text-muted" style="font-size:12px;">A rationale note is required — an empty goal change is not allowed.</span>' : ''}
      </div>
    </div>
    <div class="panel">
      <div class="panel-hd"><h4>Goal journal</h4></div>
      <div style="padding:20px;display:flex;flex-direction:column;gap:0;">${timeline}</div>
    </div>
  </div>
  ${renderGlidePaths()}`;
}

/* Industry-standard age-based 529 glide tracks (rollup %, sum 100 per band).
   Approximations of typical enrollment/age-based 529 portfolios — de-risk from
   equities toward bonds/cash as the child nears college. Fully editable once
   loaded; verify against your own plan's glide. */
const GLIDE_PRESETS = {
  aggressive: {
    label: 'Aggressive (equity-tilted)',
    bands: [
      { ageFrom: 0,  ageTo: 8,  targets: { stocks: 100 } },
      { ageFrom: 9,  ageTo: 12, targets: { stocks: 80, bonds: 20 } },
      { ageFrom: 13, ageTo: 15, targets: { stocks: 60, bonds: 35, cash: 5 } },
      { ageFrom: 16, ageTo: 17, targets: { stocks: 40, bonds: 50, cash: 10 } },
      { ageFrom: 18, ageTo: 30, targets: { stocks: 25, bonds: 55, cash: 20 } },
    ],
  },
  moderate: {
    label: 'Moderate (typical)',
    bands: [
      { ageFrom: 0,  ageTo: 5,  targets: { stocks: 90, bonds: 10 } },
      { ageFrom: 6,  ageTo: 10, targets: { stocks: 75, bonds: 20, cash: 5 } },
      { ageFrom: 11, ageTo: 14, targets: { stocks: 60, bonds: 32, cash: 8 } },
      { ageFrom: 15, ageTo: 17, targets: { stocks: 40, bonds: 45, cash: 15 } },
      { ageFrom: 18, ageTo: 30, targets: { stocks: 20, bonds: 50, cash: 30 } },
    ],
  },
  conservative: {
    label: 'Conservative',
    bands: [
      { ageFrom: 0,  ageTo: 5,  targets: { stocks: 70, bonds: 25, cash: 5 } },
      { ageFrom: 6,  ageTo: 10, targets: { stocks: 55, bonds: 40, cash: 5 } },
      { ageFrom: 11, ageTo: 14, targets: { stocks: 40, bonds: 50, cash: 10 } },
      { ageFrom: 15, ageTo: 17, targets: { stocks: 25, bonds: 55, cash: 20 } },
      { ageFrom: 18, ageTo: 30, targets: { stocks: 10, bonds: 50, cash: 40 } },
    ],
  },
};
// Load a preset track into a child's glide path (replaces bands; editable after).
function applyGlidePreset(childId, track) {
  const preset = GLIDE_PRESETS[track]; if (!preset) return;
  const gp = ensureGlide(childId);
  gp.bands = preset.bands.map(b => ({ ageFrom: b.ageFrom, ageTo: b.ageTo, targets: Object.assign({}, b.targets) }));
  if (!gp.rationale) gp.rationale = `Loaded a standard ${preset.label.toLowerCase()} age-based 529 glide — edit to match your plan.`;
  markDirty(); render();
  toast(`Loaded ${preset.label} glide`);
}

function renderGlidePaths() {
  if (!portfolio.children.length) {
    return `<div class="panel"><div class="panel-hd"><h4>529 glide paths</h4></div>
      <div style="padding:20px;"><span class="text-muted" style="font-size:13px;">Add a child in Accounts to define an age-based 529 glide path.</span></div></div>`;
  }
  const blocks = portfolio.children.map(child => {
    let gp = portfolio.glidePaths.find(g => g.childId === child.id);
    const bands = gp ? gp.bands.slice().sort((a, b) => a.ageFrom - b.ageFrom) : [];
    const age = childAge(child.birthYear, todayISO());
    const rows = bands.map((b, i) => {
      const active = age >= b.ageFrom && age <= b.ageTo;
      const t = TAXONOMY.groups.filter(g => b.targets[g.id]).map(g => `${g.label.split(' ')[0]} ${b.targets[g.id]}%`).join(' · ');
      return `<tr ${active ? 'style="background:var(--color-accent-100);"' : ''}>
        <td class="tnum">${b.ageFrom}–${b.ageTo}${active ? ' <span class="tag tag-accent">now</span>' : ''}</td>
        <td style="font-size:13px;">${t || '<span class="text-muted">—</span>'}</td>
        <td style="text-align:right;"><button class="btn btn-ghost btn-sm" data-act="edit-band" data-child="${esc(child.id)}" data-idx="${i}">edit</button><button class="btn btn-ghost btn-sm btn-danger" data-act="del-band" data-child="${esc(child.id)}" data-idx="${i}">✕</button></td>
      </tr>`;
    }).join('');
    return `<div style="border:1px solid var(--color-divider);padding:0;">
      <div class="panel-hd"><h4>${esc(child.label)} <span class="text-muted" style="font-family:var(--font-body);font-size:13px;">born ${esc(child.birthYear)} · age ${age}</span></h4>
        <div style="margin-left:auto;display:flex;gap:8px;align-items:center;">
          <select class="input" style="max-width:215px;min-height:30px;" data-act="load-glide" data-child="${esc(child.id)}" title="Load an industry-standard age-based 529 glide — editable after loading">
            <option value="">Load standard glide…</option>
            ${Object.keys(GLIDE_PRESETS).map(k => `<option value="${k}">${esc(GLIDE_PRESETS[k].label)}</option>`).join('')}
          </select>
          <button class="btn btn-ghost btn-sm" data-act="add-band" data-child="${esc(child.id)}">+ Add band</button>
        </div></div>
      <table class="table"><thead><tr><th style="padding-left:16px;">Age band</th><th>Targets</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="3" class="text-muted" style="padding:12px 16px;">No bands yet.</td></tr>'}</tbody></table>
      <div style="padding:10px 16px;"><input class="input" style="max-width:520px;" placeholder="Glide rationale (optional)" value="${esc(gp ? gp.rationale || '' : '')}" data-act="glide-rationale" data-child="${esc(child.id)}"></div>
    </div>`;
  }).join('');
  return `<div class="panel"><div class="panel-hd"><h4>529 glide paths</h4><span class="text-muted" style="font-size:12px;margin-left:auto;">per child · measured instead of the household goal</span></div>
    <div style="padding:20px;display:flex;flex-direction:column;gap:20px;">${blocks}</div></div>`;
}

/* ===============================================================
   REVIEW › TAX (F9, §13) — scorecard, per-holding drag, recommendations
   =============================================================== */
function snapPickerHTML() {
  const snap = currentSnapshot();
  const snaps = sortedSnapshots().slice().reverse();
  if (!snaps.length) return '';
  const opts = snaps.map((s, i) => `<option value="${s.date}" ${snap && s.date === snap.date ? 'selected' : ''}>${s.date}${i === 0 ? ' (latest)' : ''}</option>`).join('');
  return `<div class="field" style="width:170px;margin-left:auto;"><select class="input" data-act="pick-snap">${opts}</select></div>`;
}
function classForTicker(t) { return classifyTicker(t, portfolio.tickerMap) || 'other'; }

function renderTax() {
  const snap = currentSnapshot();
  if (!snap) return `<div class="toolbar no-print"><div class="crumb"><span>Tax Analysis</span></div></div>
    <div class="panel"><div style="padding:44px 20px;text-align:center;" class="text-muted">The tax scorecard needs a snapshot. <a data-act="new-checkin" style="cursor:pointer;color:var(--color-accent);">Start a check-in →</a></div></div>`;
  const sc = taxScorecard(snap);
  const rates = sc.rates;
  const swaps = locationSwapRecs(snap);
  const munis = muniRecs(snap);
  ui._taxRecs = [...swaps, ...munis];
  ui._rothRecs = rothPlacementRecs(snap);

  const scoreCls = sc.locScore == null ? 'text-muted' : sc.locScore >= 90 ? 'ok' : sc.locScore >= 70 ? 'warn' : 'crit';
  const scoreColor = sc.locScore == null ? 'inherit' : `var(--color-${scoreCls})`;
  const tile = (label, big, sub, color) => `<div class="blueprint" style="flex:1;min-width:175px;padding:16px 18px;">
      <div class="kicker" style="font-size:10px;">${label}</div>
      <div class="tnum" style="font-family:var(--font-heading);font-size:28px;line-height:1.1;${color ? `color:${color};` : ''}">${big}</div>
      <div class="text-muted" style="font-size:12px;">${sub}</div></div>`;

  const scorecard = `<div style="display:flex;gap:14px;flex-wrap:wrap;">
    ${tile('Location Efficiency', sc.locScore == null ? 'N/A' : fmtPct(sc.locScore, 0), sc.locScore == null ? 'no tax-inefficient assets' : `${fmtMoney(sc.locNum)} of ${fmtMoney(sc.locDen)} inefficient assets sheltered`, scoreColor)}
    ${tile('Annual tax drag', fmtMoney(sc.totalDrag), `${fmtPct(sc.dragPct, 2)} of ${fmtMoney(sc.taxableAssets)} taxable`, sc.totalDrag > 0 ? 'var(--color-warn)' : 'var(--color-ok)')}
    ${tile('Tax shielded ✓', fmtMoney(sc.taxShielded), `avoided/yr by sheltering ${fmtMoney(sc.shieldedAssets)}`, 'var(--color-ok)')}
    ${tile('Effective rates', fmtPct(rates.r_qdi_eff * 100, 1), `${abbr('QDI', 'Qualified dividends')}/${abbr('LTCG', 'Long-term capital gains')} · ordinary ${fmtPct(rates.r_ord_eff * 100, 1)}`, '')}
  </div>`;

  const rateLine = `<div class="panel"><div style="padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;">
      <span class="tag tag-accent">TY ${REFERENCE_DATA.taxYear}</span>
      <span class="text-muted">${esc(FILING_STATUS_LABELS[rates.fs] || rates.fs)} · ${esc(REFERENCE_DATA.incomeBands.find(b => b.income === rates.income)?.label || '')}${portfolio.taxSettings.state ? ' · ' + esc(portfolio.taxSettings.state) : ''}</span>
      <span class="text-muted">Ordinary ${fmtPct(rates.r_ord * 100, 0)} · ${abbr('QDI', 'Qualified dividends')}/${abbr('LTCG', 'Long-term capital gains')} ${fmtPct(rates.r_qdi * 100, 0)} · ${abbr('NIIT', 'Net Investment Income Tax (3.8%)')} ${fmtPct(rates.niit * 100, 1)} · State ${fmtPct(rates.r_state * 100, 2)}${rates.surtax ? ' · ' + abbr('MA', 'Massachusetts') + ' surtax ' + fmtPct(rates.surtax * 100, 0) : ''}</span>
      <a data-act="nav" data-view="taxprofile" style="margin-left:auto;cursor:pointer;color:var(--color-accent);">Edit tax profile →</a>
    </div></div>`;

  const ineffList = INEFFICIENT_CLASSES.map(c => detailLabel(c)).join(', ');
  const guide = `<div class="panel"><div class="panel-hd"><h4>How to read this</h4></div>
    <div style="padding:14px 20px;font-size:12.5px;line-height:1.65;" class="text-muted">
      <p style="margin:0 0 8px;"><b>${abbr('Yield', 'Dividend yield')}</b> = the fund’s annual dividends as a % of its value. <b>${abbr('Qual', 'Qualified dividends')}</b> = the share of those dividends taxed at the lower long-term rate instead of your ordinary rate (bond interest is 0% qualified; broad stock funds ≈ 95–100%). <b>${abbr('Cap Gain', 'Capital-gains distributions')}</b> = gains the fund pays out each year as a % of value (index funds ≈ 0; active funds higher).</p>
      <p style="margin:0 0 8px;"><b>Annual drag</b> = Value × [ Yield×Qual×${abbr('QDI', 'Qualified-dividend / long-term rate')} + Yield×(1−Qual)×ordinary + Cap&nbsp;Gain×long-term ], at your effective rates. Sheltered accounts (${abbr('IRA', 'Individual Retirement Account')} / 401k / ${abbr('HSA', 'Health Savings Account')} / 529) pay $0 now — the “Tax shielded” tile is that saving (what those holdings <em>would</em> cost if held in taxable). Fund figures come from bundled ${REFERENCE_DATA.taxYear} data or asset-class defaults (rows marked “est.”).</p>
      <p style="margin:0 0 8px;"><b>Location Efficiency</b> = ($ of tax-<b>inefficient</b> assets held in sheltered accounts) ÷ (total $ of tax-inefficient assets) — i.e. how much of the stuff that belongs in a shelter actually is. <b>Inefficient</b> classes (flagged in the Efficiency column): ${esc(ineffList)}. Stock index funds are <b>efficient</b> (fine in taxable); cash &amp; crypto are <b>neutral</b>. Colored ≥90% green · 70–90% yellow · &lt;70% red.</p>
      <p style="margin:0;"><b>Commodities</b> are inefficient for a different reason than yield: physical-metal ETFs (GLD, IAU, SLV) are taxed as <b>collectibles</b> — long-term gains at your ordinary rate capped at ${Math.round((REFERENCE_DATA.collectiblesMaxRate || 0.28) * 100)}% (plus ${abbr('NIIT', 'Net Investment Income Tax')}), not the 15/20% long-term rate — and futures funds issue ${abbr('K-1', 'Schedule K-1 partnership tax form')}s. The drag shown uses that collectibles rate; the bigger cost lands when you sell, so shelter them.</p>
    </div></div>`;

  // Sortable per-holding drag table.
  const tsort = ui.taxSort || (ui.taxSort = { key: 'drag', dir: -1 });
  const sortKeys = {
    ticker: r => (r.ticker || '').toUpperCase(), account: r => (r.accountName || '').toUpperCase(),
    class: r => detailLabel(r.assetClass), eff: r => classEfficiency(r.assetClass).rank,
    value: r => r.mv, yield: r => r.profile.divYield || 0, qual: r => r.profile.qualifiedPct || 0,
    capgain: r => r.profile.capGainDistPct || 0, drag: r => r.drag,
  };
  const kf = sortKeys[tsort.key] || sortKeys.drag;
  const sortedRows = sc.rows.slice().sort((a, b) => {
    const va = kf(a), vb = kf(b);
    const c = typeof va === 'string' ? va.localeCompare(vb) : (va - vb);
    return c * tsort.dir;
  });
  const sortTh = (key, label, align) => `<th data-act="tax-sort" data-key="${key}" style="cursor:pointer;user-select:none;${align ? 'text-align:' + align + ';' : ''}" title="Sort by ${key}">${label}${tsort.key === key ? `<span style="font-size:9px;opacity:0.7;"> ${tsort.dir < 0 ? '▼' : '▲'}</span>` : ''}</th>`;
  const dragRows = sortedRows.map(r => {
    const p = r.profile;
    const eff = classEfficiency(r.assetClass);
    const dragCell = r.sheltered
      ? `<span class="text-muted" title="${esc(r.reason)} — would cost ${fmtMoney2(r.wouldBeDrag)}/yr if held in a taxable account">$0</span>`
      : `<span class="tnum">${fmtMoney2(r.drag)}</span>`;
    return `<tr>
      <td style="font-family:var(--font-heading);">${esc(r.ticker || '—')}${r.estimated ? ' <span class="tag tag-neutral" style="font-size:9px;padding:1px 5px;" title="Estimated from asset-class defaults — no bundled data for this ticker">est.</span>' : ''}</td>
      <td class="text-muted" style="font-size:12px;">${esc(r.accountName)}</td>
      <td class="text-muted" style="font-size:12px;">${esc(detailLabel(r.assetClass))}</td>
      <td>${eff.key === 'efficient' ? `<span class="text-muted" style="font-size:11px;">Efficient</span>` : `<span class="tag ${eff.cls}" style="font-size:9px;" title="${eff.key === 'inefficient' ? 'Tax-inefficient — belongs in a sheltered account (counts toward Location Efficiency)' : 'Neutral — placement doesn’t matter much'}">${eff.label}</span>`}</td>
      <td class="tnum" style="text-align:right;">${fmtMoney(r.mv)}</td>
      <td class="tnum text-muted" style="text-align:right;">${(p.divYield || 0).toFixed(1)}%</td>
      <td class="tnum text-muted" style="text-align:right;">${(p.qualifiedPct || 0)}%</td>
      <td class="tnum text-muted" style="text-align:right;">${(p.capGainDistPct || 0).toFixed(1)}%</td>
      <td style="text-align:right;">${dragCell}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="9" class="text-muted" style="padding:14px 20px;">No holdings in this snapshot.</td></tr>';

  // Materiality = return improvement: annual $ saved ÷ total portfolio value =
  // the percentage points the move adds to your return (e.g. $100 saved on a
  // $10k portfolio = +1.0%). A rec under 0.1% return improvement is immaterial.
  const MATERIAL_MIN_PCT = 0.1; // % return improvement below which a rec is immaterial
  const portfolioTotal = grandTotal(snap) || 1;
  const recImprovePct = (r) => (r.savingsPerYr / portfolioTotal) * 100;
  const recCard = (r, i) => {
    const pct = recImprovePct(r);
    const savings = `${fmtMoney2(r.savingsPerYr)}/yr`;
    const cost = r.basisKnown ? (r.oneTimeCost > 0 ? `one-time tax ${fmtMoney2(r.oneTimeCost)}` : 'no gain to realize') : 'basis unknown — verify realization cost';
    const title = r.kind === 'location-swap'
      ? `Shelter ${fmtMoney(r.amount)} ${esc(r.aTicker)} <span class="text-muted">(${esc(detailLabel(r.aClass))})</span> → move into ${esc(r.bAccountName)}, send ${esc(r.bTicker)} to taxable`
      : `Swap ${fmtMoney(r.amount)} ${esc(r.aTicker)} → ${esc(r.muniTicker)} <span class="text-muted">(${r.inState ? 'in-state muni — federal + state exempt' : 'national muni — federal-exempt'})</span>`;
    const muniCaveat = r.kind === 'muni' ? ` <span title="A national muni is federal-exempt but taxable by your state; an in-state muni fund is exempt from both. Some muni income can be subject to AMT; bonds bought below par may trigger the de-minimis rule. Toggle 'in-state muni' in Tax Profile.">ⓘ</span>` : '';
    return `<div class="blueprint" style="padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
      <div style="flex:1;min-width:260px;">
        <div style="font-size:14px;">${title}${muniCaveat}</div>
        <div class="text-muted" style="font-size:12px;margin-top:3px;">Est. savings <span style="color:var(--color-ok);">${savings}</span> <span style="color:var(--color-ok);" title="Annual saving ÷ total portfolio value — the percentage points this adds to your return">(+${fmtPct(pct, 3)} return improvement)</span> · ${cost}${r.kind === 'muni' ? ` · after-tax yield ${r.muniAT.toFixed(2)}% vs ${r.taxableAT.toFixed(2)}%` : ''}</div>
      </div>
      <button class="btn btn-sm btn-primary" data-act="send-to-plan" data-rec="${i}">Send to Plan →</button>
    </div>`;
  };
  const planMoveCount = (planForSnapshot(snap.date) || { moves: [] }).moves.length;
  const withIdx = ui._taxRecs.map((r, i) => ({ r, i }));
  const material = withIdx.filter(x => recImprovePct(x.r) >= MATERIAL_MIN_PCT);
  const immaterial = withIdx.filter(x => recImprovePct(x.r) < MATERIAL_MIN_PCT);
  const divider = (label) => `<div style="display:flex;align-items:center;gap:10px;margin:8px 0 2px;"><div style="flex:1;height:1px;background:var(--color-divider);"></div><span class="kicker" style="font-size:10px;">${label}</span><div style="flex:1;height:1px;background:var(--color-divider);"></div></div>`;
  const recsHTML = ui._taxRecs.length
    ? `${material.length ? material.map(x => recCard(x.r, x.i)).join('') : `<div class="text-muted" style="font-size:13px;padding:2px 2px 4px;">Nothing worth acting on — every recommendation below improves your return by less than ${MATERIAL_MIN_PCT}%.</div>`}
       ${immaterial.length ? divider(`recommended · immaterial (return improvement < ${MATERIAL_MIN_PCT}%)`) + immaterial.map(x => recCard(x.r, x.i)).join('') : ''}`
    : `<div class="text-muted" style="font-size:13px;padding:6px 2px;">No location-swap or muni recommendations — your tax-inefficient assets are already well placed${rates.r_ord < 0.32 ? ' (muni comparison activates at the 32% bracket)' : ''}.</div>`;

  const rothHTML = (ui._rothRecs && ui._rothRecs.length) ? ui._rothRecs.map((r, i) => `
    <div class="panel" style="border-color:var(--color-accent-2);"><div class="panel-hd" style="border-color:var(--color-accent-2);"><h4>Roth placement</h4><span class="text-muted" style="font-size:12px;margin-left:auto;">tax-free growth · allocation-neutral</span></div>
      <div style="padding:14px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
        <div style="flex:1;min-width:260px;font-size:13px;">Your Roth (${esc(r.rothAccountName)}) holds <b>${esc(r.lowTicker)}</b> <span class="text-muted">(${esc(detailLabel(r.lowClass))})</span>, while <b>${esc(r.highTicker)}</b> <span class="text-muted">(${esc(detailLabel(r.highClass))})</span> — an asset with higher assumed growth — sits in ${esc(r.tradAccountName)}. Qualified Roth withdrawals are tax-free. Under the assumed growth rates, swapping ${fmtMoney(r.amount)} to put the higher-growth asset in the Roth may increase after-tax wealth; actual returns and withdrawal rules matter. Both sides are sheltered — no tax to realize.</div>
        <button class="btn btn-sm btn-primary" data-act="send-roth-to-plan" data-rec="${i}">Send to Plan →</button>
      </div></div>`).join('') : '';

  return `<div class="toolbar no-print"><div class="crumb"><span>Tax Analysis</span></div>${snapPickerHTML()}</div>
    ${scorecard}
    ${rateLine}
    <div class="panel"><div class="panel-hd"><h4>Per-holding tax drag</h4><span class="text-muted" style="font-size:12px;margin-left:auto;">click a header to sort · sheltered rows show $0</span></div>
      <div style="overflow-x:auto;"><table class="table" style="table-layout:fixed;min-width:760px;">
        <colgroup><col style="width:11%"><col style="width:17%"><col style="width:16%"><col style="width:11%"><col style="width:11%"><col style="width:7%"><col style="width:7%"><col style="width:8%"><col style="width:12%"></colgroup>
        <thead><tr>
          ${sortTh('ticker', 'Ticker')}${sortTh('account', 'Account')}${sortTh('class', 'Class')}
          ${sortTh('eff', abbr('Efficiency', 'Tax efficiency of the asset class — inefficient classes belong in sheltered accounts'))}
          ${sortTh('value', 'Value', 'right')}
          ${sortTh('yield', abbr('Yield', 'Dividend yield — annual dividends ÷ value'), 'right')}

/* ===============================================================
   PLAN (F8, §13.4/§13.7/§13.8) — moves, no-action, savings directive,
   before/after simulator, commit & track.
   =============================================================== */
function ensurePlan(date) {
  let p = planForSnapshot(date);
  if (!p) { p = { snapshotDate: date, moves: [], noAction: false, directive: null, notes: '' }; portfolio.plans.push(p); }
  return p;
}
function planAddMove(date, move) {
  const p = ensurePlan(date); p.noAction = false;
  p.moves.push(Object.assign({ accountId: '', sellTicker: '', buyTicker: '', amount: 0, taxNote: '', done: false }, move));
  markDirty();
}
// §13.4 — build drift-driven proposals, preferring sheltered trades (zero tax).
function driftMoves(snap) {
  const goal = activeGoal(snap.date);
  if (!goal) return [];
  const holds = householdHoldings();
  const a = allocate(holds, snap);
  const detail = goalIsDetail(goal);
  const targets = detail ? goalDetailTargets(goal) : goalGroupTargets(goal);
  const rows = detail ? toRows(a.detail, a.total, 'detail') : toRows(a.group, a.total, 'group');
  const band = portfolio.meta.driftBandPct || 5;
  const drift = computeDrift(rows, a.total, targets, band);
  const over = drift.filter(d => d.driftPct > band).sort((x, y) => y.driftPct - x.driftPct);
  const under = drift.filter(d => d.driftPct < -band).sort((x, y) => x.driftPct - y.driftPct);
  const idx = valueIndex(snap);
  const moves = [];
  let ui2 = 0;
  for (const o of over) {
    if (ui2 >= under.length) break;
    const u = under[ui2];
    const amt = Math.min((o.driftPct / 100) * a.total, (Math.abs(u.driftPct) / 100) * a.total);
    if (amt < a.total * 0.005) continue;
    // Prefer a sheltered account holding a ticker of the overweight class.
    const cands = activeHoldings().filter(h => {
      const cls = detail ? h.assetClass : rollupOf(h.assetClass);
      return cls === o.id && (idx[h.id] && Number(idx[h.id].marketValue) > 0);
    });
    cands.sort((h1, h2) => {
      const s1 = accountShelter(accountById(h1.accountId)).sheltered ? 0 : 1;
      const s2 = accountShelter(accountById(h2.accountId)).sheltered ? 0 : 1;
      return s1 - s2;
    });
    const src = cands[0];
    const acctId = src ? src.accountId : '';
    const sellTicker = src ? src.ticker : '';
    const buyTicker = detail ? (CLASS_SUGGEST_TICKER[u.id] || 'VTI') : 'VTI';
    moves.push({ accountId: acctId, sellTicker, buyTicker, amount: Math.round(amt), done: false });
    ui2++;
    if (moves.length >= 4) break;
  }
  return moves;
}
// Taxable long-term gain a move would realize (§13.4/13.5). Sheltered-account
// sales realize $0; unknown basis counts as $0 (can't gate on it).
function moveRealizedGain(m, snap) {
  const acct = accountById(m.accountId);
  if (!acct || accountShelter(acct).sheltered) return 0;
  const X = Number(m.amount) || 0;
  if (!(X > 0) || !m.sellTicker) return 0;
  const idx = valueIndex(snap);
  const h = activeHoldings(m.accountId).find(x => (x.ticker || '').toUpperCase() === m.sellTicker.toUpperCase());
  if (!h) return 0;
  const v = idx[h.id]; if (!v) return 0;
  const mv = Number(v.marketValue) || 0;
  const cb = v.costBasis != null ? Number(v.costBasis) : (h.costBasis != null ? Number(h.costBasis) : null);
  if (cb == null || mv <= 0) return 0;
  return Math.max(0, (mv - cb) * (Math.min(X, mv) / mv));
}
// Total realized gain across a plan's moves (for the gain-budget tracker).
function planRealizedGain(plan, snap) {
  return (plan && plan.moves || []).reduce((s, m) => s + moveRealizedGain(m, snap), 0);
}
// Full auto-generation from tax + drift + savings (§13.4–13.8); user then edits.
// Gain-realizing proposals stop once the annual gain budget is spent (§13.4.4).
function generatePlanProposals(snap) {
  const p = ensurePlan(snap.date);
  p.noAction = false;
  p.moves = [];
  const budget = Number(portfolio.taxSettings.gainBudgetAnnual) || 0;
  let gainUsed = 0;
  const affords = (gain) => budget <= 0 || (gainUsed + gain) <= budget;
  // 1. Tax-driven swaps — each realizes gain on the taxable A-side (kept as a pair).
  for (const r of locationSwapRecs(snap)) {
    const gain = r.realizedGain || 0;
    if (!affords(gain)) continue;
    gainUsed += gain;
    p.moves.push({ accountId: r.aAccountId, sellTicker: r.aTicker, buyTicker: r.bTicker, amount: Math.round(r.amount), source: 'tax-swap', taxNote: `Shelter ${r.aTicker} · ~${fmtMoney2(r.savingsPerYr)}/yr saved`, done: false });
    p.moves.push({ accountId: r.bAccountId, sellTicker: r.bTicker, buyTicker: r.aTicker, amount: Math.round(r.amount), source: 'tax-swap', taxNote: 'Swap pair · tax-free side', done: false });
  }
  for (const r of muniRecs(snap)) {
    const gain = r.realizedGain || 0;
    if (!affords(gain)) continue;
    gainUsed += gain;
    p.moves.push({ accountId: r.aAccountId, sellTicker: r.aTicker, buyTicker: r.muniTicker, amount: Math.round(r.amount), source: 'tax-muni', taxNote: `Muni swap · ~${fmtMoney2(r.savingsPerYr)}/yr saved`, done: false });
  }
  // 2. Drift moves (sheltered-first; only taxable sells realize gain).
  for (const m of driftMoves(snap)) {
    const gain = moveRealizedGain(m, snap);
    if (!affords(gain)) continue;
    gainUsed += gain;
    p.moves.push(Object.assign({ source: 'drift', taxNote: '', done: false }, m));
  }
  const dir = savingsDirective(snap);
  p.directive = dir ? { text: dir.text, splits: dir.splits } : null;
  p.generated = true;
  markDirty();
}
// Live tax note for a move (recomputes as the user edits).
function moveTaxNoteLive(m) {
  const acct = accountById(m.accountId);
  const sh = accountShelter(acct);
  if (!m.accountId) return { text: 'Pick an account', cls: 'tag-neutral' };
  if (sh.sheltered) return { text: `Tax-free · ${sh.reason}`, cls: 'tag-ok' };
  const rates = taxRates();
  return { text: `Taxable · gains taxed ~${fmtPct(rates.r_ltcg_eff * 100, 1)}`, cls: 'tag-warn' };
}
function simulateAfter(snap, moves) {
  const base = allocate(householdHoldings(), snap);
  const detail = Object.assign({}, base.detail);
  const apply = (cls, amt) => { for (const [k, v] of expandClass(cls, amt)) detail[k] = (detail[k] || 0) + v; };
  for (const m of moves || []) {
    const X = Number(m.amount) || 0; if (!(X > 0)) continue;
    if (m.sellTicker) apply(classForTicker(m.sellTicker), -X);
    if (m.buyTicker) apply(classForTicker(m.buyTicker), X);
  }
  for (const k in detail) if (detail[k] < 0) detail[k] = 0;
  const group = {}; for (const k in detail) { const g = rollupOf(k); group[g] = (group[g] || 0) + detail[k]; }
  const total = Object.values(detail).reduce((s, v) => s + v, 0);
  return { detail, group, total };
}

    <div style="padding:14px 20px;font-size:12.5px;line-height:1.6;" class="text-muted">
      Combines <b>tax moves</b> — location swaps &amp; muni comparisons — with <b>rebalancing moves</b> from your drift vs goal, placed in sheltered accounts first to avoid tax, plus a <b>savings directive</b> steering new contributions. Every row is a suggestion — edit, add, or delete it. Nothing is ever executed.
      <div style="margin-top:8px;color:var(--color-text);"><b>${nTax}</b> tax · <b>${nDrift}</b> rebalancing move${nDrift === 1 ? '' : 's'}${plan.directive ? ' · 1 savings directive' : ''}.</div>
    </div></div>`;

  const srcTag = (m) => {
    if (/^tax/.test(m.source || '')) return `<span class="tag tag-accent-2" style="font-size:9px;" title="Proposed by the Tax tab — location swap or muni">tax</span>`;
    if (m.source === 'drift') return `<span class="tag tag-neutral" style="font-size:9px;" title="Rebalancing toward your goal (drift)">drift</span>`;
    return `<span class="text-muted" style="font-size:11px;">—</span>`;
  };
  const acctOpts = (sel) => portfolio.accounts.filter(a => a.status !== 'archived')
    .map(a => `<option value="${esc(a.id)}" ${a.id === sel ? 'selected' : ''}>${esc(a.name)}</option>`).join('');
  const moveRows = plan.moves.map((m, i) => {

    </div></div>` : '';

  // Savings directive.
  const dirHTML = plan.directive ? `<div class="panel"><div class="panel-hd"><h4>Savings directive</h4><span class="text-muted" style="font-size:12px;margin-left:auto;">until next check-in</span></div>
      <div style="padding:16px 20px;font-size:13px;">${esc(plan.directive.text || '')}</div></div>`
    : (dir ? `<div class="panel"><div class="panel-hd"><h4>Savings directive</h4></div><div style="padding:16px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;"><span style="font-size:13px;">${esc(dir.text)}</span><button class="btn btn-sm btn-secondary" style="margin-left:auto;" data-act="plan-adddir">Attach to plan</button></div></div>` : '');

  const goal = activeGoal(snap.date);
  const gTargets = goal ? (goalIsDetail(goal) ? goalGroupTargets(goal) : goalGroupTargets(goal)) : {};

    </div></div>`;

  const doneCount = plan.moves.filter(m => m.done).length;
  // Gain-budget tracker (§13.4.4): realized long-term gain across the plan's moves.
  const gainUsed = planRealizedGain(plan, snap);
  const gainBudget = Number(portfolio.taxSettings.gainBudgetAnnual) || 0;
  const overBudget = gainBudget > 0 && gainUsed > gainBudget + 0.5;

      showAccounts.map(acct => {

        return `<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);"><span>${esc(acct.name)} <span class="text-muted">${esc(acct.institution || '')}</span></span><span class="tnum">${fmtMoney(av.total)}</span></div>`;
      }).join('') + '</div>';
  }
  const goalRows = goalTargets
    ? TAXONOMY.groups.filter(g => goalTargets[g.id] != null).map(g => ({ id: g.id, label: g.label, color: groupColor(g.id), value: goalTargets[g.id], pct: goalTargets[g.id] }))
    : null;
  const legend = rollup.map(r => {
    const gt = goalTargets && goalTargets[r.id];
    return `<div class="legend-item"><span class="swatch" style="background:${r.color}"></span>${esc(r.label)} <span class="text-muted tnum">${r.pct.toFixed(0)}%${gt != null ? ' / ' + Math.round(gt) + '%' : ''}</span></div>`;
  }).join('');
  return `<section class="rep-section" style="margin-bottom:26px;">
    <h3 style="margin:0 0 2px;">${esc(title)}</h3>
    <div class="rep-sub text-muted" style="font-size:13px;margin-bottom:12px;">${esc(subtitle)} · ${fmtMoney(a.total)}</div>
    <div class="rep-chart" style="display:flex;gap:24px;align-items:center;margin-bottom:16px;">
      <figure class="blueprint" style="padding:12px;flex:none;">${corners()}${concentricDonutSVG(rollup, goalRows)}</figure>
      <div style="flex:1;"><div class="kicker" style="margin-bottom:8px;">${goalRows ? 'Outer ring = actual · inner ring = goal · figures: actual % / goal %' : 'Allocation'}</div><div class="legend" style="flex-direction:column;gap:7px;">${legend}</div></div>
    </div>
    <div class="rep-tables" style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
      <div><div class="kicker" style="margin-bottom:6px;">Rollup</div>${allocTableHTML(rollup, goalTargets, band)}</div>
      <div><div class="kicker" style="margin-bottom:6px;">Detail</div>${allocTableHTML(detail, detailTargets || null, band)}</div>
    </div>
    ${accountsHTML}
  </section>`;
}

/* F7 report — tax scorecard summary section. */
function reportTaxSection(snap) {
  const sc = taxScorecard(snap);
  if (!sc.rows.length) return '';
  const scoreTxt = sc.locScore == null ? 'N/A' : fmtPct(sc.locScore, 0);
  const top = sc.rows.filter(r => !r.sheltered && r.drag > 0).slice(0, 6).map(r =>
    `<tr><td>${esc(r.ticker || '—')}</td><td class="text-muted" style="font-size:12px;">${esc(r.accountName)}</td><td class="tnum" style="text-align:right;">${fmtMoney(r.mv)}</td><td class="tnum" style="text-align:right;">${fmtMoney2(r.drag)}</td></tr>`).join('');
  return `<section class="rep-section" style="margin-bottom:26px;">
    <h3 style="margin:0 0 2px;">Tax posture</h3>
    <div class="rep-sub text-muted" style="font-size:13px;margin-bottom:12px;">Location efficiency ${scoreTxt} · annual drag ${fmtMoney(sc.totalDrag)} (${fmtPct(sc.dragPct, 2)} of ${fmtMoney(sc.taxableAssets)} taxable)</div>
    ${top ? `<table class="table"><thead><tr><th>Ticker</th><th>Account</th><th style="text-align:right;">Value</th><th style="text-align:right;">Drag $/yr</th></tr></thead><tbody>${top}</tbody></table>` : ''}
  </section>`;
}

/* F7 report — committed Quarterly Plan section (§13). */
function reportPlanSection(snap) {
  const plan = planForSnapshot(snap.date);
  if (!plan) return '';
  if (plan.noAction) return `<section class="rep-section" style="margin-bottom:26px;"><h3 style="margin:0 0 2px;">${esc(planTitle(snap.date))}</h3><div class="rep-sub text-muted" style="font-size:13px;">Decision: no action — within bands.</div></section>`;
  const rows = (plan.moves || []).map(m => `<tr>
      <td>${m.done ? '✓' : '☐'}</td><td>${esc(accountById(m.accountId) ? accountById(m.accountId).name : '—')}</td>
      <td>${esc(m.sellTicker || '')} → ${esc(m.buyTicker || '')}</td>
      <td class="tnum" style="text-align:right;">${fmtMoney(m.amount || 0)}</td>
      <td class="text-muted" style="font-size:12px;">${esc(m.taxNote || '')}</td></tr>`).join('');
  const dir = plan.directive && plan.directive.text ? `<div class="text-muted" style="font-size:13px;margin-top:8px;">Savings directive: ${esc(plan.directive.text)}</div>` : '';
  if (!rows && !dir) return '';
  return `<section class="rep-section" style="margin-bottom:26px;">
    <h3 style="margin:0 0 2px;">${esc(planTitle(snap.date))}</h3>
    <div class="rep-sub text-muted" style="font-size:13px;margin-bottom:12px;">Committed plan</div>
    ${rows ? `<table class="table"><thead><tr><th>Done</th><th>Account</th><th>Move</th><th style="text-align:right;">Amount</th><th>Tax note</th></tr></thead><tbody>${rows}</tbody></table>` : ''}
    ${dir}
  </section>`;
}

/* F7 report — Retirement section (§5.7). Only when the mapping is confirmed. */
function reportRetireSection(snap) {
  const rs = portfolio.retirementSettings;
  if (!rs || !rs.mappingConfirmed) return '';
  if (!retireAccounts().length || !latestSnapshot()) return '';
  const model = retireModel();
  const { cfg, base, verdict, conv } = model;
  const endBand = base.bands[base.bands.length - 1];
  const convLine = cfg.conversionFill > 0 && conv
    ? `<br>Roth conversion window (${esc(rs.conversionFillBracket)}): convert ${fmtMoney(conv.converted)} for ${fmtMoney(conv.convTax)} tax; first RMD ${fmtMoney(conv.firstRmdWithout)} → ${fmtMoney(conv.firstRmdWith)}.`
    : '';
  return `<section class="rep-section" style="margin-bottom:26px;">
    <h3 style="margin:0 0 2px;">Retirement projection</h3>
    <div class="rep-sub text-muted" style="font-size:13px;margin-bottom:12px;">Real dollars · retire at ${cfg.retireAge} · ${cfg.paths.toLocaleString()} paths · to age ${RETIRE_DATA.endAge}</div>
    <div style="margin-bottom:10px;">${fanChartSVG(base.bands, { age: cfg.retireAge, label: 'Retire at' }, 'reportfan', { static: true })}</div>
    <div style="font-size:13px;line-height:1.7;">
      Funds ${fmtMoney(cfg.spend)}/yr spending in <b>${fmtPct(base.success * 100, 0)}</b> of paths · median ending balance ${fmtMoney(endBand.p50)} (P10 ${fmtMoney(endBand.p10)}).<br>
      This year's contributions: <b>${verdict.verdict}</b> — rate now ${fmtPct(verdict.rNow * 100, 1)} vs projected retirement rate ${fmtPct(verdict.rThen * 100, 1)} (a surviving spouse alone: ${fmtPct(verdict.rThenSurvivor * 100, 0)}).${convLine}
    </div>
  </section>`;
}

/* F7 report — College projection section (one line per child), when there are children + a snapshot. */
function reportCollegeSection(snap) {
  if (!portfolio.children.length || !latestSnapshot()) return '';
  const rows = portfolio.children.map(child => {
    const model = collegeModel(child.id), { cfg, base } = model;
    return `<tr><td>${esc(child.label)}</td><td class="tnum" style="text-align:right;">${fmtMoney(collegeStartBalance(child.id))}</td>
      <td class="tnum" style="text-align:right;">${fmtMoney(cfg.annualCost)}/yr × ${cfg.years}</td>
      <td class="tnum" style="text-align:right;">${fmtPct(base.fullSuccess * 100, 0)}</td>
      <td class="tnum" style="text-align:right;">${base.avgYearsFunded.toFixed(1)} / ${cfg.years}</td></tr>`;
  }).join('');
  return `<section class="rep-section" style="margin-bottom:26px;">
    <h3 style="margin:0 0 2px;">College projection</h3>
    <div class="rep-sub text-muted" style="font-size:13px;margin-bottom:12px;">Real dollars · per child, 529 grown on its glide path then drawn down for college</div>
    <table class="table"><thead><tr><th>Child</th><th style="text-align:right;">529 today</th><th style="text-align:right;">Cost</th><th style="text-align:right;">Fully funded</th><th style="text-align:right;">Avg years funded</th></tr></thead><tbody>${rows}</tbody></table>
  </section>`;
}

function reportHTML(snap) {
  if (!snap) return '<p class="text-muted">No snapshot to report on yet.</p>';
  const band = portfolio.meta.driftBandPct || 5;
  const goal = activeGoal(snap.date);
  const ggt = goal ? goalGroupTargets(goal) : null;
  const gdt = goal ? goalDetailTargets(goal) : null;
  let out = `<header style="border-bottom:2px solid var(--color-text);padding-bottom:10px;margin-bottom:20px;">
    <div class="kicker">Quartermaster · your real allocation</div>
    <h1 style="margin:2px 0 0;font-size:34px;">As of ${esc(snap.date)}</h1>
  </header>`;

  // Order: Household → Investments (non-retirement) → Retirement → 529 → Others
  out += reportSection('your real allocation', 'Household · excludes 529s · vs goal', householdHoldings(), snap, ggt, band, null, gdt);

  const nonret = accountsSorted(a => a.category === 'Non-Retirement');
  if (nonret.length) out += reportSection(catLabel('Non-Retirement'), 'vs household goal', nonret.flatMap(a => accountHoldings(a.id)), snap, ggt, band, nonret, gdt);

  const ret = accountsSorted(a => a.category === 'Retirement');
  if (ret.length) out += reportSection('Retirement', 'vs household goal', ret.flatMap(a => accountHoldings(a.id)), snap, ggt, band, ret, gdt);

  for (const acct of accountsSorted(a => a.category === '529')) {
    const child = childById(acct.childId);
    const g = glideTargets(acct.childId, snap.date);
    out += reportSection(`529 — ${child ? child.label : acct.name}`, `Age ${g ? g.age : '?'} · vs glide band`, accountHoldings(acct.id), snap, g && g.targets, band, [acct]);
  }

  // Other categories grouped by label
  const others = accountsSorted(a => a.category === 'Other');
  const byLabel = {};
  for (const a of others) { const k = a.categoryLabel || 'Other'; (byLabel[k] = byLabel[k] || []).push(a); }
  for (const [label, accts] of Object.entries(byLabel)) {
    out += reportSection(label, 'Other category · vs household goal', accts.flatMap(a => accountHoldings(a.id)), snap, ggt, band, accts, gdt);
  }

  out += reportTaxSection(snap);
  out += reportPlanSection(snap);
  out += reportRetireSection(snap);
  out += reportCollegeSection(snap);

  out += `<footer style="border-top:1px solid var(--color-divider);margin-top:20px;padding-top:12px;font-size:12px;" class="text-muted">
    Snapshot ${esc(snap.date)} · Goal effective ${goal ? esc(goal.effectiveDate) : '—'} · Drift band ±${band}% absolute · Tax figures TY ${REFERENCE_DATA.taxYear} (estimates, not advice).
    ${goal && goal.rationale ? '<br>Latest rationale: ' + esc(goal.rationale) : ''}
  </footer>`;
  return out;
}

  return `<div class="toolbar no-print"><div class="crumb"><span>Accounts</span></div>

  <div class="panel"><div class="panel-hd"><h4>Allocation settings</h4></div>
    <div style="padding:20px;display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end;">

    </div>
    <div style="padding:0 20px 20px;"><span class="text-muted" style="font-size:12px;">Tax treatment on an account (Pre-tax / Roth / Taxable) drives the Tax tab’s asset-location scoring. Edit an account to set it.</span></div>

/* ===============================================================
   SETTINGS › HOUSEHOLD (§14) — children, birth years, 529 assignments.

function renderHousehold() {
  const kids = portfolio.children.length ? portfolio.children.map(c => {
    const accts = portfolio.accounts.filter(a => a.category === '529' && a.childId === c.id && a.status !== 'archived');

}

/* ===============================================================
   SETTINGS › TAX PROFILE (§14, §13.1) — bracket picker + expert
   override, gain budget, household monthly savings, YTD contributions.
   =============================================================== */
function renderTaxProfile() {
  const ts = portfolio.taxSettings;
  const ref = REFERENCE_DATA;
  const rates = taxRates();
  const ov = ts.override || {};
  const advanced = !!ui.taxAdvanced || !!ts.override;
  const opt = (val, label, sel) => `<option value="${esc(val)}" ${sel ? 'selected' : ''}>${esc(label)}</option>`;
  const filingOpts = Object.keys(FILING_STATUS_LABELS).map(k => opt(k, FILING_STATUS_LABELS[k], ts.filingStatus === k)).join('');
  const bandOpts = ref.incomeBands.map(b => opt(b.key, b.label, ts.incomeBand === b.key)).join('');
  const stateOpts = opt('', '— no state income tax —', !ts.state)
    + Object.keys(ref.stateRates).sort().map(s => opt(s, `${s} · ${ref.stateRates[s].toFixed(2)}%`, ts.state === s)).join('');
  const stateNote = ts.state && ref.stateNotes[ts.state] ? `<div class="text-muted" style="font-size:12px;margin-top:4px;">${esc(ref.stateNotes[ts.state])}</div>` : '';

  const rateChip = (label, v) => `<div style="display:flex;flex-direction:column;gap:2px;"><span class="kicker" style="font-size:10px;">${label}</span><span class="tnum" style="font-size:18px;font-family:var(--font-heading);">${fmtPct(v * 100, 1)}</span></div>`;

  const advPanel = advanced ? `
    <div class="panel" style="border-color:var(--color-accent-2);">
      <div class="panel-hd" style="border-color:var(--color-accent-2);"><h4>Expert override</h4><span class="text-muted" style="font-size:12px;margin-left:auto;">blank = use derived value</span></div>
      <div style="padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;">
        <div class="field"><label>Ordinary rate (%)</label><input class="input tnum" inputmode="decimal" data-act="ov-ord" value="${ov.ordinaryRate != null ? (ov.ordinaryRate * 100) : ''}" placeholder="${(rates.r_ord * 100).toFixed(1)}"></div>
        <div class="field"><label>${abbr('QDI', 'Qualified dividends')} / ${abbr('LTCG', 'Long-term capital gains')} rate (%)</label><input class="input tnum" inputmode="decimal" data-act="ov-ltcg" value="${ov.ltcgRate != null ? (ov.ltcgRate * 100) : ''}" placeholder="${(rates.r_qdi * 100).toFixed(1)}"></div>
        <div class="field"><label>State rate (%)</label><input class="input tnum" inputmode="decimal" data-act="ov-state" value="${ov.stateRate != null ? (ov.stateRate * 100) : ''}" placeholder="${(rates.r_state * 100).toFixed(2)}"></div>
        <label class="radio" style="align-items:center;"><input type="checkbox" data-act="ov-niit" ${ov.niitApplies ? 'checked' : ''}><span class="dot"></span>Force ${abbr('NIIT', 'Net Investment Income Tax')} (3.8%)</label>
        <label class="radio" style="align-items:center;"><input type="checkbox" data-act="ov-surtax" ${ov.surtaxApplies ? 'checked' : ''}><span class="dot"></span>Force ${abbr('MA', 'Massachusetts')} 4% surtax</label>
      </div>
      <div style="padding:0 20px 18px;"><button class="btn btn-sm btn-secondary" data-act="ov-clear">Clear all overrides</button></div>
    </div>` : `<div style="padding:2px 2px 6px;"><button class="btn btn-sm btn-secondary" data-act="ov-toggle">Advanced: override derived rates…</button></div>`;

  const advAccts = portfolio.accounts.filter(a => a.status !== 'archived' && vehicleContribLimit(accountVehicle(a), REFERENCE_DATA.contribLimits) > 0);
  const ytd = ts.ytdContributions || {};
  const ytdRows = advAccts.length ? advAccts.map(a => `<div class="drift-row" style="grid-template-columns:1fr 120px;gap:10px;align-items:center;">
      <span style="font-size:13px;">${esc(a.name)} <span class="text-muted">· ${esc(accountVehicle(a))} limit ${fmtMoney(vehicleContribLimit(accountVehicle(a), REFERENCE_DATA.contribLimits))}</span></span>

    </div>`).join('') : '<span class="text-muted" style="font-size:13px;">No tax-advantaged accounts yet.</span>';

  return `<div class="toolbar no-print"><div class="crumb"><span>Tax Profile</span></div>
    <span class="tag tag-accent" style="margin-left:auto;">Tax Year ${ref.taxYear}</span></div>
  <div class="panel"><div class="panel-hd"><h4>Bracket picker</h4><span class="text-muted" style="font-size:12px;margin-left:auto;">${esc(ref.source)}</span></div>
    <div style="padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;">
      <div class="field"><label>Filing status</label><select class="input" data-act="ts-filing">${filingOpts}</select></div>
      <div class="field"><label>Income band</label><select class="input" data-act="ts-band">${bandOpts}</select></div>
      <div class="field"><label>State</label><select class="input" data-act="ts-state">${stateOpts}</select>${stateNote}</div>

    <div style="padding:0 20px 20px;display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end;background:color-mix(in srgb, var(--color-text) 3%, transparent);margin:0 0 0;padding-top:16px;">

      <div class="field"><label class="radio" style="align-items:center;"><input type="checkbox" data-act="ts-instatemuni" ${ts.inStateMuni ? 'checked' : ''}><span class="dot"></span>In-state muni fund available</label><span class="text-muted" style="font-size:11px;">A muni fund for your state is exempt from <b>both</b> federal and state tax — improves the muni comparison.</span></div>
    </div>
    <div class="panel-hd" style="border-top:1px solid var(--color-divider);"><h4 style="font-size:13px;">YTD contributions (for headroom)</h4></div>
    <div style="padding:16px 20px 20px;display:flex;flex-direction:column;gap:8px;max-width:520px;">${ytdRows}</div>
  </div>
  <div style="padding:0 2px;"><span class="text-muted" style="font-size:12px;">Estimates only — confirm material decisions with a CPA.</span></div>`;
}

/* ===============================================================
   REVIEW › RETIRE (spec §5–6) — Monte Carlo retirement projector.

// Outlook display-unit toggle (today's/real vs future/nominal dollars). Purely a display choice —
// it NEVER re-runs the simulation (which always computes in real dollars); it only re-inflates the
// figures that are tied to a future year, using the assumed inflation rate.
function dollarModeIsFuture() { return ui.dollarMode === 'future'; }
// Outlook page header with the today's/future-dollars toggle attached to its bottom edge (one connected bar).
function outlookHeaderBlock(title, editView) {

  return `<div class="panel no-print" style="border-top-color:${future ? 'var(--color-warn)' : 'var(--color-accent)'};">
    <div style="display:flex;align-items:center;gap:12px;padding:14px 18px;flex-wrap:wrap;">
      <span style="font-family:var(--font-heading);font-size:17px;">${esc(title)}</span>
      ${editView ? `<a data-act="nav" data-view="${editView}" style="margin-left:auto;cursor:pointer;color:var(--color-accent);white-space:nowrap;">Edit inputs →</a>` : ''}
    </div>
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:11px 18px;border-top:1px solid var(--color-line-2);background:${future ? 'var(--color-warn-soft)' : 'var(--color-teal-soft)'};">
      <span style="font-size:13px;font-weight:600;">Show amounts in</span>
      <div style="display:inline-flex;border:1px solid var(--color-divider);background:var(--color-panel);overflow:hidden;">${seg('today', "Today's dollars", !future, 'var(--color-teal)')}${seg('future', 'Future dollars', future, 'var(--color-warn)')}</div>
      <span class="text-muted" style="font-size:12px;flex:1;min-width:220px;line-height:1.5;">${future
        ? "Projected balances &amp; withdrawals are inflated to each future year's sticker price — bigger numbers, same buying power. Inputs stay in today's dollars."
        : "Everything is in today's buying power, inflation removed — the honest way to compare against what money buys now."}</span>
    </div></div>`;
}

// Interactive fan chart: outcome bands + median on an age axis, a marker age called out,
// hover shows the balance at any age. `id` scopes hover state; `marker` = {age,label}.
let FAN_STATE = {};
function fanChartSVG(bands, marker, id, opts) {
  id = id || 'fan'; opts = opts || {};
  const isStatic = !!opts.static;
  const W = 720, H = 280, padL = 60, padB = 30, padT = 22, plotW = W - padL - 14, plotH = H - padB - padT;
  const a0 = bands[0].age, a1 = bands[bands.length - 1].age;
  const maxV = Math.max(1, ...bands.map(b => b.p90));
  const x = age => padL + (a1 === a0 ? plotW / 2 : (age - a0) / (a1 - a0) * plotW);
  const y = v => padT + plotH - (Math.max(0, v) / maxV) * plotH;
  const poly = (lo, hi) => bands.map(b => `${x(b.age).toFixed(1)},${y(b[hi]).toFixed(1)}`)
    .concat(bands.slice().reverse().map(b => `${x(b.age).toFixed(1)},${y(b[lo]).toFixed(1)}`)).join(' ');
  const median = bands.map(b => `${x(b.age).toFixed(1)},${y(b.p50).toFixed(1)}`).join(' ');
  // y-axis: 5 gridlines with compact labels (no clipping in the millions)
  const yTicks = [0, 0.25, 0.5, 0.75, 1].map(f => { const v = maxV * f; return `<line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${W - 14}" y2="${y(v).toFixed(1)}" stroke="var(--color-divider)"></line>
    <text x="${padL - 7}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end" style="font-size:10px;fill:var(--color-text);opacity:0.7;">${esc(fmtCompactMoney(v))}</text>`; }).join('');
  // Optional shaded span (e.g. the college-spending years) so it's unmistakable WHEN money is drawn.
  let shadeEl = '';
  if (opts.shadeFrom != null && opts.shadeTo != null) {
    const sx0 = x(Math.max(a0, opts.shadeFrom)), sx1 = x(Math.min(a1, opts.shadeTo));
    shadeEl = `<rect x="${sx0.toFixed(1)}" y="${padT}" width="${Math.max(0, sx1 - sx0).toFixed(1)}" height="${plotH.toFixed(1)}" fill="var(--color-warn)" opacity="0.10"></rect>
      <text x="${((sx0 + sx1) / 2).toFixed(1)}" y="${(padT + 12).toFixed(1)}" text-anchor="middle" style="font-size:10px;fill:var(--color-warn);opacity:0.9;">${esc(opts.shadeLabel || '')}</text>`;
  }
  // x-axis: a tick every `tickEvery` years (default 5; denser for short spans like college)
  const tickEvery = opts.tickEvery || 5;
  const ageTicks = bands.filter(b => b.age % tickEvery === 0 || b.age === a1 || b.age === a0).map(b =>
    `<line x1="${x(b.age).toFixed(1)}" y1="${padT + plotH}" x2="${x(b.age).toFixed(1)}" y2="${padT + plotH + 4}" stroke="var(--color-text)" opacity="0.35"></line>
     <text x="${x(b.age).toFixed(1)}" y="${H - 9}" text-anchor="middle" style="font-size:10px;fill:var(--color-text);opacity:0.7;">${b.age}</text>`).join('');
  // marker (retirement / college start): dashed line + callout of the median balance there
  let markerEls = '';
  const mBand = marker ? bands.find(b => b.age === marker.age) : null;
  if (marker && marker.age >= a0 && marker.age <= a1) {
    const mx = x(marker.age), my = y(mBand ? mBand.p50 : 0);
    markerEls = `<line x1="${mx.toFixed(1)}" y1="${padT}" x2="${mx.toFixed(1)}" y2="${(padT + plotH).toFixed(1)}" stroke="var(--color-text)" stroke-dasharray="3 3" opacity="0.55"></line>
      <text x="${mx.toFixed(1)}" y="${padT - 10}" text-anchor="middle" style="font-size:10px;fill:var(--color-text);opacity:0.85;">${esc(marker.label)} ${marker.age}</text>
      ${mBand ? `<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="3.5" fill="var(--color-accent-700)"></circle>
      <text x="${(mx + 6).toFixed(1)}" y="${(my - 6).toFixed(1)}" style="font-size:11px;font-weight:600;fill:var(--color-accent-900);">${esc(fmtCompactMoney(mBand.p50))}</text>` : ''}`;
  }
  // hover hit columns + cursor + per-age lookup state (interactive mode only)
  const byAge = {}; bands.forEach(b => byAge[b.age] = b);
  let hits = '', cursor = '', readout = '';
  if (!isStatic) {
    FAN_STATE[id] = { byAge, maxV, padT, plotH };
    hits = bands.map((b, i) => {
      const cx = x(b.age);
      const left = i === 0 ? padL : (x(bands[i - 1].age) + cx) / 2;
      const right = i === bands.length - 1 ? padL + plotW : (cx + x(bands[i + 1].age)) / 2;
      return `<rect class="fanhit" data-fanid="${id}" data-age="${b.age}" data-cx="${cx.toFixed(1)}" x="${left.toFixed(1)}" y="${padT}" width="${(right - left).toFixed(1)}" height="${plotH}" fill="transparent"></rect>`;
    }).join('');
    cursor = `<line id="${id}-cursor" x1="0" y1="${padT}" x2="0" y2="${(padT + plotH).toFixed(1)}" stroke="var(--color-accent-900)" stroke-width="1" style="display:none;"></line>
      <circle id="${id}-cdot" r="3.8" fill="var(--color-accent-900)" style="display:none;"></circle>
      <text id="${id}-cval" text-anchor="middle" style="font-size:12px;font-weight:700;fill:var(--color-accent-900);paint-order:stroke;stroke:var(--color-panel);stroke-width:3.5px;display:none;"></text>`;
    readout = `<div class="fan-readout" id="${id}-readout" style="min-height:18px;font-size:12px;margin-bottom:4px;color:var(--color-text);">Hover the chart to see the balance at any age.</div>`;
  }
  return `<div data-fanwrap="${id}">
    ${readout}
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;" role="img" aria-label="Projected balance by age, with a range of outcomes">
      ${yTicks}${shadeEl}
      <polygon points="${poly('p10', 'p90')}" fill="var(--color-accent-100)"></polygon>
      <polygon points="${poly('p25', 'p75')}" fill="var(--color-accent-300)" opacity="0.75"></polygon>
      <polyline points="${median}" fill="none" stroke="var(--color-accent-700)" stroke-width="2.5"></polyline>
      ${markerEls}${ageTicks}${hits}${cursor}
    </svg>
    <div style="display:flex;gap:18px;flex-wrap:wrap;font-size:11px;margin-top:8px;" class="text-muted">
      <span><span class="swatch" style="background:var(--color-accent-700);"></span> Median simulated balance</span>
      <span><span class="swatch" style="background:var(--color-accent-300);"></span> Middle half of outcomes</span>
      <span><span class="swatch" style="background:var(--color-accent-100);"></span> 10th–90th percentile range</span>
    </div>
  </div>`;
}
// Fan-chart hover → show the balance at the hovered age in plain language.
function onFanHover(e) {
  const hit = e.target.closest && e.target.closest('.fanhit');
  if (!hit) return;
  const id = hit.dataset.fanid, age = +hit.dataset.age, st = FAN_STATE[id];
  if (!st) return;
  const b = st.byAge[age]; if (!b) return;
  const ro = document.getElementById(id + '-readout');
  if (ro) ro.innerHTML = `<b>Age ${age}:</b> median <b>${fmtCompactMoney(b.p50)}</b> · middle 50%: ${fmtCompactMoney(b.p25)}–${fmtCompactMoney(b.p75)} · middle 80%: ${fmtCompactMoney(b.p10)}–${fmtCompactMoney(b.p90)}`;
  const cx = +hit.dataset.cx;
  const cur = document.getElementById(id + '-cursor');
  if (cur) { cur.setAttribute('x1', cx); cur.setAttribute('x2', cx); cur.style.display = ''; }
  // Float the median value right at the cursor so the eye doesn't leave the chart.
  const yv = st.padT + st.plotH - Math.max(0, b.p50) / (st.maxV || 1) * st.plotH;
  const dot = document.getElementById(id + '-cdot');
  if (dot) { dot.setAttribute('cx', cx.toFixed(1)); dot.setAttribute('cy', yv.toFixed(1)); dot.style.display = ''; }
  const lbl = document.getElementById(id + '-cval');
  if (lbl) {
    let ly = yv - 9; if (ly < st.padT + 9) ly = yv + 17;   // flip below the dot if too near the top
    lbl.setAttribute('x', cx.toFixed(1)); lbl.setAttribute('y', ly.toFixed(1));
    lbl.textContent = fmtCompactMoney(b.p50);
    lbl.style.display = '';
  }
}

// Two-bar marginal-rate compare (r_now vs r_then joint & survivor).
function marginalCompareSVG(rNow, rJoint, rSurv) {
  const rows = [['This year (contribution)', rNow, 'var(--color-accent-700)'], ['Retirement — joint', rJoint, 'var(--color-accent-500)'], ['Retirement — survivor', rSurv, 'var(--color-accent-900)']];
  const maxR = Math.max(0.37, rNow, rJoint, rSurv);
  return `<div style="display:flex;flex-direction:column;gap:10px;">` + rows.map(([label, r, col]) => `
    <div style="display:grid;grid-template-columns:170px 1fr 48px;gap:8px;align-items:center;">
      <span style="font-size:12px;">${esc(label)}</span>
      <div style="background:var(--color-neutral-200);height:16px;border-radius:2px;overflow:hidden;"><div style="width:${(r / maxR * 100).toFixed(1)}%;height:100%;background:${col};"></div></div>
      <span class="tnum" style="font-size:12px;text-align:right;">${fmtPct(r * 100, 1)}</span>
    </div>`).join('') + `</div>`;
}

function retireEmptyState(msg) {

// Validation gate (§2): show the account→bucket mapping, editable inline, flag likely-mistagged accounts.
// Once confirmed it collapses into a closed <details> (not critical to keep on screen).
function retireMappingPanel(confirmed, scopeRow) {
  const bucketLabel = { pretax: 'Pre-tax', roth: 'Roth', taxable: 'Taxable', taxfree: 'Tax-free (HSA)' };

  const treatSel = a => `<select class="input" style="min-height:30px;padding:2px 6px;font-size:12px;" data-act="rd-map-treatment" data-account="${esc(a.id)}"><option value="">— none —</option>${TAX_TREATMENTS.map(t => `<option ${a.taxTreatment === t ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  const rows = accts.map(a => {
