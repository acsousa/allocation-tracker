      }
    });
  }
  for (const h of data.holdings || []) {
    if (!ids.accounts.has(h.accountId)) fail('holding ' + h.id + '.accountId', 'references a missing account');
    if (h.costBasis != null) number(h.costBasis, 'holding ' + h.id + '.costBasis');
  }
  const targetMap = (value, path) => {
    object(value, path);
    for (const [key, pct] of Object.entries(value)) number(pct, path + '.' + key);
  };
  for (const goal of data.goals || []) { date(goal.effectiveDate, 'goal.effectiveDate'); targetMap(goal.targets, 'goal.targets'); }
  for (const glide of data.glidePaths || []) {
    if (!Array.isArray(glide.bands)) fail('glidePath.bands', 'must be an array');
    for (const band of glide.bands) { object(band, 'glidePath.band'); targetMap(band.targets, 'glidePath.band.targets'); }
  }
  for (const plan of data.plans || []) {
    if (plan.moves !== undefined && !Array.isArray(plan.moves)) fail('plan.moves', 'must be an array');
    for (const move of plan.moves || []) object(move, 'plan.move');
  }
  const rs = data.retirementSettings;
  if (rs) {
    for (const key of ['birthYears', 'ssClaimAge', 'pensions']) if (rs[key] !== undefined && !Array.isArray(rs[key])) fail('retirementSettings.' + key, 'must be an array');
    for (const pension of rs.pensions || []) object(pension, 'retirementSettings.pension');
  }
  if (data.collegeSettings && data.collegeSettings.byChild !== undefined) {
    object(data.collegeSettings.byChild, 'collegeSettings.byChild');
    for (const value of Object.values(data.collegeSettings.byChild)) object(value, 'collegeSettings.byChild entry');
  }
  const dates = new Set();
  for (const snap of data.snapshots || []) {
    date(snap.date, 'snapshot.date');
    if (dates.has(snap.date)) fail('snapshot.date', 'is duplicated');
    dates.add(snap.date);
    if (!Array.isArray(snap.values)) fail('snapshot.values', 'must be an array');
    const seen = new Set();
    for (const v of snap.values) {
      object(v, 'snapshot.value');
      if (!ids.holdings.has(v.holdingId)) fail('snapshot.value.holdingId', 'references a missing holding');
      if (seen.has(v.holdingId)) fail('snapshot.value.holdingId', 'is duplicated');
      seen.add(v.holdingId);
      number(v.marketValue, 'snapshot.value.marketValue');
      if (v.costBasis != null) number(v.costBasis, 'snapshot.value.costBasis');
    }
  }
  if (data.meta && data.meta.schemaVersion !== undefined && (!Number.isInteger(data.meta.schemaVersion) || data.meta.schemaVersion < 0)) fail('meta.schemaVersion', 'must be a nonnegative integer');
  for (const key of ['retirementSettings', 'collegeSettings']) {
    const settings = data[key];
    if (settings && settings.paths !== undefined && (!Number.isInteger(settings.paths) || settings.paths < 1 || settings.paths > 20000)) fail(key + '.paths', 'must be an integer from 1 to 20000');
  }
}

// Reject newer-major files; migrate older ones silently.
function migrate(data) {
  validatePortfolio(data);
  data = JSON.parse(JSON.stringify(data)); // Migration must not mutate the caller's data.
  const v = (data.meta && data.meta.schemaVersion) || 0;
  if (v > SCHEMA_VERSION) {
    throw new Error(
      `This file was made by a newer version (schema ${v}). ` +
      `Update the tracker to open it.`
    );
  }
  const base = emptyPortfolio();
  const merged = Object.assign({}, base, data);
  merged.meta = Object.assign(base.meta, data.meta || {});
  // v2 → v3: tax module. Add plans[], taxSettings, taxData if absent.
  // Additive + idempotent — never drops existing user data.
  if (!Array.isArray(merged.plans)) merged.plans = [];
  merged.taxSettings = Object.assign(defaultTaxSettings(), data.taxSettings || {});
  if (!merged.taxData || typeof merged.taxData !== 'object') {
    merged.taxData = { lastRefreshed: null, source: 'bundled', tickers: {} };
  } else if (!merged.taxData.tickers || typeof merged.taxData.tickers !== 'object') {
    merged.taxData.tickers = {};
  }
  // v3 → v4: account "vehicle" (401k/IRA/HSA/529/taxable) for correct
  // contribution limits + shelter status. Infer from name/category if absent.
  for (const a of merged.accounts || []) { if (!a.vehicle) a.vehicle = inferVehicle(a); }
  // v4 → v5: retirement modeler settings. Additive; merge so new fields fill in.
  merged.retirementSettings = Object.assign(defaultRetirementSettings(), data.retirementSettings || {});
  merged.collegeSettings = Object.assign(defaultCollegeSettings(), data.collegeSettings || {});
  if (!merged.collegeSettings.byChild || typeof merged.collegeSettings.byChild !== 'object') merged.collegeSettings.byChild = {};
  // v1 → v2: US Total Market retired as a goal class; redistribute any goal
  // target on us_total into Large/Mid/Small by the default split.
  if (v < 2) {
    for (const g of merged.goals || []) {
      if (g.targets && g.targets.us_total) {
        const amt = Number(g.targets.us_total);
        const mid = Math.round(amt * 0.13), small = Math.round(amt * 0.05), large = amt - mid - small;
        g.targets.us_large = (g.targets.us_large || 0) + large;
        g.targets.us_mid = (g.targets.us_mid || 0) + mid;
        g.targets.us_small = (g.targets.us_small || 0) + small;
        delete g.targets.us_total;
      }
    }
  }
  merged.meta.schemaVersion = SCHEMA_VERSION;
  return merged;
}

/* ---------------------------------------------------------------
   ID helper — crypto.randomUUID with fallback (offline-safe)
   --------------------------------------------------------------- */
function uid(prefix) {
  const rnd = (self.crypto && self.crypto.randomUUID)
    ? self.crypto.randomUUID()
    : 'xxxxxxxxyxxxx'.replace(/[xy]/g, c => {
        const r = (self.crypto ? self.crypto.getRandomValues(new Uint8Array(1))[0] : Math.floor(Math.random()*256)) & 15;
        const val = c === 'x' ? r : (r & 0x3) | 0x8;
        return val.toString(16);
      });
  return (prefix ? prefix + '_' : '') + rnd;
}

/* ---------------------------------------------------------------
   CLASSIFICATION — user map wins over seed (spec §9)
   --------------------------------------------------------------- */
function classifyTicker(ticker, tickerMap) {
  if (!ticker) return null;
  const key = String(ticker).trim().toUpperCase();
  if (!key) return null;
  if (tickerMap && Object.prototype.hasOwnProperty.call(tickerMap, key)) return tickerMap[key];
  if (Object.prototype.hasOwnProperty.call(SEED_MAP, key)) return SEED_MAP[key];
  if (Object.prototype.hasOwnProperty.call(SEED_MAP_EXT, key)) return SEED_MAP_EXT[key];
  return null; // unknown → caller prompts with 14-class picker
}

/* ---------------------------------------------------------------
   In-memory state + dirty tracking (single object, spec §10)
   --------------------------------------------------------------- */
let portfolio = emptyPortfolio();
let dirty = false;
let fileHandle = null;      // File System Access API handle when available
let fileName = 'my-portfolio.json';

function markDirty() { dirty = true; updateDirtyIndicator(); }
function updateDirtyIndicator() { /* wired to UI in the render layer (M2+) */ }

/* ===============================================================
   CALC LAYER — pure functions over the portfolio object.
   No DOM, no side effects. Everything the dashboard/report needs.
   =============================================================== */

function accountById(id)  { return portfolio.accounts.find(a => a.id === id) || null; }
function childById(id)    { return portfolio.children.find(c => c.id === id) || null; }

function sortedSnapshots() {
  return portfolio.snapshots.slice().sort((a, b) => a.date.localeCompare(b.date));
}
function latestSnapshot() {
  const s = sortedSnapshots();
  return s.length ? s[s.length - 1] : null;
}
function snapshotByDate(date) {
  return portfolio.snapshots.find(s => s.date === date) || null;
}

/* Map holdingId -> {marketValue, costBasis} for a snapshot. */
function valueIndex(snapshot) {
  const idx = {};
  if (snapshot) for (const v of snapshot.values) idx[v.holdingId] = v;
  return idx;
}

/* Active (non-archived) holdings, optionally scoped to an account. */
function activeHoldings(accountId) {
  return portfolio.holdings.filter(h =>
    h.status !== 'archived' &&
    (accountId == null || h.accountId === accountId)
  );
}

/* Holdings belonging to accounts matching a predicate. */
function holdingsWhereAccount(pred) {
  const ok = new Set(portfolio.accounts.filter(pred).map(a => a.id));
  return portfolio.holdings.filter(h => ok.has(h.accountId));
}

/*
  Allocation for a set of holdings against a snapshot's values.
  Returns { detail:{id:value}, group:{id:value}, total, byHolding:[...] }.
  Only holdings with a positive value in the snapshot contribute.
*/
function allocate(holdings, snapshot) {
  const idx = valueIndex(snapshot);
  const detail = {};
  const group = {};
  const byHolding = [];
  let total = 0;
  for (const h of holdings) {
    const v = idx[h.id];
    if (!v) continue;
    const mv = Number(v.marketValue) || 0;
    if (mv === 0) continue;
    // Look-through: if the holding declares a composition, split its value
    // across the real classes (e.g. a target-date fund into stocks/bonds/intl).
    const comp = compositionOf(h);
    for (const [cls, part] of splitValue(mv, comp, h.assetClass)) {
      detail[cls] = (detail[cls] || 0) + part;
      group[rollupOf(cls)] = (group[rollupOf(cls)] || 0) + part;
    }
    total += mv;
    const cb = (v.costBasis != null ? Number(v.costBasis)
             : (h.costBasis != null ? Number(h.costBasis) : null));
    byHolding.push({
      holding: h, marketValue: mv, costBasis: cb,
      gain: cb != null ? mv - cb : null,
      gainPct: (cb != null && cb !== 0) ? (mv - cb) / cb : null,
      composed: !!comp,
    });
  }
  return { detail, group, total, byHolding };
}

/* A holding's composition map {classId: pct} if it has a valid one, else null.
   Total-market funds auto-decompose into Large/Mid/Small unless the user set an
   explicit composition. */
function compositionOf(h) {
  if (h.composition) {
    const keys = Object.keys(h.composition).filter(k => Number(h.composition[k]) > 0);
    if (keys.length) return h.composition;
  }
  if (h.assetClass === 'us_total') return US_TOTAL_SPLIT;
  return null;
}
/* Expand a single class + dollar amount into terminal classes. US Total Market
   is a blend, so it decomposes into Large/Mid/Small — even when it appears as a
   SLEEVE inside a fund's composition (e.g. a target-date fund's total-market
   holding). Any other class is terminal. */
function expandClass(cls, amt) {
  if (cls === 'us_total') {
    const s = US_TOTAL_SPLIT, tot = s.us_large + s.us_mid + s.us_small;
    return [['us_large', amt * s.us_large / tot], ['us_mid', amt * s.us_mid / tot], ['us_small', amt * s.us_small / tot]];
  }
  return [[cls, amt]];
}
/* Yield [classId, dollarPart] pairs for a holding's value, honoring composition
   and expanding any blend classes (us_total) into their components. */
function splitValue(mv, comp, primaryClass) {
  const raw = !comp
    ? [[primaryClass || 'other', mv]]
    : (() => {
        const entries = Object.entries(comp).filter(([, p]) => Number(p) > 0);
        const sum = entries.reduce((s, [, p]) => s + Number(p), 0) || 1;
        return entries.map(([cls, p]) => [cls, mv * (Number(p) / sum)]);
      })();
  const out = [];
  for (const [cls, part] of raw) for (const pair of expandClass(cls, part)) out.push(pair);
  return out;
}

/* Convert a {id:value} map + total into sorted [{id,label,color,value,pct}]. */
function toRows(valueMap, total, level /* 'detail'|'group' */) {
  const order = level === 'group'
    ? TAXONOMY.groups.map(g => g.id)
    : TAXONOMY.detail.map(d => d.id);
  const rows = [];
  for (const id of order) {
    const value = valueMap[id] || 0;
    if (value === 0) continue;
    rows.push({
      id,
      label: level === 'group' ? GROUP_BY_ID[id].label : detailLabel(id),
      color: level === 'group' ? groupColor(id) : detailColor(id),
      value,
      pct: total > 0 ? (value / total) * 100 : 0,
    });
  }
  return rows;
}
/* Rollup-group color comes from its own token (mockup legend order). */
function groupColor(groupId) { return cssVarValue('--g-' + groupId, '#b7b7ba'); }

/* ---- Scopes (spec §4/§5): household EXCLUDES 529 (measured vs glide). ---- */
function householdHoldings() {
  const inc529 = !!portfolio.meta.include529InHousehold;
  return holdingsWhereAccount(a => a.status !== 'archived' && (inc529 || a.category !== '529'))
    .filter(h => h.status !== 'archived');
}
function categoryHoldingsLabeled(category, label) {
  if (category === 'Other' && label) {
    return holdingsWhereAccount(a => a.status !== 'archived' && a.category === 'Other' && (a.categoryLabel || 'Other') === label)
      .filter(h => h.status !== 'archived');
  }
  return categoryHoldings(category);
}
function categoryHoldings(category) {
  return holdingsWhereAccount(a => a.status !== 'archived' && a.category === category)
    .filter(h => h.status !== 'archived');
}
function accountHoldings(accountId) {
  return activeHoldings(accountId);
}

/* ---- Goals (append-only journal; active = latest effective <= date) ---- */
function activeGoal(asOfDate) {
  const eligible = portfolio.goals
    .filter(g => !asOfDate || g.effectiveDate <= asOfDate)
    .sort((a, b) => a.effectiveDate.localeCompare(b.effectiveDate));
  return eligible.length ? eligible[eligible.length - 1] : null;
}

/* Goals may be stored at detail (14-class) or legacy rollup (6-group) level. */
function goalIsDetail(goal) {
  return !!(goal && goal.targets && Object.keys(goal.targets).some(k => DETAIL_BY_ID[k]));
}
/* Group-level targets: sum detail targets into their rollup groups (or pass a
   legacy rollup goal through unchanged). Always available. */
function goalGroupTargets(goal) {
  if (!goal) return null;
  if (!goalIsDetail(goal)) return goal.targets;
  const g = {};
  for (const [cls, pct] of Object.entries(goal.targets)) {
    const grp = rollupOf(cls);
    g[grp] = (g[grp] || 0) + Number(pct);
  }
  return g;
}
/* Detail-level targets: only a detail goal exposes these (a rollup goal can't
   be split into 14 classes unambiguously). */
function goalDetailTargets(goal) { return goalIsDetail(goal) ? goal.targets : null; }

/*
  Drift = actual% - target%. Positive = overweight.
  targets keyed by the same level as actualRows (detail or group ids).
  Returns [{id,label,actualPct,targetPct,driftPct,breach,valueDelta}].
*/
function computeDrift(actualRows, total, targets, band) {
  const bandPct = band != null ? band : (portfolio.meta.driftBandPct || 5);
  const byId = Object.fromEntries(actualRows.map(r => [r.id, r]));
  const ids = new Set([...Object.keys(targets || {}), ...actualRows.map(r => r.id)]);
  const out = [];
  for (const id of ids) {
    const targetPct = (targets && targets[id]) || 0;
    const r = byId[id];
    const actualPct = r ? r.pct : 0;
    const driftPct = actualPct - targetPct;
    out.push({
      id,
      label: GROUP_BY_ID[id] ? GROUP_BY_ID[id].label : detailLabel(id),
      color: GROUP_BY_ID[id] ? groupColor(id) : detailColor(id),
      actualPct, targetPct, driftPct,
      breach: Math.abs(driftPct) > bandPct,
      valueDelta: total * (driftPct / 100), // ≈ $ over/under target
    });
  }
  // stable order by taxonomy
  const rank = {};
  TAXONOMY.groups.forEach((g, i) => rank[g.id] = i);
  TAXONOMY.detail.forEach((d, i) => rank[d.id] = 100 + i);
  out.sort((a, b) => (rank[a.id] ?? 999) - (rank[b.id] ?? 999));
  return out;
}

/* ---- 529 glide paths: child age → matching band's targets ---- */
function childAge(birthYear, asOfDate) {
  const year = asOfDate ? Number(asOfDate.slice(0, 4)) : new Date().getFullYear();
  return Math.max(0, year - Number(birthYear));
}
function glideTargets(childId, asOfDate) {
  const gp = portfolio.glidePaths.find(g => g.childId === childId);
  if (!gp) return null;
  const child = childById(childId);
  if (!child) return null;
  const age = childAge(child.birthYear, asOfDate);
  const band = (gp.bands || []).find(b => age >= b.ageFrom && age <= b.ageTo);
  return band ? { targets: band.targets, age, band, rationale: gp.rationale } : { targets: null, age };
}

/* ---- History: per-snapshot rollup series for the stacked area (F4) ---- */
function historySeries(scope /* 'household'|category|null=all */) {
  const snaps = sortedSnapshots();
  const pickHoldings = scope == null || scope === 'all'
    ? () => portfolio.holdings.filter(h => h.status !== 'archived')
    : scope === 'household' ? householdHoldings
    : () => categoryHoldings(scope);
  return snaps.map(s => {
    const a = allocate(pickHoldings(), s);
    return { date: s.date, total: a.total, group: a.group, detail: a.detail };
  });
}

/* ===============================================================
   TAX CALC LAYER (F9/F8) — portfolio-aware, built on the pure
   tax engine above. All offline; §13.2–13.9.
   =============================================================== */
function taxRates() { return deriveRates(REFERENCE_DATA, portfolio.taxSettings); }

// Per-holding drag rows for a snapshot, worst-first (§13.2).
function holdingDragRows(snapshot, rates) {
  rates = rates || taxRates();
  const idx = valueIndex(snapshot);
  const rows = [];
  for (const h of activeHoldings()) {
    const v = idx[h.id];
    if (!v || !(Number(v.marketValue) > 0)) continue;
    const acct = accountById(h.accountId) || {};
    const shelter = accountShelter(acct);
    const mv = Number(v.marketValue);
    const { profile, estimated, source } = tickerProfile(h.ticker, h.assetClass, portfolio.taxData);
    const wouldBeDrag = holdingDrag(mv, profile, rates); // drag if this holding sat in a taxable account
    const drag = shelter.sheltered ? 0 : wouldBeDrag;
    const cb = v.costBasis != null ? v.costBasis : (h.costBasis != null ? h.costBasis : null);
    rows.push({
      holdingId: h.id, ticker: h.ticker || '', name: h.name || '',
      accountId: h.accountId, accountName: acct.name || '(account)',
      assetClass: h.assetClass, mv, costBasis: cb == null ? null : Number(cb),
      sheltered: shelter.sheltered, reason: shelter.reason,
      profile, estimated, source, drag, wouldBeDrag,
      avoided: shelter.sheltered ? wouldBeDrag : 0, // tax shielded by good placement
      dragPerDollar: shelter.sheltered ? 0 : holdingDrag(1, profile, rates),
    });
  }
  rows.sort((a, b) => b.drag - a.drag);
  return rows;
}

// §13.9 scorecard for a snapshot.
function taxScorecard(snapshot) {
  const rates = taxRates();
  const rows = holdingDragRows(snapshot, rates);
  let totalDrag = 0, taxableAssets = 0, shieldedAssets = 0, taxShielded = 0, locNum = 0, locDen = 0;
  for (const r of rows) {
    totalDrag += r.drag;
    if (r.sheltered) { shieldedAssets += r.mv; taxShielded += r.avoided; }
    else taxableAssets += r.mv;
    if (INEFFICIENT_CLASSES.includes(r.assetClass)) {
      locDen += r.mv;
      if (r.sheltered) locNum += r.mv;
    }
  }
  const dragPct = taxableAssets > 0 ? (totalDrag / taxableAssets) * 100 : 0;
  const locScore = locDen > 0 ? (locNum / locDen) * 100 : null;
  return { rates, rows, totalDrag, taxableAssets, shieldedAssets, taxShielded, dragPct, locScore, locNum, locDen };
}

const EFFICIENT_FOR_TAXABLE = ['us_large', 'us_total', 'intl_dev', 'us_mid', 'us_small'];

// §13.5 location-swap recommendations (allocation-neutral pairs).
function locationSwapRecs(snapshot) {
  const rates = taxRates();
  const rows = holdingDragRows(snapshot, rates);
  const inefTaxable = rows
    .filter(r => !r.sheltered && INEFFICIENT_CLASSES.includes(r.assetClass) && r.mv > 0)
    .sort((a, b) => b.drag - a.drag);
  const effSheltered = rows
    .filter(r => r.sheltered && EFFICIENT_FOR_TAXABLE.includes(r.assetClass) && r.mv > 0)
    .sort((a, b) => a.dragPerDollarTaxable - b.dragPerDollarTaxable);
  // Precompute each sheltered efficient holding's would-be taxable per-$ drag.
  for (const b of effSheltered) {
    b.dragPerDollarTaxable = holdingDrag(1, b.profile, rates);
  }
  effSheltered.sort((a, b) => a.dragPerDollarTaxable - b.dragPerDollarTaxable);
  const usedB = {};   // holdingId → dollars already committed
  const recs = [];
  for (const a of inefTaxable) {
    const dA = a.dragPerDollar;  // per-$ drag of A in taxable
    let best = null;
    for (const b of effSheltered) {
      const avail = b.mv - (usedB[b.holdingId] || 0);
      if (avail <= 1) continue;
      if (b.dragPerDollarTaxable >= dA) continue; // B must be more efficient than A
      if (!best || b.dragPerDollarTaxable < best.dragPerDollarTaxable) best = b;
    }
    if (!best) continue;
    const bAvail = best.mv - (usedB[best.holdingId] || 0);
    const X = Math.min(a.mv, bAvail);
    if (X <= 1) continue;
    const savings = X * (dA - best.dragPerDollarTaxable);
    if (savings <= 0) continue;
    // One-time realization cost on the A portion sold in taxable (§13.5).
    let oneTime = 0, realizedGain = 0, basisKnown = a.costBasis != null;
    if (basisKnown) {
      const gainFull = a.mv - a.costBasis;
      realizedGain = Math.max(0, (X / a.mv) * gainFull);
      oneTime = realizedGain * rates.r_ltcg_eff;
    }
    // Recommend only when one-time cost is $0 or < 2 years of savings (§13.5).
    const worthIt = oneTime === 0 || oneTime < 2 * savings;
    if (!worthIt) continue;
    usedB[best.holdingId] = (usedB[best.holdingId] || 0) + X;
    recs.push({
      kind: 'location-swap', amount: X, savingsPerYr: savings,
      oneTimeCost: oneTime, realizedGain, basisKnown,
      aTicker: a.ticker, aClass: a.assetClass, aAccountId: a.accountId, aAccountName: a.accountName,
      bTicker: best.ticker, bClass: best.assetClass, bAccountId: best.accountId, bAccountName: best.accountName,
    });
    if (recs.length >= 6) break;
  }
  return recs;
}

const DEFAULT_MUNI_YIELD = 3.3; // VTEB national muni fund (federal-exempt).

// §13.6 muni comparison (only when r_ord ≥ 32% and bonds sit in taxable).
function muniRecs(snapshot) {
  const rates = taxRates();
  if (rates.r_ord < 0.32) return [];
  const rows = holdingDragRows(snapshot, rates);
  const recs = [];
  for (const r of rows) {
    if (r.sheltered || r.assetClass !== 'us_bond') continue;
    if (r.profile && r.profile.muni) continue; // already a muni fund
    const y_t = (r.profile.divYield || 0);
    const inState = !!(portfolio.taxSettings && portfolio.taxSettings.inStateMuni);
    const y_m = DEFAULT_MUNI_YIELD;
    // Taxable-side rate honors any US-Treasury state-exemption in the bond (M1),
    // so a Treasury-heavy fund isn't overtaxed vs the muni.
    const taxableAT = y_t * (1 - ordinaryInterestRate(r.profile, rates));
    // National muni: federal-exempt, state-taxable. In-state muni (M4): exempt
    // from BOTH federal and state.
    const muniAT = inState ? y_m : y_m * (1 - rates.r_state);
    if (muniAT <= taxableAT) continue;
    const savings = r.mv * (muniAT - taxableAT) / 100;
    let oneTime = 0, realizedGain = 0, basisKnown = r.costBasis != null;
    if (basisKnown) { realizedGain = Math.max(0, r.mv - r.costBasis); oneTime = realizedGain * rates.r_ltcg_eff; }
    recs.push({
      kind: 'muni', amount: r.mv, savingsPerYr: savings, oneTimeCost: oneTime, realizedGain, basisKnown,
      aTicker: r.ticker, aAccountId: r.accountId, aAccountName: r.accountName,
      muniTicker: inState ? 'in-state muni' : 'VTEB', taxableAT, muniAT, inState,
    });
  }
  return recs;
}

// Rough expected-return ranking (higher = faster grower → prefer in Roth).
const EXPECTED_RETURN_RANK = {
  crypto: 9, em: 8, us_small: 7, us_mid: 6, intl_dev: 5, us_large: 4, us_total: 4,
  reit: 4, blend: 3, commod: 3, us_bond: 2, intl_bond: 2, cash: 1, other: 3,
};
// §13.3 Roth placement: Roth growth is never taxed, so hold the highest-expected-
// return assets there. Flags a swap when a Roth holds a slow grower while a
// traditional (pre-tax) sheltered account holds a fast one. Allocation-neutral,
// both sides tax-free (no realization cost).
function rothPlacementRecs(snapshot) {
  const idx = valueIndex(snapshot);
  const roth = [], trad = [];
  for (const h of activeHoldings()) {
    const v = idx[h.id]; if (!v || !(Number(v.marketValue) > 0)) continue;
    const acct = accountById(h.accountId); if (!acct) continue;
    const sh = accountShelter(acct); if (!sh.sheltered) continue;
    const rank = EXPECTED_RETURN_RANK[h.assetClass] != null ? EXPECTED_RETURN_RANK[h.assetClass] : 3;
    const rec = { ticker: h.ticker, assetClass: h.assetClass, accountId: h.accountId, accountName: acct.name, mv: Number(v.marketValue), rank };
    if (acct.taxTreatment === 'Roth' || /Roth/.test(sh.reason)) roth.push(rec); else trad.push(rec);
  }
  if (!roth.length || !trad.length) return [];
  const bestTrad = trad.slice().sort((a, b) => b.rank - a.rank)[0];
  const worstRoth = roth.slice().sort((a, b) => a.rank - b.rank)[0];
  if (bestTrad.rank <= worstRoth.rank) return []; // already well-placed
  const X = Math.min(bestTrad.mv, worstRoth.mv);
  if (X < 500) return [];
  return [{
    kind: 'roth-placement', amount: X,
    highTicker: bestTrad.ticker, highClass: bestTrad.assetClass, tradAccountId: bestTrad.accountId, tradAccountName: bestTrad.accountName,
    lowTicker: worstRoth.ticker, lowClass: worstRoth.assetClass, rothAccountId: worstRoth.accountId, rothAccountName: worstRoth.accountName,
  }];
}

// §13.7 wash-sale scan for a plan's moves + directive.
function washWarnings(plan) {
  if (!plan) return [];
  const buys = new Set();
  for (const m of plan.moves || []) if (m.buyTicker) for (const t of washCloneSet(m.buyTicker)) buys.add(t);
  if (plan.directive && plan.directive.splits) {
    for (const s of plan.directive.splits) if (s.ticker) for (const t of washCloneSet(s.ticker)) buys.add(t);
  }
  const warns = [], seen = new Set();
  for (const m of plan.moves || []) {
    if (!m.sellTicker) continue;
    const t0 = m.sellTicker.toUpperCase();
    if (seen.has(t0)) continue; // one warning per sold ticker
    const set = washCloneSet(m.sellTicker);
    if (set.some(t => buys.has(t))) {
      seen.add(t0);
      warns.push({ ticker: m.sellTicker, clones: set.filter(t => t !== t0) });
    }
  }
  return warns;
}

/* Contribution limit for an account's vehicle (annual, employee side). */
function vehicleContribLimit(vehicle, lim) {
  if (vehicle === '401k') return lim.k401_elective; // 401(k)/403(b)/TSP elective deferral
  if (vehicle === 'ira') return lim.ira;             // IRA (Roth or Traditional)
  if (vehicle === 'hsa') return lim.hsa_self;        // HSA (self-only default; family is higher)
  return 0; // taxable / 529 / other: no elective cap enforced here
}
// Fill priority (§13.8): HSA first (triple tax advantage), then 401k, IRA, 529.
const VEHICLE_FILL_PRIORITY = { hsa: 1, '401k': 2, ira: 3, '529': 4 };

/* Savings directive — steer householdMonthlySavings by contribution headroom
   (capped on each account's VEHICLE, not its tax treatment) in priority order,
   then toward the most-underweight classes. Returns { monthly, lines[],
   text, splits[] } or null when no savings figure is set. */
function savingsDirective(snapshot) {
  const ts = portfolio.taxSettings || {};
  const monthly = Number(ts.householdMonthlySavings) || 0;
  if (monthly <= 0) return null;
  const lim = REFERENCE_DATA.contribLimits;
  const ytd = ts.ytdContributions || {};
  // Ownership is not recorded: conservatively share one base limit per vehicle.
  // Sum YTD across all accounts (even archived ones) before allocating headroom.
  const usedByVehicle = {};
  for (const a of portfolio.accounts) {
    const vehicle = accountVehicle(a);
    usedByVehicle[vehicle] = (usedByVehicle[vehicle] || 0) + Math.max(0, Number(ytd[a.id]) || 0);
  }
  const headrooms = [];
  for (const a of portfolio.accounts) {
    if (a.status === 'archived') continue;
    const vehicle = accountVehicle(a);
    const cap = vehicleContribLimit(vehicle, lim);
    if (cap <= 0) continue; // taxable / 529 / other → not part of the capped fill
    const room = Math.max(0, cap - (usedByVehicle[vehicle] || 0));
    if (room > 0) headrooms.push({ accountId: a.id, name: a.name, room, vehicle, priority: VEHICLE_FILL_PRIORITY[vehicle] || 9 });
  }
  headrooms.sort((a, b) => a.priority - b.priority); // HSA → 401k → IRA → 529
  // Most-underweight classes from household drift (targets − actual).
  const under = underweightClasses(snapshot);
  const topClass = under.length ? under[0] : null;
  const splits = [];
  const lines = [];
  let remainingAnnual = monthly * 12;
  const allocatedByVehicle = {};
  for (const h of headrooms) {
    if (remainingAnnual <= 0) break;
    const fill = Math.min(Math.max(0, h.room - (allocatedByVehicle[h.vehicle] || 0)), remainingAnnual);
    if (fill <= 0) continue;
    allocatedByVehicle[h.vehicle] = (allocatedByVehicle[h.vehicle] || 0) + fill;
    remainingAnnual -= fill;
    const perMo = fill / 12;
    const tkr = topClass ? topClass.suggestTicker : 'VTI';
    splits.push({ accountId: h.accountId, ticker: tkr, pctOrAmt: perMo });
    lines.push(`Fill ${h.name}: ~${fmtMoney(perMo)}/mo → ${tkr}`);
  }
  if (remainingAnnual > 0) {
    const perMo = remainingAnnual / 12;
    const tkr = topClass ? topClass.suggestTicker : 'VTI';
    splits.push({ accountId: 'taxable', ticker: tkr, pctOrAmt: perMo });
    lines.push(`Remainder to taxable: ~${fmtMoney(perMo)}/mo → ${tkr}`);
  }
  // The tool can't see your employer match — flag it as the true first priority.
  if (headrooms.some(h => h.vehicle === '401k')) lines.unshift('First capture any employer 401(k) match');
  lines.push('Illustrative base limits shared across accounts of each type; confirm owner-specific headroom, income eligibility, employer contributions and HSA coverage before contributing.');
  const text = lines.join(' · ');
  return { monthly, lines, text, splits };
}

// Underweight classes (target − actual > 0), most-underweight first.
const CLASS_SUGGEST_TICKER = {
  us_large: 'VOO', us_mid: 'VO', us_small: 'VB', us_total: 'VTI',
  intl_dev: 'VEA', em: 'VWO', us_bond: 'BND', intl_bond: 'BNDX',
  reit: 'VNQ', commod: 'PDBC', crypto: 'BTC', cash: 'VMFXX',
  blend: 'VTI', other: '',
};
function underweightClasses(snapshot) {
  const goal = activeGoal(snapshot ? snapshot.date : null);
  if (!goal) return [];
  const holds = householdHoldings();
  const a = allocate(holds, snapshot);
  const detail = goalIsDetail(goal);
  const targets = detail ? goalDetailTargets(goal) : goalGroupTargets(goal);
  const rows = detail ? toRows(a.detail, a.total, 'detail') : toRows(a.group, a.total, 'group');
  const drift = computeDrift(rows, a.total, targets, portfolio.meta.driftBandPct || 5);
  const out = [];
  for (const d of drift) {
    if (d.driftPct < 0) { // underweight
      out.push({
        classId: d.id, level: detail ? 'detail' : 'group',
        driftPct: d.driftPct, gapDollars: (Math.abs(d.driftPct) / 100) * a.total,
        suggestTicker: detail ? (CLASS_SUGGEST_TICKER[d.id] || 'VTI') : 'VTI',
      });
    }
  }
  out.sort((x, y) => x.driftPct - y.driftPct); // most negative first
  return out;
}

// Most-recent plan (attached to whatever snapshot it was made on).
function latestPlan() {
  const ps = (portfolio.plans || []).slice().sort((a, b) => (a.snapshotDate || '').localeCompare(b.snapshotDate || ''));
  return ps.length ? ps[ps.length - 1] : null;
}
function planForSnapshot(date) {
  return (portfolio.plans || []).find(p => p.snapshotDate === date) || null;
}

/* ===============================================================
   CSV EXPORT (F6/F7) — plain, Excel-friendly.
   =============================================================== */
function csvEscape(v) {
  let s = String(v == null ? '' : v);
  // Spreadsheet applications interpret formula-looking text even inside CSV quotes.
  if (typeof v === 'string' && /^[\s]*[=+@-]/.test(s)) s = "'" + s;
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(rows) { return rows.map(r => r.map(csvEscape).join(',')).join('\r\n'); }

function snapshotCSV(snapshot) {
  const idx = valueIndex(snapshot);
  const rows = [['Account', 'Category', 'Ticker', 'Name', 'Asset Class', 'Rollup', 'Market Value', 'Cost Basis', 'Unrealized Gain']];
  for (const h of portfolio.holdings) {
    const v = idx[h.id];
    if (!v) continue;
    const acct = accountById(h.accountId) || {};
    const cb = v.costBasis != null ? v.costBasis : (h.costBasis != null ? h.costBasis : '');
    const gain = (cb !== '' && cb != null) ? (Number(v.marketValue) - Number(cb)) : '';
    rows.push([
      acct.name || '', acct.category || '', h.ticker || '', h.name || '',
      detailLabel(h.assetClass), GROUP_BY_ID[rollupOf(h.assetClass)].label,
      v.marketValue, cb, gain,
    ]);
  }
  return toCSV(rows);
}

/* ===============================================================
   PERSISTENCE (spec §10) — file is the source of truth.
   File System Access API on Chrome/Edge; download/upload fallback.
   =============================================================== */
const HAS_FSA = typeof window !== 'undefined'
  && 'showSaveFilePicker' in window && 'showOpenFilePicker' in window;

let pendingHandle = null; // remembered file awaiting a permission re-grant

/* Remember the file handle so the app can re-open the same file next launch
   (Chrome/Edge). IndexedDB stores a FileSystemFileHandle natively. */
const HANDLE_DB = 'aat-handles', HANDLE_STORE = 'h', HANDLE_KEY = 'portfolio';
function _idb() {
  return new Promise((res, rej) => {
    let r; try { r = indexedDB.open(HANDLE_DB, 1); } catch (e) { return rej(e); }
    r.onupgradeneeded = () => r.result.createObjectStore(HANDLE_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function rememberHandle(handle) {
  if (!handle) return;
  try {
    const db = await _idb();
    await new Promise((res, rej) => {
      const tx = db.transaction(HANDLE_STORE, 'readwrite');
      tx.objectStore(HANDLE_STORE).put(handle, HANDLE_KEY);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  } catch (e) { /* non-fatal — handle just won't be remembered */ }
}
async function recallHandle() {
  try {
    const db = await _idb();
    return await new Promise(res => {
      const rq = db.transaction(HANDLE_STORE, 'readonly').objectStore(HANDLE_STORE).get(HANDLE_KEY);
      rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null);
    });
  } catch (e) { return null; }
}

/* On startup, restore the last file automatically where the browser allows. */
async function tryAutoload() {
  if (HAS_FSA) {
    const handle = await recallHandle();
    if (handle && typeof handle.queryPermission === 'function') {
      try {
        const perm = await handle.queryPermission({ mode: 'readwrite' });
        if (perm === 'granted') {
          const file = await handle.getFile();
          portfolio = migrate(JSON.parse(await file.text()));
          fileHandle = handle; fileName = handle.name || fileName; dirty = false;
          return { loaded: true };
        }
        if (perm === 'prompt') { pendingHandle = handle; return { needsClick: true, name: handle.name }; }
      } catch (e) { /* stored handle is stale */ }
    }
  }
  return { loaded: false };
}

async function reopenPending() {
  if (!pendingHandle) return;
  try {
    const perm = await pendingHandle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') { toast('Permission not granted'); return; }
    const file = await pendingHandle.getFile();
    portfolio = migrate(JSON.parse(await file.text()));
    fileHandle = pendingHandle; fileName = pendingHandle.name || fileName; dirty = false;
    pendingHandle = null; ui.pendingReopen = null;
    resetViewState(); render(); toast('Loaded · ' + fileName);
  } catch (e) { toast('Could not open: ' + e.message); }
}

function serialize() { return JSON.stringify(portfolio, null, 2); }

function triggerDownload(text, name, mime) {
  const blob = new Blob([text], { type: mime || 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function saveFile(forceNew) {
  const text = serialize();
  const savedPortfolio = portfolio;
  if (HAS_FSA) {
    try {
      let targetHandle = fileHandle;
      if (!targetHandle || forceNew) {
        targetHandle = await window.showSaveFilePicker({
          suggestedName: fileName,
          // Suggest the folder the file came from (a prior handle) so "Save As"
          // lands where the file was loaded; otherwise start in Documents.
          startIn: fileHandle || pendingHandle || 'documents',
          types: [{ description: 'Portfolio JSON', accept: { 'application/json': ['.json'] } }],
        });
      }
      const w = await targetHandle.createWritable();
      await w.write(text); await w.close();
      if (portfolio === savedPortfolio) {
        fileHandle = targetHandle; fileName = targetHandle.name || fileName;
        dirty = serialize() !== text; updateDirtyIndicator();
        rememberHandle(fileHandle);
      }
      return { ok: true, via: 'fsa' };
    } catch (e) {
      if (e && e.name === 'AbortError') return { ok: false, aborted: true };
      // fall through to download
    }
  }
  triggerDownload(text, fileName, 'application/json');
  if (portfolio === savedPortfolio) { dirty = serialize() !== text; updateDirtyIndicator(); }
  return { ok: true, via: 'download' };
}

// Classic hidden <input type=file> loader — works everywhere, including sandboxed webviews
// where the File System Access picker is blocked. Used as the fallback (and sole path) below.
function openFileViaInput() {
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.json,application/json';
    const finish = result => { input.remove(); resolve(result); };
    input.oncancel = () => finish({ ok: false, aborted: true });
    input.onchange = async () => {
      const file = input.files && input.files[0];
      if (!file) return finish({ ok: false, aborted: true });
      try {
        const data = JSON.parse(await file.text());
        portfolio = migrate(data);
        fileHandle = null; fileName = file.name || fileName; dirty = false;
        finish({ ok: true });
      } catch (e) { finish({ ok: false, error: e.message }); }
    };
    // Some webviews only fire the picker when the input is in the DOM.
    input.style.display = 'none'; document.body.appendChild(input);
    input.click();
    setTimeout(() => input.remove(), 60000);
  });
}
async function openFile() {
  if (HAS_FSA) {
    let selected = false;
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'Portfolio JSON', accept: { 'application/json': ['.json'] } }],
      });
      selected = true;
      const file = await handle.getFile();
      const data = JSON.parse(await file.text());
      portfolio = migrate(data);
      fileHandle = handle; fileName = handle.name || fileName;
      dirty = false;
      rememberHandle(handle);
      return { ok: true };
    } catch (e) {
      if (e && e.name === 'AbortError') return { ok: false, aborted: true };
      if (selected) return { ok: false, error: e.message };
      // Picker blocked/failed in this environment (e.g. sandboxed webview) — fall back to <input type=file>.
      return openFileViaInput();
    }
  }
  return openFileViaInput();
}

/* Autosave reminder if there are unsaved changes (spec §10). */
window.addEventListener('beforeunload', (e) => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; return ''; }
});

function catLabel(cat) { return CATEGORY_LABELS[cat] || cat; }

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function todayISO() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function parseNum(v) {
  if (v == null) return null;
  const s = String(v).replace(/[$,\s]/g, '');

const CIRC = 2 * Math.PI * 70; // r=70 circumference for the main donut

  }

/* 100% stacked bars for allocation-% over time, placed on the time axis. */
function pctStackSVG(series, id) {

/* Readout for the hovered snapshot column. */
function chartReadoutHTML(d, i) {
  const s = d.series[i];
  let rows;
  if (d.kind === 'growth') {
    rows = d.lines.map(l => `<div class="ro-line"><span class="swatch" style="background:${l.color}"></span>${esc(l.label)}<span class="tnum">${fmtMoney(l.points[i])}</span></div>`).join('');
  } else {
    const total = s.total || 0;
    rows = TAXONOMY.groups.filter(g => s.group[g.id]).map(g => {
      const v = s.group[g.id], pct = total > 0 ? (v / total) * 100 : 0;
      const val = d.kind === 'pct' ? pct.toFixed(1) + '%' : fmtMoney(v) + ' · ' + pct.toFixed(0) + '%';
      return `<div class="ro-line"><span class="swatch" style="background:${groupColor(g.id)}"></span>${esc(g.label)}<span class="tnum">${val}</span></div>`;
    }).join('');
  }
  const head = d.kind === 'value' ? `${esc(s.date)} · ${fmtMoney(s.total)}` : esc(s.date);
  return `<div class="ro-date">${head}</div>${rows}`;
}
function onChartHover(e) {
  const hit = e.target.closest ? e.target.closest('.snaphit') : null;
  if (!hit) return;
  const d = CHART_DATA[hit.dataset.chart]; if (!d) return;
  const ro = document.getElementById('chart-ro-' + hit.dataset.chart); if (!ro) return;
  ro.innerHTML = chartReadoutHTML(d, +hit.dataset.snap);
}

/* Theme: portfolio.meta.theme is 'system' | 'light' | 'dark'. applyTheme reflects it
   onto <html data-theme>; 'system' leaves it unset so prefers-color-scheme decides. */
function themeEffective() {
  const t = (portfolio.meta && portfolio.meta.theme) || 'system';
  if (t === 'light' || t === 'dark') return t;
  return (self.matchMedia && self.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function themeIsDark() { return themeEffective() === 'dark'; }
function applyTheme() {
  const t = (portfolio.meta && portfolio.meta.theme) || 'system';
  const root = document.documentElement;
  if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t);
  else root.removeAttribute('data-theme');
}

  // Flip to the opposite of what's currently showing, and remember it in the file.
  portfolio.meta.theme = themeIsDark() ? 'light' : 'dark';
  applyTheme(); markDirty(); render();
}

function renderDashboard() {
  const snap = currentSnapshot();
  if (!snap) return dashNoSnapshotHTML();

  const drill = ui.drill;
  const is529 = drill.level === 'category' && drill.category === '529';
  let holdings, scopeLabel, goalTargets, goalNote, glideInfo = null;

  if (drill.level === 'household') { holdings = householdHoldings(); scopeLabel = 'Household'; }
  else if (drill.level === 'category') {
    holdings = categoryHoldingsLabeled(drill.category, drill.categoryLabel);
    scopeLabel = drill.categoryLabel || drill.category;
  } else {
    holdings = accountHoldings(drill.accountId);
    const acct = accountById(drill.accountId); scopeLabel = acct ? acct.name : 'Account';
  }

  const alloc = allocate(holdings, snap);
  const level = ui.level;
  const actualRows = toRows(level === 'group' ? alloc.group : alloc.detail, alloc.total, level);

  // goal / glide targets for this scope (dashboard "Goal" selector can override
  // the date-based active goal to compare against any named goal).
  const goal = (ui.goalSel && portfolio.goals.find(x => x.effectiveDate === ui.goalSel)) || activeGoal(snap.date);
  if (drill.level === 'account') {
    const acct = accountById(drill.accountId);
    if (acct && acct.category === '529' && acct.childId) {
      glideInfo = glideTargets(acct.childId, snap.date);
      // Age comes from the child's birth year (Settings › Household) even with no glide path defined yet.
      if (!glideInfo) { const ch = childById(acct.childId); if (ch && ch.birthYear != null) glideInfo = { age: childAge(ch.birthYear, snap.date), targets: null }; }
      goalTargets = glideInfo && glideInfo.targets; goalNote = '529 glide band';
    } else { goalTargets = goal && rollupTargets(goal, level); goalNote = goal ? 'Household goal ' + goal.effectiveDate : null; }
  } else if (is529) {
    goalTargets = null; goalNote = 'Per-child glide (drill into a child account)';
  } else {
    goalTargets = goal && rollupTargets(goal, level); goalNote = goal ? 'Household goal ' + goal.effectiveDate : null;
  }

  const band = portfolio.meta.driftBandPct || 5;
  // Drift must compare like against like. 529 glide targets (and legacy rollup goals) are group-keyed, so
  // when the goal is group-level we always drift against group-rolled actuals — even in Detail view, where
  // actualRows are the 14 detail classes (otherwise a "Stocks" target with no "Stocks" detail row read −100%).
  const targetsAreGroup = goalTargets && Object.keys(goalTargets).length > 0 && Object.keys(goalTargets).every(k => GROUP_BY_ID[k]);
  const driftRows = (targetsAreGroup && level !== 'group') ? toRows(alloc.group, alloc.total, 'group') : actualRows;
  const drift = goalTargets ? computeDrift(driftRows, alloc.total, goalTargets, band) : [];
  const breaches = drift.filter(d => d.breach);

  return `
    ${dashToolbarHTML(snap)}
    ${dashKpiHTML(snap, alloc, goal, band, breaches.length)}
    <div class="panel" style="display:grid;grid-template-columns:1fr 1fr;">
      ${dashDonutsHTML(actualRows, goalTargets, alloc, snap, scopeLabel, goalNote, level, glideInfo)}
      ${dashDriftHTML(drift, band, breaches, goalTargets)}
    </div>
    ${dashCategoriesHTML(snap)}
    ${drill.level === 'account' ? dashHoldingsHTML(drill.accountId, snap) : ''}
    ${drill.level === 'household' ? dashHistoryStripHTML() : ''}
  `;
}

/* Account-level review: the account's holdings with values, share, and gain. */
function dashHoldingsHTML(accountId, snap) {
  const a = allocate(accountHoldings(accountId), snap);
  if (!a.byHolding.length) {
    return `<div class="panel"><div class="panel-hd"><h4>Holdings</h4></div><div style="padding:20px;" class="text-muted">No holdings with values in this snapshot.</div></div>`;
  }
  const rows = a.byHolding.slice().sort((x, y) => y.marketValue - x.marketValue).map(h => {
    const pct = a.total > 0 ? (h.marketValue / a.total) * 100 : 0;
    const cls = (h.composed ? 'Split · ' : '') + detailLabel(h.holding.assetClass);
    return `<tr>
      <td style="padding-left:20px;font-family:var(--font-heading);font-size:15px;">${esc(h.holding.ticker)}</td>
      <td><span class="tag ${h.composed ? 'tag-accent-2' : 'tag-accent'}">${esc(cls)}</span> ${h.holding.name ? `<span class="text-muted" style="font-size:11px;margin-left:6px;">${esc(h.holding.name)}</span>` : ''}</td>
      <td class="tnum" style="text-align:right;">${fmtMoney(h.marketValue)}</td>
      <td class="tnum" style="text-align:right;">${pct.toFixed(1)}%</td>
      <td class="tnum" style="text-align:right;padding-right:20px;color:${h.gain != null && h.gain < 0 ? 'var(--color-crit)' : 'var(--color-accent-700)'};">${h.gain != null ? fmtMoneySigned(h.gain) : '—'}</td>
    </tr>`;
  }).join('');
  return `<div class="panel"><div class="panel-hd"><h4>Holdings</h4><span class="text-muted" style="font-size:12px;margin-left:auto;">${a.byHolding.length} holding${a.byHolding.length !== 1 ? 's' : ''} · ${fmtMoney(a.total)}</span></div>
    <table class="table"><thead><tr>
      <th style="padding-left:20px;">Ticker</th><th>Asset class</th>
      <th style="text-align:right;">Value</th><th style="text-align:right;">% of account</th>
      <th style="text-align:right;padding-right:20px;">Unrealized</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

function rollupTargets(goal, level) {
  // A 14-class goal compares directly at detail level and sums to groups at
  // rollup level. A legacy rollup goal only supports the rollup view.
  if (!goal) return null;
  return level === 'group' ? goalGroupTargets(goal) : goalDetailTargets(goal);
}

  const d = ui.drill;
  let crumb = `<a data-act="drill" data-level="household">Household</a>`;
  if (d.level === 'household') {
    crumb = `<span>Household</span><span class="sep">›</span><span class="text-muted">Category</span><span class="sep">›</span><span class="text-muted">Account</span>`;
  } else if (d.level === 'category') {
    crumb += `<span class="sep">›</span><span>${esc(d.categoryLabel || catLabel(d.category))}</span><span class="sep">›</span><span class="text-muted">Account</span>`;
  } else {
    const acct = accountById(d.accountId);
    const catLbl = acct ? (acct.categoryLabel || catLabel(acct.category)) : '';
    crumb += `<span class="sep">›</span><a data-act="drill" data-level="category" data-category="${esc(acct ? acct.category : '')}" data-categorylabel="${esc(acct ? (acct.categoryLabel || '') : '')}">${esc(catLbl)}</a><span class="sep">›</span><span>${esc(acct ? acct.name : '')}</span>`;

  return `<div class="toolbar no-print">
    <div class="crumb">${crumb}</div>
    <div class="seg" style="margin-left:auto;">
      <label class="seg-opt"><input type="radio" name="lvl" ${ui.level === 'group' ? 'checked' : ''} data-act="level" data-level="group">Rollup (6)</label>
      <label class="seg-opt"><input type="radio" name="lvl" ${ui.level === 'detail' ? 'checked' : ''} data-act="level" data-level="detail">Detail (14)</label>

    </div>
    <div class="field" style="width:150px;"><label>Snapshot</label>
      <select class="input" data-act="pick-snap">${opts}</select>

function dashKpiHTML(snap, alloc, goal, band, breachCount) {
  const snaps = sortedSnapshots();
  const idx = snaps.findIndex(s => s.date === snap.date);
  const prev = idx > 0 ? snaps[idx - 1] : null;
  let deltaHTML = '<div class="text-muted" style="font-size:12px;">first snapshot</div>';
  if (prev) {
    const prevAlloc = allocate(householdHoldings(), prev);
    const d = alloc.total - prevAlloc.total;
    deltaHTML = `<div class="text-muted" style="font-size:12px;">${fmtMoneySigned(d)} vs ${prev.date}</div>`;
  }
  const withBasis = alloc.byHolding.filter(h => h.gain != null);
  const totalGain = withBasis.reduce((s, h) => s + h.gain, 0);
  const gg = goal ? goalGroupTargets(goal) : null;
  const goalStr = gg ? TAXONOMY.groups.filter(x => gg[x.id]).map(x => Math.round(gg[x.id]) + '%').join(' / ') : '—';
  return `<div class="grid-kpi">
    <div class="kpi">
      <div class="kicker">${esc(drillScopeLabel())} total${ui.drill.level === 'household' && !portfolio.meta.include529InHousehold ? ' · excludes 529' : ''}</div>
      <div class="kpi-val tnum">${fmtMoney(alloc.total)}</div>
      ${deltaHTML}
    </div>
    <div class="kpi">
      <div class="kicker">Unrealized gain</div>
      <div class="kpi-val tnum">${withBasis.length ? fmtMoneySigned(totalGain) : '—'}</div>
      <div class="text-muted" style="font-size:12px;">${withBasis.length} of ${alloc.byHolding.length} holdings with basis</div>
    </div>
    <div class="kpi">
      <div class="kicker">Goal in force${ui.goalSel ? ' · selected' : ''}</div>
      <div class="kpi-val ${goal && goal.name ? '' : 'tnum'}" style="${goal && goal.name ? 'font-size:22px;line-height:1.1;' : ''}">${goal ? esc(goal.name || goal.effectiveDate) : '—'}</div>
      <div class="text-muted" style="font-size:12px;">${goal ? (goal.name ? esc(goal.effectiveDate) + ' · ' : '') + goalStr + ' rollup' : 'no goal set'}</div>
    </div>
    <div class="kpi">
      <div class="kicker">Drift band</div>
      <div class="kpi-val tnum">±${band}%</div>
      <div style="margin-top:4px;">${breachCount ? `<span class="tag tag-crit">${breachCount} class${breachCount > 1 ? 'es' : ''} breached</span>` : `<span class="tag tag-ok">within band</span>`}</div>
    </div>
  </div>`;
}

function dashCategoriesHTML(snap) {
  const drill = ui.drill;
  if (drill.level === 'account') return ''; // account level shows a holdings table instead

  // Category level → cards for each account in the category (drill into one).
  if (drill.level === 'category') {
    const inCat = drill.category === 'Other' && drill.categoryLabel
      ? accountsSorted(a => a.category === 'Other' && (a.categoryLabel || 'Other') === drill.categoryLabel)
      : accountsSorted(a => a.category === drill.category);
    if (!inCat.length) return '';
    const catName = drill.categoryLabel || catLabel(drill.category);
    const catTotal = allocate(inCat.flatMap(x => accountHoldings(x.id)), snap).total;
    const cards = inCat.map(acct => {
      const av = allocate(accountHoldings(acct.id), snap);
      const share = catTotal > 0 ? (av.total / catTotal) * 100 : 0;
      const n = activeHoldings(acct.id).length;
      return catCardHTML(acct.institution || 'Account', acct.name, av.total, share,
        `${n} holding${n !== 1 ? 's' : ''}${acct.taxTreatment ? ' · ' + acct.taxTreatment : ''}`,
        { level: 'account', accountId: acct.id }, catName);
    }).join('');
    return `<div class="panel">
      <div class="panel-hd"><h4>Accounts in ${esc(catName)} — click to drill in</h4></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;padding:20px;">${cards}</div>
    </div>`;
  }

  // Household level → category cards.
  const gt = grandTotal(snap);
  const cards = [];
  const plainCatCard = (cat) => {
    const accts = accountsSorted(a => a.category === cat);
    if (!accts.length) return;
    const a = allocate(accts.flatMap(x => accountHoldings(x.id)), snap);
    const share = gt > 0 ? (a.total / gt) * 100 : 0;
    cards.push(catCardHTML('Category', catLabel(cat), a.total, share, `${accts.length} account${accts.length > 1 ? 's' : ''}`, { level: 'category', category: cat }));
  };
  plainCatCard('Retirement');
  // 529 — one card per child
  for (const acct of accountsSorted(a => a.category === '529')) {
    const child = childById(acct.childId);
    const a = allocate(accountHoldings(acct.id), snap);
    const g = glideTargets(acct.childId, snap.date);
    const age = child && child.birthYear != null ? childAge(child.birthYear, snap.date) : null;
    const share = gt > 0 ? (a.total / gt) * 100 : 0;
    const gr = toRows(a.group, a.total, 'group');
    let meta = age != null ? 'age ' + age : 'set birth year in Settings › Household';
    if (g && g.targets) {
      const gd = computeDrift(gr, a.total, g.targets, 999).filter(x => x.targetPct > 0);
      meta = 'actual→goal: ' + gd.map(x => `${x.label} ${x.actualPct.toFixed(0)}%→${x.targetPct}%`).slice(0, 2).join(' · ');
    }
    cards.push(catCardHTML(`529 · ${child ? child.label : ''}${age != null ? ` (${age})` : ''}`, acct.name, a.total, share, meta, { level: 'account', accountId: acct.id }));
  }
  plainCatCard('Non-Retirement');
  // Other — one card per custom category label
  for (const label of otherLabels()) {
    const accts = accountsSorted(a => a.category === 'Other' && (a.categoryLabel || 'Other') === label);
    const a = allocate(accts.flatMap(x => accountHoldings(x.id)), snap);
    const share = gt > 0 ? (a.total / gt) * 100 : 0;
    cards.push(catCardHTML('Other', label, a.total, share, `${accts.length} account${accts.length > 1 ? 's' : ''}`, { level: 'category', category: 'Other', categoryLabel: label }));
  }
  if (!cards.length) return '';
  return `<div class="panel">
    <div class="panel-hd"><h4>Categories — click to drill in</h4></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;padding:20px;">${cards.join('')}</div>
  </div>`;
}

/* ===============================================================
   POSITIONS — read-only, sortable view of every holding by category,
   with % of total per holding and a per-asset-class summary.
   =============================================================== */
function positionsSnapshot() { return (ui.positionsSnap ? snapshotByDate(ui.positionsSnap) : null) || latestSnapshot(); }
function posGroupCompare(a, b, key) {
  if (key === 'value' || key === 'pct') return a.value - b.value;
  if (key === 'gain') return (a.gainTotal == null ? -Infinity : a.gainTotal) - (b.gainTotal == null ? -Infinity : b.gainTotal);
  if (key === 'ticker') return a.ticker.localeCompare(b.ticker);
  if (key === 'class') {
    const ai = a.classId ? TAXONOMY.detail.findIndex(d => d.id === a.classId) : 999;
    const bi = b.classId ? TAXONOMY.detail.findIndex(d => d.id === b.classId) : 999;
    return ai - bi;
  }
  return 0;
}
/* Terminal (decomposed) class ids a holding contributes to. */
function holdingClasses(h) { return splitValue(1, compositionOf(h), h.assetClass).map(([c]) => c); }
/* Holdings in the current Positions category scope. */
function positionsScopeHoldings() {
  const c = ui.posCategory || 'all';
  if (c === 'all') return activeHoldings();
  if (c === 'household') return householdHoldings();
  if (c.indexOf('Other:') === 0) return categoryHoldingsLabeled('Other', c.slice(6));
  return categoryHoldings(c);
}
function renderPositions() {
  const snap = positionsSnapshot();
  if (!snap) return `<div class="toolbar no-print"><div class="crumb"><span>Positions</span></div></div>
    <div class="empty" style="margin:6vh auto;"><span class="tag tag-outline">No snapshots yet</span>
    <h2 style="margin:0;">Record a check-in to see your positions.</h2>
    <button class="btn btn-primary" data-act="new-checkin">Start a check-in</button></div>`;
  const idx = valueIndex(snap);
  const sort = ui.positionsSort || (ui.positionsSort = { key: 'value', dir: -1 });
  const scoped = positionsScopeHoldings();
  const alloc = allocate(scoped, snap);           // scope total (decomposed)
  const gt = alloc.total;

  // per-asset-class summary of the scope; click a row to filter holdings by class
  const classRows = toRows(alloc.detail, gt, 'detail').slice().sort((a, b) => b.value - a.value);
  const classTable = classRows.map(r => `<tr class="${ui.posClass === r.id ? 'pos-class-active' : ''}" style="cursor:pointer;" data-act="pos-class" data-class="${r.id}">
      <td><span class="swatch" style="background:${r.color};margin-right:6px;"></span>${esc(r.label)}</td>
      <td class="tnum" style="text-align:right;">${fmtMoney(r.value)}</td>
      <td class="tnum" style="text-align:right;">${r.pct.toFixed(1)}%</td>
    </tr>`).join('');

  // Roll up the same ticker held across multiple accounts into one line.
  const byTicker = {};
  for (const h of scoped) {
    const v = idx[h.id]; const value = v ? Number(v.marketValue) : 0;
    if (!value) continue;
    const key = (h.ticker || '').toUpperCase();
    const acct = accountById(h.accountId) || {};
    const cb = v && v.costBasis != null ? Number(v.costBasis) : (h.costBasis != null ? Number(h.costBasis) : null);
    const gain = cb != null ? value - cb : null;
    const g = byTicker[key] || (byTicker[key] = { ticker: h.ticker, name: '', classIds: new Set(), classes: new Set(), composedAny: false, children: [], value: 0, gain: 0, gainAny: false });
    if (!g.name && h.name) g.name = h.name;
    g.classIds.add(h.assetClass);
    holdingClasses(h).forEach(c => g.classes.add(c));
    if (compositionOf(h)) g.composedAny = true;
    g.value += value;
    if (gain != null) { g.gain += gain; g.gainAny = true; }
    g.children.push({ account: acct.name || '', category: acct.category || '', categoryLabel: acct.categoryLabel, value, gain });
  }
  let groups = Object.values(byTicker).map(g => ({
    ticker: g.ticker, name: g.name, children: g.children, value: g.value,
    classId: g.classIds.size === 1 ? [...g.classIds][0] : null,
    className: g.classIds.size === 1 ? detailLabel([...g.classIds][0]) : 'Mixed',
    classesArr: [...g.classes], composed: g.composedAny,
    pct: gt > 0 ? g.value / gt * 100 : 0,
    gainTotal: g.gainAny ? g.gain : null, multi: g.children.length > 1,
  }));
  if (ui.posClass) groups = groups.filter(g => g.classesArr.indexOf(ui.posClass) >= 0);
  groups.sort((a, b) => { const c = posGroupCompare(a, b, sort.key) * sort.dir; return c || (b.value - a.value); });

  const arrow = k => sort.key === k ? (sort.dir > 0 ? ' ▲' : ' ▼') : '';
  const th = (k, label, align) => k
    ? `<th style="text-align:${align || 'left'};cursor:pointer;white-space:nowrap;" data-act="pos-sort" data-key="${k}">${label}${arrow(k)}</th>`
    : `<th style="text-align:${align || 'left'};">${label}</th>`;
  const gcolor = g => g < 0 ? 'var(--color-crit)' : 'var(--color-accent-700)';
  const body = groups.map(g => {
    const exp = !!(ui.posExpanded && ui.posExpanded[g.ticker.toUpperCase()]);
    const caret = g.multi ? `<span style="display:inline-block;width:12px;color:var(--color-accent);">${exp ? '▾' : '▸'}</span>` : '<span style="display:inline-block;width:12px;"></span>';
    const acctCell = g.multi
      ? `<span class="tag tag-neutral">${g.children.length} accounts</span> ${esc(g.children.map(c => c.account).slice(0, 2).join(', '))}${g.children.length > 2 ? ' …' : ''}`
      : esc(g.children[0].account);
    const main = `<tr ${g.multi ? `style="cursor:pointer;" data-act="pos-expand" data-ticker="${esc(g.ticker.toUpperCase())}"` : ''}>
      <td style="font-family:var(--font-heading);font-size:15px;">${caret}${esc(g.ticker)}${g.name ? ` <span class="text-muted" style="font-family:var(--font-body);font-size:11px;">${esc(g.name)}</span>` : ''}</td>
      <td class="text-muted" style="font-size:13px;">${acctCell}</td>
      <td><span class="tag ${g.composed ? 'tag-accent-2' : 'tag-accent'}">${g.composed && g.classId ? 'Split · ' : ''}${esc(g.className)}</span></td>
      <td class="tnum" style="text-align:right;">${fmtMoney(g.value)}</td>
      <td class="tnum" style="text-align:right;font-family:var(--font-heading);">${g.pct.toFixed(1)}%</td>
      <td class="tnum" style="text-align:right;color:${g.gainTotal != null ? gcolor(g.gainTotal) : ''};">${g.gainTotal != null ? fmtMoneySigned(g.gainTotal) : '—'}</td>
    </tr>`;
    let kids = '';
    if (g.multi && exp) {
      kids = g.children.slice().sort((a, b) => b.value - a.value).map(c => `<tr style="background:color-mix(in srgb, var(--color-text) 3%, transparent);">
        <td style="padding-left:34px;font-size:13px;">↳ ${esc(c.account)}</td>
        <td class="text-muted" style="font-size:12px;">${esc(c.categoryLabel || catLabel(c.category))}</td>
        <td></td>
        <td class="tnum" style="text-align:right;font-size:13px;">${fmtMoney(c.value)}</td>
        <td class="tnum" style="text-align:right;font-size:13px;">${(gt > 0 ? c.value / gt * 100 : 0).toFixed(1)}%</td>
        <td class="tnum" style="text-align:right;font-size:13px;color:${c.gain != null ? gcolor(c.gain) : ''};">${c.gain != null ? fmtMoneySigned(c.gain) : '—'}</td>
      </tr>`).join('');
    }
    return main + kids;
  }).join('');

  // category filter options
  const catArr = [['all', 'Everything (incl. 529)'], ['household', 'Household']];
  for (const cat of ['Retirement', 'Non-Retirement', '529']) if (accountsSorted(a => a.category === cat).length) catArr.push([cat, catLabel(cat)]);
  for (const l of otherLabels()) catArr.push(['Other:' + l, l]);
  const catSel = `<div class="field" style="width:210px;"><label>Category</label><select class="input" data-act="pos-category">${catArr.map(([v, l]) => `<option value="${esc(v)}" ${(ui.posCategory || 'all') === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;

  const snaps = sortedSnapshots().slice().reverse();
  const opts = snaps.map((s, i) => `<option value="${s.date}" ${s.date === snap.date ? 'selected' : ''}>${s.date}${i === 0 ? ' (latest)' : ''}</option>`).join('');
  const totalLabel = (ui.posCategory && ui.posCategory !== 'all') ? 'scope total' : 'total';

  return `<div class="toolbar no-print" style="flex-wrap:wrap;"><div class="crumb"><span>Positions</span></div>
    ${catSel}
    ${ui.posClass ? `<span class="tag tag-accent-2" style="cursor:pointer;align-self:flex-end;margin-bottom:6px;" data-act="pos-class-clear">Class: ${esc(detailLabel(ui.posClass))} ✕</span>` : ''}
    <span class="text-muted" style="margin-left:auto;align-self:flex-end;margin-bottom:6px;font-size:12px;">${groups.length} position${groups.length !== 1 ? 's' : ''} · ${fmtMoney(gt)} ${totalLabel}</span>
    <div class="field" style="width:150px;"><label>Snapshot</label><select class="input" data-act="pos-snap">${opts}</select></div>

    </div>
