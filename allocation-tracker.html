  Spec: asset-allocation-tool-spec.md. An allocation tool, not a net-worth tracker.

<style>
  /* ============================================================
     "Industry" design system — inlined, zero-network (spec §10).
     Source of truth for tokens/components was the Design project's
     styles.css; the Google-Fonts @import is intentionally dropped so
     the file makes NO network requests. Barlow/Barlow Condensed stay
     in the stack for users who have them; otherwise system-ui.
     ============================================================ */
  /* ============================================================
     DESIGN TOKENS — light palette on :root (2026 redesign).
     Warmer paper ground, white cards, multi-hue accent + chart set.
     Dark palette redefines the changed tokens in the blocks below.
     ============================================================ */
  :root {
    color-scheme: light;
    --color-bg: #f2f4f1;        /* paper ground */
    --color-panel: #ffffff;     /* card surface */
    --color-panel-2: #f7f9f7;   /* subtle raised */
    --color-surface: #ebefeb;   /* sunk wells / inputs */
    --color-text: #151823;      /* ink */
    --color-ink-2: #48525c;
    --color-ink-3: #596773;
    --color-accent: #0f6493;
    --color-accent-2: #1e8175;  /* teal (secondary) */
    --color-divider: #d6dcda;   /* line */
    --color-line-2: #e8ece9;

    --color-neutral-100: #f2f5f3; --color-neutral-200: #e6ebe8;
    --color-neutral-300: #d3dad6; --color-neutral-400: #aab4b0;
    --color-neutral-500: #8a949e; --color-neutral-600: #6b7580;
    --color-neutral-700: #525b64; --color-neutral-800: #3a424a;
    --color-neutral-900: #232a31;

    --color-accent-100: #f0f7fc; --color-accent-200: #dbeaf5;
    --color-accent-300: #bfddf0; --color-accent-400: #7fbbe0;
    --color-accent-500: #3e92c4; --color-accent-600: #1e77a8;
    --color-accent-700: #0a4a6d; --color-accent-800: #0a3a54;
    --color-accent-900: #08293b;
    --color-accent-soft: #dbeaf5; --color-accent-wash: #f0f7fc;

    /* teal (accent-2 family) */
    --color-accent-2-100: #eaf6f3; --color-accent-2-200: #dcefeb;
    --color-accent-2-300: #b6ddd6; --color-accent-2-400: #74c2b6;
    --color-accent-2-500: #3fa294; --color-accent-2-600: #1e8175;
    --color-accent-2-700: #196a60; --color-accent-2-800: #144f48;
    --color-accent-2-900: #0f2e2a;
    --color-teal: #1e8175; --color-teal-soft: #dcefeb;
    --color-plum: #6c5aa8; --color-plum-soft: #e8e4f5;

    /* status */
    --color-ok:   #1c7150; --color-ok-soft:   #dcf0e6;
    --color-warn: #96590b; --color-warn-soft: #fbedd0;
    --color-crit: #a83f33; --color-crit-soft: #fae3e0;

    /* rollup-group chart colors (6) — distinct hues */
    --g-stocks:      #1b6f9b;  /* blue */
    --g-bonds:       #6c5aa8;  /* plum */
    --g-real_assets: #c08a2e;  /* gold */
    --g-crypto:      #1e8175;  /* teal */
    --g-cash:        #8a949e;  /* gray */
    --g-blend_other: #a4566b;  /* rose */

    /* 14 detail-class chart colors — grouped by family, multi-hue */
    --c-us_large:  #114863; --c-us_mid:  #1b6f9b; --c-us_small: #3e92c4;
    --c-us_total:  #1b6f9b; --c-intl_dev:#1e8175; --c-em:       #45bfae;
    --c-us_bond:   #6c5aa8; --c-intl_bond:#9b8dd0;
    --c-reit:      #c08a2e; --c-commod:  #e0b25a;
    --c-crypto:    #a4566b;
    --c-cash:      #8a949e;
    --c-blend:     #a0aab2; --c-other:   #c4ccd2;

    /* landing/marketing chart accents (redesign c1–c6) */
    --c1: #1b6f9b; --c2: #1e8175; --c3: #c08a2e; --c4: #6c5aa8; --c5: #8a949e; --c6: #a4566b;

    --font-heading: "Barlow Condensed", system-ui, "Segoe UI", sans-serif;
    --font-heading-weight: 600;
    --font-body: "Barlow", system-ui, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    /* airy density (redesign) — generous gaps + card padding */
    --space-1: 4px; --space-2: 8px; --space-3: 13px;
    --space-4: 18px; --space-6: 28px; --space-8: 44px;
    --qm-pad: 30px; --qm-gap: 26px;
    /* one horizontal gutter for every full-bleed bar + the body, so tab labels,
       sub-nav labels and card edges all line up down the same left/right edge */
    --shell-x: 24px;

    --radius-sm: 2px; --radius-md: 4px; --radius-lg: 7px;

    --shadow-sm: 0 1px 2px color-mix(in srgb, #151823 12%, transparent);
    --shadow-md: 0 4px 14px color-mix(in srgb, #151823 14%, transparent);
    --shadow-lg: 0 20px 48px color-mix(in srgb, #0f6493 30%, transparent);
  }

  /* Dark palette — dormant for now (light-only launch). Applied only when the root
     carries data-theme="dark" (no auto prefers-color-scheme switch yet). */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --color-bg: #0b0d14; --color-panel: #151823; --color-panel-2: #1c2030; --color-surface: #10131c;
    --color-text: #eceff3; --color-ink-2: #aab4c0; --color-ink-3: #7b8694;
    --color-accent: #57acdc; --color-divider: #2b3140; --color-line-2: #212637;
    --color-neutral-100: #1c2030; --color-neutral-200: #232a37; --color-neutral-300: #2f3745;
    --color-neutral-400: #4a545f; --color-neutral-500: #6b7580; --color-neutral-600: #8a949e;
    --color-neutral-700: #aab4c0; --color-neutral-800: #cdd4dc; --color-neutral-900: #eceff3;
    --color-accent-100: #101f2b; --color-accent-200: #123347; --color-accent-300: #17435e;
    --color-accent-400: #2f6f96; --color-accent-500: #57acdc; --color-accent-600: #7cc2e8;
    --color-accent-700: #a6d8f2; --color-accent-800: #c8e7f8; --color-accent-900: #e4f3fc;
    --color-accent-soft: #123347; --color-accent-wash: #101f2b;
    --color-accent-2: #45bfae;
    --color-accent-2-100: #0f2e2a; --color-accent-2-200: #124039; --color-accent-2-300: #1a5c52;
    --color-accent-2-400: #2f8b7d; --color-accent-2-500: #45bfae; --color-accent-2-600: #6fd0c2;
    --color-accent-2-700: #9fe0d6; --color-accent-2-800: #c4ece5; --color-accent-2-900: #e3f5f1;
    --color-teal: #45bfae; --color-teal-soft: #0f2e2a;
    --color-plum: #a99be0; --color-plum-soft: #211e38;
    --color-ok: #4fc894; --color-ok-soft: #0f2c21;
    --color-warn: #e5ae4c; --color-warn-soft: #332810;
    --color-crit: #e3826f; --color-crit-soft: #33191a;
    --g-stocks: #4fa0cb; --g-bonds: #a99be0; --g-real_assets: #dea94a; --g-crypto: #45bfae; --g-cash: #a6b0b9; --g-blend_other: #c97e92;
    --c-us_large: #3f8fbf; --c-us_mid: #4fa0cb; --c-us_small: #79bde0; --c-us_total: #4fa0cb; --c-intl_dev: #45bfae; --c-em: #74d3c6;
    --c-us_bond: #a99be0; --c-intl_bond: #c3b8ee; --c-reit: #dea94a; --c-commod: #ecc887; --c-crypto: #c97e92; --c-cash: #a6b0b9; --c-blend: #7b8694; --c-other: #5a636e;
    --shadow-lg: 0 20px 48px color-mix(in srgb, #000 55%, transparent);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--color-bg); color: var(--color-text);
    font-family: var(--font-body); font-size: 15px; line-height: 1.55; font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-heading); font-weight: var(--font-heading-weight);
    line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
  }
  h1 { font-size: 42px; } h2 { font-size: 30px; } h3 { font-size: 24px; }
  h4 { font-size: 20px; } h5 { font-size: 16px; }
  h6 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; margin: 0; }
  p { margin: 0 0 var(--space-3); }
  a { color: var(--color-accent); text-underline-offset: 3px; }
  a:hover { color: var(--color-accent-700); }
  .mono { font-family: var(--mono); }
  .tnum { font-variant-numeric: tabular-nums; }
  .text-muted { color: var(--color-ink-2); }
  .kicker { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-ink-3); }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  ::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }
  .hr { height: 1px; border: 0; margin: var(--space-4) 0; background: var(--color-divider); }

  /* — blueprint frame + corner registration marks — */
  .blueprint { position: relative; border: 1px solid var(--color-divider); border-radius: 0; background: transparent; }
  .blueprint > .corner { position: absolute; width: 11px; height: 11px; color: color-mix(in srgb, var(--color-text) 55%, transparent); }
  .blueprint > .corner::before, .blueprint > .corner::after { content: ""; position: absolute; background: currentColor; }
  .blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }
  .blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }
  .blueprint > .corner.tl { top: -6px; left: -6px; }
  .blueprint > .corner.tr { top: -6px; right: -6px; }
  .blueprint > .corner.bl { bottom: -6px; left: -6px; }
  .blueprint > .corner.br { bottom: -6px; right: -6px; }

  /* — buttons — */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer; text-decoration: none; white-space: nowrap;
    font-family: var(--font-heading); font-weight: var(--font-heading-weight);
    font-size: 14px; line-height: 1.2; color: var(--color-text);
    background: transparent; border: 1px solid var(--color-divider);
    padding: var(--space-2) calc(var(--space-3) * 1.2); border-radius: 0;
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: var(--color-accent); color: var(--color-bg); border-color: var(--color-accent); }
  .btn-primary:hover { background: var(--color-accent-600); }
  .btn-primary:active { background: var(--color-accent-700); }
  .btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
  .btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
  .btn-ghost { color: var(--color-accent); border-color: transparent; padding-inline: var(--space-2); }
  .btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
  .btn-danger { color: var(--color-crit); border-color: color-mix(in srgb, var(--color-crit) 45%, transparent); }
  .btn-danger:hover { background: color-mix(in srgb, var(--color-crit) 10%, transparent); }
  .btn-sm { font-size: 12.5px; padding: 4px 9px; }
  .btn-block { width: 100%; }

  /* — forms — */
  .field > label { display: block; font-size: 12px; margin-bottom: 5px; color: color-mix(in srgb, var(--color-text) 70%, transparent); }
  .input {
    width: 100%; min-height: 36px; padding: 6px 10px; font: inherit; font-size: 14px;
    color: var(--color-text); caret-color: var(--color-accent);
    background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 0;
  }
  .input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
  .input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
  .input.basis-flag { border-color: var(--color-warn); background: color-mix(in srgb, var(--color-warn) 12%, var(--color-surface)); }
  select.input { min-height: 34px; }
  textarea.input { min-height: 80px; resize: vertical; line-height: 1.5; }
  .seg { display: inline-flex; overflow: hidden; border: 1px solid var(--color-divider); border-radius: 0; }
  .seg-opt { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; font-size: 13px; cursor: pointer; user-select: none; }
  .seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
  .seg-opt input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
  .seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }
  .seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }

  /* — cards / tags — */
  .card { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3); border-radius: 0; background: var(--color-panel); border: 1px solid var(--color-divider); }
  .card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
  .card-title { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 17px; line-height: 1.2; }
  .card-meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: color-mix(in srgb, var(--color-text) 50%, transparent); }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; letter-spacing: 0.02em; padding: 3px 10px; border-radius: 0; }
  .tag-accent  { background: var(--color-accent-100); color: var(--color-accent-800); }
  .tag-accent-2{ background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
  .tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
  .tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }
  .tag-ok   { background: color-mix(in srgb, var(--color-ok) 16%, transparent);   color: var(--color-ok); }
  .tag-warn { background: color-mix(in srgb, var(--color-warn) 16%, transparent); color: var(--color-warn); }
  .tag-crit { background: color-mix(in srgb, var(--color-crit) 16%, transparent); color: var(--color-crit); }

  /* — nav / tables — */
  .nav { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-6); background: var(--color-panel); border-bottom: 1px solid var(--color-divider); }
  .nav-brand { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 18px; }
  .nav a { color: inherit; text-decoration: none; font-size: 14px; cursor: pointer; letter-spacing: 0.01em; }
  .nav a:hover { color: var(--color-accent); }
  .nav a[aria-current='page'] { color: var(--color-accent); font-weight: 700; }
  /* Sub-tab strip under a master tab — flush with the content padding, underline indicator. */
  .subnav { display: flex; gap: 4px; padding: 0 var(--shell-x); border-bottom: 1px solid var(--color-divider); background: var(--color-panel-2); flex-wrap: wrap; }
  .subnav a { color: var(--color-ink-2); text-decoration: none; font-family: var(--font-heading); font-size: 14px; letter-spacing: 0.04em; cursor: pointer; padding: 12px 16px; border-bottom: 2px solid transparent; margin-bottom: -1px; line-height: 1; white-space: nowrap; }
  .subnav a:first-child { padding-left: 0; }   /* first label flush with the content gutter */
  .subnav a:hover { color: var(--color-text); background: color-mix(in srgb, var(--color-text) 5%, transparent); }
  .subnav a.subnav-active { color: var(--color-accent); border-bottom-color: var(--color-accent); font-weight: 600; }

  /* — redesign app shell: file bar + numbered tab bar + reference drawer.
       Bars run full-bleed to the shell edges (no side gutter); their content is padded to --shell-x,
       and the body cards run full-bleed too, so every left/right edge lines up with no floating borders. — */
  .filebar { display: flex; align-items: center; gap: 14px; padding: 9px var(--shell-x); background: var(--color-surface); border-bottom: 1px solid var(--color-divider); flex-wrap: wrap; }
  .filebar .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .file-chip { display: flex; align-items: center; gap: 9px; padding: 6px 13px; background: var(--color-panel); border: 1px solid var(--color-divider); font-size: 12.5px; }
  .file-chip .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--color-ok); }
  .file-chip .fname { font-family: var(--mono); font-size: 12px; }
  .file-chip .fmeta { color: var(--color-ink-3); font-size: 12px; }
  .filebtn { padding: 6px 12px; border: 1px solid var(--color-divider); background: var(--color-panel); font-size: 13px; color: var(--color-ink-2); cursor: pointer; font-family: var(--font-body); }
  .filebtn:hover { border-color: var(--color-accent); color: var(--color-accent); }
  .netpill { display: flex; align-items: center; gap: 8px; font-family: var(--font-heading); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-ok); }
  .netpill .ring { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--color-ok); flex: none; }

  .tabbar { display: flex; align-items: stretch; background: var(--color-panel); border-bottom: 1px solid var(--color-divider); overflow-x: auto; }
  .apptab { display: block; text-align: left; padding: 10px 18px; border: 0; border-right: 1px solid var(--color-line-2); background: transparent; color: var(--color-ink-3); cursor: pointer; white-space: nowrap; }
  .apptab:first-child { padding-left: var(--shell-x); }   /* first tab label at the content gutter */
  .apptab .step { display: block; font-family: var(--font-heading); font-size: 10px; letter-spacing: 0.16em; opacity: 0.62; }
  .apptab .lbl { display: block; font-family: var(--font-heading); font-weight: 600; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 2px; }
  .apptab:hover { color: var(--color-text); background: var(--color-panel-2); }
  .apptab.active { background: var(--color-accent); color: #fff; }
  .apptab.active .step { opacity: 0.85; }
  .otab { margin-left: 14px; border-left: 1px solid var(--color-divider); border-right: 0; }

<script>
"use strict";
/* ================================================================
   Asset Allocation Tracker — application script.
   Everything below is vanilla JS. No build step, no dependencies.
   ================================================================ */

/* ---------------------------------------------------------------
   TAXONOMY — the 14 detail classes and their rollup groups (spec §4a)
   --------------------------------------------------------------- */
const TAXONOMY = {
  // id: stable key stored in data; label: display; group: rollup; cssVar: color token
  detail: [
    { id: 'us_large',  label: 'US Large Cap',            group: 'stocks',      cssVar: '--c-uslarge'  },
    { id: 'us_mid',    label: 'US Mid Cap',              group: 'stocks',      cssVar: '--c-usmid'    },
    { id: 'us_small',  label: 'US Small Cap',            group: 'stocks',      cssVar: '--c-ussmall'  },
    { id: 'us_total',  label: 'US Total Market',         group: 'stocks',      cssVar: '--c-ustotal'  },
    { id: 'intl_dev',  label: 'International Developed',  group: 'stocks',      cssVar: '--c-intl'     },
    { id: 'em',        label: 'Emerging Markets',        group: 'stocks',      cssVar: '--c-em'       },
    { id: 'us_bond',   label: 'US Bonds',                group: 'bonds',       cssVar: '--c-usbond'   },
    { id: 'intl_bond', label: 'International Bonds',      group: 'bonds',       cssVar: '--c-intlbond' },
    { id: 'reit',      label: 'Real Estate / REITs',     group: 'real_assets', cssVar: '--c-reit'     },
    { id: 'commod',    label: 'Commodities',             group: 'real_assets', cssVar: '--c-commod'   },
    { id: 'crypto',    label: 'Crypto',                  group: 'crypto',      cssVar: '--c-crypto'   },
    { id: 'cash',      label: 'Cash & Equivalents',      group: 'cash',        cssVar: '--c-cash'     },
    { id: 'blend',     label: 'Target Date / Blend',     group: 'blend_other', cssVar: '--c-blend'    },
    { id: 'other',     label: 'Other / Alternatives',    group: 'blend_other', cssVar: '--c-other'    },
  ],
  groups: [
    { id: 'stocks',      label: 'Stocks'       },
    { id: 'bonds',       label: 'Bonds'        },
    { id: 'real_assets', label: 'Real Assets'  },
    { id: 'crypto',      label: 'Crypto'       },
    { id: 'cash',        label: 'Cash'         },
    { id: 'blend_other', label: 'Blend/Other'  },
  ],
};

const DETAIL_BY_ID = Object.fromEntries(TAXONOMY.detail.map(d => [d.id, d]));
const GROUP_BY_ID  = Object.fromEntries(TAXONOMY.groups.map(g => [g.id, g]));

// US Total Market is a US-equity blend, not a peer of Large/Mid/Small. Holdings
// tagged us_total auto-decompose into L/M/S by this default market-cap split
// (editable per fund), and us_total is excluded from the goal matrix.
const US_TOTAL_SPLIT = { us_large: 82, us_mid: 13, us_small: 5 };
const GOAL_DETAIL = TAXONOMY.detail.filter(d => d.id !== 'us_total');
function detailLabel(id) { return (DETAIL_BY_ID[id] || {}).label || id; }
function cssVarValue(name, fallback) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}
function detailColor(id) { return cssVarValue('--c-' + id, '#b7b7ba'); }
function rollupOf(detailId) { return (DETAIL_BY_ID[detailId] || {}).group || 'blend_other'; }

const ACCOUNT_CATEGORIES = ['Retirement', '529', 'Non-Retirement', 'Other'];
const TAX_TREATMENTS = ['Pre-tax', 'Roth', 'Taxable', 'Tax-free'];
// Account "vehicle" drives contribution limits + shelter status (a 401k and an
// IRA are both "Retirement" but have very different limits).
const ACCOUNT_VEHICLES = ['taxable', '401k', 'ira', 'hsa', '529', 'other'];
const VEHICLE_LABELS = { taxable: 'Taxable / brokerage', '401k': '401(k) / 403(b) / TSP', ira: 'IRA (Roth or Traditional)', hsa: 'HSA', '529': '529 plan', other: 'Other' };
function inferVehicle(a) {
  const n = (a.name || '').toLowerCase();
  if (/\bhsa\b/.test(n)) return 'hsa';
  if (/\bira\b|roth ira|traditional ira|\bsep\b|\bsimple\b/.test(n)) return 'ira';
  if (/401|403|457|\btsp\b/.test(n)) return '401k';
  if (a.category === '529') return '529';
  if (a.category === 'Retirement') return '401k';
  if (a.category === 'Non-Retirement') return 'taxable';
  return 'other';
}
function accountVehicle(a) { return (a && a.vehicle) || (a ? inferVehicle(a) : 'taxable'); }

/* ---------------------------------------------------------------

const SEED_MAP = {
  // ---- US Total Market ----
  VTI:'us_total', ITOT:'us_total', SCHB:'us_total', FSKAX:'us_total', FZROX:'us_total',
  VTSAX:'us_total', SWTSX:'us_total', IWV:'us_total',

  // ---- US Large Cap (S&P500 / large-cap blend) ----
  VOO:'us_large', SPY:'us_large', IVV:'us_large', FXAIX:'us_large', SWPPX:'us_large',
  VFIAX:'us_large', SPLG:'us_large', VV:'us_large', SCHX:'us_large', SPYG:'us_large',
  SPYV:'us_large', VUG:'us_large', VTV:'us_large', MGK:'us_large', IWB:'us_large',
  QQQ:'us_large', QQQM:'us_large', ONEQ:'us_large', IWF:'us_large', IWD:'us_large',
  DIA:'us_large', SCHG:'us_large', SCHD:'us_large', DGRO:'us_large', VIG:'us_large',
  VYM:'us_large', NOBL:'us_large',
  // mega-cap single stocks → US Large Cap

/* Tax-efficiency classification of an asset class, for the drag table. */

  for (const b of brackets) if (income <= b.upTo) return b.rate;
  return brackets[brackets.length - 1].rate;
}
function ltcgRateFor(brackets, income) {
  for (const b of brackets) if (income <= b.upTo) return b.rate;
  return brackets[brackets.length - 1].rate;
}
function bandIncome(ref, bandKey) {
  const b = ref.incomeBands.find(x => x.key === bandKey);
  return b ? b.income : 150000;
}
// §13.1 — derive the full effective rate stack from taxSettings.
function deriveRates(ref, taxSettings) {
  const ts = taxSettings || {};
  const fs = ts.filingStatus || 'single';
  const income = bandIncome(ref, ts.incomeBand);
  const ov = ts.override || {};

  const r_qdi   = (ov.ltcgRate     != null) ? ov.ltcgRate     : ltcgRateFor(ref.ltcgBrackets[fs] || ref.ltcgBrackets.single, income);

  const collMax = ref.collectiblesMaxRate != null ? ref.collectiblesMaxRate : 0.28;
  const r_collectible_eff = Math.min(r_ord, collMax) + niit + r_state + surtax;
  return { fs, income, r_ord, r_qdi, niit, r_state, surtax, r_ord_eff, r_qdi_eff, r_ltcg_eff, r_collectible_eff };
}
// Resolve a ticker's tax profile: user taxData → bundled seed → class default.
function tickerProfile(ticker, assetClass, taxData) {
  const t = (ticker || '').toUpperCase();
  const user = taxData && taxData.tickers && taxData.tickers[t];
  if (user) return { profile: user, estimated: false, source: 'user' };
  if (SEED_TAX_DATA[t]) return { profile: SEED_TAX_DATA[t], estimated: false, source: 'bundled' };
  return { profile: DEFAULT_TAX_PROFILE[assetClass] || DEFAULT_TAX_PROFILE.other, estimated: true, source: 'default' };
}
// Effective rate on the ordinary-income slice (interest / non-qualified divs):
//  · REIT ordinary dividends get the §199A 20% QBI deduction on the FEDERAL
//    portion only (qbiEligible) — NIIT and state are not reduced.
//  · US Treasury interest is state-tax-exempt (usGovtPct) — state applies to
//    only the non-government fraction.
function ordinaryInterestRate(profile, rates) {
  const govt = (profile.usGovtPct || 0) / 100;
  const fedOrd = profile.qbiEligible ? 0.8 * rates.r_ord : rates.r_ord;
  return fedOrd + rates.niit + rates.r_state * (1 - govt) + rates.surtax;
}
// Foreign tax credit: ~7% of an international fund's dividend is foreign tax you
// recover in a taxable account (but lose inside a sheltered one) — §13.3.
const FTC_RECOVERY = 0.07;
// §13.2 — annual $ tax drag for one taxable holding.
//  · Collectible profiles (physical-metal ETFs): gains at the collectibles rate (≤28%).
//  · §1256 futures funds (sixtyForty): 60% long-term / 40% ordinary on gains.
//  · International funds (ftcEligible): net of the recoverable foreign tax credit.
function holdingDrag(mv, profile, rates) {
  const dy = (profile.divYield || 0) / 100;
  const q  = (profile.qualifiedPct || 0) / 100;
  const cg = (profile.capGainDistPct || 0) / 100;
  const rOrd = ordinaryInterestRate(profile, rates);
  let rCg;
  if (profile.collectible && rates.r_collectible_eff != null) rCg = rates.r_collectible_eff;
  else if (profile.sixtyForty) rCg = 0.6 * rates.r_ltcg_eff + 0.4 * rates.r_ord_eff;
  else rCg = rates.r_ltcg_eff;
  const ftc = profile.ftcEligible ? FTC_RECOVERY * dy * mv : 0; // recovered foreign tax (taxable placement only)
  return Math.max(0, mv * (dy * q * rates.r_qdi_eff + dy * (1 - q) * rOrd + cg * rCg) - ftc);
}
// Account tax-shelter classification from its vehicle + treatment.
// Returns { sheltered:bool, reason:string }.
function accountShelter(acct) {
  if (!acct) return { sheltered: false, reason: 'taxable' };
  const v = accountVehicle(acct);
  const tt = acct.taxTreatment;
  if (v === 'hsa') return { sheltered: true, reason: 'tax-free (HSA)' };
  if (v === '529') return { sheltered: true, reason: 'tax-free (529)' };
  if (v === '401k' || v === 'ira') return { sheltered: true, reason: (tt === 'Roth' || tt === 'Tax-free') ? 'tax-free (Roth)' : 'tax-deferred' };

  if (tt === 'Roth' || tt === 'Tax-free') return { sheltered: true, reason: 'tax-free' };

// Wash-sale clone set for a ticker (includes the ticker itself, §13.7).
function washCloneSet(ticker) {
  const t = (ticker || '').toUpperCase();
  const row = WASH_CLONES.find(g => g.includes(t));
  return row ? row : [t];
}

/* ===============================================================
   RETIREMENT ENGINE — Monte Carlo projector (spec §6, NORMATIVE).
   Pure functions; real (inflation-adjusted) throughout. All rates
   decimals, all balances today's dollars. Embedded data, not saved.
   =============================================================== */
const RETIRE_DATA = {
  // Real geometric μ (%), σ (%) per detail asset class (§6.1). Editable defaults.
  muSigma: {
    us_large: [5.0, 16], us_total: [5.0, 16], us_mid: [5.5, 20], us_small: [5.5, 20],
    intl_dev: [5.5, 17], em: [6.0, 21], us_bond: [1.8, 5], intl_bond: [1.8, 5],
    reit: [4.5, 19], commod: [1.0, 16], cash: [0.5, 1], crypto: [5.0, 70],
    blend: [3.7, 10], other: [3.0, 10],
  },
  standardDeduction: { single: 16100, mfj: 32200, hoh: 24150, mfs: 16100 }, // TY2026 (Rev. Proc. 2025-32)
  // IRS Pub 590-B Uniform Lifetime Table divisors (RMD).
  uniformLifetime: { 73:26.5,74:25.5,75:24.6,76:23.7,77:22.9,78:22.0,79:21.1,80:20.2,81:19.4,82:18.5,83:17.7,84:16.8,85:16.0,86:15.2,87:14.4,88:13.7,89:12.9,90:12.2,91:11.5,92:10.8,93:10.1,94:9.5,95:8.9,96:8.4,97:7.8,98:7.3,99:6.8,100:6.4,101:6.0,102:5.6,103:5.2,104:4.9,105:4.6 },
  ssTaxablePct: 0.85,   // state-tax approximation only; federal benefits use Pub. 915
  ssTaxingStates: ['CO','CT','MN','MT','NM','RI','UT','VT','WV'], // states that tax SS; all others (incl. MA) exempt
  ssFRA: 67, endAge: 95, penaltyAge: 59.5, penaltyRate: 0.10,
};

// Correlation family of an asset class (§6.1 correlation rule).
const retireCatOf = c => c==='cash'?'cash':c==='crypto'?'crypto':c==='commod'?'commod':(c==='us_bond'||c==='intl_bond')?'bond':c==='reit'?'reit':'equity';
function retireCorr(a, b) {
  if (a === b) return 1;
  const ca = retireCatOf(a), cb = retireCatOf(b);
  if (ca === 'cash' || cb === 'cash') return 0;
  const isEq = x => x === 'equity';
  if ((ca === 'reit' && isEq(cb)) || (cb === 'reit' && isEq(ca))) return 0.70; // REIT↔equity
  const na = ca === 'reit' ? 'equity' : ca, nb = cb === 'reit' ? 'equity' : cb;
  if (na === nb) return na === 'bond' ? 0.70 : 0.85;
  const s = new Set([na, nb]);
  if (s.has('bond')) return 0.10;                        // bond × anything-nonbond
  if (s.has('equity') && s.has('commod')) return 0.30;
  if (s.has('equity') && s.has('crypto')) return 0.50;
  if (s.has('crypto')) return 0.20;                      // crypto × commodity
  return 0.20;
}
// Blend weights {classId:fraction} → {mu, sigma} decimals. σ² = ΣΣ wᵢwⱼσᵢσⱼρᵢⱼ.
function blendMuSigma(weights, muSigma) {
  const ms = muSigma || RETIRE_DATA.muSigma;
  const cls = Object.keys(weights).filter(c => weights[c] > 0);
  const wsum = cls.reduce((s, c) => s + weights[c], 0) || 1;
  let mu = 0;
  for (const c of cls) mu += (weights[c] / wsum) * ((ms[c] || ms.other)[0] / 100);
  let v = 0;
  for (const i of cls) for (const j of cls) {
    const si = (ms[i] || ms.other)[1] / 100, sj = (ms[j] || ms.other)[1] / 100;
    v += (weights[i] / wsum) * (weights[j] / wsum) * si * sj * retireCorr(i, j);
  }
  return { mu, sigma: Math.sqrt(Math.max(0, v)) };
}

// Progressive tax on a taxable-income amount against a bracket list.
function retireBracketTax(brackets, ti) {
  if (!(ti > 0)) return 0;
  let tax = 0, prev = 0;
  for (const b of brackets) { const top = Math.min(ti, b.upTo); if (top > prev) tax += (top - prev) * b.rate; if (ti <= b.upTo) break; prev = b.upTo; }
  return tax;
}
function retireBracketMarginal(brackets, ti) {
  for (const b of brackets) if (ti <= b.upTo) return b.rate;
  return brackets[brackets.length - 1].rate;
}
// LTCG stacked ON TOP of ordinary taxable income against the 0/15/20 thresholds.
function ltcgStackTax(ltcgBrackets, ordinary, ltcg) {
  if (!(ltcg > 0)) return 0;
  let tax = 0, lo = Math.max(0, ordinary), rem = ltcg;
  for (const b of ltcgBrackets) { if (lo >= b.upTo) continue; const amt = Math.min(rem, b.upTo - lo); tax += amt * b.rate; rem -= amt; lo += amt; if (rem <= 0) break; }
  return tax;
}

// RMD (§6.4): start 75 if born 1960+, else 73. Amount = balance ÷ Uniform Lifetime divisor.
function rmdStartAge(birthYear) { return Number(birthYear) >= 1960 ? 75 : 73; }
function rmdDivisor(age) { const t = RETIRE_DATA.uniformLifetime; return t[Math.max(73, Math.floor(age))] || t[105]; }
function rmdAmount(pretaxBalance, age) { return Math.max(0, pretaxBalance) / rmdDivisor(age); }

// Seeded RNG (mulberry32) + lognormal annual return so the GEOMETRIC mean ≈ μ.
function mulberry32(seed) { let a = (seed >>> 0) || 1; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gaussFrom(rng) { let u = 0, v = 0; while (u === 0) u = rng(); while (v === 0) v = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

// Social Security actuarial factor vs PIA at full retirement age.
function ssFactor(claimAge, fra) {
  fra = fra || RETIRE_DATA.ssFRA;
  const m = Math.round((claimAge - fra) * 12);
  if (m === 0) return 1;
  if (m < 0) { const e = -m; return Math.max(0.7, 1 - (Math.min(e, 36) * (5 / 900) + Math.max(0, e - 36) * (5 / 1200))); }
  return Math.min(1.24, 1 + m * (8 / 1200)); // +8%/yr delayed credit to age 70
}
// Rough real monthly PIA from annual income (2026 bend points; wage base $184,500) when no benefit entered.
function estimatePIAmonthly(annualIncome) {
  const aime = Math.min(annualIncome, 184500) / 12, b1 = 1286, b2 = 7749;
  return 0.9 * Math.min(aime, b1) + 0.32 * Math.max(0, Math.min(aime, b2) - b1) + 0.15 * Math.max(0, aime - b2);
}

// Withdraw `need` gross dollars in order RMD→taxable→pre-tax→Roth→tax-free (§6.4).
function doWithdraw(B, basis, need, forcedRMD) {
  let pretaxOut = 0, taxableOut = 0, rothOut = 0, taxfreeOut = 0, ltcgOut = 0, newBasis = basis, reinvest = 0, pretaxDiscretionary = 0;
  const gainFrac = B.taxable > 0 ? Math.max(0, Math.min(1, (B.taxable - basis) / B.taxable)) : 0; // average-basis (declared)
  // unmet = the part of `need` the buckets couldn't cover (true funds-exhausted shortfall, not a rounding gap).
  const finalize = () => { if (newBasis < 0) newBasis = 0; const totalOut = pretaxOut + taxableOut + rothOut + taxfreeOut; return { pretaxOut, taxableOut, rothOut, taxfreeOut, ltcgOut, newBasis, reinvest, pretaxDiscretionary, unmet: Math.max(0, need - totalOut) }; };
  if (forcedRMD > 0) pretaxOut += forcedRMD;
  let raised = pretaxOut;
  if (raised >= need) { reinvest = raised - need; return finalize(); } // excess RMD reinvested to taxable
  let rem = need - raised;
  const takeT = Math.min(rem, B.taxable);
  taxableOut += takeT; ltcgOut += takeT * gainFrac; newBasis -= takeT * (1 - gainFrac); raised += takeT; rem -= takeT;
  if (rem <= 0) return finalize();
  const takeP = Math.min(rem, Math.max(0, B.pretax - forcedRMD));
  pretaxOut += takeP; pretaxDiscretionary += takeP; raised += takeP; rem -= takeP;
  if (rem <= 0) return finalize();
  const takeR = Math.min(rem, B.roth); rothOut += takeR; raised += takeR; rem -= takeR;
  if (rem <= 0) return finalize();
  const takeF = Math.min(rem, B.taxfree); taxfreeOut += takeF; rem -= takeF;
  return finalize();
}

// IRS Publication 915 regular-benefit worksheet. MFS assumes spouses lived together;
// unusual exclusions, lump-sum elections and tax-exempt interest are not inferred.
function taxableSocialSecurity(benefits, otherIncome, filing, taxExemptInterest = 0) {
  const ss = Math.max(0, benefits);
  const combined = Math.max(0, otherIncome) + Math.max(0, taxExemptInterest) + ss / 2;
  if (filing === 'mfs') return Math.min(ss * 0.85, Math.max(0, combined) * 0.85);
  const lower = filing === 'mfj' ? 32000 : 25000;
  const upper = filing === 'mfj' ? 44000 : 34000;
  if (combined <= lower) return 0;
  if (combined <= upper) return Math.min(ss / 2, (combined - lower) / 2);
  return Math.min(ss * 0.85, (combined - upper) * 0.85 + Math.min(ss / 2, (upper - lower) / 2));
}

// One year of decumulation with the full retirement tax stack (§6.3). Gross-up loop for tax-on-withdrawals.
function decumulateYear(buckets, basis, opts) {
  const B = Object.assign({}, buckets);
  let taxableBasis = basis;
  let ssTaxableFed = 0;
  const ssTaxableState = opts.taxesSSstate ? opts.ssGross * RETIRE_DATA.ssTaxablePct : 0;
  const forcedRMD = Math.min(opts.forcedRMD || 0, B.pretax);
  const pensionGross = opts.pensionGross || 0;   // guaranteed income, fully taxable as ordinary (fed + state)
  let taxGuess = 0, res = null;
  for (let iter = 0; iter < 100; iter++) {
    let need = opts.spendNet + taxGuess - opts.ssGross - pensionGross;
    if (need < 0) need = 0;
    res = doWithdraw(B, taxableBasis, need, forcedRMD);
    ssTaxableFed = taxableSocialSecurity(opts.ssGross, res.pretaxOut + pensionGross + res.ltcgOut, opts.filing || 'single', opts.taxExemptInterest || 0);
    const ordinary = res.pretaxOut + ssTaxableFed + pensionGross;
    const ti = Math.max(0, ordinary - opts.stdDed);
    const fed = retireBracketTax(opts.fedBrackets, ti);
    const taxableGains = Math.max(0, res.ltcgOut - Math.max(0, opts.stdDed - ordinary));
    const ltcgTax = ltcgStackTax(opts.ltcgBrackets, ti, taxableGains);
    const magi = ordinary + res.ltcgOut;
    const niit = magi > opts.niitThreshold ? opts.niitRate * Math.min(res.ltcgOut, magi - opts.niitThreshold) : 0;
    const state = opts.stateRate * Math.max(0, res.pretaxOut + ssTaxableState + pensionGross + res.ltcgOut);
    const penalty = (opts.age < RETIRE_DATA.penaltyAge) ? RETIRE_DATA.penaltyRate * res.pretaxDiscretionary : 0;
    const tax = fed + ltcgTax + niit + state + penalty;
    if (Math.abs(tax - taxGuess) < 0.000001) { taxGuess = tax; break; }
    taxGuess = tax;
  }
  const w = res;
  B.pretax  = Math.max(0, B.pretax  - w.pretaxOut);
  B.taxable = Math.max(0, B.taxable - w.taxableOut);
  B.roth    = Math.max(0, B.roth    - w.rothOut);
  B.taxfree = Math.max(0, B.taxfree - w.taxfreeOut);
  taxableBasis = w.newBasis;
  const totalOut = w.pretaxOut + w.taxableOut + w.rothOut + w.taxfreeOut;
  const availableCash = opts.ssGross + pensionGross + totalOut - taxGuess;
  const surplus = Math.max(0, availableCash - opts.spendNet);
  B.taxable += surplus; taxableBasis += surplus; // save all after-tax surplus, including pension/SS
  const netCash = availableCash - surplus;
  return { buckets: B, basis: taxableBasis, tax: taxGuess, ltcg: w.ltcgOut, ssTaxable: ssTaxableFed,
           withdrawn: totalOut, netCash, shortfall: Math.max(0, opts.spendNet - availableCash), // includes final tax liability
           // where the year's cash came from, in draw order (RMD is the required part of the pre-tax bucket)
           bySource: { ss: opts.ssGross, pension: pensionGross, rmd: forcedRMD, taxable: w.taxableOut, pretax: w.pretaxDiscretionary, roth: w.rothOut, taxfree: w.taxfreeOut },
           ordinaryTI: Math.max(0, w.pretaxOut + ssTaxableFed + pensionGross - opts.stdDed), pretaxOut: w.pretaxOut };
}

// Full projection: `paths` Monte Carlo runs (or one deterministic constant-return path). See §6.2–6.6.
function runProjection(cfg) {
  const endAge = RETIRE_DATA.endAge;
  const nYears = endAge - cfg.currentAge + 1;
  const rmdAge = rmdStartAge(cfg.birthYearPrimary);
  const glideYears = Math.max(1, cfg.retireAge - cfg.currentAge);
  const yearWeights = (k) => {
    if (!cfg.weightsTarget) return cfg.weightsNow;
    const f = Math.max(0, Math.min(1, k / glideYears));
    const out = {}, keys = new Set([...Object.keys(cfg.weightsNow), ...Object.keys(cfg.weightsTarget)]);
    for (const c of keys) out[c] = (cfg.weightsNow[c] || 0) * (1 - f) + (cfg.weightsTarget[c] || 0) * f;
    return out;
  };
  const musig = [];
  for (let k = 0; k < nYears; k++) musig.push(blendMuSigma(yearWeights(k), cfg.muSigma));

  const nPaths = cfg.deterministic ? 1 : cfg.paths;
  const totalsByYear = Array.from({ length: nYears }, () => []);
  let successes = 0, detTable = null, rThenJoint = 0, rThenSurvivor = 0, converted = 0, convTax = 0, detFirstRmdPretax = 0;

  for (let p = 0; p < nPaths; p++) {
    const rng = cfg.deterministic ? null : mulberry32((cfg.seed >>> 0) + p * 2654435761);
    let B = { pretax: cfg.start.pretax, taxable: cfg.start.taxable, roth: cfg.start.roth, taxfree: cfg.start.taxfree };
    let basis = cfg.start.basis, depleted = false, prevPretax = B.pretax;
    const rows = cfg.deterministic ? [] : null;
    totalsByYear[0].push(Math.max(0, B.pretax + B.taxable + B.roth + B.taxfree)); // k=0 anchors at today
    if (rows) rows.push({ age: cfg.currentAge, phase: 'start', r: 0, total: B.pretax + B.taxable + B.roth + B.taxfree });
    for (let k = 1; k < nYears; k++) {
      const age = cfg.currentAge + k, ms = musig[k];
      const r = cfg.deterministic ? ms.mu : drawReturnFrom(rng, ms.mu, ms.sigma);
      prevPretax = B.pretax;
      if (age < cfg.retireAge) {
        const c = cfg.contrib, g = Math.pow(1 + cfg.contribGrowth, k);
        B.pretax  = B.pretax  * (1 + r) + (c.pretax  || 0) * g;
        B.roth    = B.roth    * (1 + r) + (c.roth    || 0) * g;
        B.taxfree = B.taxfree * (1 + r) + (c.taxfree || 0) * g;
        const divs = B.taxable * (cfg.workDrag ? cfg.workDrag.divYield : 0);
        const dragTax = B.taxable * (cfg.workDrag ? cfg.workDrag.dragRate : 0);
        B.taxable = B.taxable * (1 + r) + (c.taxable || 0) - dragTax;
        basis += (c.taxable || 0) + divs; // reinvested dividends raise basis (declared)
        if (rows) rows.push({ age, phase: 'accum', r, contrib: (c.pretax||0)+(c.roth||0)+(c.taxfree||0)+(c.taxable||0), tax: dragTax, pretax: B.pretax, total: B.pretax + B.taxable + B.roth + B.taxfree });
      } else {
        B.pretax *= (1 + r); B.taxable *= (1 + r); B.roth *= (1 + r); B.taxfree *= (1 + r);
        const survivor = age >= cfg.survivorAtAge;
        const forcedRMD = age >= rmdAge ? rmdAmount(prevPretax, age) : 0;
        if (cfg.deterministic && age === rmdAge) detFirstRmdPretax = prevPretax;
        const ssGross = age >= cfg.ssClaimAge ? cfg.ssGross : 0;
        let pensionGross = 0;
        for (const pen of (cfg.pensions || [])) {
          if (age < pen.startAge) continue;
          let amt = pen.cola ? pen.amount : pen.amount / Math.pow(1 + (cfg.inflation || 0), age - pen.startAge);
          if (survivor) amt *= (pen.survivorPct || 0) / 100;
          pensionGross += amt;
        }
        const out = decumulateYear(B, basis, {
          age, spendNet: cfg.spend, ssGross, pensionGross, filing: survivor ? 'single' : cfg.filing,
          fedBrackets: survivor ? cfg.survivorFedBrackets : cfg.fedBrackets,
          ltcgBrackets: survivor ? cfg.survivorLtcgBrackets : cfg.ltcgBrackets,
          stdDed: survivor ? cfg.survivorStdDed : cfg.stdDed,
          stateRate: survivor ? cfg.survivorStateRate : cfg.stateRate,
          niitRate: cfg.niitRate, niitThreshold: survivor ? REFERENCE_DATA.niitThreshold.single : cfg.niitThreshold, taxesSSstate: cfg.taxesSSstate, forcedRMD,
        });
        B = out.buckets; basis = out.basis;
        if (out.shortfall > 1) depleted = true;
        if (cfg.deterministic) {
          const grossOrd = out.pretaxOut + out.ssTaxable + pensionGross;
          rThenJoint    = Math.max(rThenJoint,    retireBracketMarginal(cfg.fedBrackets, Math.max(0, grossOrd - cfg.stdDed)) + cfg.stateRate);
          rThenSurvivor = Math.max(rThenSurvivor, retireBracketMarginal(cfg.survivorFedBrackets, Math.max(0, grossOrd - cfg.survivorStdDed)) + cfg.survivorStateRate);
          if (cfg.conversionFill > 0 && age < rmdAge && age < cfg.ssClaimAge && !survivor) {
            const convAmt = Math.min(Math.max(0, cfg.conversionFill - out.ordinaryTI), B.pretax);
            if (convAmt > 0) {
              const t = retireBracketTax(cfg.fedBrackets, out.ordinaryTI + convAmt) - retireBracketTax(cfg.fedBrackets, out.ordinaryTI) + cfg.stateRate * convAmt;
              const payable = Math.min(t, B.taxable);            // conversion tax paid from taxable (§6.6)

              const bt = B.taxable > 0 ? Math.max(0, Math.min(1, (B.taxable - basis) / B.taxable)) : 0;

      }
      totalsByYear[k].push(Math.max(0, B.pretax + B.taxable + B.roth + B.taxfree));
    }

}

// Roth-vs-Traditional verdict. The headline comparison uses the household's projected retirement rate
// (joint, or single for a one-person household); the survivor-alone rate is surfaced as a tiebreaker/hedge.
function switchPointVerdict(rNow, jointMarginal, survivorMarginal) {
  const rThen = jointMarginal;
  const survivorHigher = survivorMarginal > jointMarginal + 1e-9;
  let verdict, why;
  if (rNow > rThen + 0.02) { verdict = 'Traditional'; why = 'Your rate this year is above your projected retirement rate — take the deduction now at the higher rate.'; }
  else if (rNow < rThen - 0.02) { verdict = 'Roth'; why = 'Your projected retirement rate is higher than today — pay the tax now at the lower rate.'; }
  else { verdict = 'Roth'; why = 'The two rates are close, so Roth wins the tiebreakers: no forced withdrawals later, and it shelters more after-tax wealth per dollar of limit.'; }
  if (survivorHigher && verdict === 'Traditional') why += ' A surviving spouse filing alone would face an even higher rate, which argues the other way — consider splitting toward Roth.';
  else if (survivorHigher && verdict !== 'Roth') why += ' It also hedges the higher rate a surviving spouse would pay alone.';
  return { verdict, rNow, rThen, rThenJoint: jointMarginal, rThenSurvivor: survivorMarginal, why };
}

/* ---- Portfolio glue: read the schema into engine inputs (spec §2) ---- */
// Which tax bucket an account's balance belongs to.
function retireBucketOf(a) {
  const v = accountVehicle(a), tt = a.taxTreatment;

}
// Starting balances by bucket + taxable basis, from the latest snapshot.

  if (!snap) return out;

      const mv = Number(v.marketValue) || 0; if (mv <= 0) continue;

}
// Current allocation weights across detail classes (composition-decomposed), non-529.
function retireCurrentWeights(snap) {
  snap = snap || latestSnapshot();

  const acctOk = new Set(retireAccounts().map(a => a.id));
  const a = allocate(holds.filter(h => acctOk.has(h.accountId)), snap);
  const w = {}; if (a.total > 0) for (const [cls, val] of Object.entries(a.detail)) w[cls] = val / a.total;

// Infer real contribution run-rate per bucket from ≥3 snapshots (§2), else null.
function retireInferContributions() {
  const snaps = sortedSnapshots();
  if (snaps.length < 3) return null;
  const first = snaps[0], last = snaps[snaps.length - 1];
  const years = Math.max(0.25, (new Date(last.date) - new Date(first.date)) / (365.25 * 864e5));

// Blended taxable dividend yield + tax drag at the user's working-years rates (feeds §6.2).

// Map a conversion-fill setting ('22%'|'24%'|'off') to the top-of-bracket dollar amount.

// Assemble the engine cfg from portfolio + retirementSettings + tax profile.

  const pensions = (rs.pensions || [])
    .filter(p => (Number(p.amountReal) || 0) > 0)
    .map(p => ({ amount: Number(p.amountReal) || 0, startAge: Number(p.startAge) || 65,

// Cached model runner — base MC + deterministic median + (optional) conversion pass. Invalidated by signature.
let RETIRE_CACHE = null;

/* ===============================================================
   COLLEGE ENGINE — Monte Carlo 529 projector (follow-on to retirement).

   child's 529 glide path (group targets → μ/σ) or current 529 mix.

function collegeStartBalance(childId, snap) {
  snap = snap || latestSnapshot(); if (!snap) return 0;
  const idx = valueIndex(snap); let sum = 0;
  for (const a of child529Accounts(childId)) for (const h of activeHoldings(a.id)) { const v = idx[h.id]; if (v) sum += Number(v.marketValue) || 0; }
  return sum;
}
// Current 529 allocation weights (detail classes) for a child, else null.
function collegeCurrentWeights(childId, snap) {
  snap = snap || latestSnapshot(); if (!snap) return null;

  const holds = portfolio.holdings.filter(h => h.status !== 'archived' && acctIds.has(h.accountId));

}

// Monte Carlo 529 projection to the end of college. Anchored at today (k=0 = current balance).
function runCollegeProjection(cfg) {

  const nYears = Math.max(1, endAge - cfg.currentAge + 1);

// Validate the file boundary before any data replaces the current portfolio.
// Unknown fields survive migration; invalid known fields fail with a useful path.
function validatePortfolio(data) {
  const fail = (path, message) => { throw new Error(`Invalid portfolio: ${path} ${message}.`); };
  const object = (v, path) => { if (!v || typeof v !== 'object' || Array.isArray(v)) fail(path, 'must be an object'); };
  object(data, 'root');
  if (!data.meta && !Array.isArray(data.accounts) && !Array.isArray(data.holdings)) fail('root', 'must contain portfolio metadata or account data');
  const walk = (v, path, depth) => {
    if (depth > 40) fail(path, 'is nested too deeply');
    if (typeof v === 'number' && !Number.isFinite(v)) fail(path, 'must be finite');
    if (!v || typeof v !== 'object') return;
    for (const key of Object.keys(v)) {
      if (['__proto__', 'constructor', 'prototype'].includes(key)) fail(path, 'contains an unsafe property');
      walk(v[key], path + '.' + key, depth + 1);

    ids[key] = new Set();
    data[key].forEach((row, i) => {
      const path = `${key}[${i}]`; object(row, path);
      if (['accounts', 'holdings', 'children'].includes(key)) {
        id(row.id, path + '.id');
        if (ids[key].has(row.id)) fail(path + '.id', 'is duplicated');
